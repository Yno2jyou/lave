この世界は理不尽で不条理に満ちている。もしこれが神の生み出した世界だとするなら、神はとんだクソ野郎だ』って」", "「ああ、言ってたね」", "キズキは事あるごとに神を批判した。そしてニーチェの語録を愛読していた。", "「クソ野郎ってのが、いいよな」", "そう言ってトヲルは苦笑した。僕も思わず苦笑してしまった。", "「でも神に比べれば死は平等だよね」", "「まあ、そうだな」", "貧乏も、金持ちも皆等しく死ぬ。地球の裏側や宇宙の果てに逃げたって、死からは逃れられない。", "「『この世に完璧なものなどない。ただ一つ死を除いて』」", "「キズキが言ってたの？」", "「ああ。死は完璧なんだってさ」", "「完璧か……」", "キズキは時々独特な表現を使った。キズキらしいといえばその通りだが、それはときに奇妙な余韻をあとに残した。", "「でも、やっぱり思うんだよ。アイツには神という救済が必要だったんじゃないかって」", "「救済？」", "トヲルは頷いて、じっとこちらを見つめた。今にも吸い込まれてしまいそうな瞳だった。", "「『神を信じていれば救われる？ そんなバカな話あるわけないだろ』ってアイツはよく言ったよな。でも、この世界では現に何十億もの人が神を信仰している。そして信仰することで救われると考えている。確かに根拠はないさ。でもこれほど多くの人々が神を信仰しているんだ。バカな話ってことはないだろ？」", "「まあ、確かに」", "『神は死んだ』とニーチェが宣言してもなお、人々は神を信仰している。それは紛れもない事実だ。", "「それに何よりこの世界は虚しい。生まれてもいずれ死ぬ。死ねば全てのものを失う。極論、生きていることには何の意味も、価値もない。それは生きている身からすれば、あまりにも残酷なことだ。救いを求めるのも、無理はない」", "この世界は虚しい。どれだけ必死に生きたって、死ねばそれで全て終わる。死ねばそれで全て失われる。", "「だからこそ、俺は神を信仰することには大いなる意味があると思う」", "「大いなる意味」", "「そして神を信仰することには大いなる価値があると思う」", "「大いなる価値」", "そこまで言ってトヲルはギムレットを口にした。僕も煙草を吸い、煙を吐き出した。", "「でも、アイツは神に頼らなかった。そして死んだ。でも死っていうのもある意味では救済なんだよ。だって死ねばあらゆる物事から解放されるからな。それは救済とも捉えられる。アイツは神という救済を捨てて、死という救済に縋ったんだ」", "そこでトヲルはぎゅっとグラスを握った。照明に照らされて、ギムレットが滑らかに輝いている。", "「結局アイツは死ぬことでしか救われなかった。俺たちはどうすることもできなかった」", "悲哀に満ちた声だった。それでもトヲルは一度としてキズキの死を否定はしなかった。", "「……そういえば、お前に見せたいものがあったんだ」", "「見せたいもの？」", "「ああ」", "そう言って、トヲルは胸ポケットから一枚の紙を取り出して僕に渡した。", "「この前、キズキの姉さんに会ったとき貸してくれたんだ。キズキの部屋を整理していたら、机の中から遺書らしきものが見つかったって」", "「遺書？」", "驚きながら尋ねると、トヲルはああと頷いた。改めて見ると、ノートの切れ端のような紙に薄く文字が書かれている。", "「確かに、キズキの字だ」", "細くて達筆なキズキの字だった。僕はそこに書かれていた言葉をゆっくりと読み上げた。", "「『息をするのも、しないのもつらい』……」", "「どういう意味だと思う？」", "僕は紙に書かれたその文字を、しばらくのあいだ黙ってじっと見つめていた。筆圧の残らないかすかな筆致で紡がれた言葉は、まるで夜の冷たい湿気に溶け込んでいくかのように、今にも霞んで消えてしまいそうな危うい字だった。僕は息を殺し、その消え入りそうな筆跡の中に閉じ込められたかすかな意味の体温を、ひとつひとつ拾い上げるようにしてじっと目を凝らし続けた。", "「息をするのも、しないのも辛かった。だから自死を選んだ……？」", "「その息をするのも、しないのも辛いってのはどういうことだと思う？」", "僕はキズキの書いたその言葉に思いを巡らせた。キズキはこの世界に息苦しさを感じていたのだろうか。", "「何かの理由で息をするのが辛かった。だから息を止めた。だけど生きていれば当然息を止めるのも辛い。息をするのも、しないのも辛い。だからキズキは永遠に息を止める選択をした？」", "手元に残されたかすかな文字の体温が、キズキの静かな叫びのように僕の指先からじわじわと伝わってくる。どれほど救いを求めていたのか、どれほど絶望していたのか、その本当の深さを僕は何ひとつ知らずにいたのだと思い知らされ、冷たい悔根だけがどこまでも胸を満たしていった。", "「なあ、俺たちはどうするべきだったと思う？」", "その問いに、なんと答えればいいのかわからなかった。", "「わからないよ、それは僕にも。だけどキズキの異変にもっと早く気づいていたら、何かが変わったのかもしれない」", "「……そうだな」", "どうすることもできなかったのだろうか。キズキの死を僕たちはただ、眺めていることしかできなかったのだろうか。", "「俺たちがアイツを置き去りにしたのか、それとも俺たちがアイツに置き去りにされたのか」", "「難しいね」", "「ああ、難しいよ」", "そこでトヲルはぐーっと背中を伸ばして腕時計を見た。", "「もうこんな時間か。そろそろこの店も閉まるけど、お前どうする？」", "腕時計を見ると、夜中の二時だった。この店もそろそろ閉まってしまう。", "「名残惜しいけど、帰ろうか。もう、夜も遅いし」", "僕が言うと、トヲルもそうだなと言って荷物をまとめた。そしてバーテンダーを呼んだ。", "「今日は俺が払うよ。遅れて悪かったな」", "「いいよ、別に」", "「お前と久しぶりに話せて楽しかった。ありがとう」", "そう言ってトヲルは勘定を済ませた。僕はトヲルに礼を言い、店を出た。外は街の静けさに包まれ、程よく冷たかった。", "「終電、もう過ぎてるよな」", "「ああ、そうだね。どうしようかな」", "二時過ぎだから、電車はもうない。ホテルで夜を明かそうか。そう考えていると、トヲルが声を出した。", "「よかったら俺の家来ないか？ ここからだったら、歩いて三十分だから酔いをさまして帰れる」", "「嬉しいけど、いいの？」", "「いいよ。ソファで寝てもらうことになるけど、いいだろ？」", "「全然いいよ。じゃあ、お邪魔しようかな」", "トヲルのそんな笑顔を目にするのは、本当に久しぶりのような気がした。キズキが生きていた頃は、僕たちはいつだってくだらないことでこんな風に声を上げて笑い合っていたのだ。だけど、キズキが死んでしまってからは、僕たちの生活から自然と笑顔の数が減っていった。笑おうとすると顔の筋肉が強張り、心のどこかで罪悪感が冷たく疼いた。キズキのいないこの世界で、心から笑うことが果たして許されるのか、わからなかったのだ。"]}, {"title": "第十話：館山城", "paragraphs": ["海ほたるをあとにした僕たちは、そのまま夜の静寂を切り裂くようにして千葉を目指した。フロントガラスの向こうには、海と空の境界すら曖昧になった漆黒の帳が延々と広がっていて、時折現れる街灯の光だけが、まるで置き去りにされた古い記憶のように後方へと流れ去っていった。真夜中の高速道路には車の姿もまばらで、驚くほど空いていた。アスファルトの継ぎ目を踏むたびにタイヤが刻む一定のリズムと、エンジンの心地よい振動だけが車内に響き、運転のストレスは驚くほどなかった。むしろその単調な振動は、まどろみにも似た奇妙な安らぎを僕たちに与えていた。千葉に入ると、僕たちは木更津を通り抜け、そのまま房総半島を南下して館山へと向かった。窓の外を流れる景色は、街灯の乏しい田舎道に差し掛かるにつれてますます闇に呑み込まれ、道路標識の反射光だけがぽつりぽつりと浮かんでは消えていった。目的地を館山にした特別な理由はなかった。ただそこにかつて里見義頼が築城したという館山城があることを知っていたからだ。里見義頼という戦国武将の歴史には大して興味があったわけではないが、その城に持つ佇まいや造形には、どこか惹かれるものがあった。", "館山へ向かう道中、キズキはずっと何か深い思考の底に沈み込むようにして、流れていく窓の外の闇をじっと眺めていた。ダッシュボードの淡い光に照らされた横顔は、あまりに静止していて、まるで呼吸すら止めているかのようだった。その横顔は遠く離れた火星から太陽の激しい爆発を冷ややかに眺めているようにも見えたし、あるいは人類が途絶えた地球の終焉を、静かな月面から一人で見届けようとしているようにも見えた。そして窓ガラスに映り込んだキズキの瞳の奥には、僕には決して覗き込むことのできない、深く昏い水底のような何かが揺れていた。とにかく、キズキは一度も口を開かず、ただ黙っていた。その沈黙は気まずさとは無縁の、むしろ二人の間にだけ許された特別な静けさのようなものだった。", "館山城に辿り着いたのは、夜中の三時半を過ぎた頃だった。城のある城山公園の駐車場に車を停め、エンジンを切ると同時に押し寄せてきた静寂の重さに、僕は一瞬たじろいだ。ドアを開けて外に出ると、冷え切った夜気が肌を刺すようにして僕たちを包み込んだ。吐く息は白く、それはすぐに闇の中へと溶けて消えていった。園内にはまばらに外灯が点在していたものの、その頼りない光は深い闇に覆い尽くされ、足元すらおぼつかない。木々の葉擦れの音が、まるで見えない何かが僕たちの動きを追っているかのように、断続的に響いていた。僕たちは暗がりの中をしばらく散策したあと、館山城の天守を目指して歩き始めた。どうやら城は、公園の少し小高くなった丘の上に腰据えているようだった。", "傾斜のある曲がりくねった坂道を登っている間、静寂を破るようにしてキズキが不意に口笛を吹き始めた。夜の空気に高く澄んだ音が響く。それは木々の間を縫うようにして遠くまで広がり、やがて夜の底へと吸い込まれていった。何の歌かと尋ねてみると、キズキは「俺にもわからない」とそっけなく答えた。それから僕たちは、二人で肩を並べ、その名前のない奇妙なメロディを口笛で吹き交わしながら坂道を登っていった。息は上がり、首筋にはじんわりと熱が帯びていったが、不思議と足取りは軽かった。こんな真夜中に、暗闇の公園で二人の男が楽しそうに口笛を響かせている。もし近隣の住民に聞かれたら、不審者として警察に通報されるか、あるいは夜な夜な現れる怪奇現象として恐れられるかのどちらかだろうな、と僕は思った。", "ようやく辿り着いた館山城は、それほど大きな城ではなかった。姫路城のような目を見張る壮麗さもなければ、大阪城のような金碧輝く絢爛さもない。三層のこぢんまりとした天守は、月明かりの下でひっそりと佇み、その控えめな輪郭は夜空に溶け込むようにして浮かび上がっていた。けれど館山城には、そうした名城にはない、どこか人懐こい親しみやすさのようなものが漂っていた。そしてその小さな城の佇まいに触れていると、理由もなく胸の奥がじんわりと温かくなるのを感じた。そのとき僕の心を満たした感情は、どんなに言葉を重ねても完璧に言い表すことはできない。でもあえて言葉の限りを尽くすなら、それは忘れかけていた古い記憶がある日突然、鮮やかによみがえってきたときのような感動に近かった。", "僕たちはそれから、しばらくの間立ち止まり、じっと館山城を仰ぎ見た。もちろん開館時間はとっくに過ぎていたため、中に入ることはできなかったが、夜空に浮かぶ月明かりを浴びたその白い天守は、まるで静かな湖畔にそっと降り立った一羽の白鳥のように優美で、どこか儚げだった。風がふいに吹き抜け、傍らの木々の梢を揺らすと、葉音はまるで城そのものが小さくため息をついたかのように聞こえた。", "城の少し先にある開けた場所からは、館山の街並みが一望できた。真夜中の街は静まり返り、ほとんどの家屋の明かりは消えていたけれど、幾つかの窓にはまだぽつりと温かい光が灯っていた。それはまるで、まだ眠りにつけずにいる誰かの孤独な営みを、密かに物語っているかのようだった。遠くの海の方角からは、かすかに潮の匂いを含んだ風が吹き上げてきて、僕たちの髪をそっと撫でていった。僕たちはそこに佇み、静寂に包まれた街の息づかいを見下ろしていた。不思議と、お互いに言葉は出てこなかった。まるで世界から言葉が完全に忘れ去られ、その無音の空白の中に、僕たち二人だけが取り残されてしまったかのような感覚だった。", "館山城をあとにした頃には、すでに時刻は四時を回っていた。", "東の空の端には、まだ気づかれることを恐れるようにして、ごくかすかな白みが兆し始めていた。それは夜と朝の境界を曖昧に滲ませる、名づけようのない薄明の色だった。僕たちは再び車に乗り込み、エンジン音を鳴らして、まだ眠りから覚めない千葉の街を、どこまでも走り続けた。", "キズキが声を出したのは、館山を過ぎ、鴨川に入ったときのことだった。", "「なあ、お前は死にたいって思ったことあるか？」", "あまりにも唐突な質問だったので、僕は思わず「えっ？」と声を出してしまった。", "「いきなりどうしたの？」", "「なんかさ、時々思うんだよ。このままふらっと消えたいなって」", "「ふらっと？」", "「ああ、ふらっと……」", "キズキの声が妙に冷たく、そして不気味なほど落ち着いていたので、僕は嫌な予感を抱きながらも、ただただそのまま会話を続けてしまった。車を路肩に停めて、一度エンジンを切り、キズキの顔をちゃんと見ながら話を聞こうか。そんな思いが頭をよぎったが、あいにく周囲の道路は無機質なフェンスと闇に囲まれていて、車を安全に停められるような場所はどこにも見当たらなかった。", "「どんなときに、そう思うの？」", "「どんなときって……まあ、眠れない夜とか？」", "「眠れない夜……」", "僕はラジオのボリュームを小さくして、キズキの次の言葉を待った。胸騒ぎがした。", "「ここでハンドルを切れば、俺たち死ねるんだよ」", "「えっ？」", "死の底にそっと触れるような声だった。手が汗ばんだ。", "「なあ、案外死ってのはすぐそこに潜んでいるんだよ。そう思わないか？」", "僕はその問いに答えなかった。答えてはいけないような気がした。", "「ここで死んだら、少しは楽になれるのかな」", "「は？」", "「いや、ここでお前と一緒に死ねたら、楽になれるのかなって」", "「何言ってるの？」", "震えを抑えながら言うと、キズキは一度僕を見つめてから、静かに息をついた。", "「『語れ、さもなくば死ね』」", "「えっ？」", "「話すべきか、死ぬべきか。お前はどうする？」", "「どういうこと？」", "僕たちの車とは反対側の車線を、一台の黒い大型バイクが激しい排気音を残して走り抜けていく。ヘッドライトの光が車内を掠めた一瞬だけ、そのバイクのシートに若い男女が二人で跨っているのが見えた。後ろに乗る少女の髪が夜風に大きく乱れ、男の背中に力強くしがみついている。", "「たとえば、お前には好きな人がいる。その人に好意を伝えたい」", "短い沈黙。", "「でも、好意を伝えて振られるのが怖い。全てを話したいけど、話せない。話すべきか、死ぬべきか。お前はどうする？」", "僕はスピードメーターをちらっと見てから、その問いについて考えを巡らせた。", "「まあ、僕なら話すね。だって、話して振られても失うものは何もないんだから」", "「何もない？」", "「だって、話したって、それで何かが失われるわけじゃない。それならモヤモヤするより、話したほうがいい」", "「本当に、何も失われないのか？」", "抑揚のない平板な声だった。僕はキズキの問いに、もう一度考えを巡らせた。", "「まあ、苦しみは残るかもしれない。でも、それは直に消えるものだ。長い目で見たら、失うものはないと思う」", "「……そうか」", "そこでキズキは上着のポケットから煙草の箱を取り出し、一本を唇に咥えた。そして胸ポケットから手慣れた動作でライターを取り出すと、カチリと小さな金属音を立てて煙草に火をつけた。オレンジ色の小さな炎が瞬き、キズキの顔を短い一瞬だけ暗闇の中に浮かび上がらせる。だが、キズキは何を思ったのか、煙を吐き出すことさえせず、次の瞬間には手元のボタンを押して車の窓を少しだけ開けた。そしてキズキは一度も紫煙を胸に吸い込むことなく、ただ点火したばかりの煙草を指で摘み、開いた窓の隙間から勢いよく道路へと投げ捨てた。暗闇の舗装路へと落ちていった火種は、車が疾走するスピードの中で一瞬だけ赤い火花を散らし、そのまま背後の闇の中へと小さく飛び散って消えていった。僕はバックミラーの中で失われたその小さな光の軌跡を、言葉もなくただじっと見つめていた。", "「どうして捨てるの？」", "「何となくだよ。うん、なんとなく……」", "妙に落ち込んだ声だった。僕は違和感を覚えながらも、運転を続けた。", "「ラジオ変える？ なんかあまり面白くないし」", "僕の問いに、キズキは答えなかった。僕は小さく息をついてからラジオのチャンネルを切り替え、音楽番組にした。", "「あっ、この曲キズキの好きなやつだよ」", "僕はラジオのボリュームを大きくして、車内に響きわたる曲にじっと耳を傾けた。その曲は、十九歳というあまりにも早い若さでこの世を去った、とあるミュージシャンの遺作だった。若者の内に潜む複雑な心象風景を瑞々しく描くことで一躍注目を集めたそのミュージシャンは、わずか十七歳で華々しいデビューを飾り、逝去するまでのたった二年間で十五もの楽曲を作り上げた。それらはどれも当時の音楽シーンに消えない衝撃を与え、月日が流れた今でも語り継がれる名曲となっていた。ミュージシャンの死は、公には不慮の事故死として処理されたが、世間では絶えず自殺の疑いが囁かれ続けていた。その一番の要因となったのは、彼が遺した最後の曲に付けられたあまりにも歪で静かなタイトルだった。", "『人生でいちばん楽しいと思った日に死ぬ』", "車内のスピーカーから流れる美しく切ないメロディが、静まり返った夜の静寂の中に重く溶けていった。", "「いいよね、この曲。実はキズキに薦められたあと、結構聴いたんだよ」", "そう言ってキズキの反応を待ったが、キズキは窓の外を見つめているだけで、何も喋らなかった。僕は仕方なく前を向き、運転に集中した。", "「みんな、結局は死ぬんだ」", "「えっ？」", "「どんな死に方しても変わらないんだよ。結局……」", "「えっ、どういうこと？」", "困惑しながら尋ねると、キズキはすっと手を伸ばし、僕の握っていたハンドルを掴んだ。", "「何してるの？」", "「なあ、こっちを見てくれ」", "「はっ？ ダメだよ。運転してるんだから」", "「いいからさ……」", "キズキは左手でハンドルを握り、右手で僕の肩を力強く掴んでいた。僕は驚きを隠せないまま、ゆっくりとキズキの座っている方を見た。", "「なあ、俺がどう見える？」", "まつ毛が重なり合いそうなくらい、あまりにも近い距離だった。僕はキズキの荒い息づかいと、その奥に混じるかすかな煙草の匂いをダイレクトに感じ取り、思わず息を呑んだ。目と鼻の先まで迫ったキズキは、まるでこの広大な宇宙に存在するすべての淋しさを独り占めしてしまったかのように、ただひとり物悲しげにこちらを見つめていた。その瞳は果てしない時間をかけて硬く凍りついた氷河のようで、長く伸びたまつ毛は命を落とした羽虫の脚のように寂しく伏せられていた。月明かりに照らされたまっすぐな鼻梁は象牙細工のように冷たく白く浮き上がり、小さく引き締まった唇は、陽に晒されて干からびたみみずのように悲しく乾いていた。そして僕とキズキのわずか数センチの隙間には目に見えない深い深い溝がどこまでも広がっていた。それはこの世界に点在するいかなる海溝よりも深く、広く、そして決して埋めることのできない救いがたい溝だった。僕はただ時間が過ぎ去っていくことさえ忘れて、キズキの横顔をじっと見つめ続けていた。そこには宇宙の果てを思わせるような、あまりにも果てしなく、重い孤独が横たわっていた。", "ハッと我に返ったとき、目の前の道は鋭いカーブを描いていた。僕はそこでようやく理性を取り戻し、反射的にブレーキを踏み込んでハンドルを強く切った。タイヤが悲鳴を上げ、車体が右へと大きく傾く。僕の体も慣性に従って横へと激しく投げ出された。僕は指関節が白くなるほどハンドルを強く握りしめ、次の瞬間に訪れるであろう激しい衝撃に全身を強張らせて備えた。しかし激突の衝撃はいくら待ってもやってこなかった。不思議に思って恐る恐る顔を上げると、フロントガラスの先には黒く静かに続く舗装道路が伸びていた。どうやら車はガードレールに接触する寸前で、滑らかな弧を描くようにしてカーブを曲がりきったようだった。僕は喉の奥で詰まっていた息を途切れ途切れに吐き出し、力なくハンドルへともたれかかった。心臓が胸の裏側を激しく叩いている。それからハッと思い出したように、助手席へと視線を送った。そこにはシートベルトに深く体を預けたまま佇むキズキの姿があった。車窓から滑り込んでくる青白い月明かりに照らし出されたキズキの横顔は、夜の重い闇を切り裂くように鮮明に浮かび上がっていた。僕は乾いた喉を鳴らし、キズキに向かって「大丈夫か」と声をかけた。キズキはすぐには答えず、数秒の静寂を置いたあとで、低く「大丈夫」と答えた。そして僕の方を振り返り、歪で不器用な笑みを浮かべて見せた。", "キズキの無事を確認すると、僕は震える手でバックミラーを覗き込み、後方から車が来ていないの確かめてからエンジンを切った。ドアを開けて外へ出ると、たったいま疾走してきたカーブの先から、冷たく湿った夜風が頬を撫でていった。僕は車体に背中を預け、暗闇を鋭く引き裂く道路の曲がり角をじっと見つめた。僕たちはどうにか、あの死の匂いが漂うカーブを曲がりきることができたのだ。そう思うと胸の奥にささやかな誇らしさが込み上げてきた。けれどそれと同時に、脳裏の裏側にこびりついて離れない光景があった。カーブに飛び込む直前、目と鼻の先で見せたキズキの、あの絶望的な悲愁に満ちた表情だ。なぜキズキは、あんなにも深く哀しげな顔をしたのだろう。僕は腕を組んで、真夜中の静寂の中で真剣に思考を巡らせてみた。だが、どれほど記憶を遡り、キズキの言葉を反芻してみても、思い当たる理由はひとつとして浮かんでこなかった。僕は深く溜め息をつき、寄りかかっていたドアから体を離すと、しゃがみ込んで車体に傷がついていないか検分して回った。もし借り物の車に傷でもつけていれば、高額な修理代を支払わなければならないところだったが、幸いなことに塗装の剥げひとつ見受けられなかった。", "僕はそこでほっと胸を撫で下ろし、車の中にいるキズキに声をかけた。", "「傷はなかったよ。でも、ああやって運転中に気を引こうとするのはやめてくれないか。とても危ないんだ」", "僕が運転席に腰掛けながら言うと、キズキは一度真っ直ぐにこちらを見つめてから、俯いた。", "「やっぱり、俺には無理だ」", "「えっ？」", "「やっぱり、俺には話せない」", "そう言うと、キズキは今にも泣き出しそうな顔で、じっとこちらを見つめた。僕はそんなキズキの姿に戸惑いながらも、声を出した。", "「とにかく、ああいうことは危ないから、二度としちゃダメだ。わかった？」", "僕がさとすように言うと、キズキは一度だけこくりと頷いた。首振り人形のように、愛想のない頷きだった。", "「じゃあ、もうこのことは忘れよう。せっかく車で旅をしてるんだ。楽しくいこう」", "そう言って僕は車のエンジンをかけた。その間も、キズキはずっと俯いていた。"]}, {"title": "第十一話：生まれてきてよかったって言えるか？", "paragraphs": ["それから僕たちは頼りない外灯が落とす淡い光を辿るようにして、あてもなく夜道を歩き続けた。あたりは恐ろしいほどの静けさに充ち満ち、アスファルトを踏みしめる僕たちの靴底の音だけが、どこまでも高く夜闇の底に響き渡っていた。僕たち以外に、この世界の夜道を歩いている人間などひとりもいなかった。耳を澄ませば、街灯の下を伸びる自分たちの黒い影の足音さえ聞こえてきそうだった。", "「それにしても懐かしいよ」", "「え？」", "「ほら、覚えてないか？ 寮を抜け出して裏山で花火したの？」", "トヲルにそう言われて、僕はすっかり忘れていた当時の記憶をゆっくりと思い出した。確かあの頃の僕たちは、あまりにも平坦で退屈な寮生活に心底あきあきしていたのだ。味のしないまずい飯、埃っぽい汚い部屋、深夜まで続く下品な騒音、そして廊下に充満する独特の悪臭。そのすべてに嫌気がさした僕たちは、ある蒸し暑い夜、寮長の監視の目をまんまと盗んで寮を抜け出した。近くのコンビニで買い込んだ大量の花火を抱え、僕たちは闇に包まれた寮の裏山へと登り、片っ端から火をつけて花火を打ち上げた。だが、静寂を切り裂いて夜空に弾けたあまりの激しい爆竹の轟音と光に、自分たちで仕掛けたことすら忘れてすっかり怯えてしまい、僕たちは蜘蛛の子を散らすようにしてその場から逃げ出したのだった。", "「覚えてるよ。あの時は大変だったな。寮長にみっちり叱られた挙句、三ヶ月の外出禁止令が出たんだから」", "「ああ、そうだったな。でもあの外出禁止令があったから、俺たちは麻雀の面白さを知ることができたんだ」", "確かに、僕たちは三ヶ月の外出禁止令の間、麻雀に明け暮れていた。夜通し麻雀をやったことだってあった。", "「ははっ。麻雀で単位落としたやつが言うと説得力があるよ」", "揶揄うように言うと、トヲルは困ったように笑った。", "「それは言わないでくれよ。あれ、結構大変だったんだから」", "そう言うとトヲルはネクタイを緩めて、楽しそうに笑った。僕たちの笑い声は果てのない夜の闇に吸い込まれてしまった。", "「いつまでも忘れないんだろうな」", "「忘れられないさ。あんな刺激的な日々は」", "中学、高校とこれといって特筆すべきこともなく、ただ色あせた時間をやり過ごすだけの学校生活を送ってきた僕にとって、彼らと肩を並べて過ごしたあの時間は、何ものにも代えがたい特別な日々だった。どのような痛みも、苦しみもすべてが一瞬にして忘れられるような美しい日々だった。", "「そして、もう二度と戻らない……」", "トヲルの言葉に僕は静かに頷いた。もう戻らない。キズキは、もう二度と帰らない。", "「お前は、生まれてきてよかったって言えるか？」", "その言葉が耳に入った瞬間、僕は立ち止まっていた。どうなのだろう。僕は生まれてきてよかったと言えるだろうか。", "「俺は、今死んでもいいと思ってる。もちろんやりたいことはまだまだたくさんある。出世もしたいし、いつかは自分の家が欲しいとも思っている。でも、時々思うんだ。これから何かを失うくらいなら、ここで人生を終えてもいいんじゃないかって。キズキが死んでから、そういう考えが頭から離れないんだよ。全てを失って死ぬくらいなら、全てを失わないために死ぬのもありなんじゃないかってさ」", "ハッとなって顔を上げると、トヲルは憂いを帯びた瞳で笑っていた。", "「もちろん死ぬのは怖いさ。俺は死にたくない。でも、それ以上に何かを失うことがとてつもなく怖い。失って悲しみに暮れるのは、もう嫌なんだ。何かを失った喪失に、俺はこれ以上耐えられない」", "「それは僕も同じだよ」", "何もかもが眠りついたような夜だった。まるですべての生き物が息絶えてしまったようだった。", "「キズキが死んで僕は絶望の淵に立たされた。毎日苦しかったし、辛かった。正直何度も死ぬことを考えた。でも、そのたびに思ったんだ。僕はキズキを失って悲しい。でもそれ以上にキズキは苦しんでいたんじゃないかって。僕たちの悲しみとは比にならないくらい、もっとずっと大きな何かにキズキは苦しんでいたんじゃないかって。そう思うと、不思議と前を向けたんだ。それに、僕には君がいたからね。君を置いて死ぬわけにはいかなかった」", "「……そうか」", "外灯に小さな虫たちが群がっている。水たまりに僕たちの姿が反射している。死を悟った鳥たちがけたたましく鳴いている。", "「キズキがいたらどれほどこの世界が輝いていたんだろうって、時々思うよ。でもさ、もう仕方のないことなんだ。キズキは死んだ。キズキは戻ってこない。それはどうしたって変えられない。いつまでもキズキのことを引きずっていたらダメなんだ。僕たちはキズキという過去に別れを告げなくてはいけない。キズキという記憶に蹴りをつけなくてはいけない」", "いつまでもキズキに囚われてはいけない。それでは、僕たちは前に進めない。", "「……そうだな」", "僕たちはそれから一言も言葉を交わすことなく、ただ黙々と夜道を歩き続けた。世界から音が消え失せたかのような、死んだように静かな夜だった。あまりの静寂に、この道の角を曲がったら、いつもの呑気な顔をしたキズキがふらっと姿を現すんじゃないかとさえ思えた。胸に溜まった冷たい空気を吐き出すように小さく息をつき、ゆっくりと夜空を見上げる。すると黒々と広がる闇の遠く彼方に、吸い込まれそうなほど美しく煌めく星が見えた。"]}, {"title": "第十二話：九十九里浜", "paragraphs": ["鴨川をあとにした僕たちは、続いて九十九里浜に向かった。九十九里浜は全長六十六キロメートルもある日本一長い砂浜で、僕もキズキも訪れるのはこれが初めてだった。全長六十六キロメートルというスケールは伊達ではなく、しばらく車を走らせていると、視界が急に開けて果てしない海岸線に出た。そこには闇に包まれた砂浜が一面に広がり、その先には底知れぬ真っ暗な海がどこまでも蠢いていた。どうやらここが九十九里浜のようだった。", "九十九里浜の白里海岸に到着したのは、早朝の五時半だった。五時半とはいえ冬の朝は重く、東の空に日の昇る気配はまだ微塵もなかった。僕たちは凍てつく真っ暗闇の中、砂に足を取られながら九十九里浜の渚を全速力で走った。皮膚を刺すような冷たい潮風を全身に受け、必死に息を乱しながら駆け抜ける感覚は、僕たちがいつの間にか日常のどこかに置き忘れていたものだった。", "「意外と、早いなお前」", "「これでも高校三年間、体育祭のリレー選抜だったからね」", "「すごいな。まあ、でも俺は小中高ずっとリレー選抜だったけどな」", "「自慢か？ じゃあ、もう一本走ろう。これでも体力には自信があるんだ」", "「いいぜ。じゃあ、何か賭けよう」", "そう言って、キズキはじっとこちらを見つめた。暗闇にはある程度目は慣れていたが、それでもキズキの表情まで窺うことはできなかった。", "「何を賭ける？」", "「そうだな。じゃあ、負けた方が勝った方の言うことを何でも聞く」", "「何だよ、そのど定番なやつ」", "「いいだろ、じゃあやろう」", "そう言って僕たちは、足元に落ちていた手頃な枝を拾い上げると、湿った砂浜に太いスタートラインとゴールラインを引き直した。それから互いに手足を念入りに伸ばし、寒さに強張った体をほぐすようにアップをした。いくら旅先の気まぐれな遊びとはいえ、勝負事となれば話は別だった。キズキに負けたくなかったし、最初から本気で勝ちにいくつもりだった。", "スタートの合図は、直前のじゃんけんで勝ったキズキが担当することになった。僕たちは並んでスタートラインに立ち、冷たい潮風を胸いっぱいに吸い込んでから、静かに前傾姿勢をとった。そしてキズキの威勢のいい合図とともに、二人の身体は弾かれたように砂を蹴り上げた。", "最初の数秒間、優勢に立ったのはキズキだった。合図と同時に飛び出したキズキは、持ち前のしなやかな脚力を活かして勢いよく加速し、僕との距離をぐんぐんと広げていった。僕は必死で腕を振り、必死で砂を蹴り立てて喰らいつこうとしたが、なかなかその差は縮まらなかった。どうやら瞬間的なトップスピードにかけては、キズキに一日の長があるようだった。ところが、コースの中盤を過ぎたあたりで、キズキの力強い走りにあきらかな陰りが見え始めた。肩が上がり、一歩一歩の足取りがみるみるうちに重くなっていく。どうやら序盤のオーバーペースが祟って、急激に疲労が押し寄せてきたようだった。僕はここが勝負の分かれ目だと直感し、残りの力を振り絞って一気にラストスパートを仕掛けた。中学からの三年間、陸上部で泥まみれになりながら鍛え上げていた僕の脚力とスタミナが、ここでいよいよ真価を発揮し始めたのだ。一歩、また一歩とキズキの背中が近づいてくる。荒い息づかいが重なり合い、そしてついにゴールラインのほんの数メートル手前で、僕はキズキの横顔を鮮やかに抜き去っていた。結果は僕の勝ちだった。", "「くっそ、あとちょっとだったのに……」", "「でも、結構キズキも速いね」", "「ああ。これでも中高は走り込みばっかやってたからな」", "僕たちはゼエゼエと息を切らしながら、何とかしゃべった。吐く息が白く、暗闇の中でぼんやりと形を作っては消えていった。", "「で、負けた方が勝った方の言うことを何でも聞く、だったよね？」", "「ああ。何でも言ってくれ」", "「そうだな。じゃあ今日の飲み代割り勘だったけど、キズキに全部払って欲しい」", "「えっ、そんなことでいいのか？」", "「そんなことって……じゃあ逆にキズキが勝っていたら何をお願いしようとしたの？」", "気になったので尋ねると、キズキはしばらく間を置いた。その間の長さに、僕はほんの少しだけ違和感を覚えた。", "「内緒、だな」", "「何でだよ」", "僕がキズキの肩に腕を回すと、キズキはさっと僕の腕をどかした。その反射的な動きに、僕は一瞬だけ戸惑った。", "「言ったら、多分引くから……」", "「引くって、どう言うこと？ 気になるんだけど」", "「もういい。わかったよ。今日の飲み代全部払えばいいんだろ？」", "「おっ、いいの？」", "「いいよ。ったく、仕方ないなぁ」", "そう言ってキズキは財布を取り出し、割り勘分の飲み代を僕に払った。僕はありがとうと言って、そのお金を自分の財布にしまった。", "「さて、運動もできたし、そろそろ行く？」", "「ああ、そうだな。でも、ちょっと待ってくれ。久しぶりに走って結構疲れたんだ」", "「ああ、いいよ。じゃあ少し休憩しよう」", "それから僕たちは力尽きたように九十九里浜の冷たい砂の上に腰を下ろし、ただじっと真っ暗な海を眺めていた。視線の先に広がる海は、上空を覆う夜空との境界線を完全に失い、世界の果てまで届くような無限の闇をどこまでも広げていた。僕たちはその圧倒的な黒い空白を前にして、言葉もなく、ただ静かに肩を揺らしながら息を切らしていた。全身の血の巡りが少しずつ落ち着き、荒かった呼吸が整っていくにつれて、それまで背景に埋もれていた波の音が、寄せては返す規則的な鼓動のように、だんだんと、そしてはっきりと耳の奥へ届くようになっていった。"]}, {"title": "第十三話：どんな時だって、希望は残っている。", "paragraphs": ["バーを出て、夜道を歩き、ふと見上げた夜空には、星が眩く煌めいていた。", "「すごい、星が見える」", "僕がそう言うと、トヲルは俯いていた顔を上げて夜空を見つめた。", "「ああ、本当だ……」", "目が暗闇に馴染めば馴染むほど、夜空に散らばる星々は一光点ごとに確かな輪郭を帯びて浮かび上がってきた。僕は頭上にどこまでも果てしなく広がる星空の圧倒的な美しさにすっかり目を奪われ、足元を踏み外さないよう一歩一歩確かめるようにして、ゆっくりと夜道を歩いた。", "「あの星の本当の輝きを知る頃には、僕たちはこの世界にはいない」", "何となしに呟くと、トヲルは夜空を見上げたままこちらを見つめた。", "「星の輝き？」", "僕は頷いて、ゆっくりと歩いた。どこからか透きとおった鳥の囀りが耳をくすぐり、草むらの奥からは密やかな虫たちのざわめきが立ち上ってくる。ふいにやわらかな風が通り抜けると、あたりの草木はさわさわと心地よい音を立てながら、青々とした葉を揺らしていた。", "「あの星の光は何十光年も先から長い時間をかけて僕たちのもとにやってきているんだ。だから、あの星の光は実際には何十年も前の光なんだよ」", "「ああ、そういえば学校でやったな」", "僕はその言葉に頷き、夜空の光を仰いだ。あの光は、何十年、あるいは何百年という途方もない歳月をかけて宇宙の闇を彷徨い続けた末に今こうして僕の小さな瞳に届いているのだ。そう思うと、頭上に広がる夜空の静寂が、どこか恐ろしいほどに深く、重みを持ったもののように思えてきた。", "「たかが百年。僕たちが懸命になって生きる百年は、あの星の本当の光が届く頃には過ぎ去っている」", "「……儚いな」", "「そして死んで百年も経てば、誰も僕たちのことなんて覚えていない」", "改めてそう思うと悲しみが込み上げてきた。どのように生きたところで、いつかは忘れ去られる。", "「時々思うんだ。たった百年の間に死にゆく僕の人生は一体何なんだろう。死んで百年の間に消える僕という存在は一体何なんだろうって」", "トヲルはその言葉に静かに頷いた。僕はポケットに手を突っ込んだまま、天を仰いだ。", "「たとえ働いて平穏な生活を送っても、犯罪を犯して牢獄に収容されても、死んで百年も経てばそれらは全て忘れ去られる。世界的な大発明や、世界的な大犯罪を犯さない限り百年後に名を残すことはできない。君に、そんな知恵と勇気はある？」", "「ないな」", "「僕もだ」", "そこで僕は苦笑した。世界的な大発明も、世界的な大犯罪も僕たちにはできない。", "「どう足掻いたところでこのままの人生では僕たちは百年後、人々の記憶から跡形もなく消え去る」", "百年の間にことごとく潰えていく命と、死を迎えてからの百年のあいだにひとつ残らず消え去っていく記憶。そこに一体何の意味があり、何の価値があるというのだろうか。そしてこの果てしない時間と闇の隙間で、いま現に息をしている自分という存在は一体何者なのだろうか。一体何を為し、何を遺して消えていくのだろうか。その答えを教えてくれるものは、夜空のどこを探しても見当たらなかった。", "「僕たちはきっと、宇宙から見ればごくごく小さな存在に過ぎない」", "宇宙の広さに比べたら、僕たちはあまりにも無意味で、無価値だ。", "「そして宇宙からしてみれば、僕たちの人生は流星のように短く、儚い」", "「……ああ」", "この地球では今もたくさんの生命が生まれては、そのいのちを燃やし、尽き果ててゆく。それはまるで流星のように、とめどなく。", "「俺たちは、何の為に生きるんだろう」", "それはきっと、百年という途方もない月日を費やしたとしても、到底答えを導き出すことなどできない問いなのだろう。あるいは星々が刻むような気の遠くなる年月があったとしても、僕たちがその答えの核心に辿り着くことなど叶わないのかもしれない。僕は胸の奥の重い空気を逃がすように小さく吐息を漏らし、ゆっくりと夜空を見上げた。頭上には、天の川がどこまでも静かに横たわっていた。濃密な夜空を二つに裂くようにして広がったその銀河の帯には無数の星々がびっしりと散らばっている。それはまるで遥かな時空の裂け目に向かって、光のかけらが吸い込まれているようだった。僕たちは言葉を失い、ただどこまでも広がる世界の圧倒的な神秘を目前に立ち尽くしていた。その光景は息を呑むほどに美しく、人間がこねくり回してきた理屈や定義といったちっぽけなものを、いとも簡単にねじ伏せてしまうような絶対的な力強さに満ちていた。人間が歴史の中で積み上げてきた営みやあがきなど、この星々の静かな輝きには到底及ばないのだと、皮膚の感覚で強く感じていた。それほどまでに僕たちの頭上に広がる世界はどこまでも美しく、そして救いがたいほどに広大だった。", "「なんか、こうやって宇宙の広さを感じていると心が安らぐよ」", "「安らぐ？」", "僕は頷いて、改めて夜空を仰いだ。幾千もの星が、叫ぶように輝いている。", "「宇宙の大きさに比べたら、自分の抱える悩みは取るに足らないものだって思えるからさ」", "「わからなくもないけど、虚しくならないか？」", "僕はそれについて考えを巡らせた。宇宙を見上げたときの、何かとても大きなものに包まれているような感覚を表したかった。", "「確かに宇宙の広さに圧倒されて虚しくなることはあるよ。僕たちの想像を絶するくらい宇宙は広いからね。そう言った意味での無力さはある」", "僕は素直に認めた。", "「だけど、それがときとして励みになるんだよ」", "「励みに？」", "僕は頷いて、夜空をじっと見つめた。夜空にまたがる天の川は世界の神秘を解き放つように、果てしなく広がっている。", "「毎日必死に働いて、でもふと顔を上げればこんなにも美しい世界が広がっている。僕たちは本当はものすごく小さな生き物で、僕たちだけの力でこの美しい世界が変わることは決してない。そういった意味で僕たちは無力だよ。だけどこの宇宙は僕たちがどんな絶望や悲しみに打ちひしがれていようとも、変わらず美しく在り続ける。それはある意味で、励みにもなる気がするんだ」", "「……励みに」", "トヲルはそれについて、真剣に考えているようだった。僕は小さく息をつき、夜空の遠く彼方を見つめた。", "「いつも星を見上げると思うんだ。星の数だけ希望は残っている、って」", "「……希望」", "僕はその言葉に頷き、ゆっくりと道を歩いた。夜道はどこまでも冷たく、まるで巨大な死体でも横たわっているみたいだった。", "「もちろん星を見上げたからって、人生が劇的に変わることはない」", "それは間違いない。", "「でも、どんなときだって希望は残っている。そう宇宙が教えてくれているような気がするんだよ」", "「……そうか」", "そこで僕たちは黙った。夜空には光の大河が流れている。星たちが呼吸をするように瞬いている。", "「『どんな時だって希望は残っている』キズキにもそう言ってあげればよかったのかな」", "何となしに僕がそう呟くと、トヲルは夜空を見上げたまま、深く息を吐き出すように「ああ」とだけ言った。それから僕たちは言葉を失ったように、ただひたすらに頭上の夜空を眺め続けた。風の音すら優しく溶け込んでいくような、静かで穏やかな夜だった。手を伸ばせば、今にも頭上の星々がこぼれ落ちてくるのではないかと思えるほど、夜空はどこまでも近く、優しく僕たちを包み込んでいた。", "「あのさ……」", "「ん？」", "「お前に、ずっと言ってなかったことがあるんだ」", "「ずっと言ってなかったこと？」", "その言葉にビクッと体が反応した。トヲルはポケットに手を突っ込んだまま、重く息を吐いた。", "「死ぬ少し前に、アイツ言ったんだよ」", "「言った？」", "「ああ、『俺は死なないぜ』って」", "「えっ……？」", "死者が息を吹き返したみたいに、不吉な風が暗い夜道を吹き抜けた。", "「生きとし生けるものは、本当の意味では死なない。死んで生命が失われても、その生命を構成していたものはまた別の何かへと形を変えて永久にあり続ける。俺が死んでも、俺を構成していたものは地球を漂い、宇宙を彷徨い続ける。そしてまたお前たちと、宿命的にめぐり逢うって……」", "「それはつまり……」", "「ああ、自死の予告だったんだ」", "トヲルの声が、紡ぎ出された言葉が、抑えきれない感情に苛まれるようにひどく震えていた。僕はその突然の告白に、息を呑んだ。", "「その時はただロマンチックだと思ってたよ。だけど、アイツは本当にそう思っていたんだ」", "トヲルはやりきれないように、俯いた。", "「自分が死んで骨と灰だけになっても、必ず俺たちとまためぐり逢えるって」", "「本当に……そう言ってたの？」", "「ああ……言ってたよ」", "初めて聞いたことだった。キズキはトヲルと最期に会ったときに、もう死ぬことを決めていたのだ。", "「どうして今までそのことを言ってくれなかったの？」", "問いただすような言い方になってしまった。トヲルは俯いたまま、唇を震わせて声を出した。", "「あの時自殺を止められたのは俺だけだったんだ。なのに俺は自殺を止められなかった。これは全部、俺の責任なんだ」", "「そんなわけないだろ」", "「そんなわけあるんだよ！」", "そう言ってトヲルは肩を震わせた。僕はただ、肩を震わせるトヲルの姿を見つめることしかできなかった。", "「アイツはたくさんのヒントを残していたんだ。でも俺は、それに気づくことすらできなかった」", "「ヒントって……」", "「自分が憎いんだ。何もできなかった、いや何もしなかった自分が堪らなく憎いんだよ」", "トヲルはそう吐き捨てるように言うと、頭を強く抱え込み、その場に固まるようにしてうずくまってしまった。夜の暗闇の中で、肩を小さく震わせるその背中は見ているこちらの手足が冷たくなっていくほど、ひどく不格好で惨めな姿だった。これ以上、自らを切り刻む彼の姿を見ていられなかった。", "「この話はやめよう。これ以上こんな君の姿は見たくない」", "そう言うと、僕はトヲルの肩を叩いて、夜道を歩いた。足を踏み出すたびに重い水圧のような夜気が身体にまとわりついた。まるで光のまったく届かない冷たい海底をあてもなく歩いているかのようだった。すれ違う風の音さえ遠く引きちぎられ、逃げ場のない圧倒的な孤独と、肺を内側から押し潰すような激しい息苦しさだけが、僕の胸を痛いほどに支配していた。"]}, {"title": "第十四話：犬吠埼", "paragraphs": ["路肩に停めておいた車に身を滑り込ませ、ドアを閉めると、密閉された車内に僕たちの重い吐息が残響のように満ちた。エンジンをかけると低い振動が響き渡り、僕たちは真っ暗な九十九里浜を後にした。潮騒の音を引きちぎるようにして夜の国道へ躍り出てからは、一度もアクセルを踏み緩めることなく、ただひたすらに車を走らせ続けた。途切れた街灯と街灯のあわいを幾度も突き抜け、闇を切り裂くヘッドライトの光だけを頼りに流れていく景色の果てを目指した。そうして辿りついたのは、関東最東端、太平洋に向かって爪のように鋭く突出した犬吠埼の岬だった。", "車を降りると、潮風は先ほどよりも一段と冷たく切り立ち、湿った岩肌を打ちつける波音が荒々しく響いていた。周囲を見渡せば、ちょうど東の地平線が仄かに白み始め、深い群青から淡い紫へと溶け込んでいく黎明の薄い光が、世界をそっと包み込み始めているところだった。空と海のあいだに引かれた境界線が薄っすらと浮かび上がり、夜の重厚な闇は、ゆっくりと新しい朝の光に押し流されようとしていた。", "「すごい、夜明けだ」", "「ああ、ほんとだ」", "太陽がすぐそばまで迫ってきているのが目に見えた。今にも水平線の彼方から光が溢れてきそうだった。", "「そろそろ来るな」", "キズキがそう口にした瞬間、まるで世界そのものが大きく息を呑んだかのように、波打ち際から潮がさっと引き、あたり一面に濃密な静寂が降りてきた。ざわめいていた潮風も、遠くの波音も一瞬にして掻き消え、まるでこの一刻だけ、世界からあらゆる音が綺麗に抜き取られてしまったかのように、どこまでも透明な静寂が訪れた。そして次の瞬間、張り詰めた闇を打ち破るようにして、眩い光が世界を溢れんばかりに満たした。再び生き返ったように寄せては返す波音が耳に届き始めた頃には水平線の彼方から真っ赤な天球が姿を現し、力強い朝日が静かに昇っていた。太陽が顔を出すと、それまで天空を重重しく覆っていた深い藍色は急速にその色を失って澄み渡り、足元に広がる冷たかった砂浜は、光の粒子を浴びて一瞬にして美しい黄金色へと染め上げられていった。それはまるで世界が古い姿を未練なく捨て去り、真新しい光の姿を手に入れる、まさにその瞬間だった。", "「すごい眺めだね」", "「ああ、そうだな」", "僕たちは言葉を交わすことも忘れ、その圧倒的な光景をただ息を呑んで眺めていた。水平線から溢れ出した眩い光は、またたく間に世界の隅々までを満たし、視界のすべてが眩いばかりの輝きで溢れかえっていた。あまりにも美しい光景だったので、僕たちはそれから三十分ほどの間、潮風に身を晒したまま、ただ無言でその朝日を眺め続けた。ふと我に返り、隣に立つキズキの横顔を見やると、そこには穏やかな微笑を口許に湛えた彼の姿があった。しかしその温かな微笑みはやがて、夕暮れの残光のようにゆっくりと彼の奥深くへと消え去っていってしまった。そしてあとに残されたのは、荒涼とした大地を見つめるような、どこか物悲しい眼差しだけだった。その瞳の奥には、今まさに世界を照らし出している朝日の眩い光でさえも一切受けつけないような、どこまでも深い、深い闇が横たわっていた。そしてその眼差しは水平線の彼方を超え、もっと遠く、深い場所をただ静かに見つめていた。", "レンタカー店に借りていた車を返却し、僕たちが寮の門をくぐったのは午前十時のことだった。寮に戻るなり、無断で夜を明かした──外泊届けを出していなかった──ことで、僕たちは待ち構えていた寮長からこっぴどく叱られた。迅雷のような説教は小一時間も続き、もう少しで大学の講義に遅刻してしまうところだった。それでもなんとか走って教室へ滑り込み、ギリギリで出席カードを通すことができた。", "講義が終わると僕たちは逃げるように寮へ戻り、それぞれの自室のベッドに倒れ込むようにして眠りについた。二人とも昨夜は一睡もせず、ただひたすら車を走らせて夜を駆け抜けていたから、身体は鉛のように重く、シーツの冷たさに触れた瞬間に意識が遠のいていった。まぶたを閉じる間際、僕は頭の中でもう一度だけ、あのどこか滑稽で愉快な一夜の出来事について思いを巡らせた。海ほたるの潮風の匂い、九十九里浜の満天の星空、そして犬吠埼で見た、言葉を失うほどに美しい朝日の光。どこまでも長く、険しく、そして心地よい夜だった。僕たちはその幸福な疲労感の中で、自分たちの時間がこの先も、いつまでも続いていくのだと疑わずに信じ切っていた。しかしその夢のようなひとときは翌朝、あまりにも唐突に、無惨に引きちぎられることになる。何故なら、あの夜から五日が経った頃にはもう、キズキが死んでいたのだから──。", "キズキが死んだと僕が理解したのは、あの長く奇妙な夜から数えて五日目のことだった。泥のような深い眠りから目を覚ますと、すでに窓の外は傾きかけた午後の陽射しに切り取られていた。鉛のように重い身体を引きずりながらベッドの上で身を起こすと、そこにあるべきキズキの姿は、どこにも見当たらなかった。皺ひとつなく綺麗に整えられたままのシーツは、彼がそこで休んだ痕跡すらないことを無言で告げていた。はじめのうちは、どこかへふらりと散歩にでも出かけたのだろうと高を括っていた。しかし窓の外の景色がゆっくりと群青色の闇に沈み、冷たい夜がすっかり更けてしまっても、彼は一向に寮へ戻ってくる気配を見せなかった。少しばかりの胸のざわめきを覚え、どこかで外泊でもしているのかと古びた事務室へ足を運び、寮長に尋ねてみた。しかし、しかめ面をした寮長は「アイツから外泊届は出されていない」と素っ気なく答えるだけだった。寮長もまた、キズキがいつ寮を出て行ったのか、その行方をまったく把握していなかったのだ。僕は自室でトヲルと顔を突き合わせ、とりあえず一晩だけ様子を見ることに決めた。というのも、キズキには時折、誰にも何も告げることなくふらっと外へ姿を消してしまう、迷い猫のような癖があったからだ。いつもの気まぐれだろう。僕たちはそう自分たちに言い聞かせることで、心の奥底で蠢き始めた得体の知れない不安を無理やり押し殺した。", "ところが、翌日になっても事態は変わらなかった。キズキは依然として寮に戻ってこなかったのだ。流石に事の異常さに気づいた寮長も渋い顔つきになり、キズキの携帯へ何度か連絡を入れた。しかし、電子的な呼び出し音は空虚な空間に響き続けるだけで、彼がその電話に出ることは二度となかった。キズキは、まるで最初からこの世界に存在していなかったかのように、外出をしたきり、ぷっつりと途絶えてしまった。", "彼が自ら命を絶ったという決定的な事実を知らされたのは、それからさらに三日の空白を経た後のことだった。詳しい経緯は、僕やトヲルにはすぐには呑み込めなかった。どうやら管轄の警察署から寮へ直接電話が入り、キズキが自殺を図り、すでにこの世を去っているという事実だけが事務的に告げられたようだった。受話器を置いた寮長は、いつもとは違うひどく青ざめた顔色で僕たちの部屋をノックし、真っ先にその重苦しい事実を伝えてきた。「キズキが死んだ」。その短い言葉は、僕たちの間に落ちた冷たい石のように、重く、そして暴力的なまでの響きを持っていた。", "翌日、僕たちは警察署に呼び出され、殺風景な部屋で事情聴取を受けることになった。灰色の壁と蛍光灯の冷たい光の下で、警察官の口から語られる彼の最期は、あの美しい朝日の記憶とは対極にある、あまりにも無機質で現実味を欠いたものだった。そして僕たちがキズキの死の生々しい詳細と、彼が一人で抱え込んでいた深い闇の正体を思い知らされることになったのも、まさにこの事情聴取を受けていたときのことだった。", "警察官が無機質な調子で淡々と語る言葉によれば、キズキの遺体が見つかったのは、長野県の山間にぽつんと取り残された、すでに廃業して久しいホテルの浴槽の中だったという。そのホテルは半年前、経営者の一人が地方自治体の観光業振興のための県の補助金を不正に受給していたことが明るみに出たことで、地域社会からの信用を根底から失い、破綻へと追い込まれた施設だった。当時、その事件は地元の新聞で大々的に報じられて大きな騒動となったばかりか、全国放送のニュース番組でも社会の歪みを示す一例として二度にわたってピックアップされていた。キズキがその遠く離れた廃ホテルに目をつけたのも、恐らくは図書室の隅でめくった地方紙の片隅か、あるいは深夜のテレビ画面の奥に映し出されたそのニュースを、何らかの拍子で目にし、記憶していたからではないか──警察はそう推測していた。", "ホテルは廃業宣告を受けて以来、誰一人として管理する者もなく、ただ時の風化に任せて放置されていた。周囲を囲む雑草は生い茂り、外壁を叩く雨風によって窓ガラスは幾重にも蜘蛛の巣状のひびを刻み、剥がれ落ちた壁紙が湿り気を帯びて冷たく垂れ下がっていた。夜風が通り抜けるたびに、誰もいない空室の木製ドアがギィギィと嫌な音を立てて軋むような、完全に世界から忘れ去られた廃墟と化していたのだ。キズキの冷たくなった遺体が発見されたのは、そのホテルの二階奥にある、一室のツインルームの浴室で、第一発見者は週末の夜に好奇心本位で肝試しに忍び込んだという地元の高校生たちだった。彼らは闇の中で懐中電灯の光を泳がせ、足を踏み入れた浴室の浴槽の中で、両手首から流れ出た途方もない量の血の海に浸かるキズキの姿を目撃したのだという。しかし警察官が語った中で最も僕たちの胸を締め付けたのは、その凄惨な死の状況ではなく、彼が最期を迎えた部屋の異常な姿だった。ホテルのあらゆる空間が埃と落書きで荒れ果てていた中で、キズキが自らの死に場所として選んだそのツインルームの室内、浴室、そして洗面所だけが、まるで今さっき高級ホテルの清掃員が仕事を終えたばかりであるかのように、恐ろしいほど完璧に整えられていたのだった。警察官は感情を殺した淡々とした声で、「現場に入った捜査員が、その整然とした様に思わずため息を漏らしたほどでした」と呟き、僕とトヲルに数枚の現場写真を差し出した。指先に触れる冷たい写真には、確かにキズキが自分の手で整えたという部屋が写し出されていた。黄ばんで破れていたはずのツインベッドには、彼がわざわざ持ち込んだと思われるシーツの皺ひとつない真っ白な生地が完璧に張り巡らされていた。洗面所の鏡は綺麗に磨き上げられ、棚には新品の歯ブラシや折りたたまれたタオルといったアメニティ類が、ミリ単位の狂いもなく一列に美しく並べられていた。僕とトヲルはその狂気すら孕んだあまりにも整然とした部屋の写真の一枚一枚を、震える指先で静かに手に取り、死を前にしたキズキがその手で残そうとした言葉にならない何かの気配を、必死に感じ取ろうとした。しかしどれだけ指を滑らせても、そこにキズキの抱えた何かを感じることができなかった。", "完璧に整えられたベッドや洗面所とは惨烈な対比をなすように、彼が命を散らした浴槽の中だけは、目を背けたくなるほど凄惨な朱色に染まっていたという。当初、その遺体の凄まじい損傷と血の海から、警察内部でも他殺の可能性が疑われたほどだった。しかし血の海と化した浴槽の縁に、吸い殻を幾つも溜め込んだ陶器の灰皿が整然と置かれていたこと、そして冷たくなった彼の手元には、自身の指紋がくっきりと残された使い捨ての剃刀が落ちていたことなどを総合的に照らし合わせた結果、捜査は事件性のない純粋な自殺であるという結論に至った。つまりキズキは、補助金の不正受給によって放置された廃ホテルという存在を何らかの方法で見つけ出し、あのどこまでも長く、奇妙で美しい夜の旅を終えたまさにその翌日、誰にも何も告げずにひとり密かに寮を抜け出したのだ。そして電車とバスを乗り継ぎ、人知れず長野の廃墟へと足を踏み入れ、たったひとりで部屋の隅々まで磨き上げ、真っ白なシーツを敷き詰め、一本の煙草を静かに燻らせながら、自らの刃で手首を切り裂き、ゆっくりとこの世界から去っていったのだ。死因は手首の静脈を深く切ったことによる出血死。警察が割り出した彼の死亡推定時刻は、あの夜から数えて三日後の、闇が最も深く沈み込む夜中の十一時だった。", "警察はキズキの凄惨な最期についての説明を淡々と終えると、手元の黒いメモ帳に視線を落とし、まずは高校時代からの古い友人であったトヲルに向かって、彼の日頃の様子や言動についての聞き取りを始めた。トヲルが絞り出すような低い声で短く答えていくのを横目で眺めながら、僕は冷たいパイプ椅子の感触にただひたすら耐えていた。やがて警察官の硬い眼差しが、今度は僕へと向けられた。いくつか事務的な確認がなされた後、刑事は僕の目をまっすぐに見つめながら問いかけてきた。", "「キズキ君に、自死を匂わせるような兆候や、悩んでいる素振りはありましたか？」", "僕は重い首を縦に振る気力もなく、ただ小さく横に振った。すると刑事は手帳のページをくくり、寮長から聞いたのであろう情報を確かめるように語気を強めた。", "「それでは、彼が命を絶つ直前、ドライブをした目的は何だったのですか？ なぜあのタイミングで九十九里や犬吠埼へ向かったのですか？」", "その問いに、僕は言葉を飾る余裕もなく、「彼に誘われたからです。断る理由もなかったので、そのまま一緒に行きました」と正直に答えた。", "刑事はペンを握る手を一瞬止め、眼鏡の奥の鋭い瞳で、こちらの真意を探るようにじっと僕の顔を検分した。殺風景な室内に、壁の時計が刻む不躾な針の音だけが響いていた。刑事は少し間を置いてから、さらに深く踏み込むように尋ねてきた。", "「その旅の道中で、キズキ君は何か意味深な発言をしていませんでしたか？ あるいは自分の最後を予感させるような、妙な言葉を残しては？」", "その瞬間、僕の思考は突如として白いモヤに包まれたように停止した。こめかみの奥が、ずきんずきんと重く鈍い痛みを打ち始め、胃の底から押し寄せてくるひどい吐き気が喉元まで込み上げてきた。犬吠埼の水平線から昇ったあの力強い朝日の光と、その直後に見た、キズキの瞳の奥に潜んでいた冷たく底のない漆黒の闇──あの対極的な二つの光景が、激しい目眩とともに脳裏にフラッシュバックしていた。僕が顔を蒼白にし、言葉に詰まって完全に押し黙ってしまうと、刑事は静かに溜息をつき、手帳から視線を外して五秒ほどじっと待った。そしてそれ以上追及することはせず、その質問を静かに棚上げにして次の項目へと踏み越えていった。どうやらそれが彼らなりの精一杯の気遣いであり、配慮のつもりらしかった。しかし今の僕にとっては、そんな些細で無機質な気遣いなど何の役にも立たず、胸の底に渦巻く気持ち悪さを打ち消すことなど到底できなかった。", "結局、それ以降僕たちは硬直したまま、刑事の機械的な質問に対して三回頷き、二回首を振った。刑事もそれで納得したのか、事情聴取を終えた。重い鉄の扉を押して警察署の外へ出ると、午後の眩い日光が容赦なく僕たちの眼球を刺した。僕もトヲルも、心身をボロボロに削り取られ、立っていることすら危ういほどひどく憔悴しきっていた。しかし警察署の冷たい空気を抜け、現実の街のざわめきの中に放り出されたその頃には、それまでどこか現実味を欠き、浮遊していたキズキの死が、逃れようのない絶対的な真実として、僕たちの胸の真ん中に重く、はっきりととどまっていた。"]}, {"title": "第十五話：見届けるよ。そこで。", "paragraphs": ["トヲルの家と思しき建物にたどり着いたのは、あの湿っぽく鬱屈したバーのドアを押して夜の街へと押し出されてから、およそ三十分が経過した頃のことだった。街灯の光も疎らな住宅街の奥にひっそりと佇むその家は、立派な手入れの行き届いた庭を従えた、重厚な造りの二階建ての一軒家だった。そして家屋のすぐ横には、母屋の重厚さに負けないほど頑丈で、どこか無機質な圧迫感を放つ大きなガレージがどっしりと備え付けられていた。トヲルはこちらを振り返ることもなく、ポケットから取り出した鍵をガレージの金属製シャッターの鍵穴に静かに差し込んだ。", "「実家だよ。父親は俺が二十八のときに癌で死んで、母親は施設に入ってる。だから今は一人で住んでるんだ」", "そう言いながらトヲルはガレージを開け、中へ入るよう手で示した。僕は頷いて、ひんやりとした空気の中に足を踏み入れた。", "「一人で寂しくない？」", "「実家だからな。特に寂しくはないよ」", "トヲルはそう言いながら、ガレージに停めてあった車のボディに手を滑らせた。それはキズキが憧れていた、日産のプリンス・グロリアだった。", "「これって……」", "「覚えてるか？ キズキが好きだったやつだよ。中古で、ちょっと奮発して買ったんだ」", "「いや、覚えてるけど……どうして、これを？」", "僕が尋ねると、トヲルは何も答えず、ポケットから煙草を取り出して火をつけた。煙が一筋、ガレージの暗がりに昇っていく。", "「俺さ、アイツのことがずっと好きだったんだよ」", "「それは自分もだけど──」", "「そうじゃなくてさ」", "短くそう言って、トヲルは黙り込んだ。何か聞き返そうとしたが、言葉が出てこなかった。", "「俺さ、どうしてもアイツのことが忘れられないんだよ」", "トヲルはそれ以上多くを語ろうとはせず、ただ無言のまま手際よく手元を動かし始めた。", "ガレージの奥から取り出してきた厚手のゴムホースを引きずり寄せると、その片端をグロリアの太い排気パイプの先端へと固く押し込み、隙間を潰すように深く繋ぎ合わせた。続いて助手席のシートの上に置かれていた粘着テープのロールを手に取ると、ビリビリと静寂を切り裂く乾いた音をガレージ内に響かせながら、グロリアの窓ガラスの境界線を一枚、また一枚と手慣れた手つきで執拗に目張りしていった。整然と、そして淡々と進められるその一連の作業は、かつて長野の廃ホテルで部屋を寸分違わず磨き上げたキズキの手際と、恐ろしいほどに重なって見えた。", "「おい、何してるんだよ」", "声をかけても、トヲルの手は止まらなかった。迷いのない、淀みない手つきだった。", "「昔の車にはガスを浄化する装置がついていないんだ。だから、このホースで車内に排気ガスを送り込めば──死ねるんだよ」", "トヲルは黒いゴムホースのもう片端をリアウィンドウのわずかな隙間から車内へと引き込み、外気と遮断するように最後の窓枠へガムテープを幾重にも貼り重ねた。隙間なく目張りが施され、完全な密室へと変貌を遂げていくグロリアの車体。その一切の迷いがない機械的な手の動きを目にした瞬間、トヲルがこれからここで何を成し遂げようとしているのか、僕は否応なく、そして残酷なまでに理解してしまった。", "「やめろよ。そんなことして、キズキが喜ぶと思ってるのかよ！」", "「キズキは喜ばないだろうな。だけど、もういいんだよ」", "そう言ってトヲルはワイパーに一枚の紙を差し込んだ。それはキズキの遺書だった。", "「アイツが死んでから十年、俺はただがむしゃらに生きてきた。アイツのことを思って眠れない夜もあったし、忘れようと必死になった時期もあった。それでも前だけを向いて生きてきた──はずだった」", "煙草を吸い、長く息を吐く。白い煙が失われた魂のように揺らめいてガレージの天井へ消えていく。", "「だけど、やっぱり辛いんだ。アイツのいない朝が、アイツのいない夜が、俺にはもう耐えられない。一日生きるたびに、アイツが自分にとってどれだけ大切な存在だったか、ひしひしと思い知らされる。それが毎日、十年だよ。耐えられるわけがないだろ。俺にはもう無理だ」", "大きく息をつくトヲルを見て、ひくりと胸が痛んだ。この十年の重さを思うと、何も言葉が出なかった。", "「そんなとき、キズキの姉さんから遺書を見せてもらったんだ。震えたあの字を見て、俺はハッとした。アイツの苦しみが、そこから伝わってきたから。それで思ったんだ。アイツの『息をするのも、しないのも辛い』っていう感覚を、自分でも味わってみようって。そうやって調べて、準備して、今夜決行すると決めた。だけど、どうしても最期にお前に会いたかったんだよ。キズキの話をしたかった。遺書も見せたかったしな。だけどお前と話してるうちに思ったんだ。お前に、俺とキズキの最期を見届けてほしいって」", "「馬鹿なこと言うなよ」", "必死で止めようとしたが、トヲルの耳には届いていなかった。トヲルは煙草を指に挟んだまま、こちらを見て、不器用に笑った。", "「お前と話すのは楽しかったよ。寮を抜け出して花火をして、麻雀に明け暮れたあの日々を思い出した。短い人生だったけど、俺は幸せだった。キズキを失ったことはものすごく辛かったけど──もうすぐ会える。だから、見届けてほしいんだ。俺とキズキの最期を。なあ、頼む」", "手を合わせるトヲルを前に、僕は車内に通されたホースに視線を落とした。", "「これで、本当に死ねるの？」", "「どうだろうな。だけど、死ぬのには時間がかかるよ」", "僕はガムテープで隙間なく目張りされたグロリアの窓を吸い寄せられるようにじっと見つめていた。ガラスとフレームの境目を完璧に覆う黒いテープの線は歪み一つなく美しく直線を描き、重なり合う角の処理に至るまで狂いなく整えられていた。死に向かうための作業であるはずなのに、そこに投げやりな感情は一切見当たらない。その几帳面で、冷徹な貼り方ひとつにまで、どこまでも真面目で繊細なトヲルの性格が痛々しいほどに滲み出ていた。そしてその完璧な手際こそが、彼の決意がもはや誰の手にも届かないほど深い場所へ行ってしまったことを、何よりも雄弁に物語っていた。", "「苦しみながら死ぬわけ？」", "「キズキの抱えた苦しみを、知りたいんだよ」", "「だからって……」", "言葉を紡げなかった。トヲルの瞳が「止めないでくれ」と、はっきり訴えていた。", "「キズキのことが、好きだったのか？」", "その問いに、トヲルは遠いどこかを見るような目で、助手席のシートに視線を落とした。", "「ああ……もう、ずっと」", "その一言には、十年という時間が積み上げた執着と、それが報われなかった虚無とが、静かに溶け合っていた。", "「どうして言ってくれなかったんだ。言ってくれたら、一緒に考えることだってできたのに」", "「そんなこと、できるわけないだろ。絶対に……」", "「どうして？」", "そこでトヲルは皮肉めいた笑みを浮かべ、ゆっくりと首を横に振った。", "「だってアイツが好きだったのは、お前だったから……」", "「えっ？」", "喉から絞り出した声は、ひどく掠れていた。その言葉に理解が追いつかず、ガレージの輪郭がぐらりと歪んだ気がした。", "「どういう、こと」", "トヲルはグロリアの助手席の扉を開け、中から一冊の文庫本を取り出した。", "「この小説、知ってるだろ」", "差し出されたそれは、キズキがあの日、居酒屋で誇らしげに見せてくれた川端康成の『掌の小説』だった。そっと受け取った本は記憶の中にあるよりもどこかずっしりと重く、何度も読み返された証のようにページの角は優しく丸みを帯び、紙の繊維がわずかに毛羽立っていた。開くと、古紙のかすかな甘い香りと仄かなインクの匂いが立ち上り、ぎっしりと文字の詰まったページが、指の熱を吸い込むようにしっとりと波打っていた。間違いなかった。十年前、キズキが自ら命を絶つほんの数日前、あの居酒屋の狭いテーブルで愛おしそうに手にとっていたあの一冊だった。失われた時間の重みに胸を突かれながら、パラパラと静かにページを捲っていると、紙の隙間から滑り落ちるようにして、一枚の紙片が床へと落ちた。拾い上げて手に取ると、それは鮮やかな青い花を丁寧に押し花にした一枚の栞だった。時が止まったかのように色鮮やかなその青は、あの犬吠埼で見た明ける直前の群青の空のようであり、同時に僕たちが二度と戻ることのできない、あの青い季節の残像のようでもあった。", "「勿忘草、だよ」", "「わすれなぐさ？」", "「ああ。花言葉は『わたしを忘れないで』だ」", "「わたしを忘れないで……」", "トヲルは苦笑いを浮かべた。", "「この間、キズキの実家に線香をあげに行ったとき、遺品を見せてもらったんだ。そうしたら、この小説が出てきた」", "その声はどこか遠くから響いてくるようだった。僕は手の中の文庫本を、ただ凝視することしかできなかった。", "「最初はキズキの好きだった小説の一冊かと思って気にも留めなかった。だけど、妙なところにこの栞が挟まっていたんだ」", "「妙なところ？」", "栞が挟まれていたページに目を落とすと、そこには鮮明に見覚えのある『化粧の天使たち』の一節が横たわっていた。『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』少し掠れたインクで丁寧に引かれた青い下線。十年前、居酒屋の仄暗い灯りの下で本を開き、「幽遠な文章だと思わないか」と静かに語りかけてきたキズキの横顔と声が、昨日のことのように鮮烈に脳裏に蘇った。季節が巡り、どれほど年月が過ぎ去ろうとも、花は巡り来る春に必ずその咲き誇る姿を現す。しかしその花の名を教えてくれた当の本人はもうどこにもおらず、残されたものたちだけが、去りゆく亡き人の影を追いかけながら止まった時間の中に取り残されていた。青い押し花の栞と、丁寧に引かれた一本の線。それは彼がこの世界に存在していたことを示す確かな証であり、同時に残された僕たちへ向けた、別れの遺言のようなものだった。", "「『別れる男に、花の名前を一つは教えておきなさい』と書かれたページに、勿忘草の栞が挟まっている。妙だと思わないか」", "その問いを、僕は真っ向から否定することができなかった。文学を愛したキズキなら、そこに何かメッセージを伏せていてもおかしくない。", "「だからって、どうしてそれが僕を好きな理由になるんだ」", "僕が問い詰めるように言うと、トヲルは一歩、二歩と歩み寄り、栞を取り上げてその裏側を僕に見せつけた。", "「裏に、イニシャルが書かれているんだよ」", "目を凝らすと、達筆な字で「Ｈ・Ｍ」と書かれていた。", "「Ｈ・Ｍ。俺はこのイニシャルを持つやつを一人しか知らない。もう、わかるだろ。早川ミツル──」", "その名が叫ばれた瞬間、『掌の小説』を見せてくれたときのキズキの言葉が、脳裏に鮮明に浮かんだ。──なんか素敵じゃないか。好きな人に毎年思い出してもらうために、花の名前を教えるなんてさ。あのどこか寂しさに押しつぶされそうな声。ずっと遠くを見つめるような痛々しい眼差し。まさかと思った。しかし、トヲルの叫んだ「早川ミツル」という名は、確かに僕の名前だった。", "「なあ、ミツル。知ってるか、勿忘草のもうひとつの花言葉──」", "「えっ……」", "僕たちの間を過ぎ行く沈黙を餌に、天使と悪魔が巧妙な駆け引きをしている。", "「『真実の愛』だよ」", "「……真実の愛」", "その言葉が耳に届いた瞬間、記憶の波が一斉に押し寄せた。ずっと前から好きな人がいると語ったときの、覚悟を宿した冷たい横顔。絶望的な距離があると語ったときの切実な眼差し。好きな人について尋ねたときに見せた一瞬の驚き。今度、想いを正直に伝えてみようと語った遠い目。『月を喰らうもの』を語るときの異様な饒舌さ。鴨川で「俺がどう見える？」と尋ねたときの、抑えきれない苦悶。そのすべてが走馬灯のように脳裏を駆け抜けた。", "「好きな人って……」", "視線を落とすと、トヲルがあの日に見せた些細な言動の数々と、目の前に広がる事実が音を立てて一つに収斂していった。『掌の小説』に挟まれた栞には勿忘草が押し花されている。花言葉は『私を忘れないで』と『真実の愛』。そして『化粧の天使達』、そこでキズキが線を引いていた一節は──。", "「『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』」", "手が震えていた。震えが止まらなかった。", "「もう、わかっただろ。これは偶然なんかじゃない。確信犯なんだよ、アイツは」", "彼の一言一句が、鉛のように胸へと沈んでいった。キズキが抱えていた深い孤独と、誰にも言えなかったひそかな愛。それが十年後の今夜、あまりにも残酷な形で息を吹き返し、トヲルの心を突き動かし、僕の眼前に突きつけられていた。その事実に、僕はただ愕然としていた。", "「アイツは自分の意思で、この想いを勿忘草に託して、遺書としてお前に残したんだ。俺じゃない、お前に、だ──」", "あの日、居酒屋で見せたキズキの寂しげで、しかしどこか晴れやかな微笑みが脳裏に鮮明に蘇る。", "「だから、俺はここで死ぬ。悔いはない。アイツのところに行くんだよ」", "トヲルの声には、もう迷いがなかった。", "「でも、一人で死ぬのはあまりに哀しい。だから、お前に見届けてほしいんだよ。俺たちの最期を」", "懇願するその手が、震えていた。自分が今、どれほど残酷な決断を迫られているのか、僕はようやく悟った。", "「……わかったよ」", "「見届けてくれるのか」", "一段、明るくなった声。それが余計に悔しく、僕は拳を強く握った。", "「見届けるよ。そこで」", "そう言って、僕はプリンス・グロリアの助手席を指差した。指先を目で追ったトヲルは、ひどく驚いた顔でこちらを見た。"]}, {"title": "第十六話：旅の終わり、日々の始まり", "paragraphs": ["キズキの死を知らせる電話が鳴ったあの日から、世界は急激に色彩を失った。警察署を出たあと、僕とトヲルはしばらくまともに言葉を交わすことができなかった。駅までの道を並んで歩きながら、ただ互いの足音だけを聞いていた。日常のすべてがひどく色褪せて見えた。コンビニの看板も、信号機の音も、すれ違う人々の笑い声も、月並みな言葉で表せば、遠い世界の出来事のようだった。キズキの葬式もまた驚くほど淡々と進んでいった。線香の匂いと、僧侶の読む経と、親族の啜り泣き。その中で、僕はただ立ち尽くしていた。何か言葉をかけなければと思っても、果たして何を言えばいいのかわからなかった。キズキの母親が棺にしがみついて泣き崩れる姿を、僕は直視することすらできなかった。火葬場の煙突から立ち昇る煙を、丘の上から眺めたあの日。僕が「まるで天国に向かって昇っているみたいだ」と言ったことを、彼は鮮明に覚えていたが、僕自身は長らく忘れていた。だけどそのときの僕には、そんな感傷に浸る余裕すらなかった。ただ目の前で起きていることが現実だとは、どうしても思えなかった。", "大学に戻ってからの日々は、奇妙な静けさに包まれていた。寮の部屋からキズキの私物が運び出されたあと、隣の部屋はしばらく空室のままだった。寮長も、他の寮生たちも、その部屋の前を通るときだけ、少しだけ声を潜めるようになった。誰もキズキの名前を口にしなかったし、誰も口にしたいとも思っていなかった。それはまるでキズキという存在を悪性のウイルスか何かだと思っているようだった。それが僕にはひどく腹立たしかったし、同時に途方もなく虚しかった。そして僕はその行き場のない思いをかき消すように、大学の講義にひとりで出席し、レポートを書き、サークルの集まりにも頻繁に顔を出すようになった。傍目にはいつも通りの学生生活を送っているように見えただろう。だけど僕の内側では、何かが決定的に壊れてしまっていた。夜、ベッドに横たわると決まってあの夜のドライブのことを思い出した。代々木パーキングエリアの缶の温もり。海ほたるから見た東京の夜景。九十九里浜で競走したときの息切れ。犬吠埼で見た夜明け。そして鴨川で見せたあの、悲愁に満ちた表情。どうしてあのとき、もっと深く尋ねなかったのだろう。どうしてあのとき、ハンドルを握ったキズキの手を、もっと強く握り返さなかったのだろう。後悔は際限なく押し寄せ、夜ごと僕を苛んだ。", "トヲルとはしばらくの間、連絡を取り合うことができなかった。顔を合わせれば、否応なくあの日のことを思い出してしまう。電話のベルが鳴るたびに心臓が竦んだ。お互いがお互いの傷を見るのが怖かったのだと思う。キズキを失った悲しみを分かち合うことすら、当時の僕たちにはできなかった。 大学の卒業式で久しぶりに顔を合わせたとき、トヲルは見違えるほど痩せていた。スーツの袖から覗く手首は、記憶にあるよりもずっと細かった。「元気か」と尋ねると、トヲルは力なく笑って「まあな」とだけ答えた。その目の奥に、深い疲労と、まだ癒えていない傷の色が見えた気がした。", "社会人になってからの僕たちは、それぞれ別の道を歩んだ。僕は出版社に就職し、文芸編集の部署に配属された。皮肉なことに、毎日のように誰かの「書いた言葉」と向き合う仕事だった。原稿を読みながら、ふとキズキの『月を喰らうもの』のことを思い出すことがあった。精緻な構成と、ひとりの少女の報われない愛を描いたあの物語を語るときだけ、饒舌になるキズキの姿が脳裏から離れなかった。トヲルは大手の機械メーカーに、技術職として入社した。入社三年目で早くも昇進し、実直に仕事をこなしているという話を、共通の知人から時折耳にした。住む場所も離れ、生活のリズムも違う僕たちは、自然と会う機会を失っていった。それでも完全に縁が切れることはなかった。年に一度か二度、どちらからともなく連絡を取り、居酒屋で酒を酌み交わす習慣だけは、不思議と絶えることなく続いていた。最初の数年は、キズキの名前を出すことすら避けていた。居酒屋で乾杯をしても、思い出話に花が咲いても、決まってキズキのことだけは触れずにいた。その名前を口にした瞬間、せっかく保っていた均衡が崩れてしまう。そんな予感が互いの中にあったのだと思う。だから僕たちは、当たり障りのない仕事の話や、最近見た映画の話ばかりをした。", "転機が訪れたのは、キズキが死んでから五年目の命日だった。", "その年、トヲルが珍しく自分から連絡をしてきた。「今年は、ちゃんとキズキの話をしよう」と。電話越しのその声は、いつになく真剣だった。僕は少しの躊躇のあと、わかったと答えた。その夜、僕たちは初めて正面からキズキについて語り合った。彼の笑い方、彼の口癖、彼が好きだった本、彼が見せた優しさ。語るほどに止まっていたはずの涙が、不思議と溢れてきた。だけどそれは悲しみだけの涙ではなかった。どこか温かい、救われるような涙でもあった。その夜を境に、命日に合わせてバーで落ち合い、キズキとその記憶について語り合うことが、僕たちの習わしになった。もちろん語ることは、痛みを伴った。あの夜のドライブの記憶を辿るたびに、見落としていたはずの違和感が、後から後から浮かび上がってくる。鴨川での唐突な質問。「またどこかで」という最期の言葉。整然と整えられたホテルの部屋。それらの欠片が、語るたびにぼんやりとした意味を浮かび上がらせては、波紋が広がるように静かに消えていった。だけど僕たちは、その意味を最後まで突き詰めることをしなかった。きっと、それが何を指し示しているのか、心のどこかで気づいていながら、目を逸らし続けていたのだと思う。それでも、語らなければキズキという存在そのものが、この世界から少しずつ損なわれていく気がした。記憶は放っておけば必ず色褪せる。輪郭は曖昧になり、声は遠ざかり、笑顔さえもいつか思い出せなくなってしまう。だから僕たちは毎年その日だけは、互いの言葉と記憶を持ち寄って、キズキという存在を確かめ合った。それが僕たちなりの弔いだったのかもしれない。", "トヲルは表向きには、順調な人生を送っているように見えた。仕事では着実に評価を重ね、同期の中では一番昇進をしていた。三十を過ぎた頃には、後輩の指導も任されるようになったと聞いた。彼は誰もが認める、優秀な技術者だった。だけど命日の夜だけは別人のような顔を見せた。普段の生真面目さからは想像もつかないほど、酒の量が増えていった。最初はビールを一杯、二杯と空けるだけだったのが、いつしかギムレットを何杯も重ねるようになった。酔いが回るほどに言葉数は減り、視線はどこか遠くを彷徨うようになる。僕はそれに気づいていながら、深く踏み込むことができなかった。トヲルの抱える孤独が、僕の想像をはるかに超えるものだと、無意識のうちに感じていたのかもしれない。父親を癌で亡くしたのは、トヲルが二十八のときだった。その知らせを聞いたとき、僕はすぐに駆けつけようとしたが、トヲルは「気にしなくていい、お前にまで気を遣われたくない」と言って、頑なに僕を遠ざけた。線香さえあげさせなかった。あとになって彼の母親が施設に入ったことも、僕は人づてに知った。トヲルは大切なものを失っても誰かに頼ろうとはしなかった。一人で抱え込み、一人で耐え抜き、そして何事もなかったかのように、僕の前では笑ってみせた。その不器用な優しさは、トヲルらしいといえばその通りだったが、その優しさの裏で、トヲルがどれほどの孤独を一人で抱えていたのか、僕は本当の意味で想像することができていなかった。そして十年目の命日。トヲルは約束の時間から、二時間も遅れてバーにやってきた。「年中激務だよ」「昨日も同僚がひとり過労で倒れた」と、いつものように笑いながら話す彼の姿に、僕は自死の兆候を見抜けなかった。ネクタイを緩め、グラスを傾けるその仕草も、疲れは滲んでいたが、いつもと変わらないように見えた。だけどその日のトヲルをよく観察すると、彼は確かに違っていた。グラスの縁を指でなぞる仕草が、いつもより長く、いつもより慎重だった。視線は時折、店の外の暗闇に向けられ、何かを見定めようとするように細められた。それはまるで、長い旅の終わりを前にした人間が見せる、静かな覚悟のようにも見えた。そして僕はそのとき、キズキのことを、彼のことを、何も知らなかった。キズキの胸の内に、十年間ひた隠しにされ続けてきた想いがあることも、その夜、彼の家のガレージに置かれたプリンス・グロリアが、もうひとつの「さよなら」のために静かに準備されていたことも。ただ、僕の隣に座ったトヲルの横顔が、いつになく遠くを見ているように感じられた。まるで、もうこの世界にはいない誰かを、グラスの向こうに探しているみたいに。", "グラスの中で、氷が静かに音を立てて沈んでいった。僕はそんなトヲルの姿をじっと見つめながら、何気なく口を開いた。", "「仕事の方は最近どうなの？」", "それが十年という歳月を経て、すべてが動き始める夜の、ほんの些細な始まりだった。"]}, {"title": "第十七話：君が死んだら、僕も死ぬよ。", "paragraphs": ["「どういうことだよ」", "トヲルが驚いたように、こちらを見つめた。", "「言った通りさ。車内で見届けるよ」", "「それじゃあ、お前……」", "言葉を切り、トヲルは黙り込んだ。僕は短く息を吐き、ボンネットに手を置いた。", "「言っただろ。『君が死んだら、僕も死ぬ』って」", "「本気で言ってるのか」", "「本気だよ。君が死んだら、僕も死ぬ。仲良く心中さ」", "苦し紛れに笑ってみせると、トヲルの顔が歪んだ。痛みに耐えるような、醜い表情だった。", "「君が死んだら、僕はひとりになる。ひとりになるくらいなら、死んだ方がマシだ」", "「だからって……」", "言葉を失ったトヲルの背後で、グロリアがガレージの光を黒く跳ね返している。まるで、こちらを死へと招き入れるように。", "「ほら、死ぬんだろ？ 一緒に逝こう」", "窓ガラスはすべてガムテープで目張りされている。三十分くらいで死ねるだろうか。", "「そうやってお前は、どこまでも俺の心を傷つけるんだな」", "その言葉に、足が止まった。ナイフで胸を抉られたような、鈍い痛みが走る。それでも僕は止まらなかった。", "「ドライブなんて何年ぶりだろう？ キズキとふたりで旅をした以来か。まあ、今回は戻ってこれないけど」", "「……やめてくれ」", "「親も選べず理不尽に生まれたんだ。最期くらい、身勝手に死んだって誰も文句は言わないさ」", "「やめろ！」", "ガレージの重い空気が、互いの吐く息で白く濁った。トヲルの瞳に、凍りつくような憤怒が宿った。", "「君がそんな臆病なやつだなんて、知らなかったよ」", "目張りされたグロリアの窓に手を触れ、僕は静かに言った。", "「せっかく、一人で逝こうとする卑怯な友人に、心中を持ちかけているというのに」", "その瞬間、トヲルの目が見開かれた。驚きと怒り、かすかな困惑がそこに入り混じっていた。", "「卑怯？ 臆病？ 笑わせるなよ」", "一歩、二歩と詰め寄り、トヲルが僕の眼前に迫った。", "「俺がこの十年、どれだけキズキのことを想い続けて、砂を噛むような思いで生きてきたか知ってるのかよ！」", "トヲルの拳がボンネットを激しく叩く。鈍い金属音がガレージに反響した。", "「……わからないよ」", "「わからないなら、偉そうな口叩くなよ。お前のその無自覚な言動が、どれだけ俺たちの孤独を嘲笑っていたか、少しは理解しろよ」", "その言葉に、僕は唇を引き結び、床に視線を落とした。革靴の先に、小さな油のシミが滲んでいる。", "「確かに僕は、僕自身の無自覚な言動で、君やキズキを傷つけたのかもしれない。そのせいでキズキが死んだのなら、僕は君に何も言い返せない──」", "「なら……」", "「でも、もしそうであるなら、僕は尚更君を見捨てるわけにはいかない。傲慢なのはわかっている。それでも僕は、キズキを傷つけてしまった僕だけは、君を見殺しにするわけにはいかない。それは僕自身の個人的な戒めでもあるし、同時にキズキの悲劇を二度と繰り返さないための誓いでもある」", "ガレージの蛍灯が、ジジ、と小さく音を立てて瞬いた。トヲルは何も言わなかった。ただ、戸惑うようにこちらを見つめていた。", "「こんなことを言っても、キズキが帰ってこないことはわかっている。それでもこれは僕なりの贖罪なんだ。僕自身の無自覚によって傷つけてしまったキズキへの最大限の贖罪。キズキはもう二度と帰ってこない。なら、僕はキズキの命に免じて、君を救い出さないといけない。僕自身のひどく無自覚な行動によって、僕は君を失意の底から救い出さないといけない。これは僕に課せられた使命なんだ」", "その言葉に、トヲルの肩からわずかに力が抜けたのがわかった。言葉を失ったトヲルの瞳が、わずかに揺れた。", "「使命なんてどうでもいいんだよ……俺はただ、お前に見守ってほしいだけなんだ」", "その声に先ほどまでの怒気はなかった。ただ疲労だけが、言葉の上に静かに覆い被さっていた。", "「この十年、ずっと堪え続けてきたんだ。だからさ、最期くらいわがままを聞いてくれよ」", "胸の奥で何かが軋んだ。十年分の痛みを吐き出すような、切実な声だった。それでも僕は目を逸らさなかった。", "「なら、さっさと死ねよ」", "「……え？」", "「自分を犠牲にしてでもキズキを想うなら、僕の命を殺してみろよ。僕の命を踏み台にして、キズキに会いに行けよ」", "自暴自棄な叫びをかき消す、静かな声で、僕はトヲルの言葉を制した。", "「もう自分でもわかってるだろ。君は僕の死が怖いんだよ。キズキのいない世界で生きていくこと以上に、僕の死が怖い。違うか？」", "その瞬間、トヲルの顔から血の気が引いた。怒りに染まっていた瞳が大きく揺れ、胸ぐらを掴まれたまま、何かを言い返そうと唇だけが震えている。", "「キズキを想ってるなら、僕を殺してみろよ。僕の命を踏み躙ってキズキに会ってみろよ」", "トヲルは目を見開いたまま固まっていた。怒りに満ちていたはずの眼差しが、行き場を失い、深い戸惑いに変わっていく。", "「ほら、殺せよ。そうしたら誰にも咎められることなく、心置きなく死ねるだろ」", "「やめろ……」", "「もしかして怖いのか？ キズキの死んだ世界で生きるよりも、僕の死が怖いのか？」", "「やめろ、やめろ、やめろ」", "彼は必死に首を振っている。それでも僕は胸ぐらを掴んだまま、詰め寄った。", "「だから臆病者なんだよ。君は自分の命を犠牲にできても、僕の命は犠牲にできない。他人の命を踏み台に生きられるほど傲慢にもなれないし、他人を見捨てられるほど冷酷にもなれない。いいか？ 傲慢になれないなら、差し伸べられた手を弾くな。冷酷になれないなら、見守ってほしいなんてほざくな。僕が僕自身の無自覚な言動によって、君やキズキを傷つけたなら、君だってその中途半端な覚悟で、僕の心を際限なく傷つけているんだよ。そんなことも理解できないで、一丁前に死にたいなんてほざくな」", "そこで初めて、自分が泣いていることに気づいた。頬を伝う涙は止まらなかった。それでも僕は声を張り上げ続けた。", "「自分の命は犠牲にできても、他人の命は犠牲にできない？ 笑わせるのも大概にしろ。君は今夜、死ぬと決めたんだろ？ それなのに適当な理由をつけて、僕をここに連れてきた。その時点で、もう答えは出ているんだよ。君はどうしたって死ぬのが怖いんだ。そしてここに僕を連れてきたのも、結局は自殺を止めてもらいたいだけなんだよ。何を言いたいか、もう分かってるだろ。今夜の逢瀬も、バーでの会話も、ガレージへの引導も、すべては君のくだらないひとり芝居に過ぎないんだよ。舞台俳優みたく悲劇を演じて、グロリアという舞台装置を用意して、観客として僕を呼び寄せて、随分と派手にやってくれたもんだよ。だけど、それはすべて虚構だ。全部フィクションだ。君の本心は、ただひとつしかない。助けてほしい。このどん底から救い出してほしい。それだけだ。それだけしかない。そう、それだけのことなのに君は、こんなにも大掛かりな虚構を築き上げて、本心を伝えることから逃げている。なあ、こんなことやって、馬鹿らしくならなかったのか？ しんどくならなかったのか？」", "叫び終えると、ガレージはひどく静まり返った。トヲルは幽霊でも見たかのように呆然と立ち尽くし、ただ僕の涙を凝視している。その胸ぐらを掴む僕の指先は、怒りと情けなさでガタガタと震えていた。僕は喉の奥からせり上がる熱い塊を強引に飲み込み、さらに言葉を絞り出した", "「苦しいなら、苦しいと言えよ。辛いなら、辛いと言えよ。死にたいなら、死にたいと言えよ。言いづらいのはわかるさ。だけど、言わなければ本当の意味で、何も変わらないだろ。遭難したときに、煙を上げない馬鹿がどこにいる？ もう、わかるだろ。声を上げない限り、人は助けてもらうことができないんだ。そして人は誰かに助けてもらわなければ、生きていけない生き物なんだ。ひとりで抱え込んでいたって、物事はひとりよがりな方向にしか進まない。それによって追い詰められるのは他ならぬ自分自身だろ。しんどくなって、行き場がなくなるのは、他ならぬ君自身だろ！」", "吐き出された僕の息が、ガレージの空気を重く湿らせていく。トヲルはもう、僕から視線を逸らすことすらできなくなっていた。僕は彼を逃がさないようにさらに顔を近づけ、今度は諭すような、それでいてひどく冷ややかな声で告げた。", "「人の命は、死のもとに平等だ。傲慢な政治家も、謙虚なアスリートも、慈愛に満ちた聖母も、死ねばみんな灰になるだけだ。そこに優劣も、序列も、区別もない。身も蓋もないことを言えば、自分が今ここで手首を切って死のうが、君がここでグロリアに乗り込んで死のうが、世界にとってみれば街角の風向きが変わるくらいの意味しかないんだ。それなのにどうして君は、自分の命をそんなに簡単に疎かにできるんだ。少しは自分を愛せよ。尊べよ。君は、優しすぎる。もっと傲慢になるべきだ。他人の命を蹴落としてでも、自分の命を尊重してみせろ。他人の尊厳を踏み躙ってでも、自分は価値ある存在だと証明してみせろ。いつまでも優等生ぶって、謙虚であろうとするな。自分を押し込めて、強がろうとするな。そんなことしかできずに、自分が犠牲になればいいんだなんて思い上がっているうちは、他人を尊ぶ資格なんてないんだよ。少しはそういうことも自覚しろよ！」", "溜まりに溜まった怒りを、すべて吐き出した。僕は息を切らしながら、それでも胸ぐらを掴み続けた。", "「キズキを失って悲しいのはわかる。残された者は、死んだ者に思いを巡らせることしかできない。それがどれだけ虚しく、報われないことか、それは僕だってよく知っている。それでも僕たちは生きて、キズキを想い続けなくちゃいけないだろ。彼を知る、ひとりの人間として」", "トヲルの唇が震えた。反論したいはずだった。否定したいはずだった。だが、その言葉を押し込めるように、僕はさらに声を張った。", "「君はキズキを失ってひどく傷ついたに違いない。その気持ちは、僕にもよくわかる。朝起きても苦しい。街を歩いていても苦しい。何かを見ても、何かを聞いても、ふとした瞬間にキズキを思い出す。『もういない』という事実だけが、何度も胸に突き刺さる。その痛みを、君はこの十年間ずっと抱えてきたんだろ？ それなのに君は死のうとする。君が死んだら、今度はその痛みを僕が抱えることになる。君が味わってきた苦しみを、痛みを、今度は僕が何十年も抱えて生きることになる。君はその苦しみを、僕に押しつけるのか？ 自分が傷ついたように、誰かを傷つけて死ぬのか？」", "「……違う」", "「違わない。いいか、自殺っていうのは人を傷つける死に方なんだよ。それは君が、一番よくわかっているだろ」", "その言葉に、トヲルは黙った。キズキが死んで、僕たちは傷ついた。その傷は今もまだ癒えていない。", "「君はこれまで、数えきれないほど傷ついてきた。傷つきに傷ついて、その果てで死を選ぼうとしている。だけど君が死んだら、今度は君を想う誰かが傷つくんだ。その傷は、簡単には消えない。十年経っても消えなかった君の傷と同じように、ずっと心の奥に残り続ける」", "涙を拭うこともせず、続けた。", "「それでも君は、自分が傷ついたのと同じように、誰かを傷つけて死ぬのか？ 本当に、そんな死を望んでいるのか？」", "「……違う」", "「違わない！」", "声が、心が震えていた。トヲルを失うことが、どうしても耐えられなかった。", "「確かに君は今、死ぬに値するくらい辛いのかもしれない」", "一度言葉を切り、震える息を吐いた。", "「でも君は、まだ死ぬに値するほど幸せじゃない」", "トヲルの眉がわずかに動いた。怯えながらも、その眼差しは僕から逸れなかった。", "「確かに君は、死ぬに値するだけの苦痛を味わったのかもしれない。ここまで生きてきて、もう十分だと思うくらい傷ついたのかもしれない。でも、君はまだ、死ぬに値するほど幸せじゃない。苦痛だけで人生を終えるなんて、あまりにも不公平だ。君はこの世界から傷つけられたことで、たくさんのものを奪われてきた。だったら今度は、その傷に見合うだけのものを、この世界から享受しなきゃいけない。苦しみも、喜びも、その両方を抱えてようやく君の人生は出来上がる。どちらか片方だけを抱えて死ぬなんて、本来あってはならないんだ。だから君はその帳尻が合うまで、もがき苦しみながら生きなきゃいけない。苦しんだ分だけ、幸せにならなきゃいけない。それだけじゃいけないのか？ それだけだからいけないのか？」", "わからなかった。それが希望となるのか、絶望となるのか、救いとなるのか、綺麗事となるのか、何もわからなかった。それでも僕はそう信じることしかできなかった。キズキが死んだあともこの世界には生きるに足る何かが、まだ残されているのだと。僕たちの知る由もない幸せが、この先のどこかに待ち受けているのだと、信じることしかできなかった。僕は一息つくと、ポケットから煙草を取り出し、ライターで火をつけた。針のように細い煙が、ゆらゆらと頭上を漂った。その瞬間、ひとつの情景が脳裏に浮かんだ。", "「大学二年の頃、真夜中の公園でサークルのみんなと飲み明かしたことがあっただろ」", "トヲルは何も言わなかった。ただ濡れた目で、続く言葉を待っていた。煙をゆっくりと吐き出しながら、僕は遠い記憶の底へ意識を沈めた。", "「みんな飲んだくれてバタバタ倒れて、だけどキズキだけは一滴も飲まなかったんだよ。酔い潰れた連中に毛布を掛けたり、コンビニで水を買ってきたり、最後まで世話を焼いていた。キズキらしいだろ？」", "あの夜の景色が、胸の奥に蘇る。", "「それでさ、みんながベンチや芝生で寝静まったあと、僕はふと目が覚めたんだ。みんな眠っていたから、すぐに横になろうとしたんだけど、そのとき、少し離れた遊具のところに、キズキがいるのが見えたんだよ。街灯の下のベンチに腰掛けて、缶ビールを片手に夜空を見上げていたんだ」", "今でも鮮明に覚えている光景だった。", "「驚いたよ。すっかり寝てたと思っていたから。僕はすぐに声を掛けようとした。でも、できなかった」", "僕は静かに、煙を吐き出した。", "「だって、あまりにも楽しそうだったから──」", "トヲルは黙って聞いていた。", "「星空を見ながら、ひとりで笑っていたんだ。声を出すわけでも、誰かと話しているわけでもない。ただ静かに酒を飲みながら、本当に幸せそうな顔をしていた。まるで今この瞬間だけで人生は、十分だって言っているみたいに」", "目を閉じる。今でも鮮明に瞼の裏にある光景だった。", "「あの夜、キズキは何も特別なことなんてしていなかった。ただ星を見て、酒を飲んでいただけだ。でもそのときの僕には、その姿があまりにも美しく見えてしまった。まるで太陽が惚れて、月が嫉妬するくらいに。そのことを、キズキの葬式の日にふと思い出したんだよ。あの憂鬱な葬式の日に」", "白い花に囲まれた葬儀場で、僕は何度もあの夜のことを思い出していた。棺の中で眠るキズキではなく、星空の下で静かに笑っていたキズキを。", "「そのとき思ったんだ。あの楽しそうなキズキの顔を知っているのは、僕だけなんだって。僕だけが知っていて、僕だけが証明できるもの。この世界でたった一人、僕だけが知っているキズキの素顔。僕がいなくなれば、この世界から跡形もなく消えてしまう、なかったことになってしまうキズキの姿。きっと誰もが、そんなものを持っているんだよ。『キズキ』という存在を証明する、記憶をさ」", "「『キズキ』を証明する、記憶……」", "トヲルが、救いを求めるようにこちらを見つめた。息を整え、僕は静かにその目を見返した。", "「そのときに思ったんだ。それが僕の生きる意味なんじゃないかって。自分だけが証明できる『キズキ』を抱えて、『キズキ』が生きたことの証人になる。僕がこの世界で生きている限り、『キズキ』と過ごしたあの日々は色褪せることなくあり続ける。僕たちにしか証明できない『キズキ』があるなら、僕たちは生きている限り、その証人であり続けなくちゃいけない気がするんだよ」", "キズキへの想いが、トヲルへの想いが、胸の奥から止めどなく溢れ出る。それを押し留めることなく、言葉にした。", "「僕たちがいなければ、『キズキ』はどんどんこの世界から損なわれてしまう。それはまずいし、何よりキズキが可哀想だ。だから僕たちは生きなければならない。生きて、『キズキ』が生きていたことを、僕たちの記憶で証明し続けなければならない」", "キズキという肉体は確かに死んだ。だけど、僕たちが覚えている限り、キズキの存在そのものまでが消えてしまうわけじゃない。", "「だから生きるんだ。キズキが生きていたことを、僕たちが生きて証明するんだ。自分のためじゃない、『キズキ』のために生きるんだよ」", "「キズキのために、生きる」", "トヲルの瞳が震えている。煙草を捨て、僕はその肩を両手で掴んだ。", "「そうだよ。僕でも君でもない、キズキのために生きるんだ」", "トヲルの肩が震えている。ぎゅっと掴み、必死に震えを抑えた。", "「このまま、俺は生きていけるのか」", "「生きていけるさ。大丈夫。僕がついてる」", "「キズキのいない世界で、俺は生きていけるのか」", "「生きていけるよ。大丈夫」", "本当に大丈夫なのか、本当に生きていけるのか、わからなかった。それでもトヲルとならば生きていけそうな気がした。", "「一人で抱え込んじゃダメだ。辛いなら、苦しいなら伝えてほしい。分かち合ってほしい。必ず、力になるから……」", "「力になる……」", "僕は頷き、グロリアからホースを引き抜いた。", "「だからさ、キズキが生きられなかった分だけ、一緒に生きよう」", "そう言って僕が微笑むと、トヲルはそのまま床へ突っ伏した。両腕で顔を覆い、固い床に押し当てた体全体を小さく縮めている。溢れそうになる息を何度か呑み込もうとしていたが、やがて呼吸が途切れ途切れになり、肩の震えが大きくなり、低い啜り泣きの声が静かに足元から漏れ出していった。", "「……怖かった。キズキがいなくなったのも、それからの人生も、ずっと怖かった」", "体を震わせながら、トヲルは胸のうちを明かした。", "「そしてお前を失うのも、やっぱり怖かった」", "僕はトヲルの背中を何度もさすり続けた。", "「だけど、本当の意味でキズキが死ぬのは、もっと怖い……」", "「そうだね」", "それから僕たちは、キズキに思いを巡らせた。生者は死者に思いを巡らせることしかできない。それでも僕たちは思いを巡らせることで死者と向き合っていく。ガレージの中で、しばらく誰も言葉を発しなかった。聞こえるのは、互いの荒い呼吸だけだった。泣き疲れたトヲルは床に座り込み、僕も壁にもたれて肩で息をしていた。目張りされた窓、床に転がるホース、充満した排気の臭い──そのどれもが、ほんの少し前まで僕たちを死へ導こうとしていたことを物語っていた。重くなった体を、ゆっくりと起こす。膝が、わずかに震えていた。トヲルもそれに気づいたのか、小さく苦笑した。", "「外に出よう」", "「……ああ」", "肩を支え合いながら、ガレージの出口へ向かう。シャッターの隙間から流れ込む夜気は、驚くほど冷たかった。外へ出た瞬間、ひやりとした空気が肺の奥まで流れ込んだ。思わず大きく息を吸う。さっきまでの淀んだ空気とはまるで違う、紛れもなく生きている人間のための空気だった。夜は深く更けていた。住宅街は寝静まり、遠くで犬の鳴く声が一度だけ聞こえた。街灯の淡い光がアスファルトを照らし、その向こうには果てしない夜の闇が広々と広がっている。だけど、不思議と怖くはなかった。僕はその場で、ポケットから煙草を二本取り出した。指先は、まだ少し震えていた。ライターを鳴らすと、小さな炎が夜の中で揺れた。一本をトヲルに渡し、もう一本を口に咥えた。ゆっくりと煙を吐き出すと、白い煙は冷えた夜気に溶けながら、静かに空へ昇っていった。トヲルもまた煙を吐いた。二筋の煙は途中で絡み合い、やがて見分けがつかなくなった。トヲルは人差し指と中指に挟んだ煙草を、静かに天へ掲げた。赤く灯る火種だけが、夜の中で小さく瞬いている。吐き出された煙は冷たい空気の中で細く伸び、風に形を崩されながらも、ゆっくりと空へ昇っていった。僕もまた煙草を掲げ、その行方を目で追った。二筋の煙は溶け合い、夜の闇へと吸い込まれていく。", "「キズキに届けよう」", "「……ああ」", "僕たちの想いは、あの煙に乗っているのだろうか。風に揺られ、雲をくぐり抜け、月の傍らを過ぎて、星空のさらに先へ──届いただろうか。", "「アイツ、ずっと前に言ってたよ。この世界は天国と呼ぶには残酷で、だけど地獄と呼ぶにはあまりにも美しい。それが俺たちの生きづらさだって」", "「生きづらさ？」", "トヲルは頷き、夜空を仰いだ。幾千もの星が、遠くから光を放っている。まるで、ここにいるよと叫ぶように。", "「確かにこの世界は残酷だよ。だけど死ぬには惜しいくらい美しい。キズキの言った通り、生きづらいよ、全く──」", "「そうだね」", "無数に散らばる星に、それらを呑み込むように横たわった天の川。その姿は、ただひたすらに美しい。", "「きっと、夜空の向こうには天国があるんだよ」", "「どうしてそう思う？」", "「だって、あんなに星が輝いているから」", "トヲルは夜空を見つめながら、そっと微笑んだ。限りなく透明で、静かな夜だった。僕たちは煙草を高く、高く掲げた。", "「絆希に捧げよう」", "その言葉に頷き、天を見上げると、ふと夜空の片隅で、ひとつの星が震えるように瞬いた。それは瞬きというよりかは、まるで何かをぐっと堪えるかのようなか細い煌めきだった。僕はその微弱な光を見つめながら、遠く彼方に浮かぶ名もなき星のことを思った。もしかしたらその星は何百年、何千年も前に燃え尽きて、もうこの世には存在していないのかもしれない。あるいはその光はすでに失われたものによって放たれた、残響のようなものなのかもしれない。しかしそれでも、いやだからこそなのか、その光は今なお色褪せることなく、ある種の切実さを持って、僕たちに訴えかけている。ここにいるよ、と。ここで待っているよ、と。まるで太陽が惚れて、月が嫉妬するような眩い光で。"]}], "en": "Speak or Die.", "summary": "十二月の夜、僕たちは旅に出た。", "tag": "長編・十七話"}], "orig": {"header": "<header class=\"portal\" id=\"top\">\n  \n  \n  <h1 data-edit=\"title\"><em data-s=\"title\">ジェラール・フィリップは洗われた<\/em>Gérard Philipe<br>was Washed.<\/h1>\n  <p class=\"abs\" data-s=\"summary\" data-edit=\"abstract\">名前も顔も知らない誰かが、ある土曜日の昼下がりに買い、本に挟んだ一枚のレシート。<br>古い文庫本、渋谷、五万五千円のジャケット、そして洗われた言葉。<br>遠い他人の生活に思いを馳せる、ひとつの物語のアーカイブ。<\/p>\n  <button class=\"enter\" onclick=\"document.getElementById('read').scrollIntoView()\">Enter the Archive<\/button>\n<\/header>", "prose": "\n<section class=\"chap\"><div class=\"no\">I<\/div><h2>世界のどこかに<\/h2>\n<p>世界のどこかに土曜日の昼下がりに五万円のジャケットを買う人がいて、その人が一冊の古い文庫本を読んでいた、という事実を僕はときどき理由もなく思い出すことがある。別に実際に見たわけではない。ただ、そういう人が確かにどこかに存在していたのだろう、という感覚だけが、なぜか長い間頭の片隅には残っていた。高価な服を買うことと、古い文庫本を読むこと。その二つが同じ一日の中に並んでいることが、僕には奇妙なほど現実的で、同時に少しだけ不思議な感じがした。その人の顔は浮かばない。年齢も性別もわからない。けれどその人が買い物袋を片手に、二月の空の下、渋谷の街を歩いている光景だけは、なぜか鮮明に想像できる。乾いた冬の空気と、昼過ぎの白っぽい光。渋谷パルコの前の広場に斜めに落ちる、少し硬質な日差し。実際にはそこへ行ったことなど一度もないのに、その場所だけは昔から知っている景色みたいに頭に浮かぶ。車通りの多い交差点。信号待ちをする人たち。コートの襟を立てて歩く若い男女。ビルのガラスに反射する淡い冬の光。そういう細部までもがなぜか僕には容易に想像ができる。多分僕は、その景色そのものに惹かれているというより、そこに偶然存在していた無数の他人の生活に惹かれているのだと思う。自分とはまったく関係のない誰かが、何かを買い、何かを読み、誰かと待ち合わせをし、あるいは一人で歩いて帰る。そのこと自体に静かな生活感がある。自分の知らない場所で、自分とは無関係な時間が、今も静かに流れ続けている。そんな当たり前の事実に、僕はほっと胸を撫で下ろしていたのかもしれない。とにかく僕は今も世界のどこかにいる、誰かに思いを馳せている。名前も知らない、顔も知らない。声も、年齢も、身分すらわからない誰かに、思い馳せている。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">II<\/div><h2>洗われた<\/h2>\n<p>大学の第二外国語のフランス語の授業だった。午後の教室には窓から差し込む光が机上に細長く伸びていた。教授は黒板に向かい、チョークを走らせながら動詞の活用について説明していた。前の席では誰かが教科書のページをめくり、少し離れたところから椅子の脚が床を擦る音が聞こえた。<\/p>\n<p>僕は教授の説明を聞きながら、ノートに書き取った例文の下へ、意味のわからない単語をいくつか書き足していた。<\/p>\n<p>教授が黒板に「lavé」と書いたのは、そのときだった。<\/p>\n<p class=\"d\">「これは過去分詞です。洗われた、という意味になります。たとえば、洗いをかけた服のことを、フランス語ではこう言うこともあります」<\/p>\n<p>その言葉を耳にした瞬間、ノートを走っていたペン先が止まった。<\/p>\n<p class=\"line\">COTON MILITAIRE LAVE。<\/p>\n<p>頭の中で、古い文庫本に挟まっていたレシートの文字が、そのまま浮かび上がった。日付も、時刻も、店の名前も、金額も、もう何度見返したかわからない。けれど、その三つの単語だけは、いつ見ても少し不思議な感じがした。僕はノートの余白に、教授が黒板に書いたものと同じように、COTON MILITAIRE LAVEと書き写した。書いてみると、レシートに印字されていたときよりも、ずっと意味のある言葉に見えた。<\/p>\n<p class=\"d\">「何、それ」<\/p>\n<p>隣の席から、小さな声が聞こえた。顔を向けると、髪を一つに束ねた女の子が僕のノートを覗き込んでいた。彼女は片手で教科書のページを押さえ、もう片方の手にはシャープペンシルを持っていた。覗き込んだ拍子に、耳の横に残っていた短い髪が頬にかかる。彼女はそれを指先で軽く払ってから、ノートの文字をもう一度確かめた。<\/p>\n<p class=\"d\">「あ、いや。服の名前で」<\/p>\n<p class=\"d\">「ミリタリー。軍隊の？」<\/p>\n<p class=\"d\">「そう。ジャケットの」<\/p>\n<p class=\"d\">「へえ。かっこいいね」<\/p>\n<p>彼女は文字を読み終えると、特にそれ以上尋ねることもなく、教科書へ視線を戻した。何かを気に入ったときに、深く考えずそのまま口にするような言い方だった。僕はどうしてその言葉をノートに書いたのか説明しようかと思った。古本屋で買った本にレシートが挟まっていたこと。そのレシートに、今書いたのと同じ文字が印字されていたこと。けれど、初めて話した相手にするには、どれも少し長い話のような気がした。<\/p>\n<p class=\"d\">「……うん」<\/p>\n<p>結局、返したのはそれだけだった。ちょうど教授が次の例文を読み始め、教室のあちこちでペンの音が戻ってきた。彼女も黒板に目を向け、自分のノートに何かを書き始めた。僕はしばらく彼女の横顔を見ていたが、やがて自分のノートに視線を落とした。そこには、授業の内容とはほとんど関係のない三つの単語が、ほかの文字より少し大きく書かれていた。それが、フユとの最初の会話だった。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">III<\/div><h2>学食の窓際<\/h2>\n<p>フユは文学部で、フランス語は単位を取るために履修していた。けれど彼女の発音は驚くほど上手だった。教授が黒板に書いた文章を順番に読ませるとき、彼女の番になると、教室の空気がほんの少しクリアになった。フランス語特有の鼻に抜ける音も、単語と単語のあいだを滑らかにつなぐ発音も、初めからその言葉を知っていたようだった。教授は彼女が読み終わるたびに発音が素晴らしい、と褒めた。フユはそのたびに、ありがとうございます、と小さく頭を下げた。得意げになるわけでも、謙遜して否定するわけでもなく、慣れたように微笑みを浮かべた。僕は彼女の後に同じ文章を読まされることが何度かあったが、自分の口から出てくるフランス語は、どうしても教科書の文字を一つずつ拾い上げているように聞こえた。<\/p>\n<p>彼女と初めて会話をした授業が終わった後、僕たちは学食で一緒に食事をした。昼休みの学食はびっくりするほど混雑していて、トレーを持った学生たちが空席を探して行き来していた。窓際の席がひとつ空いていたので、そこに向かい合って座った。フユは日替わり定食を選び、僕はカレーライスを頼んだ。彼女は食べる前に、テーブルに置かれた紙ナプキンを一枚取って、膝の上に落ちた水滴を拭いた。それから、今日の課題どうだったと尋ねた。<\/p>\n<p>最初は授業の課題について話していた。動詞の活用がどうにも覚えられないとか、教授が出す小テストは妙に細かいとか、そんなことだった。彼女は僕が間違えた箇所を覚えていて、そこは前にもやったところだよ、と言って笑った。僕は少しばつが悪かったが、彼女の説明はわかりやすかった。<\/p>\n<p>食事が進むにつれて、話題は少しずつ授業から離れていった。彼女が最近読んだ本の話をし、僕が昔観た映画の話をした。アルバイト先の店長がいかに理不尽かという話になると、彼女は自分の勤めている書店にも似たような人がいると言って、レジで起きた出来事を話してくれた。話の途中で何度か笑い声を立てたが、周囲の学生たちの声に紛れてしまうくらい小さかった。彼女は話をするとき、相手の言葉を遮らなかった。僕がうまく説明できずに途中で言い直しても、急かすことなく待っていた。そうしているうちに、食べ終わった後も席を立つ理由がなくなってしまった。<\/p>\n<p>それから授業のない日にも会うようになった。<\/p>\n<p>大学の図書館で待ち合わせたり、駅前の喫茶店でコーヒーを飲んだり、彼女のアルバイトが終わる時間に合わせて書店の近くまで行ったりした。特別な約束をしたわけではなかった。どちらかが何かを読み終えたとき、面白かったから読んでみて、と連絡をする。その本について話したくなって、次に会う日を決める。そんなことが何度か続くうちに、会うこと自体が僕たちの予定のなかに自然に組み込まれていった。<\/p>\n<p>彼女は読書家だった。小説だけでなく、エッセイや評論も読んでいたし、気に入った本は何度も読み返していた。気に入った文庫本の端には時折鉛筆で線が引かれていて、ページの隅が少しずつ丸まっていた。彼女は本の話をするとき、あらすじを説明するよりも、ある一節のことや、登場人物が何気なく口にした言葉について話すことが多かった。どうしてそんなところを覚えているのだろうと思うような些細な文章を彼女は何週間も経ってから正確に思い出したりした。ある日、僕がとある作家の名前を挙げると、彼女はそれまで手にしていたカップをテーブルに置いた。<\/p>\n<p>目が少し大きくなり、さっきまでとは明らかに違う表情で僕を見た。<\/p>\n<p class=\"d\">「え、その人読むの？」<\/p>\n<p>声に出してから、自分でも意外だったというように、彼女は少し笑った。<\/p>\n<p>僕が頷くと、どの作品が好きなのか、いつから読んでいるのか、矢継ぎ早に尋ねてきた。僕は彼女の質問に答えながら、その作家について一体自分がどれほど知っているのか急に心配になった。彼女のほうがずっと詳しいのではないかと思ったし、実際、その予感はすぐに当たった。それでも彼女は、僕の話を途中で訂正したり、知識を披露したりはしなかった。ただ自分の好きな作品について話し始めた。普段より少し早口になって、言葉を探すために何度か視線を宙に泳がせた。僕はそのとき初めて、彼女が本の話をするのを好きなのではなく、本の話を誰かとすることが好きなのだと思った。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">IV<\/div><h2>ジェラール・フィリップ<\/h2>\n<p class=\"d\">「ねえ、あなたなんだかジェラール・フィリップみたいね」<\/p>\n<p>小説の話がひと段落したあと、彼女は思い出したようにそう言った。<\/p>\n<p class=\"d\">「ジェラール・フィリップ？」<\/p>\n<p class=\"d\">「うん。知らない？　フランスの俳優」<\/p>\n<p class=\"d\">「知らないな」<\/p>\n<p class=\"d\">「『花咲ける騎士道』とか『肉体の悪魔』とか。昔の映画だけど」<\/p>\n<p class=\"d\">「初めて聞いたよ」<\/p>\n<p>僕が正直に答えると、彼女は肩を揺らして笑った。<\/p>\n<p class=\"d\">「そう。でも、とてもよく似てる気がする。目元とか」<\/p>\n<p class=\"d\">「そうかな」<\/p>\n<p class=\"d\">「まあ、今度調べてみなよ」<\/p>\n<p>彼女はそう言って、ストローで飲み物をかき混ぜた。氷がグラスの内側に当たって、小さな音がした。僕はその音を聞きながら、彼女の話し方が好きだと思った。何かを無理に伝えようとせず、ただそこにある事実をそっと手渡すような声のトーン。窓から差し込む午後の光が、彼女の束ねた髪の輪郭を淡く縁取っていた。僕はストローから指を離し、飲みかけのアイスコーヒーを見つめながら、この時間がずっと続けばいいのにとぼんやりと考えた。<\/p>\n<p>その夜、僕は部屋に帰ると、ジェラール・フィリップと検索した。画面には、白黒の写真がいくつも表示された。巻き毛の好青年がこちらを見て少し困ったように笑っている。整った顔立ちというより、どこか頼りなさげで、素直に笑いきれていないような、おぼつかない表情だった。写真の中の彼はこちらの知らない時間を生きていて、こちらの知らない場所で誰かに愛され、誰かを失い、誰にも知られないような些細なことで機嫌を損ねたりもしたのだろう。そんな当たり前のことを考えながら、僕は彼の生年月日と没年を確かめた。三十六歳だった。思っていたよりずっと若かった。出演作の一覧を開くと、知らない映画の題名が縦に並んでいた。古いポスターには、彼の顔が何度も印刷されていた。どの写真でも巻き毛の具合や目元の印象は少しずつ違っていたが、そこに在りし日の自分の面影を探すように、僕はそれらの写真を一枚ずつ眺めた。けれど見れば見るほど、自分が彼に似ているのかどうかはわからなくなった。そもそも僕と彼とでは生きた時代も、育った場所も、身につけていた服も違う。似ているという言葉が、顔の輪郭や目鼻立ちのことなのか、それとも写真から受ける漠然とした印象のことなのか、僕には判断がつかなかった。気がつくと、部屋の照明だけがついたまま、窓の外はすっかり暗くなっていた。机の上には朝から飲みかけの水が入ったグラスと、大学の講義で使ったノートが開きっぱなしになっていた。画面の隅には、彼が出演した映画の配信情報がいくつか表示されていた。一本くらい観てみようかと思った。けれど、どれも再生ボタンを押す寸前で止まった。彼の声を聞いてしまえば、僕はフユと関わる中で、常に彼の存在を意識しなければならないような気がした。そしてそれはとても気疲れしてしまうように思えた。結局、僕は一本も観ないまま画面を閉じた。似ていると言われたことが褒め言葉なのかどうかも、よくわからなかった。ただ、彼が三十六歳で死んだということと、フユがその名前を知っていたということだけが、脳裏を離れなかった。僕はもう一度、暗くなった画面に映る自分の顔を見た。<\/p>\n<p>翌日の授業の前に、「調べたよ」と伝えると、彼女はペンを回しながら訊いた。<\/p>\n<p class=\"d\">「どうだった」<\/p>\n<p class=\"d\">「よくわからなかった」<\/p>\n<p class=\"d\">「わからなかった？」<\/p>\n<p>フユが首を傾げた。<\/p>\n<p class=\"d\">「自分とどこが似ているのか、さっぱりわからなかった」<\/p>\n<p>僕が正直に答えると、彼女はにこりと笑った。<\/p>\n<p class=\"d\">「わからなくていいのよ」<\/p>\n<p class=\"d\">「どうして？」<\/p>\n<p class=\"d\">「そのうちわかるから」<\/p>\n<p class=\"d\">「そのうち？」<\/p>\n<p class=\"d\">「うん、そのうち」<\/p>\n<p>短い沈黙が流れた。<\/p>\n<p class=\"d\">「ねえ、あなたはどんなふうに生きてきたの？」<\/p>\n<p class=\"d\">「どんなふうに？」<\/p>\n<p>彼女は静かに頷いた。<\/p>\n<p class=\"d\">「どこから来て、どこへ向かっていたのか。どんな部屋に住み、朝には何を飲むのか。休日には何をして過ごすのか」<\/p>\n<p>その問いを、僕は何度か反芻した。<\/p>\n<p class=\"d\">「普通だよ」<\/p>\n<p class=\"d\">「ふつう？」<\/p>\n<p>僕は頷いた。<\/p>\n<p class=\"d\">「裕福でもないし、貧乏でもない家庭に生まれて、流れに身を任せるように大学受験をして、西荻窪のアパートでコーヒーを飲みながら、本を読んでる」<\/p>\n<p>僕がありのままに話すと、彼女は何度かしきりに瞬きをしてから、今にも消え入りそうな声で、「そっか」とだけ呟いた。<\/p>\n<p class=\"d\">「大した生活はしてないけど、それなりには充実してるよ」<\/p>\n<p class=\"d\">「そう。なら、よかったわ」<\/p>\n<p>彼女はそう言って、満足げにノートにペンを走らせた。僕はその姿を見つめながら、彼女という存在に強く惹かれ始めている自分に気がついていた。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">V<\/div><h2>二人分の食器<\/h2>\n<p>一人暮らしの部屋にフユはよく来た。六畳ほどの部屋には、ベッドと本棚と、小さな折りたたみの机がひとつあるだけだった。二人で机に向かうと、ノートを広げる場所にも困った。彼女が教科書を開けば、僕は自分のノートを膝の上に置いた。消しゴムを貸してほしいと言われるたびに、机の向こうまで手を伸ばさなければならなかった。ときどき肘がぶつかり、そのたびにどちらからともなく少し身体を引いた。課題が一段落すると、彼女は椅子の背にもたれて、しばらく天井を眺めていた。僕が続きをやろうと言うと、もう少し休ませて、と答えた。夕食も二人で作った。彼女は味噌汁を作るのが上手だった。冷蔵庫に残っている野菜を見て、何を入れるか決めるのが早かったし、味噌を溶くときも、いつも目分量だった。僕は米を炊くことだけは得意だった。水の量を間違えたことがほとんどなく、炊き上がった米はいつもふっくらとしていて、彼女に褒められた。大したことではないのに彼女は蓋を開けるたびに、今日も上手に炊けてるね、と言った。僕はその言葉を聞くたびに米を炊くくらい誰にでもできる、と返した。彼女は、そういうことじゃないんだけど、と言って笑った。食事のあとは、どちらかが洗い物をした。僕が洗っているあいだ、彼女は流しの横で濡れた食器を拭いていたこともあるし、反対に彼女が洗い、僕が拭くこともあった。そうした分担を決めた覚えはなかった。気がつけば片方が何かをしていると、もう片方も自然に手を動かしていた。彼女が来る日は、帰りに牛乳を買ってきてもらうことがあった。僕は彼女の好きな銘柄のヨーグルトを冷蔵庫に入れておくようになった。特別なことをしているつもりはなかったが、買い物のときに自分以外の誰かについて考えることは、それまでの生活にはなかったことだった。<\/p>\n<p>いつしか彼女は僕の使っているマグカップで水を飲んだ。最初にそれを見たとき、僕は何となく自分のものだと説明しようとしたが、彼女はもう口をつけていたので、結局何も言わなかった。それ以来、そのカップは二人で使うものになった。彼女は読みかけの本を机の隅に置いて帰ることがあった。次に来たときには、その続きを読み始める。ときどき、前にどこまで読んだのか忘れてしまったと言って、僕に尋ねることもあった。僕が覚えていないと、彼女は少し呆れた顔をして、栞を挟んでおけばよかった、と自分に言い聞かせるように呟いた。洗面台には、いつの間にか彼女のヘアゴムがひとつ残っていた。黒くて、飾りも何もついていない、ごく普通のものだった。僕はそれを見つけたとき、彼女に忘れているよと連絡しようかと思ったが、次に来たときに渡せばいいと思い直した。ところが、次に来たときも、その次に来たときも、渡すのを忘れてしまった。彼女も特に気にしていないようだった。ヘアゴムはしばらく洗面台の隅に置かれたままになり、いつしかそこにあることが当たり前になった。<\/p>\n<p>部屋に二人分の食器が増えていくにつれて、生活というものの輪郭が少しずつはっきりしていくような感覚を覚えた。以前は冷蔵庫に何が入っているかも、洗濯をいつするかも、すべて自分の都合だけで決まっていた。けれど彼女が来るようになってからは、夕食の材料を少し多めに買い、使った食器を二人分まとめて洗い、彼女が読み終えるまで机の上の本を動かさないようになった。彼女が帰ったあとの部屋には、使われたマグカップや、畳まれたブランケットや、読みかけの本が残っていた。そういうものを片づけずに眺めている時間も僕は嫌いではなかった。誰かと暮らすということがどういうものなのか、僕にはまだわからなかったけれど、少なくとも誰かが帰ったあとにも、その人の気配が部屋に残るということだけは身に沁みて実感した。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">VI<\/div><h2>残火<\/h2>\n<p>それでもふとした瞬間に、僕は『あの人』のことを思い出した。車の窓から渋谷方面の看板を見かけたときだった。見慣れた地名が視界の端を通り過ぎただけなのに、そこに結びついていた何かが、思いがけず意識の底から浮かび上がってきた。街の服屋の前でカーキ色の上着が目に入ったときもそうだった。店先のマネキンが着ていただけで、特段珍しい色でもなかった。誰かが土曜日の予定を話しているのを聞いたとき、古本屋で本を買ったあとにレシートを受け取ったときにも同じことが起きた。レシートには店名と日付と金額が印字されていて、商品名には『文庫本』とだけ記されていた。それなのに、紙を財布にしまうとき、僕は一瞬だけ手を止めてしまった。そういう瞬間は、決まって唐突に訪れた。何かを探しているわけではなかったし、忘れないように努めているわけでもなかった。むしろ、日々の暮らしに追われているときほど、何の前触れもなく思い出した。夕食の味噌汁をよそっているときや、フユが机に向かってフランス語の課題を解いているときでさえ、ふいにその人のことが頭をよぎることがあった。<\/p>\n<p>思い出すといっても、何かが鈍く痛むわけではなかった。胸が締めつけられることもなければ、その場に立ち尽くしてしまうこともなかった。ただ、胸の奥のどこかに、消えないまま燻り続ける残火のようなものがあった。普段はそこにあることさえ忘れている。けれど、何かの拍子に空気が通ると、まだ熱を持っていることがわかる。もう一度燃え上がるほどの力はないのに、完全に冷めてしまうこともなかった。フユと一緒にいるときでも、その火は消えなかった。彼女が隣で本を読んでいるとき、僕の作ったご飯を食べているとき、何か面白いことを思い出して話しているとき、僕は確かに彼女との時間を過ごしていた。彼女の声や、食器を置く音や、洗面台に残されたヘアゴムは、どれもその時間に属していた。あの人のことを思い出す時間とは何かが違っていた。しかしそれは決してどちらかがどちらかの代わりになるという話ではなかった。フユと過ごす時間が増えたからといって、あの人の記憶が薄くなるわけではないし、あの人を思い出すからといって、フユといる時間が色褪せるわけでもなかった。僕のなかでは、それぞれが別の場所にあり、それぞれが互いに干渉することなく、互いの領域に踏み込まず、静謐に存在していた。僕はずっと昔人の心というものはもっと単純にできているのだと思っていた。新しいものが入ってくれば、古いものは少しずつ場所を譲っていくのだと思っていた。けれど、実際にはそうではなかった。新しい食器を買い足しても、食器棚の奥にしまった古い皿がなくならないように、僕のなかには、使わなくなったあともそのまま残っている場所があった。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">VII<\/div><h2>鍋の夜<\/h2>\n<p>しかし、いつまでも『その人』のことを隠していることはできない。その話をフユにしたのは、十一月の夜だった。その日は僕の部屋で鍋をしていた。夕方から冷え込みが厳しくなり、大学から帰る途中、駅前のスーパーで白菜と長ねぎ、それから豚肉を買った。フユは豆腐を選び、僕は鍋つゆの棚の前でしばらく迷った。結局、いつも買っているものにした。部屋に着くころには、買い物袋を持つ指先が冷たくなっていた。<\/p>\n<p>鍋は折りたたみの机の上に置いた。二人で向かい合って座るには少し狭く、彼女が箸を伸ばすと、僕の茶碗に当たりそうになった。フユは白菜をよく食べた。煮えて柔らかくなった葉の部分を箸でつまみ、少し冷ましてから口に運んでいた。僕が肉を取りすぎると、そんなに食べるの、と言った。僕は鍋なんだからいいだろうと答えた。彼女は笑って、そういう問題じゃない、と言った。食べ終わるころには、窓がすっかり曇っていた。外の街灯は輪郭を失い、黄色い光だけがガラスの向こうにぼんやり浮かんでいた。鍋の火を止めても、部屋にはしばらく湯気と出汁の匂いが残っていた。フユは食器を流しに運び、僕は鍋を片づけた。彼女が洗い物をしているあいだ、僕は濡れた机を布巾で拭いた。食後、フユは本棚の前に立っていた。僕が洗面所から戻ると、背表紙を眺めながら、何か面白そうな本はないかと尋ねた。彼女は本棚の上段から何冊か取り出し、表紙を見比べていた。やがて一冊の文庫本を手に取った。フユはその本を開き、最初の数ページをめくったあと、途中のページで手を止めた。何かを確かめるように、少し戻ってから、また先へ進んだ。表紙を裏返し、出版社の名前を眺めているようだった。そのとき、挟まっていたレシートが滑り落ちた。<\/p>\n<p>乾いた紙の音が、机の脚のあたりで小さく鳴った。<\/p>\n<p class=\"d\">「あ、ごめん」<\/p>\n<p class=\"d\">「あっ、大丈夫。そのままでいい」<\/p>\n<p>フユは本を持ったまま、床に落ちたレシートを見た。僕は彼女よりも先に、それを拾った。薄い紙片は何度も折り畳まれたせいで端が柔らかくなっていた。印字もところどころ薄れていたが、日付と店名はまだ読めた。僕はそれを手のひらに載せた。何度も見てきた紙片だった。日付も、店名も、金額もすべて覚えていた。財布から取り出して眺めたこともあったし、本に挟んだまま何か月も忘れていたこともあった。捨てようと思ったことも一度や二度ではない。けれど、そのたびにまだ捨てなくてもいいと心に暗示をしていた。理由を考え始めると、かえって捨てられなくなるような気がした。<\/p>\n<p class=\"d\">「それ、何のレシート？」<\/p>\n<p>フユが尋ねた。<\/p>\n<p class=\"d\">「古本屋で買った本に挟まってたレシート」<\/p>\n<p class=\"d\">「買ったときのレシート？」<\/p>\n<p class=\"d\">「ううん。本を買ったときに、たまたま挟まっていた知らない人の知らない買い物のレシート」<\/p>\n<p>自分でも要領を得ない答えだと思った。フユは手にしていた文庫本を閉じた。僕の顔と手のひらに載ったレシートを交互に見ていた。僕は紙を広げ、印字された数字を指でなぞった。もう何度も確かめたはずなのに、そこに書かれているものを読み直すのはいつも少しだけ落ち着かなかった。レシートには何の説明もなかった。誰が本を買ったのかも、どうしてそれが僕の手元にあるのかも、そこには記されていない。ただ、ある日、ある店で、ある金額の買い物があったという事実だけが残っていた。<\/p>\n<p class=\"d\">「実は──」<\/p>\n<p>僕はそこで一度言葉を切った。彼女の手元にはさっきまで読んでいた文庫本が閉じられたまま置かれていた。<\/p>\n<p class=\"d\">「このレシートを持っていた人のことをずっと考えているんだ」<\/p>\n<p>そう言ってから、僕はどこから話せばいいのか考えた。いつのことだったのか。どういう関係だったのか。そもそも、僕はその人のことをどれくらい知っていたのだろう。思い出せる出来事はいくつもあったが、それを順番に並べたところで、彼女に伝わるとは思えなかった。<\/p>\n<p class=\"d\">「別に、付き合っていたとか、そういう話じゃないんだけど」<\/p>\n<p class=\"d\">「うん」<\/p>\n<p class=\"d\">「ただ、今でもときどき思い出すんだ。何かを見たり、聞いたりしたときに。自分でも、どうしてそんなことで思い出すのかわからないようなときに」<\/p>\n<p>フユは僕の手元に目を落とした。僕はレシートをもう一度折り畳もうとしたが、折り目が以前と違う場所にできそうで、途中でやめた。<\/p>\n<p class=\"d\">「この人が、その人なの？」<\/p>\n<p class=\"d\">「うん。このレシートは、きっとその人が買ったものなんだと思う」<\/p>\n<p>言ってしまうと、思っていたよりも簡単なことのように聞こえた。けれど僕にとっては、ずっとそうではなかった。誰かが買った一冊の本と、その人が生きていた時間と、僕が今も覚えているいくつかの場面。それらは僕のなかで、長いあいだ切り離せないままになっていた。<\/p>\n<p>フユは少しだけ考えるように黙っていた。やがて、机の上に置かれた本を指先で押さえた。<\/p>\n<p class=\"d\">「その人のことが、好きなの？」<\/p>\n<p>僕はすぐには答えられなかった。好きだった、と言えば何かを決めつけてしまうような気がしたし、そうではなかったと言うのも違う気がした。<\/p>\n<p class=\"d\">「わからない」<\/p>\n<p>僕はそう答えた。フユはそれ以上尋ねなかった。窓の外では街灯の光が曇ったガラスに滲んでいた。机の上には二人分の湯飲みと、読みかけの文庫本が置かれていた。僕の手のひらには、折り目のついたレシートが残っていた。僕はしばらく迷ったあと、彼女にその話をし始めた。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">VIII<\/div><h2>雑居ビルの古本屋<\/h2>\n<p>その本を手に入れたのは、高校三年生の冬だった。場所は駅前から少し外れた雑居ビルの二階にある古本屋で、駅前の新しい書店とは違い、そこにはいつも少し古く、すこしカビた時間が流れていた。入口は狭く、階段も急だった。階段の壁には色褪せた映画のポスターが何枚か貼られていて、途中の踊り場には縛った雑誌の束が積まれていた。上まで行くと小さなガラス扉があり、押して入ると乾いた紙の匂いがした。店の中には文庫本の棚が所狭しに隙間なく並んでいた。棚は天井近くまで伸びていて、上段の本を取るための脚立が端に立てかけられていた。暖房は入っていたが、それほど熱心には効いておらず、コートを脱ぐほどではなかった。カウンターの奥では店主らしき老人が椅子に座り、半分眠っているような顔でラジオを聞いていた。AMラジオ特有の少しざらついた音だけが静かに流れていた。僕は棚の間をゆっくり歩きながら、背表紙を順番に眺めていた。古本屋では、特に探している本がなくても、棚を見ているだけで時間が過ぎることがある。タイトルを眺め、少し引き抜き、また戻す。その繰り返しだった。僕は学校帰りで、制服のままだった。マフラーには外の冷たい空気がほんのりと残っていた。外の冷気で硬くなっていた喉が、少しずつ温まってきた。<\/p>\n<p>その本を見つけたのは、偶然だった。著者の名前は昔から知っていた。父親の本棚に何冊か並んでいて、中学生の頃は難しそうだと思っていたが、高校に入ってから少しずつ読むようになっていた。不思議と手が止まらない文章を書く人だった。乾いているのに、妙な湿度がある、とでもいうか、言葉のひとつひとつが素っ気ないのに、読んでいると胸の奥のほうが静かに揺さぶられた。長編も何作か書いていたが、短編集の方がはるかにその作家性とでもいうべきものが遺憾なく発揮されていた。その本も例によって薄い短編集だった。カバーは少し日に焼けていて、角に細かな擦れがあった。何人かの手を渡ってきたことがわかる本だった。新品の本にある硬さがもうなく、ページを開いたとき、癖が少しついていた。値段は、覚えていない。ただ、高校生の自分でも迷わず買えたくらいには安かった。古本屋の文庫本はたいていそうだった。会計を済ませると、店主は無言で本を紙袋に入れた。僕はそれを鞄に入れて店を出た。外は夕方前で、駅前には制服姿の高校生や買い物帰りの人たちがいた。コンビニの前では自転車が何台も並び、遠くで踏切の警報音が聞こえていた。外気は依然として冷ややかだったが、とても穏やかで、どことなく祝福的な夕暮れだった。<\/p>\n<p>家に帰ると、僕は制服のまま自分の部屋へ入った。暖房をつけ、ベッドに腰を下ろして、その本を開いた。窓の外では夕方の電車が一定の間隔で通り過ぎていった。遠くで犬の鳴く声がした。部屋には電気ストーブの少し焦げたような匂いが漂っていて、机の上には読みかけの問題集とシャープペンが置かれたままだった。最初の短編は、動物園のカンガルーについて書かれた話だった。少し奇妙な話で、作者の意図までは読み取れなかったが、不思議と読みやすかった。二つ目には、春の朝に「完璧な誰か」とすれ違う話が入っていた。主人公は朝の街を歩いていて、そのとき一人の女性とすれ違う。ただ、それだけの話だった。相手の名前もわからないし、長い会話があるわけでもない。けれど主人公はその一瞬で、この人は自分にとって特別な存在なのだと感じる。理屈というより直感に近かった。この人とは、本来どこかで出会うはずだったのではないか。そんな確信だけが、不自然なくらい静かに描かれていた。しかし主人公は声をかけない。ただ、そのまま歩き続ける。少しして振り返ると、相手はもう人混みの中へ消えている。物語はそこで終わる。事件らしい事件は何も起きない。再会もない。ただ一度すれ違っただけだ。それなのに読み終えたあと、妙に長く余韻が残った。悲しいのか、寂しいのか、自分でもうまく整理できない。ただ何か取り返しのつかないものを、少しだけ失ったような感覚だけが静かに残っていた。僕はその短編を最後まで読み終えたあと、少し間を置いてから、もう一度最初のページに戻った。二回目のほうが文章はゆっくり頭に入ってきた。窓の外はさらに暗くなっていて、部屋の中ではストーブのカタカタという小さな音だけが聞こえていた。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">IX<\/div><h2>レシート<\/h2>\n<p>二つ目の物語を読み終えたところで、一階から夕飯の支度ができたことを知らせる声が聞こえた。僕はそこで本を閉じ、机の上に置いた。その瞬間、本の間から何かが滑り落ちた。薄い紙切れだった。僕は反射的にそれを拾い上げた。よく見ると、それはレシートだった。細長く折れ曲がっていて、角には少し皺が寄っていた。前の持ち主が栞代わりに挟んでいたのだろう。古本にはたまにそういうものが残っている。映画の半券だったり、コンビニのレシートだったり、メモ帳の切れ端だったり。僕は最初、深く考えずにそれを捨てようとした。ゴミ箱へ放ろうとして、でも途中で手が止まった。そのレシートの内容が気になったのだ。この本を読んでいた人が、どんな人だったのか少し知りたくなった。もちろん、レシート一枚でその人のすべてがわかるわけではない。それでも、まったく何も知らない誰かの生活の断片が、偶然自分の部屋に落ちてきたような感覚があった。<\/p>\n<p>だから僕はレシートを眺めた。<\/p>\n<p class=\"rc\">店名　A.P.C<br>住所　東京都渋谷区宇田川町15ー1　パルコ2F<br>日付　2021年02月13日（土）12:59<br>商品名　COTON MILITAIRE LAVE<br>単価　¥55,000<br>決済方法　クレジット<\/p>\n<p>僕はしばらく、その数字を見ていた。<\/p>\n<p>それは高校一年生だった自分にとって、現実感のない買い物だった。まず渋谷パルコという住所が僕にとっては新鮮な響きを持っていた。都会的で、どこか前衛的なその響きは、郊外に住む自分にとっては奇妙で、硬質な響きを持っていた。それに五万五千円のジャケットというのもまた現実感のない値段だった。僕の財布の中には常に千円札が二枚くらいしか入っていなかったし、小遣いも月に五千円程度だった。服に五万円を使う、という感覚自体がまだよくわからなかった。しかしそれ以上に不思議だったのは、そんな高価な服を買う人が、本の栞にレシートを使っていたことだった。僕は勝手に想像した。その人はきっと、スマートで洒落た人なのだろう。渋谷パルコへ行き、店員と気さくに会話をして、迷いなく服を選ぶような人。長財布からクレジットカードを取り出す動作は手慣れていて、買い物そのものが生活の一部として馴染んでいるようなクールで知的な人。もちろん、レシート一枚からそんな妄想をするのは少しばかり飛躍していたが、少なくとも休日の昼間に五万円のジャケットを買うには単にお金があるだけでは足りないような気がした。自分の暮らしに対するある程度の余裕というか、自分はこういうものを着たいのだという確信のようなものが必要な気がした。<\/p>\n<p>でもその人はレシートを栞にしていた。そこが僕の心をくすぐらせた。<\/p>\n<p>僕は当時、そういう人たちはもっときちんとした栞を使うものだと思っていた。革製のブックマーカーとか、海外の美術館で買った有名絵画を模したカードとか、そういうものを自然に本へ挟む人たちなのだと思っていた。けれど実際にはレシートだった。近くにある紙をそのまま栞代わりにすることは僕自身もよくあった。何気なく観た映画の半券だったり、カフェでもらった短いレシートだったり、学校で配られたプリントの切れ端だったり……。その場にあるもので済ませてしまう性分が僕にはあった。そして五万円のジャケットを買うような人にも、ありふれた高校生の僕と同じような性分があったのだ。まるで僕とは正反対にも見えるようなスマートで、クールな人がだ。僕はしばらくの間、そのレシートを机の上で眺めていた。捨てようと思えば、すぐに捨てることはできた。でも結局、僕はそのレシートを捨てなかった。そしてなんとなく、そのまま本に戻した。<\/p>\n<p>目を閉じ、想像する。<\/p>\n<p>二〇二一年の二月。土曜日の昼下がり。渋谷パルコのA.P.Cで、五万五千円のジャケットを買った誰かはクレジットカードで会計を済ませ、受け取ったレシートを二つ折りにし、本の間に挟んだ。そしてそのまま古本屋へ売ったのか、あるいは別の誰かを経由したのか。それはわからないが、今、その本とレシートはめぐり巡って、自分の部屋にある。その人が男性なのか、女性なのかはわからない。年齢も、居住地も、どのような朝を過ごしているのかさえも僕にはまったくわからない。ただ土曜日の昼に、渋谷で買い物をして、そのあとどこかでこの本を読んでいた、という事実だけがレシートからはわかる。ただ、それだけだった。それだけのはずなのに、いやそれだけのことだからなのか、僕はその人のことを考えないわけにはいかなかった。<\/p>\n<p>フユは話の腰を折ることなく聞いていた。湯呑みを両手で包み、ときどき小さく頷いていた。話し終えると、部屋は静かになった。台所の蛇口から、水が一滴落ちる音がした。冷蔵庫のモーターが低く唸っていた。僕は手のひらのレシートを見ていた。フユもまた、しばらくそれを眺めていた。<\/p>\n<p class=\"d\">「その人を、探してるの？」<\/p>\n<p>彼女の声は、責める調子ではなかった。ただまっすぐに尖った問いだった。僕は答えようとして、口を開いた。けれど言葉が出てこなかった。探している、と言えば嘘になる気がした。探していない、と言えばそれもまた嘘になってしまうような気がした。僕はあの人に会いたいのだろうか。会いたいわけではないような気がする。ただ、どこかにいるのだと思っていたいだけなのかもしれない。自分の知らない場所で普通に暮らし、買い物をし、誰かと話し、時には本を読む。そういう日々を過ごしているのだと思っていたかった。でも、それをどう説明すればいいのか、わからなかった。<\/p>\n<p class=\"d\">「わからない」<\/p>\n<p>ようやくそう答えると、フユは小さく頷いた。<\/p>\n<p class=\"d\">「そっか」<\/p>\n<p>それだけ言って、彼女はレシートを本に戻し、本を元の位置に差した。その仕草は丁寧だったが、どこか少しだけ憂いを帯びていた。彼女はそのことを責めなかったし、それ以降、話題に出すこともなかった。僕もまた彼女といるあいだは、あのレシートのことを口にしなくなった。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">X<\/div><h2>リヨン<\/h2>\n<p>二年生になった春、フユは交換留学の選考に通った。行き先はフランスのリヨンで、期間は一年だった。出発は九月。結果を知らせてきたとき、彼女は電話で、少し泣きながら笑っていた。電話の向こうから聞こえる声は、いつもより少し高く、言葉の合間に短い息が混じっていた。僕はよかったね、と言った。それが間違いのない本心だったことは、今でもはっきりと覚えている。電話の向こうでは、彼女の声に混じって、駅のアナウンスのような音が聞こえていた。彼女は外にいるらしく、ときどき周囲の音に気を取られて返事が遅れた。これから必要な手続きを調べなければならないと言い、僕はパスポートのことや住む場所のことを尋ねた。ビザの申請や大学への連絡、現地での住居探し。彼女が一つずつ話すたびに、僕たちの会話には知らない地名や制度の名前が増えていった。話しているうちに、僕たちの間に一年という時間が置かれたのだということが、少しずつ実感を伴ってきた。けれどそのときの僕には、それがどれほど長い時間なのか、まだよくわかっていなかった。<\/p>\n<p>彼女が日本を発つ前の数か月、僕たちは何度も会った。彼女は準備に追われ、僕は設計課題に追われた。休日に会っても、以前のように何時間も一緒に過ごすことは少なくなった。留学に必要な書類を確認したり、買い物に付き合ったり、出発前に会っておきたい友人の話を聞いたりした。文房具店では彼女が現地で使うノートを何冊か選び、僕はその横で、どれも同じように見えるノートの違いについて説明を求められた。薬局では、持っていく薬の種類を一緒に確認した。彼女は買ったものを一つずつ鞄にしまい、帰り道にはまだ買わなければならないものを思い出しては携帯電話にメモしていた。僕たちは以前よりも多くのことを話していたのに、二人の間にある時間は、どこか短くなっているようだった。彼女の部屋には、少しずつ荷物が増えていった。床に広げられたスーツケースの脇には衣類や本が積まれ、棚の上には書類をまとめた透明なファイルが置かれていた。僕の部屋に置いてあった彼女の本やヘアゴムも、いつの間にか持ち帰られていた。ある日、机の端に見慣れない空きができているのに気づいた。そこには以前、彼女が読みかけの本を置いていた。僕はその空いた場所をしばらく眺めていたが、特に何も言葉は思い浮かばなかった。<\/p>\n<p>九月になり、彼女は日本を発った。<\/p>\n<p>空港で別れるとき、僕たちはしばらく手を繋いでいた。彼女の手は少し冷たく、指先には出発前に指を切ったといって小さな絆創膏が貼られていた。何か言わなければならないと思ったが、結局、気をつけて、という言葉しか出てこなかった。彼女は笑って、うん、と答えた。それから、また連絡するね、と言った。僕は頷いた。彼女の背中が人の流れに紛れていくまで、僕はその場に立っていた。飛行機が出発するまで見送ったわけではない。彼女が搭乗口へ向かっていくのを見届けてから、僕は空港を出た。帰りの電車では、窓の外の景色をぼんやりと眺めていた。時折携帯電話を取り出して、彼女から届いたばかりのメッセージを開き、何度か読み返した。そこには出発前に交わした言葉と変わらない、短い挨拶が書かれていた。<\/p>\n<p>しかし、時差のある連絡は次第に間遠になった。最初は毎日だったメッセージが週に一度になり、月に一度になった。向こうでの授業や生活のことを聞き、こちらの大学の課題やアルバイトのことを伝えた。写真も何枚か送られてきた。リヨンの街並み、カフェのテーブル、川沿いの風景。写真の隅には見慣れない看板や、読み方のわからない店の名前が写っていた。僕はそれらを眺めながら、彼女が今どんな生活をしているのかあてもなく想像した。写真に写っているカフェで彼女が何を注文したのか、誰と座っていたのか、帰り道にはどんな景色を見たのか。尋ねれば教えてくれたのかもしれない。けれど、そうしたことを一つずつ聞いていくのは、彼女の生活をこちら側から確かめようとしているようで、少し気が引けた。写真に写っているものと、実際に彼女が過ごしている時間とのあいだには、どうしても埋められない距離があった。僕が見ているのは、彼女の生活そのものではなく、彼女がその中から切り取って送ってくれた一部分にすぎなかった。彼女の返事が遅くなっても、僕は催促しなかった。僕のほうも送ろうと思ったメッセージをそのまま下書きに残すことが増えていった。大学では新しい課題が始まり、アルバイトのシフトが入り、友人と食事をすることもあった。彼女のいない生活にも、それなりの予定ができていった。ときどき、彼女に見せようと思って写真を撮ることがあった。大学の近くにできた店や、帰り道に見つけた古本屋の棚。けれど、それを送る頃には、なぜ撮ったのかを自分でもうまく説明できなくなっていた。ただ、ある日気づくと、彼女からの連絡がぷつんと途絶えていて、僕からもメッセージを一切送らなくなっていた。最後にどちらが何を送ったのか、今では正確に思い出せない。最後の会話に、別れを告げるような言葉があったわけでもなかった。誰が悪いわけでもない。ただ、生活が違う方向へと流れていっただけだ。彼女のいる場所には彼女の時間があり、僕のいる場所には僕の時間があった。それだけのことだった。そう、たったそれだけのことのはずだった。<\/p>\n<p>二〇二六年の春、桜が咲く頃に、一度だけ短いメッセージが届いた。<\/p>\n<p class=\"d\">『元気？　あの本、まだ持ってる？』<\/p>\n<p>僕は少し考えてから、返事を打った。<\/p>\n<p class=\"d\">『持ってる。レシートも、そのまま』<\/p>\n<p>短い会話だった。既読はついたけれど、返事は来なかった。僕はスマートフォンを机の上に置き、窓の外を眺めた。隣の家の物干しには、洗濯物が風に揺れていた。春の光は部屋の奥まで届いていた。僕はしばらくそのまま座っていたが、やがて本棚からあの文庫本を取り出した。<\/p>\n<p>レシートは以前と同じページに挟まっていた。<\/p>\n<p class=\"rc\">店名　A.P.C<br>住所　東京都渋谷区宇田川町15ー1　パルコ2F<br>日付　2021年02月13日（土）12:59<br>商品名　COTON MILITAIRE LAVE<br>単価　¥55,000<br>決済方法　クレジット<\/p>\n<p>その人は今、どこにいるのだろう、と僕は考えた。今も渋谷の近くに住んでいるのかもしれないし、あるいはフユのようにまったく別の知らない街に住んでいるのかもしれない。あのジャケットはまだクローゼットに残っているだろうか。それとももう処分してしまったのだろうか。この本を売ったのはいつだったのか。どんな気持ちで古本屋に持って行ったのか。あるいは売ったこと自体をもう覚えていないのかもしれない。レシートが挟まったままだったことにも最後まで気づかなかった可能性もある。そう考えると、この小さな紙切れだけが、今もその人から切り離されずに残っているのだ。<\/p>\n<p>レシートはまだ手元にある。紙は少し柔らかくなり、端も少し丸くなったが、印字は今でも読める。二〇二一年二月十三日、土曜日、十二時五十九分。A.P.C。COTON MILITAIRE LAVE。五万五千円。クレジット。そこには、ただそれだけが記録されている。名前も、顔も知らない誰かが、ある土曜日に渋谷で服を買い、そのあとこの本を読んでいた。そして栞に、レシートを用いた。その事実だけで、世界は今以上にクリアに見えた。秋の夕方や、雨が降り出す少し前みたいな時間に、僕はたまにその本を本棚から取り出すのだろう。そしてレシートを眺めながら、その人のことを考えるのだろう。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">XI<\/div><h2>洗われた、というアカウント<\/h2>\n<p>ふたつ目の短編の最後で、物語の主人公はこんなことを考える。<\/p>\n<p>もしあの人と三十分だけでも話せたなら、その人がどこから来て、どこへ向かおうとしていたのかを聞いてみたかった、と。好きな季節や、朝によく飲むものや、どんな音楽を聴くのか知りたかった、と。そしてあの晴れた朝に、偶然すれ違うに至った運命の経緯のようなものを解き明かしてみたい、と。もちろん、これは架空の話だ。でも僕はその文章を、どうしてもレシートの誰かに重ねずにはいられなかった。<\/p>\n<p>もし三十分だけでも話せたなら、と僕は思う。どこから来て、どこへ向かっていたのか。どんな部屋に住み、朝には何を飲むのか。休日には何をして過ごすのか。どうしてあの日、渋谷パルコでジャケットを買い、そのレシートをこの本へ挟んだのか。そしてあの古本屋で僕がこの本を手にとるに至った運命の経緯のようなものを解き明かしてみたい。もちろん、その人に出会うことは、今後一生ないのかもしれない。一枚の小さなレシートから特定の誰かを探し当てるなんて、現実的にはほとんど不可能だ。でも、その人は確かに存在していた。この本を読み、途中でページを閉じ、レシートを挟んだ。そのことだけはこの小さな紙が確かに証明している。僕はそれで十分だと思った。あの本は今も本棚にある。レシートもまだ同じページに挟まっている。そして僕はこれからも、ときどきその本を開いて、名前も知らない誰かのことを少しだけ考えるのだと思う。悪くない、と思った。悪くない人生だ、と思った。そして願わくば、その人生の最果てに、レシートを栞にした誰かと出会えたなら、それ以上に幸運なことはないのかもしれない。僕はレシートを本に挟み、そっと閉じた。するとちょうどそのとき、机の上のスマートフォンが短く震えた。画面にはインスタグラムのフォロー申請が届いていた。画面をスワイプして、インスタグラムを開くと、そこにはアカウントからのフォロー申請が表示されていた。アカウントのタイムラインを遡っていくと、ふと目に止まる写真があった。二〇二一年二月十三日に投稿された一枚の写真。それはカーキ色のジャケットを纏う女性の後ろ姿の写真だった。僕は目を見張り、ほとんど反射的に、画面をスクロールしてアカウント名を見つめた。そこにはたった一行、こう書かれていた。<\/p>\n<p class=\"line\">ジェラール・フィリップは洗われた、と。<\/p>\n<p>そのアカウントをしばらく眺めていた。プロフィールには何も書かれていなかった。投稿も数枚足らずで、フォローしている人数も、フォロワーの数もごくわずかだった。アイコンには何も設定されておらず、名前のほかにその人について知る手がかりはなかった。二〇二一年二月十三日の写真には、カーキ色のジャケットを着た女性が写っていた。顔は見えない。肩まで伸びた髪が背中にかかり、片方の手には小さな紙袋を提げていた。写真の背景には見覚えのある建物の壁面があった。渋谷パルコだった。投稿された時間は十三時二十七分。レシートに記された買い物から、三十分も経っていない。<\/p>\n<p>僕は写真を、何度も拡大した。ジャケットの襟元や袖口、背中にできた細かな皺を見た。COTON MILITAIRE LAVE。洗いをかけた、軍用コットン。レシートに記されていた商品名が、初めて具体的な衣服として目の前に現れた。もちろん、それだけで同じ人物だと断定できるわけではない。たまたま同じ日に同じ場所で、同じような色のジャケットを着ていた別の誰かかもしれない。そもそも写真の女性が買ったものなのか、誰かから借りたものなのかさえわからない。けれど僕にはもう、それを偶然として片づけることができなかった。何よりジェラール・フィリップは洗われた、というアカウント名。その存在が僕の胸の鼓動を高鳴らせ、喉をからからに乾かせた。僕は一度画面を閉じた。それからもう一度開いた。アカウント名を読み、写真を見て、プロフィールに戻る。その繰り返しだった。しばらくして、フォロー申請を承認した。すると、すぐにメッセージが届いた。<\/p>\n<p class=\"d\">『こんばんは。突然すみません。フォローありがとうございます』<\/p>\n<p>僕は返信欄を開いたまま、しばらく何も打てなかった。何と返せばいいのだろう。あなたがあの日、五万五千円のジャケットを買った人なのですか、と尋ねるのはあまりにも唐突だった。馬鹿げている。それにレシートを持っている、と言えば、相手はきっと困惑するだろう。僕は一度文章を打ち、消した。もう一度打ち、また消した。結局、短く返した。<\/p>\n<p class=\"d\">『こちらこそ。以前から、あなたのことが気になっていました』<\/p>\n<p>送信してから、おかしな文章だったと思った。これじゃまるで昔からの知り合いに送るような言い方だった。けれど、相手はすぐに返事をくれた。<\/p>\n<p class=\"d\">『そう言ってもらえると嬉しいです。実は、少しお話ししてみたいと思っていました』<\/p>\n<p>そのあと、いくつかメッセージを交わした。僕たちは互いの名前を尋ね、住んでいる場所を教え合った。彼女は現在、東京に住んでいるらしかった。仕事のことや休日の過ごし方についても、少しだけ話した。僕は大学を卒業してからも東京に残っていることを伝えた。彼女は本を読むのが好きなのだと言った。僕が古い小説をよく読むと答えると、彼女も最近、昔読んだ短編集を読み返しているところだと教えてくれた。会話は不思議なくらい自然に続いた。僕は相手の文章を読みながら、その人がどんな声で話すのかを想像していた。年齢も、顔も、詳しい生活も知らない。それなのに、僕の中では少しずつ、『ジェラール・フィリップは洗われた』というアカウントの先にある人物の輪郭を持ちはじめていた。<\/p>\n<\/section>\n\n<section class=\"chap\"><div class=\"no\">XII<\/div><h2>渋谷、十二時五十九分<\/h2>\n<p>何日か経った頃、彼女から一通のメッセージが届いた。<\/p>\n<p class=\"d\">『よかったら今度、渋谷のカフェでお茶でもしませんか』<\/p>\n<p>僕はその文章を何度か読み返した。渋谷。あの日と同じ場所だった。二〇二一年二月十三日、土曜日、十二時五十九分。A.P.C。五万五千円。<\/p>\n<p class=\"d\">『ぜひ』<\/p>\n<p>僕は間髪を入れず、そう返した。日程を決めるまでに、それほど時間はかからなかった。彼女の都合に合わせて、翌週の土曜日に会うことになった。待ち合わせ場所は渋谷パルコの前、時間は十三時だった。カフェの場所は会ってから決めようということになった。約束の日まで、僕は何度かレシートを取り出した。文庫本の同じページに挟まれていた紙片は、以前よりもさらに柔らかくなっていた。印字された文字は、まだ読める。僕はそれを指先で伸ばし、日付と金額を確かめた。二〇二一年から、もう何年も経っていた。あのときの僕は高校生で、今は大学を卒業している。フユと出会い、一緒に暮らし、そして離れた。あの頃には想像もできなかった生活を、僕はそれなりに過ごしてきた。けれど、この紙切れだけはずっと同じ場所にあった。<\/p>\n<p>土曜日はよく晴れていた。僕は約束の時間より少し早く渋谷に着いた。駅からパルコへ向かう道には、休日を過ごす人たちが絶えず行き交っていた。交差点では信号が変わるたびに人の流れが入れ替わり、店の前には買い物袋を提げた人たちが立ち止まっていた。ビルの窓には春の光が反射していた。僕は歩道の端に立ち、腕時計を確認した。まだ待ち合わせの時間には十分ほどあった。渋谷パルコの建物を見上げた。何度も想像してきた場所だった。高校生の頃、レシートの住所を読みながら頭のなかに描いていた景色が、今は目の前にあった。もちろん、想像していたものとは少し違っていた。建物の外壁も、行き交う人の服装も、道路の向こうに見える景色も、記憶のなかで作り上げていたものとは違っていた。それでも、ここに誰かがいたのだと思った。あの日、十二時五十九分に会計を済ませ、ジャケットを受け取り、紙袋を持ってこの場所を歩いていた誰かが。僕はスマートフォンを取り出し、彼女とのメッセージを開いた。最後に届いていたのは、もうすぐ着きます、という短い連絡だった。時計を見ると、十二時五十八分だった。信号が青に変わり、人の波が動き出す。僕は無意識のうちに、その流れの中の一人ひとりの顔を目で追っていた。コートを脱いだ人たち、薄手のシャツの袖をまくった人たち。春の装いの群れのなかで、ひとつだけ、色が違った。カーキ色。少し丈の短い洗いのかかったミリタリージャケット。襟元は柔らかく落ち、袖口には何度も腕を通したことを思わせる自然な皺が寄っている。その人は横断歩道を渡り切り、広場の入口で一度足を止めた。それから、静かにこちらを向いた。髪はひとつに束ねられていなかった。肩のあたりで切りそろえられた髪が、風に少しだけ揺れていた。間違いない。フユだった。<\/p>\n<p>四年の時間が、彼女の輪郭を少しだけ変えていた。頬のあたりが細くなり、目元には、僕の知らない街の光を見てきた人の静けさがあった。けれど、こちらを見て目を細めたときの表情は、あの学食の窓際で、ストローをかき混ぜていた彼女と同じだった。僕は、何も言えなかった。フユはゆっくりと歩いてきた。急ぐでもなく、ためらうでもなく、まるで毎週ここで待ち合わせていたかのような、軽快な足取りだった。僕の前で立ち止まると、彼女は少しだけ首を傾げ、僕の顔を、目元のあたりをじっと見た。春の陽光が、彼女の肩に落ちていた。ジャケットの生地が、光を吸って柔らかく色を変えた。五万五千円の、洗われたコットン。誰かが二〇二一年の土曜日の昼下がりに買い、そのあと本を読み、レシートを栞にした、あのジャケット。<\/p>\n<p class=\"d\">「ずっと……」<\/p>\n<p>僕が言いかけると、彼女は小さく首を振った。<\/p>\n<p class=\"d\">「いいの。今は、まだ」<\/p>\n<p>それから、あのときと同じように、何かを無理に伝えようとしない声で言った。<\/p>\n<p class=\"d\">「ほんとはね、あのレシート、栞にするつもりじゃなかったの。ただ、近くにあったから挟んだだけ。だから本を売ったときも、気づかなかった」<\/p>\n<p class=\"d\">「うん」<\/p>\n<p class=\"d\">「古本屋の棚でね、リヨンに発つ前の日に、一度だけ見に行ったの。そこにまだあるかなって。なかったけど」<\/p>\n<p>彼女は少し笑った。<\/p>\n<p class=\"d\">「あなたの部屋の本棚で見つけたとき、すぐにわかった。この本、わたしのだって。でも、言えなかった。言ったら、何かが変わるような気がして」<\/p>\n<p>僕は手のひらにレシートがないことを、はじめて少し寂しく思った。それから、すぐに思い直した。あれは、今も本棚の同じページにあるのだ、と。<\/p>\n<p class=\"d\">「ジェラール・フィリップに似てるって言ったの、覚えてる？」<\/p>\n<p>彼女が訊いた。<\/p>\n<p class=\"d\">「覚えてる。調べても、わからなかった」<\/p>\n<p class=\"d\">「そのうちわかるって、わたし言ったでしょう」<\/p>\n<p class=\"d\">「言ったね」<\/p>\n<p class=\"d\">「あのね」<\/p>\n<p>フユは一度、視線を足元に落とし、それから顔を上げた。<\/p>\n<p class=\"d\">「三十六歳で死んだ人でしょう、あの人。でも映画の中では、ずっとあの顔で、あの声で、生きてる。会ったこともない人が何十年経っても誰かの記憶のなかで、ちゃんと生きてる。あなたが誰かを思い続けていたのも、きっとそういうことなんだって思ったの。そのとき、直感で──」<\/p>\n<p>僕はようやく確信した。信号の音が、遠くで鳴っていた。春の風が、広場を斜めに抜けていく。フユは少しだけ背筋を伸ばして、僕を見た。<\/p>\n<p class=\"d\">「ジェラール・フィリップは現れたね、ちゃんと」<\/p>\n<p>カーキ色の袖が、風に揺れていた。陽の光のなかで、彼女の言葉は凛として澄んでいた。あの日から、どれくらいの時間が経っただろう。どれほどの想いが胸にあふれ、やがてついえていっただろう。しかしそれでもついえなかった想いは、確かにあった。消えずに、灯り続けた想いがあった。きっと今なら胸を張って、その想いを伝えられるはずだ。何度も迷い、戸惑い、そして心に閉ざしてきたあの言葉を、今なら、きっと──。<\/p>\n<p>運命の予感をたっぷりと含んだ空気を、胸いっぱいに吸い込む。そして僕は在りし日の記憶を告げるように、そっと口を開く。<\/p>\n<p class=\"fin\">──ジェラール・フィリップは洗われた、と。<\/p>\n<\/section>\n\n"}};

function syncDoors(){
  document.querySelectorAll('#prose .chap').forEach((c,i)=>{
    const old=c.querySelector(':scope>.door');if(old)old.remove();
    const s=S[i];if(!s)return;
    const d=document.createElement('div');d.className='door';d.dataset.i=i;d.style.setProperty('--g',s.g);
    d.innerHTML=`<div class="big" data-d="n">${esc(s.n)}<\/div>${s.r?`<div class="rcpt" data-d="rh">${s.rh||RC_DEF}<\/div>`:''}<div class="kw" data-d="k">${nl(s.k)}<\/div><div class="cap" data-d="c">${nl(s.c)}<\/div>`;
    if(document.body.classList.contains('editing'))d.querySelectorAll('[data-d]').forEach(el=>{el.setAttribute('contenteditable','true');el.spellcheck=false});
    c.insertBefore(d,c.firstChild);
    (window._dio=window._dio||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');window._dio.unobserve(e.target)}}),{threshold:.3})).observe(d);
  });
}

/* 章からランダムに1つ：まとまった地の文1段落 or セリフ1つ（短い相槌・会話の間の短い地の文は除く） */
function lineCands(ch){
  const ps=((ch&&ch.paragraphs)||[]).map(p=>String(p).trim());
  const isD=p=>/^[「『]/.test(p||'');
  const clip=p=>{if(p.length<=340)return p;const cut=p.slice(0,340);const i=cut.lastIndexOf('。');return i>=0?cut.slice(0,i+1):''};
  const cand=[];
  ps.forEach((p,i)=>{
    if(!p)return;
    if(isD(p)){
      (p.match(/「[^」]*」|『[^』]*』/g)||[]).forEach(m=>{const inner=m.slice(1,-1);if(m.length<=340&&inner.length>10)cand.push(m)});
    }else if(!/^[（(]/.test(p)){
      if(p.length<30)return;
      const adj=isD(ps[i-1])||isD(ps[i+1]);
      if(adj&&p.length<20)return;
      const t=clip(p);
      if(t.length>=30)cand.push(t);
    }
  });

if(TEXT_DOC){
  TEXT_DOC.get().then(s=>{
    if(s.exists){RAW=s.data()||{};OV={stories:RAW.stories||{},top:RAW.top||{},meta:RAW.meta||{},added:RAW.added||[]};(OV.added).forEach(s=>{if(!DATA.stories.find(x=>x.id===s.id))DATA.stories.push(s)})}
    start();
  }).catch(()=>showLoadError());
}else showLoadError();
</script>
