"ハシはそう言って、グラスを置き、店を出ていった。扉の鈴が鳴り、夏の夕方の祝福的な光の中に、白いシャツの背中が溶けていった。それがルカが生きたハシを見た、最後の姿になった。"]}, {"title": "", "paragraphs": ["旅の六日目の朝のことだった。", "タオルミーナのホテルの裏手、駐車場に面した建物の側面には、非常用のコンクリートのスロープがあった。階段ではなく、車椅子や担架を運ぶために作られた、長くて急な傾斜路だ。その下の荷物の搬入口のあたりで、早朝にゴミを出しにきた従業員が、ひとりうつ伏せに倒れている男を見つけた。男は、すでに息をしていなかった。キアラは前の晩、部屋でハシと夕食をとったあと、ワインを飲み過ぎて、先に眠ってしまっていた。目が覚めたとき、隣のベッドは空だった。シャワー室にも、ベランダにもいなかった。最初は、朝の散歩にでも出たのだろうと思った。けれど、一時間が過ぎても帰ってこなかった。フロントに電話をかけようとしたとき、部屋の扉がノックされた。そこには警察と、ホテルの支配人と、制服の男たちが立っていた。後日の検死で、死因は脳挫傷だと判断された。頭部を強く打ったことによる、即死に近い状態だった。非常用スロープの手すりは低く、前夜は雨上がりで、コンクリートが濡れていた。足を滑らせて転落したのか、あるいは自らそこから身を投げたのか。警察は、最初のうち、後者の可能性も真剣に調べた。けれど遺書は見つからなかった。部屋にも、荷物にも、ポケットにも、それらしい書き置きは何ひとつなかった。ハシのスマートフォンには、キアラとの何気ないやりとりと、その日の夕食の写真が残っているだけだった。財布も、パスポートも、きちんと部屋の金庫に入っていた。死の前に何かを整理した形跡も、誰かに別れを告げた形跡もなかった。そしてひとつだけ、警察の記録に残された奇妙な点があった。ハシの右手のそばに、藍色の布の袋が落ちていたのだ。紐がほどかれ、中の箸は一本だけが出て、もう一本は袋に残っていた。夜中に、誰もいないスロープの上で、彼は箸を出していたのだろうか、何のために。それが何を意味するのか、誰にも説明できなかった。警察は最終的に、事故として処理した。"]}, {"title": "", "paragraphs": ["キアラは数日、口をきけなかった。", "ルッカに戻ってきたとき、彼女は驚くほど痩せていて、目の下に深い影があった。ルカは彼女を、ただ黙って、バールの奥の席に座らせて、熱いカモミールティーを淹れた。同じ頃、日本大使館の領事に連絡が行った。パスポートに記載されていた名前は、ハシの本名だった。けれど、そこに書かれていた日本の住所は、すでに存在しない番地だった。大使館は親族を探す手続きを進めてくれたが、返事はいつまで経っても来なかった。誰が、どこで、ハシの帰りを待っているのか。本当に誰かが待っていたのか、それとも誰も待っていなかったのか。その手がかりは何ひとつ、残されていなかった。"]}, {"title": "", "paragraphs": ["葬儀はルッカの小さな教会で行われた。ハシが信仰を持っていたのかどうかも、誰も知らなかったが、キアラがそれを望み、神父はそれを静かに引き受けてくれた。教会は満員だった。「トラットリア・ダ・ジーノ」の主人・ジーノは厨房の白い上着のまま、最前列で、声を殺して泣いた。自転車修理店のトンマーゾは作業着の黒い手を膝の上で固く握りしめて、床を見つめていた。古書店のマルタはハシが最後に買った詩集を胸に抱いていた。街の人々、パン屋、薬局の女主人、広場の観光案内所の職員、自転車に乗せてもらった子どもたちまで、本当にたくさんの人が来た。ルッカの街の誰もが、ハシのことを知っていた。そしてルッカの街の誰もが、ハシのことを知らなかった。", "墓は旧市街の外れの、糸杉に囲まれた共同墓地の一角に建てられた。石にはイタリア語で、ただこう刻まれた。", "『HASHI ― 友人たちの、愛する人』", "ルカは棺が閉じられる前に、自分がもらった箸をハシの胸の上に置こうかと一瞬だけ思った。けれど結局、そうしなかった。それは自分が持っているべきもののように思えたからだ。そして藍色の布の袋と、その中の箸は、キアラの手によって、ハシと一緒に埋葬された。"]}, {"title": "", "paragraphs": ["それから、十年が経った。", "ルッカの街はあまり変わらなかった。城壁の上のプラタナスは、毎年同じように秋に葉を落とし、観光客の自転車は毎夏同じように長い列をなして走った。けれど人々は少しずつ変わっていった。ジーノは、ハシの死の三年後に、心臓の病気で亡くなった。トラットリアは、息子が継いだが、窓際のいちばん奥から二番目のテーブルは、そのまま空けられ、小さな花瓶が置かれた。トンマーゾは店を畳んで、故郷の村に帰った。マルタは結婚して、子どもを産んで、ときどき古書店のカウンターで、子どもを膝に乗せながら働いていた。キアラは五年ほど、ひとりで暮らしたあと、ピサの町に住む同僚の教師と再婚して、ルッカを離れた。彼女が最後にルカのバールに来た日、彼女はカウンターに座って、エスプレッソを一杯静かにゆっくりと飲んだ。", "「ありがとう」彼女は帰り際に、言った。「あなたがいてくれて、よかった」", "「僕は、何もしてないよ」", "「あなたが、いつもアーシの隣にいてくれたでしょう」", "ルカはそれ以上、何も言えなかった。バールは続いていた。看板は、相変わらず「角のバール」のままで、日本人の観光客がときどき地図アプリを片手に、首をかしげながら入ってくる。彼はそのたびに、レジの引き出しから紙ナプキンを取り出して見せ、「さよならだけが人生だ」と、覚えたての日本語で言って、笑った。もう誰もその意味を深く気にしなかった。そしてルカは毎朝、バールのシャッターを開ける前にひとつだけ、決まったことをするようになっていた。エスプレッソを二杯淹れる。ひとつは自分の分。もうひとつは、カウンターの端の席に、角砂糖を二つ添えて置く。誰も座らない席だった。客が来る前に、冷めたコーヒーをそっと流しに捨てる。それだけだった。そして誰にも聞こえない声で、ひとことだけ、つぶやく。", "「イタダキマス」"]}, {"title": "", "paragraphs": ["十年目の秋、彼はふと決心した。日本に行こう、と。", "ハシが日本のどこでどんな人生を送っていたのか。それを探りたいわけではなかった。探しようがなかったし、探してはいけないことなのだろうとも思っていた。ただハシがあの静謐で、しかしどことなく張り詰めた横顔で、ずっと見つめていたもの、あるいは見つめないようにしていたものに少しでも近づいてみたかった。ハシの面影がその生まれ故郷のどこかに、かすかに残っている気がしたのだ。ルカにとって、それは人生で初めてのイタリアの外への旅でもあった。バールを信頼できる若い店員に預けて、彼は成田行きの飛行機に乗った。パスポートを作ったのも、生まれて初めてだった。"]}, {"title": "", "paragraphs": ["東京は十月の終わりに近い、冷たい雨の日だった。ルカは空港から電車を乗り継いで、都心のホテルにチェックインし、荷物を置いたあと、慣れない足取りであてもなく街を歩き始めた。観光名所に行くつもりはなかった。ハシがいたかもしれない場所を、ハシがいなかったかもしれない場所を、ただ歩いて、確かめるように見てみたかった。けれど歩き始めて数時間で、彼は、はっきりと気づいた。この街のどこにも、ハシはいないということに。", "ハシは日本のどこにいたのかも、どんな街で暮らしていたのかも、誰にも語らなかった。だから、彼の面影はこの街の、どこを探しても見つからない。人混みの中には、彼に似た背格好の男が何人もいて、ふと振り返るたびに、違う顔が通り過ぎていった。看板の文字は、ひとつも読めなかった。ハシに教わった数少ない日本語のどれも、街の音の中ではほとんど役に立たなかった。コンビニエンスストアの棚の目の前で、彼は手に取った商品の説明書きを理解できず、悔しさを滲ませながら、棚に戻した。通りすがりの人々の会話は理路整然としすぎて、一語も聞き取れなかった。地図を眺めても、日本語の表示が複雑で、何度も迷子になった。生まれて初めて、彼は自分の言葉がまったく通じない場所に立っていた。それは予想していたよりも、ずっと孤独で、心細かった。誰も自分のことを知らない。誰も自分のことを気にかけない。話しかける相手も、気さくに話しかけてくれる相手も、誰もいない。自分はただ、人の流れの中のひとつの動く、哀れな一点にすぎなかった。"]}, {"title": "", "paragraphs": ["雨は昼過ぎから強くなり、傘を差していても、肩のあたりが冷たく濡れた。午後の二時を過ぎて、胃の中が空っぽなことに気づいたとき、彼は、蔵前の古い路地に迷い込んでいた。川の近くで、小さな店が肩を寄せ合うように並び、その一角に、紺色の暖簾をかけた寿司屋が見えた。昼の営業時間の終わりに近いのか、店の中は静かだった。ガラス戸の向こうに、白木のカウンターと、白い上着の板前の姿が見えた。ルカは、足が止まった。ここなら、入れるかもしれないと思った。そう思い立った瞬間、彼は何かに導かれるように、そっと引き戸を開けた。", "「いらっしゃい」", "低い声がした。カウンターの中の男は六十代の前半に見えた。丸刈りに近い短い髪、よく日に焼けた太い腕、無駄のない動き。", "ほかに客は誰もいなかった。ルカは、拙い英語と、覚えたての日本語を混ぜて言った。", "「ひとり。いいですか。……ワン、パーソン」", "男は少しだけ目を上げて、「どうぞ」と言い、カウンターの真ん中の席を示した。彼が腰を下ろすと、男は湯呑みと、温かいおしぼりを出した。", "「おまかせ、で、いいですか」", "その言葉は、ルカにも聞き取れた。ハシが昔、教えてくれた言葉のひとつだった。「おまかせ。相手を信じて、すべてを預ける、という意味」", "「……おまかせ。お願いします」", "男は頷いて、手元の包丁を取った。魚の身にすっと刃が入る音が、雨の音の合間に、小さく響いた。"]}, {"title": "", "paragraphs": ["最初に出されたのは、白身の魚だった。漆塗りの黒い板の上に、握りがひとつ、置かれた。艶のある身と、小ぶりな酢飯。ルカは、それを見つめた。そのとき、不意に記憶の底から、ある光景が浮かび上がってきた。「トラットリア・ダ・ジーノ」の窓際の席。藍色の布袋から出される、一膳の箸。湯気を立てるラグー。静かに皿を巻き取る、ハシの手。彼はそのとき、ふと思い至った。ハシは十年のあいだ毎日、あの席で、異国の料理を異国の人々の中で、日本の箸で食べていた。それがどれほど不思議で、どれほど孤独なことだったのか。自分は隣にいて見ていたはずなのに、一度もそれを自分の身に引き寄せて考えたことがなかった。ルカは生まれ育った街の中で、いつも自分の言葉で、自分の食べ方で暮らしてきた。それはあまりに当たり前すぎて、それを失うということが、どういうことなのか、どれほどの忍耐を伴うのか、想像したこともなかった。", "彼はその瞬間、静かに顔を上げた。どうやって伝えればいいのか、わからなかった。日本語を知らない。英語も、ほとんど出てこない。ルカは右手でナイフを切る仕草をして、左手でフォークを刺す仕草をして、それから、片言の英語で言った。", "「ナイフ。フォーク。……プリーズ」", "カウンターの中の男の手がほんの一瞬、止まった。眉がかすかに動いた。けれど男は何も言わず、一秒ほどルカの顔を見つめたあと、黙って頷いた。", "「少々、お待ちください」", "奥に引っ込み、しばらくして戻ってきた男の手には銀色の洋食器が、ひと組、握られていた。", "「どうぞ」", "「……グラツィエ」ルカは、思わずイタリア語で言い、それから慌てて言い直した。「ありがとう。ありがとう、ございます」", "「いえ」", "男はそれ以上、何も訊かなかった。ルカは自分の声が、少しだけ震えていることに気づいた。"]}, {"title": "", "paragraphs": ["彼はナイフを右手に、フォークを左手に持った。", "最初のひと切れは、ひどいものだった。フォークで魚の身を刺そうとすると、身が滑って、酢飯がほろりと崩れた。ナイフを入れると、米が刃の側面にくっついて、バラバラになった。皿の上に白い粒が散った。どうにか切り分けた魚の切れ端と、崩れた米を不格好にまとめて口に運ぶと、醤油をつけ忘れていることに気づいた。カウンターの向こうで、男が視線をかすかに落とした。それは見ないようにしてくれている、という種類の優しさだった。", "次の握りが、出された。ルカは今度はフォークを握りの側面に当てて、ナイフで真ん中を上から押さえるように切ってみた。魚が、二つに分かれた。酢飯も、切れ目に沿って割れたが、前よりは形を保っていた。彼は片方をフォークに載せて、小皿の醤油に軽くつけ、口に入れた。舌の上に寿司の旨みが広がった。昆布で締められた、白身の甘み。酢飯のほのかな酸味。それは生まれて初めて味わうもののはずなのに、なぜか懐かしく、どこか哀しい。", "次に出された握りはすでに真ん中で、二つに切られていた。ルカははっとして、顔を上げた。男は彼の視線に気づかないふりをして、次の魚を丁寧にさばいていた。けれど握られた寿司は、最初からひと口で食べやすい大きさに調えられ、切れ目の部分にはナイフで押さえやすいように、わずかな隙間が作られていた。彼はきっと黙って、そうしてくれたのだ。彼はまたフォークとナイフを握った。さっきより、ずっとうまく切れた。", "魚の身がフォークの上に収まり、醤油が酢飯の端に染みた。そしてそれを口に運びながら、彼は気づいた。この店の中で、フォークとナイフを使っているのは、自分ひとりだけであることに。壁にかかった品書きの墨の文字も、カウンターに置かれた箸置きも、湯呑みの形さえも、すべてが箸のために設えられていた。その真ん中に、ナイフとフォークを持った自分が座っている。ふとハシのすっと伸びた背中が脳裏を過ぎる。ハシは十年間、ずっと、これをしていたのだだろうか。自分のことを知らない街で、自分の食べ方を人々から不思議そうに眺められながら。友人ができても、恋人ができても、愛されても、それでも毎日あの席でひとり、藍色の袋から、箸を取り出して。ハシは日本に帰れない理由を持っていたのか、それとも帰りたくなかったのか、あるいは帰る場所がなかったのか。それは結局、誰にもわからない。けれどただひとつ、確かなことがあるとするならば、それは彼が本当の意味で、ずっとひとりだったということだ。何人もの友人に囲まれていても、愛する人の腕の中にいても、皿の上の麺をつかむ、あの二本の棒の先端には、彼しかいなかった。誰とも分かち合えることなく、誰にも説明することのできない、どこまでも静謐で、しかしあまりに痛切な孤独が、そこには──。", "頬が濡れていることに気づいた。彼はおしぼりで顔を押さえた。それでも涙は止まらなかった。肩が激しく震え、息が詰まった。", "「……スクーザ」彼はかすれた声で、イタリア語のまま言った。「すみません」", "カウンターの男は、何も答えなかった。ただ熱い茶を新しい湯呑みに注ぎ、彼の手元の少し離れたところにそっと置いた。", "ルカは涙を拭った。拭っても拭っても、涙はとめどなく頬を伝った。けれど彼はフォークを置かなかった。ナイフを置かなかった。彼は、次の握りをナイフで押さえ、半分に切り、フォークに載せた。ハシがパスタを箸でつかんで、持ち上げ、祈るような手つきで口に運んだ、あの美しい動作を思い出しながら。十年間、毎日、その動作を繰り返していた背中を、思い出しながら。窓の外のプラタナスの葉がゆらめき、ラグーの湯気が立ち、その向こうで、小さな声で「イタダキマス」と言っていた、ハシの冷たく、しかしどこまでも素直な横顔を。──理由があると思うか。城壁の上で、ハシが言った言葉が耳の奥で聞こえた。──あったかもしれない。だけど、いまはもう忘れたよ。ルカはその言葉の意味を今なら、少しだけわかるような気がした。理由はきっと、あったのだろう、と。けれど、それは言葉にしてしまうと、嘘になってしまうような、深いところにある何かだったのだろうと。", "だから、ハシはきっと答えなかったのではなく、答えられなかったのだろう──と。", "「次は、鮪です」", "カウンターの向こうから、男の声が低く落ちてきた。ルカは顔を上げた。涙で滲み、歪んだ視界の中に、白い皿と、鮪の握りが見えた。", "握りはやはり最初から、真ん中で、そっと切れ目が入れられていた。", "「……ありがとう、ございます」", "彼は声を絞り出すように言った。男は答えるかわりに、小さく頷いた。それから、もう何も言わずに、次の魚に包丁を入れた。窓の外では先鋭な雨が降り続いていた。川のほうから遠い船の汽笛が、かすかに聞こえた。ルカは、ナイフとフォークを握り直した。涙はまだ、頬を伝っていた。袖で目元を拭い、おしぼりで濡れた頬を拭い、それでも涙は後から後から溢れてきた。それでも彼は、手を止めなかった。ナイフで切り、フォークで運び、噛みしめ、飲み込んだ。ひとつ、またひとつ。自分の知らない国の、親友の生まれた国の、昼下がりの小雨の店の中で──。遠く離れた糸杉の下の石の上には、今ごろ、イタリアの秋の乾いた光が、そっと降り注いでいるのだろう。そこに眠る男が最後にどんな夜を過ごしたのかは誰にもわからない。けれどルカはひとつだけ、揺るぎない確信を抱えていた。あの男はどこにいても、自分のやり方で、ラグーを食べ続けていたのだ。誰にも理解されなくても。誰にも知られなくても。彼は涙を拭い、フォークを持ち上げて、次のひと切れを口に運んだ。そしてまた、ひと切れ。そのあいだポケットの中では、ハシからもらった、あの一膳の箸が一度も取り出されないまま、静かに、彼の体温によって抱き寄せられるように、そっと温められていた。"]}], "en": "Life Is Made of Goodbyes.", "summary": "ルッカの街で箸を使い続けた、ひとりの青年。", "tag": "別離"}, {"id": "s5", "group": "夭折した天使たちへ", "title": "誰かの犬になりたかった", "chapters": [{"title": "", "paragraphs": ["ＯＤはコスパが悪いとあれほど言っていたのに、スター先輩は咳止めを五十錠飲んだ。薬は市販のものだった。ドラッグストアの棚に無造作に並んでいる一箱数百円の鎮咳薬。成分表示を確認する素振りもなく、彼女はそれをレジに持っていった。五十錠というのは二箱以上に相当する量で、飲み込むだけでも相当な時間と水が必要だったはずだ。それでもスター先輩はやりきった。そのストイックさだけは、誰にも負けない。ところが天罰とでもいうべきか、副作用がようやく抜けかけた翌朝、彼女はひどい風邪を引いた。悪寒に、発熱、止まらない咳。皮肉にも薬を五十錠流し込んだ翌日に、本物の咳が始まってしまったのだ。体はだるく、起き上がるだけで額に汗が滲んだ。しぶしぶ近所のクリニックへ赴いたスター先輩に、医者は聴診器を当てながら咳止めを処方した。ところがその薬は、前日に五十錠もの同系統の成分を体に叩き込んだせいで耐性ができてしまい、一切効かなかった。スター先輩はベッドの上で毛布を顎まで引き上げ、天井を見つめながら力なく咳き込み、「しんどい」と掠れた声で呟いた。", "数日後、再診のために再びクリニックを訪れたスター先輩を、医者は首を傾げながら迎えた。処方通りに服用しているはずの咳止めが、どうしてこんなにも効かないのか。電子カルテを眺め、聴診器を当て直し、もう一度首を傾げた。当然、問診票に「昨日玩具のように咳止めを大量服用した」などと書けるはずもなく、スター先輩は「うーん、なんででしょうねえ」とだけ答えた。医者は腕を組んで少し考えてから、処方箋を書いた。咳止めの代わりに処方されたのは、ハチミツ入りの喉飴だった。袋を受け取ったスター先輩は、薬局の白い蛍光灯の下でそれをしばらく眺めた。五十錠の咳止めが行き着いた先が、喉飴。彼女は乾いた笑いをひとつ漏らした。それは苦笑いというより、もはや自分の業の深さを認め、受け入れるような笑いだった。"]}, {"title": "", "paragraphs": ["スター先輩について、少し話しておこう。池袋生まれの池袋育ち。繁華街の雑踏と電車の騒音を子守唄代わりに育った一人っ子の女の子。両親はどちらも忙しく、かといって放任というわけでもなく、ただ娘に対して過度な期待も深刻な失望も抱かなかった。テストで赤点を取っても叱られず、賞状を持ち帰っても大げさに褒められない。そういう家庭で育ったせいか、スター先輩は他人の評価を気にしない人間になった。正確には、気にしないふりが非常に上手い人間になった。ちなみにスター先輩はその名の通り、スターを宿している。スターとは星型のほくろのことで、彼女の右こめかみのあたりに綺麗な星型のほくろがあるのだ。一体、誰がそれを最初に指摘したのかは誰も覚えていないが、気がつけばそれが彼女の代名詞になっていた。", "そんなスター先輩との出会いについても話しておこう。僕がスター先輩と知り合ったのは、中学二年の春頃だった。もっとも、最初から僕と彼女の間に、特別な何かがあったわけではなかった。共通の友だちの誕生日会に呼ばれ、見知らぬ人間が十数人ひしめき合う狭い部屋で、たまたま隣に座ったのがスター先輩だったのだ。それだけのことである。部屋はリビングを無理やり使っていて、折りたたみのテーブルが二つ並べられ、百円ショップの紙皿に唐揚げとスナック菓子が盛られていた。誰かがBluetoothスピーカーにスマホを繋いでいたが、音量の調整を誰もしないせいで、人の声とほぼ同じくらいの音量でポップソングが流れていた。僕は知らない人間ばかりの中で、どこに視線を置けばいいかわからず、紙コップのオレンジジュースを飲んでは伏し目がちに眺め回すことを繰り返していた。スター先輩はその場で誰かと積極的に話しているわけではなかった。膝の上にスマホを乗せて、時々画面を見て、時々部屋を見回して、唐揚げを一つ取って食べた。それだけだった。にもかかわらず、彼女の周囲だけ空気が少し違う感じがした。ざわざわとした空間の中で、彼女の半径一メートルだけがどういうわけか静かだった。その場に流れる音楽が途切れた瞬間、彼女は不意に「何年生？」と訊いてきた。僕が「二年」と答えると、「じゃあ、後輩だ」と言って、それだけで満足したようにジュースを口に運んだ。その日、僕たちが交わした言葉はそれだけだった。でも帰り際、出口でまた鉢合わせると、彼女は「また会おうね」とだけ言って、池袋の雑踏に消えた。また会おうというのは社交辞令の一種だと思っていた。しかし翌週、共通の友人を通じてスター先輩からメッセージが届いた。「暇？」というたった一言だけだった。僕はその返事の簡潔さに、しばらく呆然とし、感心してしまった。というのも、当時の僕にとって「言葉」とは常に相手の顔色を窺い、その裏にある機嫌を読み解かなければならない、ひどく神経を摩耗させる道具でしかなかったからだ。そのように感じるようになったのは、我が家の根本的な不自由に由来した。", "我が家の母は常に優しかった。本当に優しかった。ただし、その優しさには微かな息苦しさが伴っていた。彼女の優しさは常に何かを先回りしていた。僕が疲れているのを見れば好きなものを作り、僕が黙っているのを見れば適度な話題を持ってきた。それ自体は悪いことではない。ただ、先回りされ続けると、自分がどこかへ消えていくような感覚があった。母親の視線の中に映っている「僕」は、いつも少しだけ本物の僕とずれていた。そのずれを指摘する言葉を、僕は持っていなかった。父親は、別の意味で難しかった。商社勤めで出張が多く、月に数回程度しか家に帰ってこなかった。帰らないこと自体は、慣れてしまえば普通のことになった。問題は、帰ってくる夜だった。父親が帰ってくる日は、前日から空気が変わった。母親の動きが少し忙しなくなる。冷蔵庫を開ける回数が増え、料理の品数が一つか二つ多くなる。父親の好きな銘柄のビールが冷やされる。これらの変化は誰も口にしないが、家の中のどこかに張り詰めた何かが生まれた。父親自身が怒鳴るとか暴力をふるうとか、そういったことは一切なかった。ただ食卓に座ると、部屋の重力とでも呼ぶべきものが変わった。父親は寡黙で、食事中もほとんど話さなかった。そして話さないことが圧力になっていた。何か話題を見つけなければという義務感のようなものが場に漂い、母親がいくつかの話を試みるが、父親の返答は常に短く、それ以上続くことはなかった。僕は箸を動かしながら、どこに視線を置けばいいかわからなくて、米粒を数えるようにして食べた。別に怒っているわけでも、機嫌が悪いわけでもない。それはわかっているはずなのに、それでも呼吸が浅くなった。父親が「ごちそうさま」と言って席を立つと、場の緊張が少し解けた。そのほっとする感覚を悟られないよう、僕は何でもない顔を保った。", "だから「暇？」と訊いてきたスター先輩に引き寄せられたのは、単に彼女のフットワークの軽さからだけではなかった。実際、彼女から送られてきたメッセージには相手を試すような鋭さがなかった。かといって歓迎をしているわけでもなかった。踏み込むでも退くでもない、ただ一定の距離を保ったまま差し出される均質な呼びかけ。それが父親の帰ってきた夜に食卓で感じていたあの名状しがたい圧とは、驚くほど対照的だったのだ。父親の無言の圧力と比べると、スター先輩の送ってきたメッセージはあまりに軽く、そして無機質だった。「暇？」の二文字は応答の有無を問う以前に、既にこちらの存在を前提として認め、受け入れていた。その押しつけがましさのない接し方に、僕は素直に好感を抱き、ほとんど反射的に「ひま」と返信を打った。するとすぐに「じゃあ来て」と、住所が送られてきた。それがスター先輩の部屋との、最初の出会いだった。"]}, {"title": "", "paragraphs": ["彼女の部屋との出会いは鮮烈だった。", "実際、僕は扉を開けた瞬間、目前に広がった光景に絶句した。部屋というものがあれほど混沌とした状態に変貌できるとは、それまでの十四年の人生で思いもしなかったからだ。空き缶やペットボトルが床のあちこちに散在し、脱ぎ捨てた服が山をなし、進路調査用紙やスナック菓子の包装紙が、ピサの斜塔のような危うい高さで部屋の片隅に堆積していた。スター先輩はその惨状の真ん中に胡座をかき、何食わぬ顔で蒸しパンを食べていた。", "「ひど」と思わず声が漏れた。", "「そう？」と彼女は言った。「慣れると気にならないんだよね」", "それが彼女の口癖だった。慣れると気にならない。彼女はそうやって、多くのものを受け流して生きていた。床に散らばった空き缶も、途切れがちな会話も、自分の存在の薄さも、何もかもを。もちろん僕は最初、その部屋の汚さに絶句していた。足の踏み場こそあるものの、どこを見ても生活の痕跡が剥き出しのまま放置されていて、何処に目を向ければいいのかわからなかった。ところが僕は同時にその散らかり具合に、ひどくほっとしてもいた。自分の家には、ゴミというものが落ちていたことがなかったからだ。食後の皿はすぐ洗われ、脱いだ靴は綺麗に揃えられ、テーブルの上にはいつも何も置かれない。それが当たり前だと思って、僕はこれまで十四年間生きてきた。しかしあの日、扉を開けた瞬間、僕の中には確かに何かが流れ込んできた。整然とした空間では絶対に得ることのできない、強烈な何かだ。それがいったい何なのかは僕にもよくわからない。しかし後になって考えてみれば、たぶんそれは「誰にも見張られていない」という感覚だったのだと思う。この部屋では誰も、誰かの様子を先回りして窺っていなかった。部屋が散らかっていることについて恥じているものは誰もいなかった。つまりそこでは誰も相手のことを気にしてはいなかったのだ。それは日々家庭の中で相手の顔色を窺っていた僕にとってみれば、かなり異質なことだった。しかしその異質さこそが、僕の安堵の理由でもあった。", "結局、その日の午後、僕たちは特に何をするでもなく、ただ部屋に並んで座ってテレビを見た。スター先輩は時折おかしな突っ込みを入れて、僕はそれに釣られて笑った。僕がクスッと笑うたびに、彼女は少し得意そうな顔をしたが、すぐに澄ました表情に戻った。夕方になると「もう帰っていいよ」と言われた。もちろん、そこはお世辞にも居心地のいい空間ではなかったが、それでも確かに不思議と居たくなるような何かがあった。", "それからの数ヶ月、僕は週に一度か二度、スター先輩の部屋に呼ばれた。呼ばれるたびに特別な理由があるわけでもなかった。「暇？」と言われて行くと、部屋で何かを食べているか、スマホを眺めているか、寝転んでいるかのどれかだった。用がなければ「もう帰っていいよ」と言われた。しかし帰ろうとすると「あ、そういえばさ」と何かを話し始めることが多かった。ある日は、どこの高校がいいと思うかという話になった。スター先輩はぱらぱらと雑誌をめくりながら、驚くほど熱心に喋った。「制服がかっこいい学校がいい」「通学に一時間以上かかるのは嫌」「でも遠いと親がうるさいこと言ってこないからいいかも」。話しながら結局どうしたいのかよくわからない結論に至り、「まあ受験してみてからだ」と言ってまた雑誌に目を落とした。別の日は、池袋の話をした。彼女は自分が育った街のことを批判的でも肯定的でもなく、ただ観察記録のように静かに語った。「東口と西口で住んでる人間の質が全然違うんだよ」「サンシャイン通りに夕方行くと、ホストっぽい男がビラ配ってるんだよね。でも誰も受け取らないから、結局バッグに押し込んでる。あれ、毎日どのくらい捨ててるんだろうね」「西口の公園、昔はもっと人がいたらしいけど、今はほとんど誰もいないんだよ。でも夜になると猫がいるから猫公園に改名したほうがいいよ」。彼女の語り口には街の細部をよく観察しているような節があった。雑踏の中にいながら、外側から眺めているような目。その目には、どこか達観したような諦めが混じっていた。僕はそこに親近感を覚えていた。", "中学三年生だったスター先輩は、夏頃から本格的に高校受験の勉強を始めた。といっても机に向かう姿勢が劇的に変わったわけではない。相変わらず床には空き缶が転がり、参考書は開きかけのまま別の雑誌に押し潰されていた。それでも成績は確かに伸びていた。赤点常連だった英語が平均点を超え、苦手だった数学も少しずつ形になりはじめた。本人はどこ吹く風で、「なんかわかってきた」と缶コーヒーを飲みながら言うだけだった。僕が何か手伝えることがあればと申し出ると、「問題集の丸つけだけやって」と言われた。赤ペンを手渡され、スター先輩の解答用紙を採点した。数学は意外に点数が高かった。英語は文法より語彙で点を落としていた。単語帳は鞄の中に入っているが、ほとんど開いた形跡がなかった。指摘すると「単語帳ってなんか好きじゃないんだよ。文脈ないと覚えられないからさ」と言い返してきた。じゃあどうするの、と聞くと「本読む」とだけ答えた。実際、彼女の部屋には英語の文庫本が何冊かあった。翻訳版と並べて置かれていて、好きなシーンだけ原文で読んでいたらしい。", "そうして冬が来て、受験当日も普段着に近い格好で試験会場に訪れたスター先輩は、桜の咲く前に志望校の合格通知を手にした。あの散らかった部屋からでも、ちゃんと未来へ続く道が伸びていたのだ。合格の報告は電話ではなく、ショートメッセージで届いた。「受かった」それだけだった。僕は「おめでとう」と返した。しばらくして「ありがと」と来た。それだけだった。大げさな喜びも、感謝の言葉もこれからの展望もなかった。でも、僕は何となくそのメッセージをスクリーンショットした。「受かった」という二文字は、彼女が努力した時間のすべてを内包していた。", "彼女にとって高校生活は紛れもなく新しい生活の始まりだった。新しい教室、新しい制服、新しい仲間たち、新しい教師たち。彼女は目前まで迫った明るい未来に期待していた。中学とは何か違う、もっと鮮やかで濃密な時間が待っていると信じていた。悩みや葛藤はあれど、これから先の未来に迷いや不安は存在しなかった。彼女も、僕も、当時はそう信じていた。しかし事件は、入学から間を置かずに起きた。"]}, {"title": "", "paragraphs": ["その前にまず、スター先輩の彼氏について話しておかなければならない。", "スター先輩が彼と付き合い始めたのは中学二年の秋の終わりだった。試験勉強が一段落しかけた時期で、ちょうど具体的な進路が見えてきて、気持ちが勉強以外に向き始めた頃のことだった。相手は同じ中学の一つ上の先輩だった。背が高く、話すときに相手の目をまっすぐに見つめる男だった。それ以外に特にこれと言って大きな特徴はなかったが、当時のスター先輩にはそれだけで十分すぎるほど響いたのだと、後になって彼女は言った。 彼との最初のエピソードを、スター先輩はよく話してくれた。出会ったのは文化祭の後片付けのときで、スター先輩が一人で折りたたみの机を廊下に運んでいたら、黙って反対側を持ってくれたのだという。話しかけてくるわけでも、名前を聞いてくるわけでもなく、ただ重たい机の端を持った。廊下を一緒に歩いて、所定の場所に置いて、「重かったね」と言って去ってしまった。それだけだったのに、とスター先輩は言った。どうしてそれで好きになるわけ、と僕が問うと、「わかんない、でもなんかよかったんだよね。すごく刺さった」と彼女は答えた。僕はその話を聞きながら、どこかで奇妙なものを感じていた。それはある意味では嫉妬にも似た感情だったのかもしれないし、また別の意味では単純な疑問だったかもしれない。「重かったね」と言って去った男のその一言のどこがそんなに良かったのか、僕は本当に理解できなかった。でも同時に理解できないこと自体が少し不快でもあった。何故なら、理解できないと認めることは、自分が彼女の本質に届いていないと認めることでもあったからだ。", "その後、スター先輩と彼はクラスの共通の知り合いを通じて連絡先を交換し、数週間のやり取りを経て、年が明ける前に付き合うことになった。交際の始まりは、喫茶店での待ち合わせだった。池袋の西口から少し歩いたところにある、昔ながらの純喫茶だった。内装が古びた木造で、コーヒーの香りが床板に染み込んでいるような店で、窓から街を見下ろせた。彼はコーヒーを飲みながら、スター先輩の右こめかみを指さした。", "「そのほくろ、星みたいだね」", "誰にも言われたことがなかった言葉だった。いや、星みたいと言われたことはあったかもしれないけど、言い方が少し違ったとスター先輩は言った。どう違うの、と聞くと、彼女はうまく言えないと言った。強いて言うなら、ちゃんと自分のことを見ていたという感じ、と。スター先輩は自分の容姿にあまり自信がなかった。鏡の前で「ブスだよな」と呟くのを、僕は何度か聞いたことがあった。冗談めかした言い方ではなく独り言を呟くような、確認するような声で。だから彼に「ちゃんと見てもらえている」と感じたことは、それなりに大きかったのだと思う。", "交際が始まってからの数ヶ月は、後から振り返れば蜜月と呼べる時期だった。週に一度か二度、放課後に会った。行く場所はたいして特別でなくて、池袋の喫茶店とか、図書館とか、サンシャインシティの広場などで特別な何かをするのではなく、ただ並んで時間を過ごした。彼は人の話をよく聞く人間だった。スター先輩が何かを話すたびに、相槌を丁寧に打ち、質問が自然で、簡潔だった。そして何より話が途切れることを怖れない人間でもあった。沈黙になっても、急いで埋めようとしなかった。そのスマートな沈黙との付き合い方が、スター先輩には心地よかった。", "ただ、彼にはひとつの癖があった。それは自分のことをあまり多く話さないということだった。聞けば答えるが、自分からは話さない。スター先輩が気づいたのは交際から二ヶ月ほど経ってからだった。自分が彼のことをあまり知らないことに気づいた。家族のことや、友人関係のこと、将来の話。彼はどれも軽く流した。深掘りしようとすると、話題をうまく変えた。別に隠しているというふうでもなく、ただそういう話し方をする人間だった。どうしてそういう話し方をするのか、スター先輩は一度聞いたことがあった。彼は少しの間沈黙してから、相手に不快な思いをさせたくないんだ、と答えた。不快にさせたくない？ とスター先輩が尋ねると、自分の話をしているときが人っていちばん楽しいからね、邪魔したくないんだと端的に答えた。当時のスター先輩は、それを彼の性格だと思っていた。後から考えれば、違ったのだろうが。", "ともあれ、スター先輩は高校入学と交際継続という二つの春を同時に迎えた。新しい制服を買いに行ったとき、彼が付き合ってくれた。百貨店の制服売り場で、スター先輩がブレザーを羽織って見せると、「似合う」と言った。もっと詳しく言ってよ、とスター先輩がからかうと、「首元がとても綺麗に見える」と答えた。首元、という言葉にスター先輩は少し照れた。それが彼女にとって、高校入学前の最後に記憶している幸せの感触だった。そして新しい生活が始まってからも、その幸福は続いていくものだと彼女は信じていた。慣れない教室や新しい友人たちに囲まれても、放課後に彼と会う約束があるだけで彼女の心は軽くなった。未来はまだ漠然としていたが、少なくとも彼との関係だけは揺るがないものだと思っていた。しかし事件はあまりにも唐突に、無慈悲に起きた。何と入学からほぼ間を置かずに。スター先輩と付き合っていた彼が別の女性と交際していたことが発覚したのだ。しかもその女性は、妊娠をしていた。スター先輩が新しい教室で自己紹介をしていたのと、ほぼ同じ頃に──。"]}, {"title": "", "paragraphs": ["スター先輩がそれを知ったのは、偶然と呼ぶには出来すぎた夜だった。手持ち無沙汰に滑らせていた指がふと画面の端で引っかかった。見覚えのある横顔が他人の写真に紛れ込んでいたのである。通り過ぎかけた指先が戻り、アカウントを開く。整然と並ぶ投稿の中で、違和は一つではなかった。最初は錯覚だと思った。しかし遡るごとに像は輪郭を増し、やがて逃げ場のない確信へと変わっていった。そこに写っていたのは、自分の彼氏だった。問題は、その写り方にあった。単に偶然背景に入り込んだ通行人という写り方ならよかった。しかしスター先輩の彼氏は、撮影者である女の子と明確な関係を示す距離に繰り返し現れていた。肩に回された手、テーブル越しの対面、夜景の前で並ぶ影。それらは単発ではなく、日付とともに積み重なっていた。最低でも数週間、場合によってはそれ以上の期間にわたって、継続的に接触していたことが読み取れた。", "スター先輩はいったんスマホを伏せた。部屋が静かすぎた。自分の呼吸の音が、やけにはっきり聞こえた。膝の上に置いた手がじわりと湿っていた。彼女は一度、小さく息を吐いた。それから投稿のタイムスタンプと自分が彼と会っていた日程とを照合した。するといくつかの日付が正確に重なった。自分と過ごしているはずの時間に、別の女の子と同じ時間を共有している記録が視覚的に残されていたのだ。それは一見すると不可解な状況ではあったが、筋は通っていた。関係が発覚した際に言い逃れの余地を残そうとしている──そう考えれば、全てが腑に落ちた。", "電話をかけたのは、その直後だった。呼び出し音は長く続かず、直後に軽い調子の応答が返ってきた。", "「もしもし？」", "何も知らない者の声音だった。スター先輩は遠回りをしなかった。", "「このアカウント、知ってる？」", "「……え？ なんの話？」", "例のアカウント名を告げ、写真を挙げ、時間と場所を一つずつ押さえていった。否認はすぐに出たが、長くは続かなかった。", "「それは──」", "「何日の、どこの店？」", "「……いや、その」", "具体を重ねるごとに、言葉は鈍り、間が増え、やがて途切れた。受話器の向こうに残った沈黙は、どんな説明よりも正確だった。", "「……もういい」", "スター先輩はそこで電話を切った。切った後、しばらく画面をただ見つめていた。怒りが来るかと思っていたが、来なかった。代わりにひどい眠気が訪れた。彼女は気持ちを落ち着かせる意味でも、一度ベッドの中に入った。しかし当然、寝れるはずはなかった。決定的な補足が届いたのは、その翌日だった。例のアカウントの持ち主からメッセージが来たのだ。文面は極めて簡潔で、余計な装飾を欠いていた。自分が彼と関係にあること。現在妊娠をしていること。関係が重なっていると知りながら、継続していたこと。必要な情報だけが、過不足なく並んでいた。時期や頻度にも曖昧さはなかった。前夜に拾い上げた断片と、矛盾なく接続された。その日のうちに、スター先輩は彼を呼び出した。場所は、夜通し灯りの消えないファミレスだった。"]}, {"title": "", "paragraphs": ["向かい合って座ると、ドリンクバーのコーヒーマシンが低く唸っているのが聞こえた。平日の夜遅く、客はまばらで、遠いテーブルに受験生らしき男の子が一人、参考書を広げていた。スター先輩はブラックコーヒーを一口飲んでから、感情を表に出さず、順に確認していった。", "「いつから」", "「……」", "「妊娠を知ったのは」", "「……その」", "「なんで」", "問いは極めて具体的で、逃げ道を一切残さない形をしていた。彼は彼女の問いに応じきれなかった。否認と曖昧な言い換えを繰り返し、やがて辻褄を失った。事態に見合う言葉は、もうどこにもなかった。そこでスター先輩は区切りを置いた。関係を終えると短く告げたのである。", "しかしその瞬間、彼の態度が急に変わった。", "「待って、別れたくない」", "「……」", "「お願いだよ、許してほしい」", "濁していた口が、別の意味で動き始めた。声が震えていた。スター先輩はそんな彼を黙って見ていた。謝罪でも弁明でもなく、ただ「別れたくない」という言葉を繰り返し続ける彼を。", "「じゃあ、その子はどうするの」", "「それは……考える」", "「いつ」", "「……」", "スター先輩はそこでようやく呆れを示した。それでも最後に一つだけ残っている問いを、取り落とさなかった。", "「どうして黙ってたの」", "「……」", "「どうして関係を続けたの」", "彼女はその問いを逃げ場のない形で彼へと差し出した。彼はしばらく黙っていた。卓上の水滴を指でなぞり、消してはまた現れる輪を見つめていた。受験生が鉛筆でノートを叩く音だけが、遠くから聞こえた。少し離れたテーブルで談笑しているカップルがいた。それは言葉を探しているというより、言い逃れの形を選び損ねているような間だった。 しかし彼はやがて観念したように口を開いた。", "彼の説明は断片的な弁解などではなく、一応の筋を持とうとしていた。まず、自分がずっと誰かから求められている状態だったこと。だからこそ誰かに選ばれ続けているという状態が途切れることを、極端に恐れていたのだということ。関係を一つに絞れば、その関係が終わった瞬間に、選ばれているという前提は消えてしまう。故に彼は関係を重ね、どちらからも切られない状態を維持しようとしていた──それが二重交際という形を取った理由なのだと。次になぜそれを隠したのかという点について、彼は長い沈黙のあと、「試していた」という言葉を選んだ。", "「何を？」", "「それでも離れないかどうか」", "スター先輩は黙った。コーヒーカップを両手で包み、テーブルを見た。彼の説明はこういうことだった。もし浮気が発覚したとき、それでもなお自分を手放さないかどうか。関係の不利が明らかになったあとでも、相手が自分を選び続けるかどうか。それを確認することでしか、自分が相手にどの程度必要とされているのか測れなかった。だから自分の価値を確かめる意味で二重交際をしていた。彼は、そう言った。もちろんスター先輩はこの論理を到底受け入れることはできなかった。しかし同時におかしいと思いながら、それでも聞き続けてしまう自分もいた。", "「……最低だね」", "「わかってる」", "さらに彼は妊娠という事実についても、同じ尺度で処理していたことを認めた。責任の所在を直視するより先に「それでも離れないか」という一点で相手の出方を見ていたのだと。結果として関係は倫理や現実の負担から切り離され、「どれだけ自分が求められるか」を測ることに収束していたのだと。そして、そこまで言って彼はようやく自分の内側について言及をした。", "「……誰かに求められてないと、すぐ価値がなくなる気がするんだ」", "その一言が出た瞬間、スター先輩の中で何かが止まった。怒りでも、共感でもない。ただ、ある種の既視感のような、説明のつかない静けさだった。彼女はその感覚を言葉にできなかった。ただ黙って、彼の顔を見た。", "「だから、関係を重ねて、確かめていたんだと思う」", "「……」", "「それで残った方が、自分にとっての本当の関係なんだって」", "求められ続けている状態を複数の関係で担保し、さらにその強度を確かめるために、わざと不利な条件を作る。そうすれば、残った方だけが「本当に必要としている相手」だと判断できる──彼の言いたいことはそういうことだった。そして彼の論理はあらゆる面で、その一点に収束していた。", "「卑怯なのは、わかってる」", "「……」", "「でも、それも含めて残るかどうか、見てた」", "彼は自分の行為が卑劣であること自体は否定しなかった。ただ、その卑劣さも含めて相手が受け入れられるかどうかを見ていたと言った。そうして残る関係だけが、自分にとって有効な拠り所になるのだと。彼は全てを語り終えると視線を上げた。スター先輩は戸惑った。犯した過ちはもちろん見過ごせなかったが、彼の話には筋が通っていた。人間関係の不安定さから、相手を試そうとするその心理は彼女にも共感できた。しかしそれ以上に、彼女は理屈の形を整えたはずの彼の言葉が、どこか芯を欠いていることに気づいていた。彼の論理は説明としては間違いなく閉じていたが、責任の所在だけが最後まで外側に置かれていた。まるで責任を取ることから、逃れるように。", "スター先輩はその事実を前に、しばらく黙っていた。彼女は当初、彼とはきっぱり縁を切るつもりでいた。しかし彼の歪んだ理屈は、きっぱりと縁を切るにはあまりにも首尾一貫していた。愚かであると明確に断じながらも、彼は彼なりの矛盾を抱えながら、それでも何とか自分の均衡を保とうとしている。そんな必死な姿に彼女はどこか行き場のないものを見てしまった。切り捨てるべきだと理解しながら、それでも切り捨てきれない何かが彼女の胸の奥には引っかかった。そして結果的にそれが彼との関係を一か月ほど延ばしてしまった。"]}, {"title": "", "paragraphs": ["ファミレスの夜から半月が経っても、スター先輩は彼と会い続けた。もちろん理屈では終わっていた。あの夜、向かい合ったテーブルの上で、彼女は関係を終えるとはっきり告げた。それは本心だった。衝動的な怒りでも、感情的な勢いでもなく、ただ論理的な結論として、彼女はそこに辿り着いた。しかし翌朝に彼から届いたメッセージを、スター先輩は開いてしまった。短い文章だった。謝罪でもなく、説明でもなく「昨日の話をもう少ししたい」という一文と、彼女が好きな喫茶店の名前が添えられていた。あの純喫茶の名前だった。二人で何度も行った、木の内装の、コーヒーの香りが板に染み込んでいる店だった。スター先輩はしばらく画面を見つめ、既読をつけたまま置いた。返信はしなかった。しかし翌日、その喫茶店の前を通りかかったとき、ふと足が止まった。もちろん入らなかった。ただ、しばらく扉の前に立っていた。風が吹いて、ドアベルが揺れた。中からコーヒーの匂いがした。それだけのことで、なぜか喉の奥が痛くなった。そういうことが何度か続いた。彼からの連絡を無視しながら、特定の場所や時間帯を避けながら、しかし完全に断ち切ることもできないまま、彼女の日々は続いた。彼女自身、なぜそうなるのかを言語化できなかった。あの夜に彼が語った歪んだ理屈──誰かに求められ続けることでしか自分の価値を測ることができないという理屈が、胸の底に引っかかっていた。哀れみでも共鳴でもなかった。ただ、それが自分自身と地続きであるような冷えた既視感があった。彼女もまた、求められることでしか輪郭を保てなかった。星のほくろを確かめ、散らかった部屋に埋もれる。彼を切り捨てれば、自分も消えてしまうような気がした。だからこそ彼女は、彼を完全に拒絶できなかった。", "しばらくしてスター先輩は彼と再会した。最初に会ったのは、別れを告げてから十一日が経った頃だった。場所は駅前のチェーンのカフェだった。二時間ほどたいして意味のない話をして別れた。その帰り道、彼女は自分でも意味がわからないと思いながら、なぜか激しく泣いた。一体泣く理由がどこにあるのか、彼女にもわからなかった。怒りでも、悲しみでもなく、ただ涙が溢れた。彼女はすぐさまコンビニのトイレに入って、個室の中で十分ほどかけて泣き続けた。鏡を見ると目が腫れていた。自分の顔が少し他人のように見えた。帰宅してから彼女は部屋の床に転がったまま、天井を二時間見続けた。その頃から眠れない夜が増えた。深夜二時に目が覚めて、そのまま朝まで過ごすことが週に何度もあった。高校に上がってから彼女はラーメン店で求人を見つけ、バイトをしていたが仕込みの作業中に手が止まることが増えた。スープの味見をして、何も感じないことがあった。美味しいとも不味いとも思わない。ただ液体が口の中にあるという、それだけの感覚。店長には気を遣われて声をかけられたが、彼女は「大丈夫です」と言い続けた。事実、体は動いていた。学校にも行っていた。ただ、何かがじわじわと薄れていくような感覚が、日常の端に常にあった。"]}, {"title": "", "paragraphs": ["リストカットを最初にしたのは、何度目かの眠れない夜のことだった。午前三時をとっくに回っていた。布団に入っても眠れなくて、起き上がって、床に座った。膝を抱えて、壁にもたれた。部屋には音がなかった。外からも何も聞こえなかった。聞こえないということが、その夜に限って奇妙な重さを持っていた。世界がどこかへ行ってしまって、自分だけがここにひとり取り残されているような感覚。胸の中にぽっかりと穴が空いているような感覚。そういうものを何時間もかけて、彼女はただ抱えていた。衝動的ではなかった。気づいたら引き出しを開けていた。工作用に買ったカッターナイフだった。刃を折るタイプのどこにでもある安いもの。取り出して、手首を見た。蛍光灯の光の下で、血管の生々しい青さが皮膚越しにうっすらと透けていた。生きているということの証拠が、こんなに表面近くに走っている。その事実が、そのとき妙に遠く感じた。そっと刃を当てた。すーっと引くと、皮膚が思ったより簡単に裂けた。最初は何も感じなかった。それから数秒遅れて、鋭い痛みが来た。傷口からぷっくりと血が滲み出してきた。繰り返しカッターで傷をつけると、鋭い痛みの後に不思議な静けさがやってきた。泣かなかった。ただ静かに息を吐いた。それだけでよかった。それだけだからよかった。血は少量で、すぐに止まった。翌朝には傷にテープを貼り、長袖の制服を着た。誰にも何も言わなかった。それから数週間の間に同じことを七度繰り返した。毎回、深夜だった。毎回、時間をかけてそこに辿り着いた。二度目は一度目よりも迷いが少なかった。三度目は迷いがなかった。傷を増やすたびに、彼女は静けさを感じた。痛みによって、ようやく自分がここにいるという手応えを得る。散らかった部屋と同じ。自分で自分を痛めつけることで、薄れゆく存在を必死に留めようとする。だがその行為は、結局、希薄さをさらに深くするだけだった。しかしそれでもやめられなかった。", "四度目のあと、傷の数を確認しながら、この行為が自分に及ぼす影響について考えた。しかし考えたところで何も変わらないと思い、やめた。五度目のとき、少し深く入りすぎた。血が思ったより多く出て、手が震えた。それでもやめることはできなかった。六度目は、痛みよりも先に静けさが来た。順序が逆になっていた。七度目のあと、床に座ったまま傷口を押さえながら、ふと気づいた。別に死にたいわけじゃなかった。その事実に自分でもひどく驚いた。しかしそれは本当だった。自分は消えたいとも、終わりにしたいとも思っていない。ただ何かに触れたかった。自分が本当にここにいるかどうかを確かめたかった。生きているという感覚が、自分の中に本当にあるかどうかを。カッターナイフを使うたびに、それを確かめていた。そういう行為だったのだと、七度目を終えてから初めて気づいた。しかし当時は、それすら言葉にならなかった。ただ、やめられなかった。", "七度目を終えた翌朝、彼女は考えた。自分はいつリストカットを知ったのだろうと。もちろん、リストカットという行為そのものを知らなかったわけではなかった。中学に入る頃にはインターネットや雑誌の記事の断片、誰かの噂話のようなものを通じて、そういう行為がこの世界に存在することは知っていた。けれど当時の彼女にとって、それはどこか遠い場所の出来事だった。理解できるとも当初は思わなかったし、自分に関係があるとも当然、思わなかった。ただ、生きづらさを抱えた誰かがいるらしいという程度の認識だった。それはＯＤについても同じだった。ネット上には様々な体験談や断片的な情報が溢れていたが、彼女はそれらを特別な興味を持って読んでいたわけではない。学校から帰ってきて、なんとなく画面を眺めているうちに目に入った言葉のひとつに過ぎなかった。だから後になって自分がその言葉の意味を身をもって知ることになるなど、その頃は想像もしていなかった。"]}, {"title": "", "paragraphs": ["ＯＤに手を出したのはその少し後だった。深夜に目が覚めた。また眠れない夜だった。布団から出て、台所へ行った。水を飲もうと思った。コップを取り出して、蛇口を捻ろうとしたとき、棚の上の咳止めの瓶が目に入った。買い置きのもので、ただそこにあった。スター先輩は瓶を手に取って、ラベルを読んだ。成分表示。用量。一回二錠、一日三回まで。その「まで」という言葉が、しばらく頭に引っかかった。ＯＤについて検索をしたのはそのときではなかった。翌日の昼、図書館の隅に座って膝の上にスマートフォンを置いて、調べた。成分名を入れると、関連する情報が次々と出てきた。作用の仕組み、用量の上限、閾値を超えたときに体に何が起きるか。感覚が変わるという記述があった。意識が遠くなるという記述があった。スター先輩はその記述を何度か読んだ。感覚が欲しかった。あるいは今ある感覚をいったん切り離したかった。どちらともつかないまま、彼女は情報だけを淡々と集めた。それから一ヶ月、スター先輩は何もしなかった。情報を持ったまま、ただ日々をやり過ごした。しかしある深夜、目が覚めて、また例の空洞が来た。ぽっかりと胸に穴が空いたような感覚。世界が遠のく感覚。彼女はそのとき初めて引き出しではなく棚に手を伸ばした。三十錠を水で流し込んだ。服用直後、すぐに眠気が来た。体が重くなって、床に横たわると、そのまま意識が遠のいた。夢を見た気がしたが、内容は覚えていない。翌朝、目が覚めると体が鉛のように重かった。吐き気があった。頭がゆっくりと回転しているような眩暈があった。立ち上がろうとすると床が遠ざかっていくような感覚に見舞われた。しかし不思議と気分は悪くなかった。感覚が、全部少しずつずれていた。痛みも、虚ろさも、胸に空いた穴も、どこか遠いところにあった。それから彼女はＯＤを、週に一回するようになった。いつの間にか、ドラックストアを何件も回ることが彼女の日課になっていた。"]}, {"title": "", "paragraphs": ["彼と最後に会ったのは、ＯＤを初めてやった日の翌週だった。自分から連絡をしたのは、珍しいことだった。なぜそうしたのか、スター先輩自身にもうまく説明できなかった。ただ、会わなければならないという感覚があった。確かめなければならないことが、まだある気がした。場所は以前と同じ夜通しのファミレスで、時間は夜の十時だった。向かい合って座ると、コーヒーマシンがあの日と同じように低く唸っていた。店内はがらんとしていて、遠いテーブルにトラックの運転手らしき男が一人、定食を食べていた。スター先輩はホットコーヒーを一口飲んだ。苦かった。それから、口を開いた。感情は一切込めなかった。込めようとしなかったわけではなく、込める感情がもう手元になかった。眠れない夜のことを静かに話した。左腕の傷のことを断片的に話した。棚の上の瓶のことを淡々と話した。全部ではなかったが、輪郭だけを丁寧に話した。話しながら自分の声が妙に遠くから聞こえた。まるで他人のことを報告しているみたいだと思った。彼は黙って聞いていた。話し終えると、沈黙があった。長い沈黙だった。スター先輩はその間、彼の顔だけをじっと見ていた。動揺が来た。それは本物だった。それから困惑が来た。それも本物だった。眉が寄って、目が泳いで、何か言おうとして言葉を失う、その過程がゆっくりと顔の上を通過していくのを、スター先輩はただ黙って見ていた。そして最後に安堵が来た。ほんの一瞬だった。目の緊張がわずかに緩んで、肩が落ちて、口元がかすかに弛む。その一瞬を、スター先輩は見逃さなかった。見た瞬間、何かが腑に落ちた。落ちたというよりも納得をした。この人は今、安心している。私が傷ついているという事実に。私が追い詰められているという事実に。それが彼にとって、自分が必要とされている証拠として機能している。あの夜に聞いた理屈は本当だった。彼は今この瞬間も、同じ尺度でこちらを測っている。スター先輩は確信した。この人は変わらない。変われない。そしてそれ以上に、自分もその構造の中に自発的に留まり続けていた。傷のことを話したのは自分だった。彼に会いに来たのも自分だった。あの一ヶ月、断ち切れなかったのも自分だった。彼女は自らその枷とでも呼ぶべきものを、彼の目の前に差し出していた。痛みと虚無を晒すことで、「まだ必要とされている」という最後の証拠を、相手に、そして自分に突きつける。枷を外せば、自分が消えてしまうという恐怖が、彼女をそこに留めていた。散らかった部屋に埋もれ、咳止めを飲み、刃を当て、薬を流し込み、それでもなお、誰かに自分の傷を見せることで輪郭を保とうとする。彼女は被害者である前に、その構造の共犯者だった。そして今も、自らその鎖を握りしめ続けていた。", "コーヒーカップを見た。液面が静かだった。スター先輩は立ち上がった。声は出さなかった。財布から千円札を一枚取り出して、テーブルに置いた。コーヒー代だった。彼が口を開きかけた。スター先輩は手のひらを、静かに返した。言葉を遮るためではなかった。ただ、もう聞く必要がない、という意思表示のためだった。店を出ると、夜風が頬に当たった。六月の終わりの風で、思ったより冷たかった。振り返らなかった。ガラス越しに、彼が何かしているのが視界の端に映ったが、見なかった。歩道に出て、しばらく歩いた。足が震えていることに気づいたのは、角を曲がってからだった。泣きたいとも思わなかった。ただ、ひどく疲れていた。何かがようやく終わったという感じではなく、長い間持ち続けていた重いものを、まだ手放せていないような感じ。空が低くて、街灯の光が妙に白かった。"]}, {"title": "", "paragraphs": ["翌朝の六時に、電話が鳴った。画面にスター先輩の名前が出た。僕は寝ぼけたまま出た。", "「別れた」", "開口一番、それだけだった。声は、驚くほど平坦だった。おはようでもなく、起こしてごめんでもなく、ただ「別れた」。", "「……いつ」", "「昨日の夜」", "「そっか」", "詳しく聞こうとしたが、彼女は「もういい、終わったから、全部終わり」と繰り返した。繰り返し方が少し、念を押すような繰り返し方だった。自分に言い聞かせているのか、こちらに言い聞かせているのか、僕には判別できなかった。", "少し間があった。", "「でも、しんどい」", "それだけだった。しんどいというのは何がしんどいのかと聞こうとした瞬間、彼女は続けた。", "「別にどうもしなくていい、ただ言いたかっただけ」", "僕はしばらく、暗い天井を見ていた。朝の六時の光がカーテンの隙間から細く差し込んでいた。彼女が何をしたくて電話をかけてきたのか、そのときの僕にはよくわからなかった。慰めてほしかったわけでもない。話を聞いてほしかったわけでも、多分ない。ただ、誰かの耳に「しんどい」という言葉を届けたかった。声に出して、どこかに着地させたかった。そういうことだったのだと僕はしばらく後になってから気づいた。そしてそのために選ばれたのが、朝の六時で、相手が僕だったのだということもしばらく後になってから理解した。"]}, {"title": "", "paragraphs": ["スター先輩の様子が変わり始めたのは、彼氏と別れた一ヶ月後だった。呼ばれて部屋に行くと彼女がいつもより静かだった。テレビがついておらず、カーテンも閉められていた。机の上に置かれたノートパソコンの光だけが煌々と光り、スター先輩は布団の上に横たわって、天井を見ていた。部屋の空気が違った。何かが抜け落ちたような、あるいは何かが溜まりすぎたような、どちらとも判断できない重さがあった。僕が声をかけると、唇がわずかに動いて、短い返事だけが返ってきた。視線は動かなかった。床に座るスペースをいつものように確保しようとしたが、以前にも増してゴミと吐瀉物の跡が散乱していて、足の踏み場がなかった。ペットボトルをどけると、血がついたカッターナイフが床に転がっていた。咄嗟に視線を逸らしたが、スター先輩は僕の反応に気づいていた。ただ何も言わなかった。", "「どうしたの」と僕は訊いた。", "「べつに」と彼女は言った。", "「べつにではないでしょ」", "「うん」", "しばらく沈黙が続いた。カーテンの隙間から差し込む光が、空き缶の縁で反射してちかちかしていた。スター先輩は天井を見続けていた。", "「あのさ」と彼女は言った。", "「なに」", "「最近、泣けないんだよ」", "僕は何も言わなかった。", "「それに夜中に目が覚めると、誰かに胸を掴まれてるみたいな感じがするんだよ。朝になったら少しは楽になるけど、最近ずっとそんな感じ」", "「いつから」", "「覚えてない。気づいたら、そうなってた」", "カーテンが風でわずかに揺れた。外では烏が鳴いていた。日が暮れかけてはいたが、烏が鳴くにはまだ早い時間だった。", "「バイトは、どう」と僕は訊いた。", "「行ってる。なんとか」", "「学校は」", "「行ってる。でも、なんか違和感がすごい。窓の外見てると、自分だけゲージの中にいるみたいな気がして」", "彼女は淡々と続けた。声に抑揚がなかった。感情を排して話しているのではなく、感情を運ぶエネルギーそのものが枯渇しているようだった。ごはんは一食くらい。お風呂は入れてない日もある。言葉は少なく、しかし途切れることなく出てきた。彼女はもう隠す気力すら失っていた。散らかった部屋は以前よりさらに混沌を増し、ゴミと埃と血の跡が存在の希薄さを埋めようとして、逆にその輪郭を曖昧にぼやけさせていた。カッターナイフも、咳止めも、それはすべて自らの希薄さを癒すためのものだった。痛みや虚無に触れることで、彼女は自分がここにいることを何とか確かめようとしていた。しかしその行為はどれだけ繰り返しても、彼女の中に染みついた根本的な希薄さを癒すことはできなかった。", "僕は壁に背中を預けて座った。スター先輩は天井を見続けていた。そのまま一時間くらい、二人はほとんど何も言わなかった。僕はただそこにいた。自分がここにいて良いのかどうかを確認することすらできないまま、ただそこにいた。それは僕にとって、かなり珍しいことだった。確認しないでいること、相手の感情を探らないこと、それは僕にとって未知の感覚だった。しかし彼女の呼吸が部屋の中にあって、僕の呼吸もそこにあるという事実が、その日、その瞬間だけは、満ち足りたものに感じた。何かをしなければならない、という焦りがなかった。ただそこに、二人分の呼吸があるということが、それだけで十分だと思えた。帰り際、スター先輩は「来てくれてありがとう」と言った。「べつに何もしてないけど」と答えると、彼女は「来てくれるだけでいい」と言った。その言葉の重さを、そのときの僕は正確には受け取れていなかった。今にして思えば、彼女はあのとき、誰かに存在を確認してもらうことだけを求めていたのだと思う。言葉でも行動でもなく、ただ同じ空気の中に誰かがいるということを。"]}, {"title": "", "paragraphs": ["それから僕は、こまめに彼女と連絡を取ったが、返信は一向に返ってこなかった。後になって話を聞くと、その頃はスマホを開いても返信を打てず、ただインスタグラムのタイムラインを何時間も流し続けていたという。生きているのか死んでいるのかもわからないまま、それでも朝は来て、制服に腕を通すしかなかったと彼女は苦しそうに答えた。それでも僕は毎日、短いメッセージを送り続けた。ごはんを食べたか、今日は暑かった、公園に蝉がいたとか。返信を期待するのではなく、ただ電波の向こうに言葉を投げ込むような感覚だった。それは暗く深い海に向かって小石を投げ入れていくような感覚に近かったが、自分が投げた小石がいったいどれほど深くまで届いているのかはわからなかった。あるいは届いていないのかもしれない、と何度か思った。底に着く音がしない。波紋も見えない。それでも手を動かし続けた。それでも僕は辛抱づよく送り続けた。届いているかどうかを確認する前に、送ることをやめることを強く拒んだ。それは僕が初めて、相手を詮索しないまま動いていた時間だったのかもしれなかった。", "彼女から連絡が来たのは、その三週間後だった。少し話せるかという短い一文で、一時間後に公園に来てほしいという内容だった。急いで向かうと、スター先輩はベンチに座っていた。膝の上に両手を重ねて、俯いていた。日が傾いていて、ベンチに長い影が落ちていた。", "彼女が顔を上げると、目の周りが赤かった。泣いていたのか、あるいは眠れていないせいなのかは、わからなかった。", "「久しぶりに泣いた」と彼女は言った。", "「そう」", "「バイトの帰りにガチャガチャの前で駄々こねてる子供見てたら、なんか泣けてきて、五分くらい泣いてた」", "「よかった」", "「よかった？」", "「泣けない方が心配だったから」", "スター先輩は少し笑った。それから「そういうこと言うんだ」と言って、空を見た。雲が一つだけあって、西の方へゆっくりと流れていた。", "「あの人、見かけたよ」と彼女は言った。", "「いつ？」", "「一昨日」", "「なんか言われた？」", "「やっぱり、やり直したいって。また最初から、ちゃんとしたいって」", "僕は何も言わなかった。", "「だからさ、一回聞いてみたんだよ。私のこと好きなの、って。なんていったと思う？」", "「わからない」", "「好きなんじゃなくて、必要としているって」", "雲がゆっくりと形を崩していった。スター先輩は膝の上の手を見ていた。指先がゆっくりと何かを数えるように動いていた。", "「好き、じゃないんだ」", "「必要としているだけ、らしいよ」", "僕はその言葉についてしばらく考えを巡らせた。好きという言葉には、少なくとも相手に向けられた眼差しが含まれている。しかし必要としているという言葉には、相手を道具にする眼差ししか含まれていない。その差は小さいようで、決定的なものなのではないだろうか。そしてそのとき初めて、僕は自分に問いかけた。僕はどちらなのだろう、と。毎日メッセージを送り続けていたのは、スター先輩のためだったのか。それとも届けることで、自分がここにいるという手応えを確かめていたのか。答えは出なかった。出す前に、考えるのをやめた。考えることが、怖かったのだ。", "公園の夕暮れが、少しずつ青くなっていった。", "「どうするの」と僕は訊いた。", "「まだわかんない」と彼女は答えた。「でも、もう少しだけ考える」", "けれど、それからスター先輩はリストカットとＯＤを繰り返し、その結果、救急車で搬送された。"]}, {"title": "", "paragraphs": ["彼女の搬送の知らせを受けたとき、僕は学校の廊下を歩いていた。バイブレーションで画面を見ると、共通の知り合いからメッセージが届いていた。", "「スター先輩が病院に搬送されたらしい。知ってた？」", "それだけだった。廊下の蛍光灯が、ひどく白く見えた。僕はその場でしばらく動けなかった。廊下は昼休みの喧騒で溢れていたが、その喧騒が一瞬にして遠のいていった。急いで病院の名前を確認して、学校を出た。病院に着くと、処置が終わって個室に移った彼女が点滴の針を刺した腕をシーツの上に置いて、天井を見ていた。点滴の管は透明で、そこを流れる液体も無色で、すべてが死んだように静かだった。", "「大丈夫？」と僕は言った。", "「なんで来たの」と彼女は言った。", "「心配したからだよ」", "「心配しなくていいのに」", "「しなくていいかどうかは、こっちが決めるから」", "スター先輩は少しの間黙った。それから「ごめん」と言った。", "「謝らなくていいよ」", "「でも、心配させた」", "「させていいよ。させてくれないと、そばにいられない」", "病院の廊下を看護師が歩く足音がして、消毒液の匂いが漂った。どこかで機械が規則的な音を立てていた。スター先輩は点滴の管をじっと見ていた。", "「怖かった」と彼女は言った。", "「何が」", "「今日は、量が多かったから。そしたら呼吸がおかしくなって。それで初めて、あ、死ぬかもって思った」", "「そう……」", "「死にたいわけじゃないのに、死ぬかもって思った」", "「うん」", "「怖かった」", "「そりゃ怖いよ」と僕は言った。「怖くて当たり前だよ」", "スター先輩はそれに対して何も言わなかった。ただ、少しだけ肩の力が抜けた気がした。", "「自分で呼んだの？ 救急車」", "「うん」", "「よかった」", "「……そう？」", "沈黙があった。長い沈黙だった。僕はパイプ椅子を引いて座り、スター先輩は天井を見ていた。廊下から、足音がして、遠ざかった。", "「楽になりたかった」と彼女は言った。「消えたかったわけじゃないんだけど、楽になる感覚が欲しかった」", "「うん」", "「それって、変？」", "スター先輩の濡れた瞳がこちらを見ていた。僕は一度、息を吐いた。", "「変じゃない、と思う」", "「でも、よくないことはわかってる」", "「うん」", "「じゃあ、なんでって聞かれたら、答えられない。なんでかわかんないけど、やっちゃうんだよ。気づいたらやっちゃってる」", "僕はそれに対して何も言えなかった。正直に言えば、何も言うことがなかった。わかる、とは言えなかった。大丈夫、とも言えなかった。かと言ってやめてほしい、とは言いたくなかった。やめてほしいと言えば、彼女は傷つくかもしれない。あるいはやめてほしいと言える立場に、僕はいないのかもしれない。どちらであっても、僕は声をかけることを恐れた。", "「ねえ」と彼女は言った。", "「なに」", "「なんで、来てくれるの」", "顔を上げた。僕は少し考えた。", "「そばにいたいから」", "「なんで」", "「好きだから」", "スター先輩は黙った。しばらくそのまま黙っていた。点滴の袋が、ゆっくりと満ちていた。", "「……好き、の意味が違くない？」とやがて言った。", "「違わないよ」", "「でも、そういうんじゃないでしょ」", "「そういうのも含まれてるかもしれないけど、それだけじゃないって言いたかっただけ」", "「……よくわかんない」", "「自分もよくわかんない」", "スター先輩は少し笑った。声にならない、口の端だけが動く笑い方だった。", "「正直だね」", "「かもね」", "「……ありがとう」", "その言葉は、以前の「ありがとう」とは少し違う響きがあった。", "「いてもいい？」", "「えっ？」", "「しばらく、ここにいてもいい？ 帰れって言われるまで」", "スター先輩は僕を見た。何かを測るような目だった。病院のベッドの白さと点滴の透明さの中で、彼女の目だけが色を持っていた。それから少しだけ目を細めて、「好きにして」と言った。僕はベットの脇まで、パイプ椅子を引いた。スター先輩はまた天井を向いた。それから一時間ほど、どちらも何も言わなかった。病院の時間は、外の時間よりゆっくり流れるような気がした。"]}, {"title": "", "paragraphs": ["退院したのは搬送から四日後のことだった。迎えに行った僕に、スター先輩は「荷物、これだけ」と小さな紙袋を持ち上げてみせた。病院の自動ドアを出ると、昼の光が白く、彼女は眩しそうに目を細めた。手首には新しい包帯が巻かれていた。長袖の袖を引き下ろす仕草がすっかり板についていた。", "帰りの電車で、彼女は窓の外を眺めたまま、ぽつりと言った。", "「ＯＤってさ、コスパ悪いよね」", "「……そう？」", "「だって、あんなに苦しいのに、一晩寝たら全部元通りじゃん。お金払って、しんどい思いして、結局何も変わんない。割に合わない」", "それが本心だったのか、僕を安心させるための言葉だったのか、いまでもわからない。ただ、そのときの彼女の横顔は、病室で見たときよりもずっと凪いでいた。僕は「うん」とだけ答えた。池袋が近づくにつれて、車内は少しずつ混み合い、彼女の肩が僕の腕に触れた。"]}, {"title": "", "paragraphs": ["それからしばらく、スター先輩は穏やかだった。カウンセリングの予約を取ったと言い、実際に一度だけ行った。ラーメン屋のバイトは休んでいた。部屋の空き缶は、僕が来るたびにほんの少しだけ減っていった。僕は相変わらず「暇？」と呼ばれ、呼ばれれば行き、ゲームをして、帰った。このまま少しずつ、良い方向へ向かっていくのだと、思いたかった。けれど、彼女の「コスパが悪い」は、やはり半分しか本当ではなかったのだと思う。", "ある夜、僕のスマホが震えた。深夜一時を過ぎていた。画面には「今から死にまーす」という、たった八文字が表示されていた。続けて「日和ったわ」と届いた。僕は上着だけ掴んで家を飛び出したが、電車はもう動いていなかった。結局、朝までどうすることもできず、始発を待って彼女の部屋に向かった。扉を開けた彼女は思いのほか普通の顔をしていた。ただ、顔色だけが紙のように白かった。「ごめん」と彼女は言った。僕は「うん」と言った。それ以上の言葉を、僕は持っていなかった。責める資格も、慰める術も、僕にはなかった。そしてその翌日、彼女は熱を出した。", "あとで聞いた話では、薬のせいで体が弱っていたところに、季節の変わり目の冷えが重なったのだという。クリニックで処方された薬は効かず、数日後に再診へ行き、帰りにハチミツ入りの喉飴を握って戻ってきた。彼女はそれを枕元に置き、袋ごと僕に投げてよこした。", "「あげる。業の塊だよ」", "僕はそれを受け取って、ポケットにしまった。氷嚢を替え、水を飲ませ、散らかった床の空き缶を一つずつ拾った。彼女が眠ったあとの静けさの中で、自分が何をしているのか、ふと考えた。彼女のためなのか。それともこの部屋にいる理由が欲しいだけなのか。どちらなのかは結局、わからない。"]}, {"title": "", "paragraphs": ["少し熱が引いた午後、スター先輩はベッドに起き上がり、枕元に置いてあったゲームコントローラーを引き寄せた。", "テレビに繋がれたゲーム機が、静かに起動した。", "「テトリスやろ」と彼女は言った。", "「体調悪いんじゃないの」", "「暇なんだよ」", "断る理由もなかったので、僕は床に積まれたスナック菓子の空袋を払いのけて胡座をかき、二つ目のコントローラーを拾い上げた。スター先輩はマイクポップコーンの袋を一つ取り出してきた。電子レンジで温めたばかりらしく、まだほかほかと湯気が立ち、バターの香りが部屋に広がった。", "「マイクポップコーンってさ、すごくいいんだよ」と彼女は言った。", "「そう」", "「食物繊維がめちゃくちゃ取れるんだよ。しかも量が多いから満足感がすごいし、カロリーもそんなに高くないし、完全食に近いと思う」", "「完全食」", "「完全食。これだけ食べてれば生きていける」", "「生きていけないと思うけど」", "「うるさい」と彼女は言って、一粒口に放り込んだ。それからゲームを起動させた。", "スター先輩のテトリスは、異様なほど速かった。序盤から手が止まらず、次々に出現するブロックが、降ってくるたびに指が吸い寄せられるように動いた。迷いがなかった。ネクストウィンドウの先まで完全に予測しているかのように、ガガガッと激しいハードドロップの音が室内に響く。凸型のＴミノを狭い隙間に滑り込ませて鋭く反転させる『Ｔスピン』。そして右端の一列だけを綺麗に開けた盤面に、待ち構えていた長いＩミノを突き刺す４列同時消しの『テトリス』。彼女が息もつかせぬコンボでラインを消し去るたび、画面が鮮やかにフラッシュした。コントローラーを握る手つきが、他のどんな場面の彼女とも違って、確信に満ちていた。それに引き換え、僕のフィールドは無惨だった。焦りから置きミスを連発し、二度と埋められない『穴』を残したまま、ブロックはみるみるうちに積み上がっていく。さらに彼女がテトリスを決めるたびに送り込まれるお邪魔ブロックが、僕のフィールドを下から容赦なく押し上げた。窒息寸前のデッドラインを示す警告音がせわしなく鳴り響き、一分も経たないうちに画面がブロックで埋め尽くされた。ゲームオーバーだった。", "「遅い」とスター先輩は言った。画面に視線を固定したまま、ポップコーンをもう一粒口に入れた。", "「速すぎるんだよ」", "「集中してないから崩れるんでしょ。ちゃんと二手先まで考えてる？」", "「考えてるよ」", "「考えてないじゃん、今のライン」", "僕は反論できなかった。スター先輩はそのまま一人でしばらく続け、高得点を叩き出して、それからようやくこちらを向いた。", "「マリオカートもやる？」", "「負けるから嫌だよ」", "「やろう」", "彼女はもう半分以上空になったポップコーンの袋を膝に置いて、慣れた手つきで画面をスクロールさせ、難解なテクニカルコースを選んだ。", "結果は案の定だった。カウントダウンのシグナルが青に変わった瞬間、彼女のマシンだけが鋭いエキゾーストノートを響かせて飛び出した。ぐうの音も出ない完璧なロケットスタート。スター先輩は序盤から当たり前のように先頭集団に食い込んだ。ヘアピンカーブの手前で車体を深く傾け、タイヤから火花を散らしながらインコースのギリギリを攻める。ドリフトからのミニターボを狂いなく繋ぎ、瞬く間に単独首位へと躍り出た。アイテムの使い方も信じられないほど的確だった。背後から迫る追尾型の攻撃アイテムを、カートの後ろに引きずった防御アイテムでパシリと鮮やかに相殺する。そして最終ラップ、ここ一番という勝負どころ。彼女は手元に温存していたダッシュアイテムを点火した。本来なら泥濘に足を取られて減速するはずの荒地を、凄まじいスピードで突っ切るショートカット。その果敢なライン取りのタイミングは、彼女の感覚に完全に染みついていた。そして敵の追随を一切許さない独走状態のまま、彼女はチェッカーフラッグをくぐり、圧倒的な一位でゴールした。", "「また負けた」", "「当たり前でしょ」", "「なんでそんなに強いの」", "スター先輩はポップコーンを一粒つまみながら、少し考えるような顔をした。", "「暇なときゲームしかすることないから」", "その横顔に、得意そうな色がわずかに混じっていた。ゲームをしているときのスター先輩は、どこか別の生き物みたいだった。ひどい部屋の散らかりも、眠れない永遠のような夜も、胸に空いた虚しい穴も、そのあいだだけは遠のいているような気がした。少なくとも、僕にはそう見えた。そして僕は、そう見えることに対して純粋に喜んでいた。彼女が何かに没頭しているとき、僕はその中に無条件にいることができた。ゲームで大敗していても、彼女の中にいることこそが、僕にとっては何よりも大切なのではないかと思うようになった。そしてそれはある意味では、間違っていなかった。"]}, {"title": "", "paragraphs": ["日が傾いてきた頃、僕は荷物をまとめた。空き缶の間を縫うように歩いて、鞄を拾い上げた。", "「じゃあ、帰るから」", "扉に手をかけると、背後で布団が動く気配がした。", "「……ありがと」", "振り返ると、スター先輩がこちらを見ていた。相変わらず髪は乱れ、頬はまだ赤い。それでも背筋を伸ばして、彼女はまっすぐにこちらを見ていた。", "「えっ？」", "「ありがとう」", "二度目のそれは、一度目よりもわずかに大きかった。珍しく目を見て、感謝を言っていた。スター先輩は感謝を述べるとき、いつも恥ずかしがって目を逸らしてしまう癖がある。視線が床や窓の方へふらふらと逃げて、言葉だけが宙に残る。それがいつものスター先輩だった。", "「ちゃんと言えたね」", "僕がからかうように言うと、彼女は「うるさい」と吐き捨て、布団にくるまり、背中を向けてしまった。", "毛布の端が額まで引き上げられ、黒髪だけが無邪気にはみ出している。", "「じゃあ、お大事に」", "手を振って扉から出ようとすると、布団がわずかにずれた。スター先輩がちらりとこちらを見て、それから小さく手を振り返した。うるうるとした目だった。熱のせいかもしれないし、そうでないのかもしれない。どちらとも判断する前に、布団はまた閉じた。僕は心の中で微笑みながら、スター先輩の部屋を後にした。廊下に出ると、悪臭がすっと遠のいた。階段を下り、マンションの自動ドアをくぐると、夜風が頬に当たった。明日には少し良くなっているだろうと、そう思っていた。疑いもせずに、そう思っていた。しかしその翌日、スター先輩は首を吊った。あの、ゴツゴツとした首輪で。"]}, {"title": "", "paragraphs": ["首輪を買った日のことを、僕は何度も思い返している。クズ男と別れて、しばらく経ったときのことだった。ある日突然、スター先輩から「デートに連れて行って」という突拍子もない連絡が送られてきたのだ。僕が驚いてどういうことか尋ねると、彼女はしばらく既読をつけたまま沈黙し、それからぽつりと「誰かと一緒にいたい気分なの」とだけ返した。僕がはぁと送ると、「買いたいものがあるからなんでも買えるところに連れて行って」と彼女は返した。正直、彼女が何を思ってこのような連絡をしてきたのか、僕には皆目見当もつかなかった。しかし失恋の直後だったこともあり、下手に感情を逆撫でするのもよくないと思った。だから、僕は彼女を慰める意味でも、とりあえず近場でなんでもありそうなホームセンターに向かうことにした。", "ホームセンターは街外れの丘の上にあった。僕はスター先輩を自転車の後ろに乗せて、丘を一気に駆け上がった。真夏だったこともあり、ペダルを一回漕ぐたびに、額から汗が吹き出た。スター先輩は僕の腰に手を回しながら、頑張ってーと感情のこもってないエールを送り続けている。自転車の車輪はパリパリと音を立てながら路上に落ちた蝉の死骸を踏み潰している。街路樹にとまった蝉たちは、仲間の残骸に咽び泣くようにおどろおどろしく鳴いている。僕はペダルを漕ぎながら、なんだか青春映画みたいだなと思った。青春映画というものには、不思議な嘘くさい澄み切り方がある。登場人物たちがどれほど傷ついても、画面は美しく、音楽は甘く、時間は光の中でゆっくり流れる。実際の青春はもっと汗臭くて、もっとぐじゃぐじゃで、もっと意味不明だ。でも、あの瞬間だけは、本当に映画みたいだと思った。僕の背中に手を回したスター先輩と、踏み潰される蝉の死骸と、鳴き続ける蝉たちと、真夏の坂道。なんだかあまりにも出来上がっていて、この場面はあとで絶対に思い出すやつだと、その瞬間にわかった。"]}, {"title": "", "paragraphs": ["ホームセンターは休日ということもあり、家族連れで混雑していた。自転車を駐輪し、店内に入ると冷房のひんやりとした風が頬をかすめた。蛍光灯の乾いた光がスター先輩の焼けた肌を照らし、資材コーナーの切り立ての木材の香りが鼻腔をくすぐった。季節の温度から切り離された均質な明るさが、金属棚に並ぶ商品を無機質に照らし、粉塵を含んだコンクリートの床が靴底に薄くざらついた感触を残した。あまりホームセンターに来たことがないのか、スター先輩はその巨大な空間をぐるっと一周見回してから、目についた売り場を物色し始めた。何十種類もある除草剤をまるで工芸品でも鑑賞するみたいにじっと眺め、アウトドア用品を見つけると、アクセサリーを吟味するみたいに一つひとつ手に取って時折、振り回し、金具や工具の売り場を見つけると、ハンマーどこ？と辺りをしきりに見回した。", "「ハンマー使って何するの？」", "「ＤＩＹ」", "「できるの？」", "「わかんない。でも、棚とか作ったら部屋オシャレになりそうだし」", "「オシャレする前に、綺麗にしようね、あの汚部屋」", "「うるさい」", "「掃除用具は向こうだよ？」", "「あーもう、うるさい」", "僕が背を向けて掃除用具を探しに行こうとすると、彼女は僕の腕をぎゅっと引っ張って、引き留めた。そしてそのまま彼女は、売り場の奥へとずんずん歩いていった。特にこれといって目的地があるようには見えなかったが、足取りだけは確かだった。", "ペット用品のコーナーは、資材売り場と、防虫剤の棚に挟まれたかたちで、ひっそりと存在していた。犬や猫の写真が笑顔でパッケージを飾り、カラフルなおもちゃや、大小さまざまなゲージが所狭しと陳列されていた。しかしスター先輩は立ち止まることなく、その通路をゆっくりと歩き進んだ。フードコーナーを通り抜けると、壁際に首輪とリードの棚があった。スター先輩はそこで足を止めると、しゃがみ込み、指先で一つひとつの首輪を撫でていった。革の縫い目をなぞり、金具を指で弾いた。前髪の隙間からのぞく瞳はうつろで、首輪よりもはるか遠くをとらえているように見えた。", "「これ、どう思う」", "振り返りもせずにそう言って、彼女は細いナイロン製の首輪を持ち上げた。淡いピンク色で、小さな鈴がついている首輪だった。揺れるたびにかすかな音が空気に混じった。僕は一歩距離を詰めて、それを覗き込んだ。", "「……ちょっと派手すぎると思う」", "僕の返答に、スター先輩は返事をしなかった。ただ、指先で鈴をつまみ、鳴らさないように押さえ込んでから、そっと棚へ戻した。そして代わりに手に取ったのは、黒い革の首輪だった。幅が広く、鋲が打ち込まれている。光沢は鈍く、凶暴な狂犬が首に巻き付けているようなものだった、彼女はそれを掌に乗せ、しばらく動かなかった。何かを測るように、何かを見定めるように目だけが静かに動いていた。", "「重いね」", "彼女は独り言のように言って、今度は腕に巻きつけた。革が擦れる低い音がして、金具が皮膚に当たった。先輩の手首は細く、首輪の無骨さがかえって際立った。僕はその様子を見ていることに、微かな居心地の悪さを覚えた。視線の置き場が見つからず、隣の棚に並ぶドッグフードの袋へと静かに目を移した。乾燥した肉の匂いが、わずかに鼻についた。", "「試してみたいんだけど」", "「試す？」", "「試着」", "彼女はそう言って、勢いよく立ち上がった。僕が「犬なんていなくない？」と声を上げると、彼女は「犬はここにいるでしょ」と言って、首輪を腕に巻いたまま、入り口にあるレジへと歩き出した。", "「どういうこと？　犬飼ってないよね？」", "「飼ってないよ」", "「じゃあ、どうして買うの？」", "「これから飼うかもしれないでしょ？」", "「飼うの？　っていうか、飼えるの？」", "「馬鹿にしてる？」", "僕はいやと言って、立ち止まった。すると彼女は一歩二歩、歩いてから唐突に立ち止まり、勢いよくこちらに振り向いてから突然、叫んだ。", "「ああーー！！　誰かの犬になりたいーー！！」", "あまりの声の大きさに、周囲にいた客たちが一斉に振り向いた。僕がえっと声を上げると、彼女は腕に巻いていた無骨な首輪を取り外し、首に巻き付けた。そして再び、肺いっぱいに空気を吸い込んで、天を突き破るような大声で叫んだ。", "「頭、撫でなででしてもらいたいーー！！」", "目の前にいた僕と、周囲にいた客たちが一歩退いた。", "「お手して、おかわりして、えらいえらいって言われたい－－！！」", "「……何してるの？」", "恐る恐る声をかけると、彼女はきりっと澄んだ瞳でこちらを見つめた。", "「犬になりたいの」", "「は？」", "「誰かの犬になりたいの、切実に」", "「犬？」", "「呼ばれたら行って、撫でられて、それで終わるような、とってもかわいいやつになりたいの」", "「はあ」", "「だから、首輪を買うの」", "そう言うと、スター先輩はごつごつとした首輪をこちらに向かって執拗に見せつけた。", "「子どもじゃないんだからさ……」", "僕が諭すように言うと、途端にスター先輩の目が暗く沈んだ。まるで、すとんと黒い幕が降りたかのような暗転の仕方だった。", "「……わからずや」", "僕がえっと呟くと、次の瞬間、スター先輩は手にしていた首輪を拳に巻きつけて、勢いよく僕の頬を殴った。鈍い衝撃と、首輪のひんやりとした感触が頬に触れた。痛みはなかった。というよりも硬いものが押し当てられたような冷たい感触が残った。僕は頬に手を当てながら、呆然としていた。一方彼女は何事もなかったように、そそくさと歩き出してしまった。歩きながら彼女はもう一度、拳に巻いた首輪を眺めた。五秒ほど、彼女は首輪をじっと凝視していた。それから突然、何かに思い当たったかのように立ち止まり、今度はリードの棚に目をやった。フックには吊るされたリードが何十本と垂れ下がっていた。布製のものや、革製のもの、伸縮するタイプのものなど、さまざまな種類のリードがあった。スター先輩はその中から細い革製のリードを一本だけ引き抜き、首輪の金具に繋げた。リードの端を持って、軽く引っ張ると、金具がかちりと鳴った。", "「これも買う」", "「えっ……何に使うの」", "「散歩」", "「誰の」", "「私の」", "彼女は端をぶらりと垂らしたまま、少しだけ首を傾けた。かすかに目が細くなった。笑っているのか、何かを考えているのか判別できない目だった。「じゃあ、散歩しよ」\\", "&#x20;　彼女はリードの端を僕に差し出した。\\", "&#x20;「嫌だよ」\\", "&#x20;「なんで」\\", "&#x20;「なんで、じゃなくて」\\", "&#x20;「持ってよ」\\", "&#x20;「持たない」\\", "&#x20;「持って」\\", "&#x20;「持たない」\\", "&#x20;「持ってくれたら帰る」\\", "&#x20;「帰らなくていいから」", "押し問答を三分ほど続けた結果、僕はリードを持つことになった。僕がもういいよ、好きにすればと観念すると、スター先輩はふふっと満面の笑みを見せてから、細い首に首輪を巻いた。そしてリードの端をこちらに向かって差し出した。", "「楽しい」", "「楽しくないよ」", "「共犯だ」", "「これ、側から見たら僕が不審者だからね？　わかってる？」", "「いいじゃん、不審者。お似合いだよ」", "「……はあ」", "結局僕はリードの端を受け取り、スター先輩の散歩をすることになった。ペット用品のコーナーを出ると、スター先輩はホームセンターの広い通路をゆっくりと歩いた。周囲の客たちは僕たちの姿を見かけると、目を見開き、それから一歩二歩、後退りをした。店員たちも客と同じように目を見開き、遠巻きに視線を送ってきたが、スター先輩は一切気にしなかった。むしろ彼女は背筋をすっと伸ばして、堂々と歩いていた。こうなるともうどっちが飼い主かわからなかった。", "「ねえ」", "「なに」", "「引っ張って」", "「は？　引っ張らないよ」", "「少しだけ」", "「絶対、嫌だ」", "僕が大きく首を振ると、スター先輩はつまらなそうに口を尖らせてから、「じゃあ撫でて」と言った。", "「撫でない」", "「えー」", "「ここ、ホームセンターだから」", "「関係ないでしょ」", "「関係あるでしょ」", "彼女がぷうと頬を膨らませると、リードがふわりと揺れた。僕は恥ずかしさで赤面していたが、スター先輩は一切顔色を変えなかった。それでも明らかにテンションが高いことは見てとれた。まるでこのままスキップでもしそうなテンションだった。通路の角を曲がったところで、小学生くらいの男の子とすれ違った。男の子はスター先輩の首元を見上げて、目をまん丸にして固まった。それから僕の顔を二度見し、こちらにだけ聞こえる適度な声量でやばと吐き捨て、母親のもとへダッシュして行った。", "「子供がびっくりしてたよ」", "「かわいい」", "「かわいくないよ。死ぬほど迷惑だよ」", "「でも犬を見てびっくりする子どもって可愛くない？」", "「犬じゃないでしょ」", "「いや、なれるかもよ」", "「なれないから」", "スター先輩は少し笑った。声には出さない、口の端だけがわずかに上がる、彼女特有の笑い方だった。", "工具売り場の前を通り過ぎ、ガーデニングコーナーを抜け、季節外れの除雪用品が並ぶ棚の前を歩いた。冷房の風が通路を流れ、スター先輩の前髪を揺らした。彼女はとくに何かを見るわけでもなく、ただ歩いていた。けれど歩き方は、来たときとどこか違った。さっきまでの足取りだけが確かな歩き方とは違う。今は少しだけ、力が抜けていた。しばらく歩いてから、スター先輩は急に立ち止まった。", "「ねえ」", "「なに」", "「ちゃんと引いてよ、リード」", "「なんで、急に」", "「いいから」", "仕方なく、ほんの少しだけリードを引いた。革が張って、金具がかちりと鳴った。スター先輩は一瞬だけ目を瞑った。それから小さく息を吐いた。", "「もう一回」", "「……」", "「もう一回だけ」", "僕はもう一度、少しだけ引いた。かちり、と首輪が鳴った。スター先輩はそのまま動かなかった。首輪の金具が蛍光灯の光を鈍く反射していた。何秒かそうしていると、彼女はゆっくりと目を開けた。", "「……なんか落ち着く」", "「……そう」", "「なんでだろ」", "「さあ」", "「わかんないけど、落ち着く」", "僕はそれ以上、何も言わなかった。彼女も、何も言わなかった。リードを少し緩めると、スター先輩はまた歩き出した。今度は何も要求しなかった。ただ並んで、売り場の端まで歩いた。レジの前まで来ると、スター先輩は自分で首輪を外した。外した首輪とリードを一緒に持ち、バーコードを店員に差し出した。店員は首輪とリードを、何も言わずに袋に入れた。こんな奇行を見ても、動じないのだからプロだなと思った。"]}, {"title": "", "paragraphs": ["店の外に出ると、夏の熱気が一気に押し寄せてきた。", "「暑い」", "彼女は眩しそうに目を細めてから、袋を脇に抱えた。", "「帰ろ」", "「うん」", "駐輪場まで歩いて、自転車を引き出した。スター先輩は黙って荷台に腰を下ろし、また僕の腰に手を回した。来るときより、少しだけ力が強かった。丘を下り始めると、風が吹いた。蝉の声が遠ざかり、アスファルトの照り返しが脚をじりじりと焼いた。スター先輩は後ろで何も言わなかった。ペダルを踏むごとに、蝉の死骸を踏む音がして、街路樹が僕たちの額に影を落とした。", "坂の中腹あたりで、彼女がぽつりと言った。", "「ありがとうね」", "「べつに、なにもしてないけど」", "「リード、持ってくれたじゃん」", "「嫌々だけど」", "「それでも」", "風がまた吹いて、彼女の前髪が僕の背中を掠めた。", "「犬、飼うの？」と僕は聞いた。", "「どうだろ」と彼女は答えた。「でも、首輪はある」", "「それじゃあ使い道ないじゃん」", "「あるよ」", "「何に使うの」", "「わかんない。でも、あるといいかなって」", "なんとなく、それ以上は聞かなかった。", "自転車は坂を下り続けた。風が吹くたびに、スター先輩の前髪が僕の背中を掠めた。蝉の声が遠ざかり、街の音が少しずつ戻ってきた。アスファルトに咲く花が、陽炎でゆらいでいた。遠くの方で烏が二羽飛んでいた。自転車の籠の中には首輪の入ったレジ袋が収められていた。車輪が段差を踏むたびにレジ袋は形を崩し、中からぎらりと首輪をのぞかせた。彼女は段差で体が横に揺れても何も言わなかった。僕も体が触れ合っても何も言わなかった。", "やがて坂が終わり、道が平らになった。その瞬間、潮が引くみたいに夏の情景が遠ざかっていった。髪をなびかせる乾いた風も、蝉たちの悲鳴に似た鳴き声も、アスファルトに漂う陽炎も、何もかもが僕の体から遠ざかっていった。静かだと思った。美しいと思った。だけどそんな胸の高鳴りは、すぐに消えてしまった。盛りを過ぎた夏が遠ざかっていく。かちり、と乾いた音が耳に触れる。その瞬間、スター先輩の手がゆっくりと腰から離れた。"]}], "en": "I Wanted to Be Someone’s Dog.", "summary": "散らかった部屋と、首輪を買った夏。", "tag": "喪失"}, {"id": "s6", "group": "語れ、さもなくば死ね", "title": "語れ、さもなくば死ね", "chapters": [{"title": "第一話：お前が死んだら、俺も死ぬよ。", "paragraphs": ["Speak or die", "プロローグ", "その夜は若さだけで乗り越えるにはあまりにも長い夜だった。十二月の乾いた風が大地を吹き荒らし、幾つかの星たちが凍てつくような光で僕たちを睨んでいた。そんな夜に僕たちは旅に出た。凡庸で、未熟で、無知だった僕たちはその夜を半ば強引に、若さだけで乗り切った。それが僕たちにとってよいことだったのかどうかは、今でもよくわからない。それでも僕はあの夜のことを今でも事あるごとに思い返す。そしてそこで交わしたいくつもの言葉に、思いを馳せる。そのたびに僕の心は鈍く痛むけれど、それでも僕は思い出すという行為を決してやめたりはしない。", "死とは何か。", "ずっと昔一人の友人にそう尋ねられたことがある。あれはまだ、僕たちが二十歳になったばかりの頃で、世界のあらゆる問いに対して、答えを持たないことを許せていた時期だった。その友人──キズキがどのような表情と声音で、その問いを放ったのかはもう思い出せない。しかしキズキが唐突にそういう質問をする人間だったことだけは、はっきりと覚えている。何の脈絡もなく、まるで天気の話でもするみたいに、生死について尋ねてくるのだ。そのくせ答えを急かすことはなく、じっとこちらの言葉を待っている。その静かな圧力に、僕はいつも気圧してしまった。僕はキズキの問いかけに、少し迷ってから、暗く、冷たく、孤独な場所だと答えた。特に根拠があったわけではない。ただ漠然と、死とはそういう光の届かない場所であり、誰の声も届かない場所であり、そういう手触りをしているものだと当時僕は信じていた。", "キズキは僕の答えを聞くと、にこやかに笑ってから、ビールを一気に飲み、息を吐いた。その笑い方はいつも通り屈託がなく、まるで僕の答えの凡庸さをそっと包み込んでくれているようだった。グラスに残った泡が、彼の唇の端にわずかに残っていた。隣のテーブルに座った客の談笑が心地よく響いていた。キズキはこちらを射止めるようにじっと見つめると、少し間を置いてから、含みを帯びた声音で、そっとこう言った。", "「お前が死んだら、俺も死ぬよ」", "その言葉を僕は長らく軽口の一種として処理していた。友情の誇張表現、若者らしい大仰な愛情表現。そう思い込むことで、もしかしたら僕はその言葉の真の重さから目を逸らしていたのかもしれない。しかしキズキはその五日後に、手首を切って死んだ。遺書も、予告もなく唐突にだ。それがこの物語のすべての始まりであり、同時に終わりでもある。そして僕はその言葉が何を意味していたのかという問いを十年もの間、彷徨い続けることになる。", "「お前が死んだら、俺も死ぬよ」", "静かなバーの店内に、その声は思いのほか大きく広がる。溶けかけた氷が、琥珀色のウイスキーをゆっくりと濁らせていく。仄暗く、乾いた店内。天井のランプがテーブルに光の輪を落とし、その輪の縁で影が揺れる。隣に座るトヲルは、指先でグラスの結露をなぞると、きつい締め付けから逃れるようにネクタイを少し緩めた。開いた襟元から覗く首筋に、ランプの仄かな明かりが落ちる。頸を這うように広がった太い血管が、彼の苦労と底知れぬ疲労を如実に現している。僕はロックグラスに目を落とすと、静かに、しかし確かな決意を込めて沈黙を破った。", "「仕事の方は最近どうなの？」", "どこか遠くを見つめるような視線が戻り、彼は困ったように笑う。", "「年中激務だよ。昨日も同僚がひとり過労で倒れた」", "「……そう」", "言葉のあとに、重苦しい沈黙が落ちる。グラスの底の氷がまたひとつ音を立てて沈んでいく。僕はその音を聞きながら、トヲルの顔をそれとなく観察していった。目の下には薄い隈が浮かび、頬もいくらか痩けて見える。仕事のせいだけではないだろう──そう直感した。", "「近くにいたやつが救急車を呼ぼうとしたんだ。そうしたら上司が止めた。なんて言ったと思う？」", "「なんて言ったの？」", "「『そいつは睡眠不足なんだ。少しそこで眠らせとけ』ってよ。おかしな奴らだと思わないか？」", "呆れて笑うトヲルを、僕はじっと見つめた。", "「前にも言ったけど、そんな会社やめた方がいい。どうしてあの会社に、そこまでこだわるんだ？」", "「辞めようにもやめられないんだよ。色々と立て込んでいるからさ」", "今日、トヲルは約束の時間から二時間遅れてこのバーに現れた。最近残業続きだと、彼は笑いながら言い訳めいたことを口にしていた。", "「でも、そんな会社にいたら心と体が壊れるのは時間の問題だ」", "さとすように言葉を重ねると、トヲルはグラスを握りながら首を振った。", "「周りに迷惑はかけられないんだよ。同僚だって同じように苦労してるんだ。自分だけ辞めるのは気が引ける」", "そう言い残し、グラスに残ったギムレットをぐっと飲み干した。", "「気持ちはわかる。でも他人の心配をするのは自分がまともなときにしろよ。君は今、苦しんでいるんだ。そんな状態で他人の心配をする必要はない」", "「他人事だからそう言えるんだ。そんなに簡単な話じゃない」", "トヲルはポケットから煙草を取り出し、口に咥えた。ライターで火をつけると、小さな炎が一瞬、彼の顔を橙色に照らし出した。", "「同じように苦労してきた同僚の姿を、ずっと見てきたんだ。辛いのは俺だけじゃない。それなのに俺だけ逃げるなんて、そんなこと許されない」", "煙草を口から離し、静かに煙を吐く。白い煙は宙に浮かんだあと、ゆるやかに消えていった。", "「でも、君のことが心配だ。転職は気が向いたらでいい。だけど辛かったり苦しかったりすることがあるなら、遠慮なく伝えてほしい。相談にも乗るし、手助けもする。とにかく、僕はもう大切なものを失いたくないんだ」", "トヲルは小さく息を吐き、煙草を灰皿に置いた。", "「もう十年か」", "「キズキが生きていたら、三十だよ。僕たちも、随分と歳をとった」", "彼の表情が一瞬だけ、何かに触れられたように揺らいだ。", "「アイツ、最期俺になんて言ったと思う？」", "「さあ、なんて？」", "「またどこかで、だよ」", "「またどこかで……」", "その言葉を、僕は口の中で反芻した。キズキは大学時代の友人だった。もともとはトヲルとキズキが海辺の街にある同じ高校の同級生で、僕は大学の陽のあたる中庭で、トヲルの気まぐれな引き合わせによって彼と知り合ったのだ。トヲルが「変な奴だけどいい奴だからさ」と缶コーヒーを片手に雑に紹介したとき、キズキは少し眩しそうに目を細め、照れくさそうに片眉を上げて笑っていた。あれからもう十年という月日が過ぎてしまったというのに、あの初夏の光と影が交差していた出会いの日の光景だけは、まるで昨日のことのように鮮明に、僕の記憶の底に熱を持って残っている。青臭い草の匂い、ぬるい風、そして彼の少し高めの話し声。そのどれもが、鮮やかな色合いを保ったまま、今も胸の奥で再現できる。", "「どう思う？」", "「どう思うって……」", "しばらく、その言葉について思いを巡らせた。", "「そういえばキズキ、よく『さよなら』の代わりに『また後で』って言ってたよね」", "「ああ、確かに」", "「ずっと前に聞いたんだよ。どうして『さよなら』じゃなくて『また後で』なのかって」", "「なんて答えたんだ？」", "僕は息をついた。今でもキズキの眩しい笑顔を忘れられない。", "「『さよなら』が最期の言葉になったら寂しいだろう、ってさ」", "溶けた氷がグラスの底でからんと音を立てた。トヲルは深くため息をついた。", "「なんだか、今でもまたどこかでアイツに会えるような気がするんだよ」", "「それは僕も同じだよ」", "またどこかで。何度聞いても、不思議な響きの言葉だった。", "「今でも時々アイツの夢を見るんだよ。三人でハワイに行ったときの夢をさ」", "「懐かしいな。綺麗なビーチだった」", "「ああ。アイツも楽しそうにしてた」", "大学の夏休み、僕たちは二、三日分の着替えをバックパックに詰め込み、期限の切れかかったパスポートを握りしめてハワイへと渡った。機内を抜けると、南国特有の湿った熱気と、甘い花の香りが僕たちの肌を包み込んだ。日差しは針で刺すようにちくちくと痛く、青空に鋭く刺さる太陽の眩しさに、僕は何度も目を細めた。ホテルにチェックインすると、僕たちは容赦のない日差しから逃れるように、潮の匂いが満ちるエメラルドグリーンの海へと潜り込み、波に身を任せていた。キズキは誰よりも無邪気にはしゃいでいて、白い歯をこぼしながら砂浜を走り回り、文法もあやふやな片言の英語と身振りだけで、現地のサーファーやビーチ沿いのショップの店員たちと次々に打ち解けていった。彼が大きな笑い声を上げると、まるで言葉の壁なんて最初からなかったかのように、周囲の人々もつられて笑顔になった。その姿は数多の惑星を、あっという間に輪の中へ引き入れる太陽を彷彿とさせた。", "「本当に、突然死んだよね」", "トヲルは頷き、ギムレットを口にした。", "「最期に見たときも元気だったんだよな？」", "「うん。居酒屋で飲んだあと、一緒に房総半島をドライブしたんだよ。最後まで楽しそうだった」", "「キズキらしいな」", "死ぬ理由など、どこを探しても存在しないはずだった。それなのにキズキはあのドライブからわずか五日後、冷たく澄んだ空気に包まれた長野の山奥へと一人で向かった。そしてツタの絡まる廃業したホテルの薄暗い浴槽の中で、冷たい刃物を自分の皮膚へと深く滑らせ、浴槽を赤く染め上げた。", "「アイツに会いたいよ」", "心の底から漏れたような声だった。僕は何も言わずに頷き、カウンターの上に置かれた重みのあるロックグラスを持ち上げて、静かに手首を傾けた。からんと低い氷の音を立てて、琥珀色の液体がグラスの底でゆっくりと渦を巻いていく。キズキと出会い、同じ空気を吸い、他愛もないことで笑い転げていたあの二年間は、僕の人生において後にも先にも、何ものにも代えがたい光に満ちた日々だった。それはあらゆる瞬間が鮮烈な色彩を帯びていて、世界が僕たちのために回っているのだと、本気で信じることができていた時期だった。しかしあの眩しい季節は、突如終わりを告げた。僕たちの世界を刻んでいた時計の針は、キズキが廃ホテルの冷たい浴槽で息絶えたまさにあの瞬間から、一秒たりとも前へは進んでいなかった。そして僕たちの心は、時が止まったままの部屋の中で、古びたレコードの針が同じ溝をなぞり続けるように、あの日の記憶を永遠に辿り続けているのだった。", "「君が死んだら、僕も死ぬよ」", "「え……？」", "トヲルがひどく驚いたように僕を見つめた。", "「どうしてそんなことを言うんだよ」", "真剣で、だけど切実な声だった。僕はトヲルの暗く、澱んだ瞳をじっと見つめた。", "「君のことが心配なんだよ。君は最近、まともに鏡すら見てないだろ？」", "「どうしてそう思う？」", "「ひどい顔をしてるからだよ。今にも手首を切って死にそうな顔をしてる」", "吐き捨てるように言うと、トヲルは驚いたのか悲しんだのか、曖昧な表情を浮かべた。そして苦しそうに声を出した。", "「仮に死ぬとしても、手首を切って死ぬようなまねはしないよ」", "「それは君に、まともな理性があったらの話だ」", "「俺にまともな理性がないというのか？」", "「ああ」", "はっきり答えると、トヲルはやりきれないように顔を歪め、ギムレットを飲み干した。キズキの通夜に似た、居心地の悪さだった。", "「とにかく、僕は本気だからね」", "目を離さずに告げると、トヲルは喉の奥で小さく息をつき、逃げるように視線を逸らした。僕は静寂を振り払うようにマスターへウイスキーを頼み、ポケットから取り出した煙草のフィルターを唇に挟んで火をつけた。ライターの小さな炎が闇を揺らし、立ち上る紫煙が目の前でゆらゆらと形を変えていく。煙の匂いを胸いっぱいに吸い込み、ゆっくりと吐き出すと意識が少しずつ現在のバーのカウンターから引き剥がされていった。グラスに注がれる琥珀色の液体と氷の澄んだ音を聞きながら、僕はキズキと一緒に過ごした、あの最後のドライブの記憶を、ひとつひとつ丁寧に手繰り寄せていった。"]}, {"title": "第二話：都内某所の居酒屋", "paragraphs": ["天井から吊るされた裸電球が、風に揺れながら、店の奥に集う客たちの輪郭を淡く照らしていた。僕とキズキは仕事帰りの会社員に挟まれるように、小さな机を囲んで腰を下ろしていた。テーブルには半分ほど減ったジンジャーエールと、泡の名残を残したビールのジョッキがある。キズキはメニューに目を落とすこともなく、焼き鳥の盛り合わせとビールを頼んだ。そして店員に向かって、憎悪とは無縁の悪魔的な微笑みを浮かべた。僕はその横顔をじっと見つめながら、テーブルの端に置かれた、分厚い文庫本にふと視線を留めた。", "「それ、新しい本？」", "僕が指差すと、キズキは「ああ、これ？」と軽く言って、本を手に取った。", "「掌の小説だよ。川端康成の」", "「たなごころの小説？」", "初めて耳にした小説だった。僕は本を受け取り、ぱらぱらとページを捲った。", "「原稿用紙五、六枚くらいの短編が多いんだ。だから、出先で読むのにちょうどいいんだよ」", "そう言うと、キズキはごくりとビールを飲んだ。僕は『掌の小説』を眺めながら、枝豆の塩漬けをつまんだ。", "「大体、何作品くらいあるの？」", "「数えたことないからな。でも、百篇以上はあると思うけど……」", "「百篇か、すごいね」", "枝豆の殻を捨てながらページを捲っていると、ふと見覚えのあるタイトルが目に飛び込んできた。", "「あっ、これって『化粧の天使達』？」", "驚いて声を上げると、キズキは僕が開いていたページを覗き込み、文章を目で追った。", "「ああ。そうだよ。よく知ってるな」", "「高校の教科書に載ってたんだよ。『掌の小説』のやつだったんだ」", "さらにページを捲ると、文章に線が引かれたページに行き当たった。", "「ここ、線が引いてあるね」", "指で示すと、キズキは「ああ、これか」と言って、その一文を読み上げた。", "「『別れる男に、花の名を一つは教えておきなさい。花は毎年必ず咲きます』──幽遠な文章だと思わないか？」", "僕はその言葉を、何度か頭の中で繰り返してみた。", "「確かに、綺麗な文章だね。だけど、なんでこの文章を？」", "僕が尋ねると、キズキは近くの店員につまみを頼みながら答えた。", "「なんか素敵じゃないか。好きな人に毎年思い出してもらうために、花の名前を教えるなんてさ」", "「ああ、確かに。日本人らしいね」", "「ほんと、素晴らしいよ」", "ジョッキを片手に、キズキはにこりと笑った。", "「にしても、悪いな。俺だけ酒飲んで」", "申し訳なさそうにキズキが言ったので、僕は首を振った。", "「仕方ないよ。僕は三月生まれなんだから。でも、あと少しの辛抱だ」", "ジンジャーエールを口に含むと、舌で炭酸が弾けた。十月生まれのキズキは二十歳。三月生まれの僕は、まだ十九歳だった。", "「キズキは、お酒、強い方なの？」", "僕が尋ねると、キズキは「そうだなぁ」と言って、ビールのグラスを揺らした。", "「まだあまり飲んでないからわからないけど、人並みには飲めると思うよ。少なくとも、一杯で顔が真っ赤になるタイプじゃないな」", "「お酒飲むと、やっぱり気分が良くなるの？」", "「まあ、それなりにな。満ち足りた気持ちになるっていうか、心地いい気分になるんだ」", "「心地いい気分……」", "その感覚を想像しながら、僕はジンジャーエールを飲んだ。ノンアルコールでは実感が湧かない。", "「まあ、お前もあとちょっとでわかるよ」", "「そうだね」", "そこで僕たちはテーブルに並んだ料理を見下ろした。寮の先輩に勧められたお店だったが、ここの焼き鳥は、期待以上に美味しかった。", "「そういえば、この前、トヲルと三人で観たあの映画、どうだった？」", "キズキに言われて、僕は一週間前に、キズキと一緒に観たとある映画を思い出した。", "「ああ、面白かったよ。何だか切ない話だったけどね」", "それは宇宙と地上に引き裂かれた男女の恋を描いたＳＦ映画だった。あまり世には知られていない作品なのだが、熱狂的なファンがいて、界隈では根強い人気のある作品だった。僕はその作品を一週間前の夜に、寮の共用テレビでキズキと一緒に観たのだ。", "「俺さ、あの映画、実はもう何十回も観てるんだよ」", "「そうなの？」", "「ああ。『たとえ世界の端と端に引き裂かれても、あなたと同じ星を見上げることができるのなら、私はそれだけで十分です』映画の冒頭の台詞だよ。なんか、ロマンチックだよな。同じ星を見上げるだけでいいなんてさ」", "それはヒロインが宇宙に旅立つ前に、主人公に託した台詞だった。だけど主人公は、いつしかその言葉を忘れてしまうのだ。", "「遠く離れた二人が、同じ星を見上げて想い合うんだ。『あの人も今、同じ星を見上げているかもしれない』って。でも地上に残った主人公は、いつからか他に好きな女の子を作って、星を見上げなくなる。ラストは悲劇的だったな。宇宙に飛び立った女の子は、燃料が尽きた宇宙船の中で、果てしない空腹と孤独に苛まれながら死んでいく。女の子が安らかに目を閉じる瞬間、その真っ黒な瞳にはひとつの星が映っていたんだ。あれはきっと、最期の最後まで女の子が主人公のことを想っていたことを表していたんだよ」", "キズキの話を聞いているうちに、僕はだんだんと映画の詳細を思い出してきた。あれは、本当に切ない映画だった。", "「そして映画は、死んでしまった女の子を乗せた宇宙船が、果てしない闇の中にぽつんと浮かんでいるカットで終わる。エンドロールの虚無感には宇宙的なものを感じたよ。まるで、宇宙にひとり放り出されたような気分だった。どこかの気取った批評家は、この映画のラストを憂鬱なバッドエンドだと酷評したらしいけど、俺はそうは思わない。この物語は愛の真実を語っているんだ。愛することの残酷さ。それを美しく、克明に描いた作品だと思う」", "愛することの残酷さ。キズキは、その言葉を強調した。", "「宇宙船の燃料が尽き果てても、主人公のことを想い続ける女の子の姿を観て、俺は思ったよ。想いとは、宇宙を直向きに突き進む光なんだって」", "「……光」", "「そして愛とは、尽き果てることのない人間の燃料なんだって」", "「燃料」", "キズキはその言葉に頷き、グラスのふちを指でなぞった。照明に照らされて、キズキの爪が滑らかに輝いた。", "「ちなみに、映画のキャッチコピーは『想いは音よりも、光よりも速いスピードで誰かのもとに届く』だった」", "「ああ、そうだったね」", "印象的なキャッチコピーだった。ヒロインの直向きな想いは、時間と空間を超えていたのだ。", "「でも、俺はこのキャッチコピーを見た時に思ったんだ。いくら音よりも、光よりも速いスピードで想いが届いたとしても、それを受け取ってくれる人がいなかったら、何の意味もないんじゃないかって」", "「まあ、そうだね」", "必ずしも、想いが届くとは限らない。この世界には、届かずして消えていった想いが、たくさんある。", "「俺さ、実はずっと前から好きな人がいるんだ」", "「えっ？」", "驚いて声を出すと、キズキはそれに頷き、グラスに入ったビールを口に含んだ。そして灰皿のふちを指でなぞって、頬杖をついた。", "「だけど、そこには絶望的な距離があった」", "「絶望的な距離？」", "僕が問うと、キズキは頬杖をついたまま、じっとこちらを見つめた。", "「それは宇宙と地上よりも遠い距離だよ」", "「宇宙と地上よりも遠い……」", "キズキはその言葉に頷き、沈黙の重さを確かめるみたいに黙った。僕もそれ以上は尋ねず、静かにジンジャーエールを飲んだ。絶望的な距離。それが一体、どれほどの距離なのか、僕にはわからなかった。", "「……でも、良かったよ」", "「えっ？」", "「いや、ほら。キズキって出会ったときから、あまり恋愛の話とか乗り気じゃなかったから。てっきり、そういうのには興味がないと思ってたんだ」", "「ああ……まあ、そうだな」", "思い出したように言いながら、キズキはもやしのナムルを箸で口に運んだ。", "「でも、そう思うとキズキはあんまり、自分の話しないよね」", "「そうか？」", "彼はわずかに眉を寄せた。指摘されて、初めて自覚したような表情だった。", "「ほら、恋愛に興味あったことだって知らなかったし」", "「まあ、そういえばそうか」", "キズキは頷き、箸を置いた。", "「どうして自分の話をしないの？」", "「難しい問いだな」", "キズキは少し考えてから、静かに言葉を続けた。", "「でも、基本的に俺は、相手が踏み込んでこない以上、自分からは踏み込まないようにしてるんだ」", "「踏み込まない？」", "「ああ。相手が自分に話題を振ってきたり、話しかけてきたら、それに対しては快く応じる。だけど、相手から話題を振ったり、話しかけない限りは、自分から積極的に話題を振ったり、話しかけたりはしない。俺はそういうスタンスで生きてるんだ」", "「受け身だね」", "「受け身といえば、そうだな」", "「でも、確かにキズキって自分から話題を振ることないよね」", "「ああ、言われてみれば」", "「それも受け身な生き方と関係があるってこと？」", "「そうとも言えるな。でも、人って自分の話しているときが一番気持ちいいだろ」", "「そうかな？」", "「そうだよ。自分の話をしたいから、他者の話に耳を傾ける。人は他者を慮るふりして、思った以上に利己的な生き物だよ」", "「僕はそうは思わないけどな」", "「心が綺麗なんだよ」", "キズキは微かに笑った。嘲るような笑みではなく、どこか遠いものを見つめるような、静かな笑みだった。", "「じゃあ、話は戻るけど、キズキは話しかけたい人がいても、自分からは話しかけないの？」", "「そういうことだな」", "彼はためらいなく頷いた。", "「ほら相手から来る場合は、何かしら自分に対して興味や関心があるわけだろ。話しかけようとしたのも、興味や関心があるわけで。だから、相手から来る分には、自分の存在が不快に思われる心配はない。だけど、逆の場合はそれがありうると思わないか。自分が話しかけたタイミングや、言い方が相手にとって不快に感じられるかもしれない。だって、話しかけた相手が必ずしも自分に対して興味や関心を持っているとは限らないわけだからさ」", "「でも、それは哀しい生き方じゃない？」", "「哀しい？」", "「だって、もしキズキがすごく話しかけたい相手がいたとしても、キズキ側からはアクションを起こさないわけでしょ？ それによってその人と仲良くなる機会を永遠に失ってしまうのは、あまりにも惜しいことだと思わない？」", "「まあ、それは一理あるな」", "キズキは一瞬、視線を落とした。", "「だけど、そこはもう諦めだよ」", "「諦め？」", "「この人とは縁がなかった。そう思って割り切るしかない。哀しい生き方ではあるけど、ある意味でそれは、俺にとっては大事な処世術でもあるんだ」", "「処世術」", "「もちろん、強欲に生きることもできる。だけど、俺は強欲に生きることで、誰かを傷つけたりはしたくないんだ」", "「たとえ、その大切な誰かとの接点を永遠に失うことになっても？」", "彼は静かに、けれどはっきりと頷いた。", "「ああ。もしそうなったら遠い星から、ひとりその人のことを見守るよ」", "「見守る、か……」", "その生き方に、どれほどの孤独が宿っているのか、僕はひとしきり思い耽った。", "「じゃあ、その好きな人のことも、そうやって見守ってるわけだ」", "僕が揶揄うように言うと、キズキはハッと顔を上げて、こちらを見つめた。それから少し目を逸らして、箸を置いた。", "「そうだな。でも、いい人だよ。その人と一緒にいるのは楽しいし、話してると色々と発見がある」", "「そっか……でも嬉しいよ。キズキにもそういう人ができて」", "串入れに竹串を入れながら言うと、キズキはありがとうと言って、儚げに笑った。", "「にしても美味しいね、この焼き鳥。今度、彼女と一緒に来ようかな」", "「そういえば、その彼女とは上手くいってるのか？」", "キズキの声が少し強張っているように聞こえたが、僕は気にせず、キズキの問いに頷いた。", "「順調だよ。この前は近くの水族館に行ったんだ。人懐っこいシロイルカがいる水族館でね。とっても可愛いんだ」", "「へえ。でも、水族館なんて久しく行ってないな」", "「今度、一緒に行こうよ。ほら、その好きな子でも誘ってさ」", "枝豆の塩漬けをつまみながら言うと、キズキは首を振って、ビールを流し込んだ。", "「言っただろ？ 絶望的な距離があるって」", "「そんなに望みがないの？」", "「まあ、うん……」", "そう言うと、キズキは静かに息をついた。そして、絞り出すように声を出した。", "「でも、今度、自分の想いを正直に伝えてみようって思うんだ。その人に」", "「ほんと？ じゃあ、上手くいったら、その子も連れて、一緒に水族館に行こうよ」", "僕がそう言うと、キズキは一度、目を伏せてから、ちらりとこちらを見つめた。", "「……まあ、上手くいったらな」", "「きっと、上手くいくさ」", "「うん。そう願いたいな」", "そこで僕たちはしばらく黙った。キズキは焼き鳥を一本頬張り、僕は枝豆の塩漬けを口に運んだ。次に、キズキが声を出したのは、僕がジンジャーエールを飲み干し、新しくコーラを頼んだときだった。", "「そういえば、お前免許取ったんだよな？」", "「うん。取ったよ。先月」", "店員から受け取ったコーラを飲みながら言うと、キズキは箸を置いてこちらを見た。", "「もう、公道で走ったのか？」", "「親の車では走ったよ。なかなか慣れないけどね」", "僕が苦笑すると、キズキは一度、まっすぐに僕を見つめてから、にこりと笑った。", "「じゃあ、ドライブでもしようぜ」", "「えっ、いつ？」", "「今からだよ。深夜時間で車をレンタルできる店が、この近くにあるんだ」", "「えっ？ いや、十一時過ぎてるんだよ？ それに、十二時に戻るって寮長に言ったし」", "慌てて言うと、キズキはビールを飲み干してから、満面の笑みを浮かべて言った。", "「いいじゃんか。ほら、お前、酒飲んでないんだし」"]}, {"title": "第三話：死んだら、パチンさ。", "paragraphs": ["薄暗い店内には、スピーカーから低く抑えられたジャズが流れていた。壁の古い掛け時計が、重苦しく時を刻んでいる。トヲルが再び声を出したのは、ミモザを飲み干し、新しくギムレットを頼んだ後だった。", "「なあ、死んだらどうなると思う？」", "その問いに、僕は考えるよりも先に声を出していた。", "「死んだら、パチンさ」", "「パチン？」", "「ＯＮからパチンとＯＦＦになる。ただそれだけだよ」", "「随分と軽いな」", "「そんなものだよ。大抵の人は死んだことにすら気づかないで死ぬんだ」", "「それは気楽でいい」", "部屋の電気を消すみたいに死は訪れる。そう教えてくれたのはキズキだった。", "「アイツは自分が死んだことに気づいたと思う？」", "力のない静かな声だった。僕はトヲルの問いに、じっくりと考えを巡らせた。", "「キズキは自分の意思で電気を消したんだ。ＯＮからパチンとＯＦＦに」", "「……ああ」", "キズキは死んだ。まるで部屋の電気を消しにいくみたいに。", "「自殺っていうのはきっと、自分が死んだことに唯一気づける死に方なんだよ。哀しいことにね」", "トヲルはそうかとだけ呟いた。命尽き果てた螢みたいに、か細い声だった。", "「アイツは死ぬ時、何を思ったんだろう」", "抑揚のない平板な声だった。僕は項垂れたトヲルの姿を見つめながら、呟くように声を出した。", "「それは誰にもわからない。キズキにも、わからなかったと思うよ」", "死を間際にしてキズキは何を思ったのだろう、何を感じたのだろう。僕にはとても想像がつかない。", "「俺はさ、小さい頃ずっと死を受け入れられなかったんだ」", "「受け入れられなかった？」", "トヲルは一度頷いた。そして届けられたギムレットを口にし、息をついた。", "「死んだらもう生きられないってことに、どうしても耐えられなかったんだ。死ぬのがたまらなく怖かった。いつか死ぬ世界で生きているのが怖かった。それでも俺はいつからか死を受け入れていた。終わりを定められた人生を受け入れていた」", "トヲルはギムレットの注がれたグラスのふちを指でなぞった。", "「でもアイツが死んで、俺はやっぱり分からなくなった。だって考えてみろよ。昨日までニコニコ笑ってたやつが、次の日には真っ青になって冷たくなってるんだよ。名前を呼んでも、肩を叩いても返事をしない。ずっと瞼を閉じてるんだ。信じられるわけないだろ？ 昨日まであんなに生き生きしてたやつが、次の日にはただのモノになってるんだよ。もちろん原理はわかるさ。老いたら死ぬ、病気になったら死ぬ、心臓を刺されたら死ぬ、高いところから飛び降りたら死ぬ。それはわかってる。でも死ってなんなんだよ？ 死んだら右も左もない。縦も横もない。呼吸も鼓動もない。意思も感情もない。数字も文字もない。色も、音も、形も、匂いも、味もない。生きてた時にあった何もかもが全て失われるんだ。そんなの受け入れられるわけないだろ？ 俺には到底受け入れられない」", "そこでトヲルはポケットから煙草を取り出し、口に咥えた。しかしトヲルは煙草を咥えているだけで、一向に火をつけようとしなかった。", "「俺たちは何のために生きているんだろう」", "「え？」", "驚いて顔を上げると、トヲルはカウンターの一点を見つめたまま、煙草を口から離した。", "「いや、アイツがよく俺に聞いたんだよ。お前は何のために生きているって。俺はそうやって問われるたびに何も答えることができなかった」", "キズキの眩しい笑顔を思い浮かべながら、僕はウイスキーを飲んだ。キズキは僕に対して一度もそんなことを尋ねなかった。どうしてトヲルにだけ、そんな絶望の縁に触れるような言葉を遺したのだろう。", "「明るいやつだったけど、アイツはずっと考えてたんだ。自分は何故生きているのか、何の為に生きているのか。神にも、仏にも頼らず、アイツはずっとひとりで考えていた。それがどれだけ孤独な作業か、俺にはとても想像がつかない」", "トヲルは言葉を切り、煙草の角を叩いた。", "「ある意味、アイツはずっとひとりだったんだよ。たったひとりで、アイツはこの人生と、この世界と向き合っていたんだ」", "その言葉にハッとする自分がいた。キズキはたった一人で、この世界と向き合っていたのだろうか。", "「なあ、俺たちはどうするべきだったと思う？ どうすればキズキを救えたと思う？」", "救いを求めるような声だった。僕はその問いにじっくりと考えを巡らせた。でも、そんなことわかるはずなかった。", "「それは僕にもわからないよ、悪いけど」", "「……そうだな」", "僕は小さく息をつき、ウイスキーを口に含んだ。", "「でも、生きる意味に悩む気持ちは少しわかるよ」", "「え……？」", "「僕も学生時代は必死になって生きる意味を探していたから」", "「そうなのか？」", "僕は一度、深く頷いた。", "「小さい頃は、生きるってことに揺るぎない何かがあったはずなんだ。でも勉強をしたり、部活をしたりしているうちにわからなくなった。自分が何故生きているのか、何の為に生きているのか、改めて立ち止まって考えてみると何もわからなかったんだ」", "灰皿には煙草の吸い殻が積み重なっている。トヲルはギムレットを飲み干し、グラスを弾いた。", "「それからは無気力だよ。何をやっても身が引き締まらなくて、気力が湧かないんだ。一日一日がただただ辛くて、どうしようもなく苦しかった。この先ずっとこのまま生きていくのかって思うと、たまらなく恐ろしかったんだ」", "そこで僕は一旦間を置き、琥珀色に染まったグラスをじっと見つめた。トヲルは手にしていた煙草をふたたび口に咥え、ライターで火をつけた。", "「色んなことを考えたし、色んな本も読んだ。だけど、やっぱりわからないんだ。自分が何故生きるのか、何の為に生きているのか。考えれば考えるほど、それはわからなくなる」", "ロックグラスを揺らすと、ウイスキーはなめらかに光を反射させた。隣に座るトヲルは、フィルターの短くなった煙草を指に挟んだまま微動だにせず、カウンターの棚に整然と並べられた無数のグラスの群れをじっと見つめている。煙草の先から細く立ち上る白い煙が、彼の顔の半分をかすかに霞ませていた。その瞳は目の前のグラスを見ているのではなく、無限に広がる暗い宇宙の果てでも覗き込んでいるようだった。", "「でも、その時に思ったんだ。生きることはたまらなく虚しいことだって」", "「……虚しい」", "トヲルはそう呟くと灰皿の角で煙草の灰を落とした。そしてバーテンダーを呼び、ミモザを頼んだ。", "「いつか人は死ぬ。死ねばあらゆるものは失われる。夢も、希望も、幸せも、感情も、意思も、記憶も何もかも失われる。僕たちは産まれながらに全てを失う運命の途上にある。虚しいと思わないか？」", "「まあ、そうだな」", "バーテンダーがトヲルのもとにミモザを届けた。僕はポケットから煙草を取り出し、口に咥えてライターで火をつけた。", "「必死に考えたよ。この人生に生きる意味はあるのか？ 生きる価値はあるのか？ 生きる理由はあるのかって。でも、その答えは見つからなかった」", "そこで僕は止めて、煙草を吸った。", "「もちろん今を生きる人たちの考えは様々だ。生きる意味はわからないと諦めている人もいるし、生きる意味はいずれ見つかると前向きに捉えている人もいる。楽しく生きれればそれでいいと割り切っている人もいるし、神の為に生きていると信じている人もいる。考え方はそれぞれだ。だけどやっぱり僕は意味を見つけたかった。生きる意味が、欲しかった」", "「どうして？」", "その問いに、すぐに答えられなかった。どうして僕は生きる意味を求めたのだろう。", "「やっぱり怖かったんだよ。意味や価値のないこの世界で生きるのが。意味や価値のないものとして人生を終わらせるのが、たまらなく怖かったんだ。だから僕は必死になって生きる意味を探したんだと思う」", "「怖い、か」", "トヲルはゆっくりと煙を吐き出した。僕は手にしていたライターの重みをじっくりと確かめた。", "「でも、そう思っていたのは学生時代だけだった。ある程度歳を重ねたら、それにも諦めがついた」", "「諦め？」", "「ああ、何て言うか、もう考えるのをやめようって思ったんだ。もちろん生きる意味や、生きる理由を考えることは大切なことさ。でも変に考えすぎるのも良くないと思ったんだ。だってその『意味探し』に究極的な答えはないわけだから」", "「まあ、そうだな」", "トヲルはミモザを口に含んだ。僕は煙草を吸いながら、カウンターの木目をじっと見つめた。", "「もちろん考えることを放棄したわけじゃない。だけど変に考えすぎて苦しくなるのもよくないと思ったんだ。だから、考えるのを諦めた」", "「考えるのを諦めた」", "トヲルはその言葉をゆっくりと繰り返した。まるで言葉の響きを確かめるみたいに。", "「もちろん、今だって何の為に生きているのかはわからない。だけど生まれた以上、生きねばならない。その程度でいいと思うようになったんだ。変に考えすぎるよりもそうやって生きている方がずっと楽しい。きっとそれだけでいいんだ。大層な意味や価値がなくても人は生きていける。生きる。ただそれだけでいいんだ。そこに理論も、定義も、真理も存在しない。大事なのは何故生きるのかではなくて、どう生きるのか。意味を見つけるのは、またあとででいいんだよ」", "「またあとで、か」", "トヲルは一度頷き、灰皿に煙草を擦りつけた。いつの間にかキズキみたいな言い方になってしまった。", "「キズキも、もしかしたらずっと考えていたのかもしれない。意味のない世界で意味を見出す、その『意味』について。でもその問いには出口がない。入口があっても出口はない。キズキはそんな迷宮に迷い込んだ。そして出口を見つけられないまま、死んでしまった」", "トヲルはグラスを握ったまま静かに息をついた。", "「『生きる意味などわからない』普通の人ならそう割り切って生きていくはずだ。だけどキズキには物事を深く考える癖があった。きっとそれがキズキ自身を苦しめていたんだ。そしてキズキは──」", "「もういい」と言ってトヲルは止めた。僕は唇を噛み、グラスを強く握った。", "「でも、本当のところは何もわからないよ」", "込み上げてくる悲しみを抑えながら、僕は呟いた。トヲルはグラスを握り、カウンターの一点を見つめている。", "「さっきのは君の話を聞いた上での推測だ。キズキが何を思って自ら命を絶つ選択をしたのか、それは誰にもわからない」", "「ああ、そうだな」", "死者の前で生者はあまりにも無力だ。声をかけることも、手を差し伸べることもできない。僕たちはただ、彼らに思いを巡らせることしかできない。"]}, {"title": "第四話：代々木パーキングエリア", "paragraphs": ["会計を済ませて重い扉を開けると、夜の冷ややかな空気が湿った肌を撫でた。僕たちはネオンの灯りがまばらに落ちる道を歩き、近くにあった深夜でも車をレンタルできる店へと向かった。僕が事務所の簡素なパイプ椅子に腰掛け、書類に名前を書き込んで手続きを済ませている間、キズキは店の外にぽつんと置かれたスタンド灰皿の前で煙草を吸っていた。夜の闇に浮かび上がる橙色の小さな火種と、彼が吐き出す白い煙が、街灯の光に透けて揺れている。その背中はどこか遠く、世界から少しだけ浮き上がっているようにも見えた。", "用意された車は、塗装のくすんだトヨタの古いコンパクトカーだった。乗り込むと、独特の古いシート地と甘ったるい芳香剤が混ざり合った匂いが鼻をついた。キズキは助手席のドアを閉めると、ダッシュボードの手触りや使い古されたエアコンの吹き出し口、歪んだルームミラーを物珍しそうに眺め、指先で確かめるようにそっと触れていた。", "「そういえばキズキって、免許取ってないんだよね？」", "「ああ。でも、いずれは取るつもりだよ。お前にばっか運転させるわけにはいかないからな」", "そう言うと、キズキはシートベルトをしめて窓の外を見つめた。その瞳には、宇宙の果てを思わせるような深い闇があった。", "「じゃあ、どこ行く？」", "「海沿いとか走りたいよな。夜の海とか見てみたいし」", "「じゃあ、江ノ島？」", "僕が言うと、キズキはうーんと唸りながらカーナビを見つめた。", "「江ノ島は洒落てるけど、なんか違うな」", "「となったら、東京湾？」", "僕の問いに、キズキはパチンと指を鳴らし、「それだ！」と言った。", "「どうせなら、羽田まで行ってみる？」", "「いいね、羽田」", "これで行き先は決まった。あとは、ゆっくりと車を走らせるだけだ。", "羽田へと向かうルートはいくつかあったが、この場所からなら首都高速道路へ上るのがもっとも手っ取り早かった。僕はレンタカー店の駐車場からゆっくりと車を切り出し、街灯のまばらな夜の下道をしばらく走ってから、ランプを上って首都高へと合流した。真夜中と言っていい時間帯だったが、首都高のオレンジ色の街灯の下には、思いのほか多くの車が走っていた。てっきり長距離を走る大型トラックばかりなのだろうと思っていたのだが、意に反して視界を掠めていくのはコンパクトカーやセダンばかりだった。みんなどこから来て、こんな夜更けにどこへ向かっているのだろう。", "キズキは首都高に入ってからというもの、ぽつりと言葉を途切れさせ、ほとんど口をきかなくなった。一日の疲れが重くのしかかっていたのかもしれない。事実、僕たちは今夜居酒屋の暖簾をくぐる直前まで、大学のレポートと格闘していた。今週中に提出しなければならないその課題を、僕たちは手つかずのまま放置し続けていた。そして提出期限まであと三日という土壇場になって、ようやく重い腰を上げたというわけだ。幸いにも枚数自体はそれほど多くなかったので、丸一日部屋にこもりきりになり、頭を抱えながらなんとか形にすることができた。居酒屋へ繰り出したのも、その過酷な作業を終えたささやかな打ち上げのためだった。本当はトヲルも打ち上げに誘うつもりだったのだが、学科試験が目前に迫っているからと断られた。僕たち三人は同じ大学に通う仲間だったが、僕とキズキが文学部に籍を置いていたのに対し、トヲルだけは工学部に籍を置いていた。おまけにトヲルは工学部の中でも一、二を争うほど成績が優秀で、試験前ともなれば尋常じゃない集中力を見せた。そのためとても僕たちの立ち入る隙はなかったのだ。", "そのような経緯もあって、僕とキズキは二人きりで居酒屋のテーブルにつき、ジョッキを交わした。そして現在助手席に深く腰を下ろしているキズキは、目を閉じて眠る風でもなく、ただ物珍しそうにガラス窓の外を流れていく夜景を見つめていた。オレンジ色の街灯の光が、一定の周期で彼の横顔を照らしては過ぎ去っていく。僕はそんな彼の様子を横目でチラリと確かめてから、ダッシュボードのカーナビの操作パネルを操作し、ラジオのスイッチを入れた。一瞬のノイズのあと、少し遅れてアナウンサーの淡々とした交通情報を伝える声が車内に響いた。僕はすぐにチャンネルボタンを押し、流行りのヒットソングを流している音楽番組に切り替えた。フロントドアの足元についた小さなスピーカーから、ざらついたノイズ混じりに若い男性の伸びやかな歌声が聴こえてくる。ラジオや街中で何度も耳にしたことのあるメロディと声だったのだが、いくら頭を巡らせてもその歌手の名前まではどうしても思い出せなかった。僕たちは流れる音楽とエンジン音に包まれながら、夜の首都高を滑るように走り続けた。", "首都高を走って、五分ほど経った頃、キズキが突如トイレに行きたいと言い出したため、僕たちは最近リニューアルされたばかりの代々木パーキングエリアに車を滑り込ませた。代々木パーキングエリア自体は、子供の頃に家族の車で何度か立ち寄った記憶があったが、綺麗に改修されてから訪れるのはこれが初めてだった。もともと敷地自体がそれほど広い場所ではなかったが、リニューアルを経たことで無駄な装飾が削ぎ落とされ、どこか現代的でこざっぱりとした清潔な印象に生まれ変わっていた。", "白線の中に車を停めてエンジンを切ると、車内を満たしていた静かな振動が消え、急に夜の静寂が降りてきた。重いドアを開けて外に出ると、真夜中の冷たい空気が心地よく肌を刺す。僕たちは並んで歩き、明かりの点いたパーキングエリアの建物の中へと入った。案内板を見るとトイレは二階にあるらしく、キズキは建物に入った途端、尿意に耐かねたように足早に階段を上っていった。取り残された僕は彼の帰りを待つ間に二階の休憩所を当てもなく歩いて回った。二階にはドトールコーヒーと小さなレストランが暖簾を掲げていたが、どちらもすでに本日の営業を終えてシャッターを下ろしており、無機質な静けさが漂っていた。広い休憩スペースにはほとんど人の気配がなく、蛍光灯の白い光の下で、古びたスラックスを履いた男性が一人、静かに新聞紙をめくっているだけだった。カサリという紙の擦れる音だけが、やけに響く。僕はカウンター代わりの長い窓際の席に腰を下ろし、ガラス越しに眼下に広がる首都高速道路をぼんやりと眺めた。時計の針はすでに零時を回り、夜の底へと沈み込んでいる時間帯だというのに、オレンジ色の街灯に照らされたアスファルトの上を、車のライトが一筋の光の尾を引いて次々と通り過ぎていく。東京という街は、こうしている間も完全にまぶたを閉じることはないのだと思う。眠らない街という言葉の本当の意味を、冷えたガラスに額を押し当てながら、僕は静かに噛み締めていた。", "キズキは五分ほど経ってから、缶コーヒーを手にして戻ってきた。", "「どうしたの、それ？」", "僕が尋ねると、キズキは缶コーヒーをこちらに投げた。", "「眠くなるかもしれないと思ってさ。買ったんだ」", "そう言うと、キズキは缶のふたをカチッと開けた。", "「ほら、遠慮するなって」", "「ああ、わかった。ありがとう」", "僕は缶を握ったまま、蓋を開けた。缶は自販機で温まっていたこともあり、冷えた手先に温もりを与えた。", "「にしても、洒落たパーキングエリアだな」", "キズキは休憩所をぐるっと見回して言った。", "「最近リニューアルされたからね。前はもっと味気なかったよ」", "「よく知ってるな」", "「地元だからね」", "そこで僕たちは、窓際の席に座ってコーヒーを飲んだ。外が寒かっただけに、コーヒーの温もりは体の芯にまで沁み渡った。", "「だけど、大丈夫だったのかな」", "「何が？」", "「いや、寮に連絡しなくてさ」", "僕がコーヒーを啜りながら呟くと、キズキは大きく首を振った。", "「気にしなくていいよ。もし怒られたとしても、俺がうまく誤魔化しとくからさ」", "「誤魔化せるの？」", "気になって尋ねると、キズキは自信ありげにこちらを見つめた。", "「心配すんなって。それにいざとなったら、死んでもお前のこと守るから」", "「本当に？」", "「ああ、死んでも守るよ」", "キズキは真剣な眼差しでこちらを見つめていた。僕はそのまっすぐな瞳をじっと見つめ、ふっと笑った。", "「どうして笑うんだよ」", "「いや、妙に真剣だったからさ」", "「当たり前だろ。俺はお前のこと想って言ってるんだぞ」", "「にしても、真剣すぎるって」", "僕が笑うと、キズキもつられて笑った。代々木パーキングエリアの小さな休憩所で、僕たちは夜空を跳ね返すように高らかに笑った。", "「キズキは、やっぱり面白いね」", "「バカにするなよ。俺は大真面目なんだからな」", "「わかったわかった。でも、嬉しいよ。そう言ってくれて」", "「ったく、最初からそうやって言えばいいのに」", "「ごめんごめん」", "休憩所は、びっくりするくらい静まり返っていた。僕たちはコーヒーを飲みながら、眼下の闇を泳ぐように走る車の光跡をじっと見つめた。", "「本音を言うとさ、今夜はお前と一緒にいたかったんだ」", "「えっ、それどういう意味？」", "気になって尋ねると、キズキは目を逸らしながら声を出した。", "「邪魔されたくなかったんだよ、いろいろと」", "「邪魔されたくなかった？」", "「ああ、ふたりきりが良かったんだ」", "そこでキズキは口をつぐんだ。僕はテーブルに肘をついて、キズキの横顔をじっと見つめた。", "「キズキは、人から好かれてるよね」", "「なんだよ、急に？」", "彼は少し首を傾げた。冗談めかしたような、でもどこか本気で疑問に思っているような顔だった。", "「いや、人から好かれる要素をたくさん持ってるなって思ってさ」", "「そうか？」", "「そうだよ」", "短い沈黙が落ちる。キズキは窓の外を、ぼんやりと眺めていた。", "「ひとつだけ言っていいか？」", "「ん？」", "「俺は人から好かれてはいないよ」", "「えっ？」", "短い沈黙。", "「というか、この世に好かれている人なんて、ひとりもいないんだよ」", "彼は静かに言った。声には、どこか達観したような響きがあった。", "「ただ、嫌われない努力をしている人がいるだけでさ」", "「嫌われない努力？」", "「ああ」", "キズキはコーヒーを握りしめたまま、眼下を冷たく見下ろした。", "「じゃあ……」", "空気がわずかに張りつめた。", "「みんなから嫌われている人は努力が足りないということ？」", "「それは少し違うよ」", "キズキはゆっくりと首を横に振った。", "「この世に好かれている人がいないように、この世に嫌われている人などいない。ただ、その人が好かれようと努力をしていないだけでさ」", "「好かれようと、努力をしてないだけで……」", "果たしてそうなのだろうか。僕にはわからなかった。しかしキズキの眼差しだけは、どこまでも真剣で、透徹だった。", "「さて、そろそろ行きたいんだが、その前に一つ寄りたいところがある」", "「寄りたいところ？」", "「ああ。一階の喫煙所なんだが」", "「喫煙所？」", "僕が驚いて尋ねると、キズキは「行こう」と言って僕の手を引いた。", "喫煙所は階段を降り、建物の重い自動ドアを抜けたすぐその先にひっそりと佇んでいた。僕が吐く息を白くさせながら喫煙所へ近づいていくと、ガラス張りのパーティションの向こうで、キズキが僕に気づいて軽く手を振った。その手の指先には、すでに箱から抜き取られた二本の煙草と、見慣れたライターが器用に握られていた。僕がすりガラスの扉を引いて喫煙所の中に入ると、灰皿の周りに漂ううっすらとした煙の匂いとともに、キズキは「ほら」と言わんばかりに、手にしていた煙草のうち一本を僕の目の前へ差し出した。言葉すら介さないその自然な差し出し方に、僕たちのあいだに流れてきた時間の長さと、静かな居心地のよさがにじみ出ていた。", "「煙草の吸い方、わかるか？」", "キズキはそう言いながら、手にしていた煙草を口に咥え、ライターで火をつけた。そして、ふーっと煙を吐いた。", "「一応、未成年なんだけど」", "僕がつぶやくように言うと、キズキは僕の背中をぽんぽんと叩いた。", "「ものは試しさ。何事もやってみなければ始まらない」", "キズキ煙草を手にしたまま、にこりと笑った。堕天使を彷彿とさせるような蠱惑的な笑みだった。", "「大丈夫さ。バレることはないよ」", "「別にそこを心配してるわけじゃないんだけど」", "僕が仕方なく煙草を口に咥えると、キズキはライターの炎をゆっくりとこちらに近づけてきた。", "「強く吸うなよ。ゆっくり優しく吸うんだ」", "キズキに言われた通り、息を殺してそっと吸い込むと、煙草の先端が静かにぽっと赤く燃えた。", "「そうしたら一度、煙を口の中に溜める。そのまま直で喉に通すとむせるからな」", "言われた通り、紫煙を口中に温めるように留めると、ほんのり苦い味が舌に乗った。", "「そこで煙草を離して、外の空気と一緒に深呼吸するみたいに吸い込むんだ。肺の中に落とすイメージで」", "口を少し開け、ゆっくりと息を吸い込んだ。冷たい空気と一緒に、薄まった煙が喉の奥を滑り、肺のすみずみへ広がっていくのが分かった。", "「あとは、静かに吐き出すだけだ」", "僕は言われた通り、口から煙を吐き出そうとした。しかし煙が気管を通った瞬間、僕は激しく咳き込んでしまった。", "「大丈夫か？」", "キズキが心配そうにこちらを見つめた。僕は手を上げて大丈夫であることを示した。", "「やっぱり、最初は咽せるよな」", "そう言いながら、キズキは煙草をうまそうに吸った。", "「キズキはこれが美味いって感じるわけ？」", "「不味いと感じる方が正常だよ」", "そこでキズキは自分が吸っていた煙草を灰皿に擦りつけた。そして僕が手にしていた煙草を手に取った。", "「吸ってもいいか？」", "キズキの問いに、僕は一度頷いた。", "「じゃあ、ありがたくいただくよ」", "そう言って、キズキは僕の煙草を気持ちよさそうに吸った。", "「おっ、こっちの方がうまいな」", "「えっ、違いがあるの？」", "僕が驚いて尋ねると、キズキはニコッと笑ってから「さあな」と言った。", "喫煙所を出たのは午前零時三十分だった。僕たちは空き缶を捨ててから、駐車場に停めてあった車に戻った。", "「さて、行きますか」", "そう言って僕がエンジンをかけると、キズキが僕の肩をとんとんと叩いた。", "「なあ、アレってなんだろう？」", "「えっ、どれ？」", "キズキの指差した方向を見ると、街路灯の上に真っ白な鳥がとまっていた。", "「えっ、何だろう……鳩？」", "「鳩にしては、嘴が尖りすぎてないか？」", "確かに、言われてみれば尖りすぎていた。僕はその鳥をじっと見つめた。", "「あっ、でもよく見ると、鴉っぽくない？」", "僕が目を凝らして言うと、キズキは「そうか？」と言いながら目を細めた。", "「ああ、でも言われてみれば確かに鴉っぽいな。だけど、体が白い鴉なんているか？」", "キズキの問いに、僕はしばらく考えを巡らせた。", "「可能性としてあるのは、アルビノとか、白変種だよね」", "「白変種？」", "「ほら、ホワイトタイガーみたいなさ」", "「ああ、なるほどな」", "そう言うと、キズキは楽しそうに白い鳥を見つめた。僕は滑らかなレザーのハンドルに両手を置いたまま、キズキの横顔をじっと眺めた。普段は当たり前の存在すぎて深く意識することもなかったが、こうして静けさの中で改めて彼の横顔を見つめると、その端正で整いすぎた顔立ちに、息をのむほど驚かされた。すっと静かに通った高い鼻筋や、街灯のオレンジ色の光を遮って頬に濃い影を落とす長い睫毛、そして涼しげな目元。それはまるで、熟練の職人が長い年月をかけて削り出した氷の彫像のようだった。僕が息を殺し、そのどこか儚げで美しい見目形にすっかり心を奪われていると、キズキは視線を感じ取ったのか、ふいにこちらを向き、眉間に皺を寄せながら、訝しげに僕を見つめ返した。", "「どうしたんだよ？」", "街灯の光が車内を絶え間なく滑り去り、その鼻梁を境として、キズキの顔立ちを明瞭な光と深い闇のふたつに塗り分けている。光の射す側は透き通るような白さを誇り、陰った側は夜の暗闇と同化するように深く沈み込んでいる。僕はそんなキズキの姿から視線を逸らすことができず、そのあまりにも現実離れした美しい顔立ちと、そこに同居する静かな陰影に、ただ息を呑んでいた。", "「いや、なんか綺麗だなって思ってさ」", "「綺麗？」", "キズキの問いに、僕は一度頷いた。そして、ぐーっと体を伸ばした。", "「そろそろ行こうよ。もう用は済んだんだし」", "「いや、でもあの鳥、気にならないか？」", "「確かに鳥は気になるけど、いつまでもここにいるわけにはいかないだろ？」", "僕がさとすように言うと、キズキは「まあ、そうだな」と言った。", "「じゃあ、行くけどいい？」", "僕の問いに、キズキは「いいよ」と頷いた。そこで僕は車を発進させ、本線に合流した。"]}, {"title": "第五話：生きる希望も、死ぬ勇気もない。", "paragraphs": ["店内の空気は冷えたアクアビットのようにキリッと澄んでいた。白シャツにベストを着たバーテンダーが、まるで僕たちの存在を風景の一部としか思っていないかのように、黙々とカクテルシェイカーを振っている。やがてその硬質な音が止むと、店内の沈黙はよりいっそう深まった。僕たちの拙い影だけが、暗い壁に長く伸びていた。トヲルが声を出したのは、僕が四杯目のウイスキーに口をつけ、トヲルがギムレットを頼んだ時のことだった。", "「なあ」", "「ん？」", "「人間ってさ、死にたいって思ったら死ねるものなのか？」", "抑揚のないひんやりとした声だった。僕はその問いに、少し間を置いてから答えた。", "「死にたいと思って死ねるなら、人類はとっくに滅亡しているよ。みんな、死ねないから生きているだけさ」", "「お前は死にたいって思ったことはあるのか？」", "孤独な僕たちの心に、沈黙が沁み込んでいく。僕はウイスキーを一口飲み、息を吐いた。", "「高校生ぐらいのときは毎日思ってたよ。あの頃は、生きているのがただただ辛かった」", "「それでも死ねなかった？」", "氷河の一片のような鋭い眼差しで、トヲルは僕を見つめた。僕はその問いについて、考えた。", "「死ねなかった。ナイフで手首を切ろうとしたときも、ロープで首を吊ろうとしたときも、やっぱりダメだった。どうしようもなく怖いんだ。死んで、全てをパチンするのがさ」", "「そうか」", "トヲルは短くそう呟くと、煙草の灰をゆっくりと灰皿の縁で落とし、それ以上は何も言わなかった。追及するでも、哀れむでもない、ただ僕の告白をそのまま静かに受け止めるような温度のない声。それを耳にした瞬間、僕の記憶の底に沈んでいた暗い泥が突如として一気に巻き上がった。生きる希望もなければ、死にきるだけの勇気すら持てなかった──あの八方塞がりで、息もできないほどつらく、苦しい季節。その光景が、鮮やかに蘇ってきた。", "あの頃の僕は自分が世界にとって不要な存在なのだという確信に取り憑かれていた。それは誰かに言われたわけでも、証明されたわけでもない。ただ朝起きて制服に着替え、電車に乗り、教室の椅子に座るという一連の動作の中で、自分という存在の輪郭がどんどん薄まっていくのを感じていた。実際その頃、僕は毎晩のように自分がこの世からいなくなる方法を考えていた。それは決して衝動的なものではなく、むしろ奇妙なほど理性的で、事務的な作業だった。ノートの片隅に誰にも見せることのない小さな文字で、僕はいくつかの自殺の手段を書き出していた。それは今思えばまるで旅行の計画を立てるような、奇妙に整然とした作業だった。ただその旅の行き先だけが、決定的に違っていただけで。", "そのようにしてこの世からいなくなる方法を考える中で、僕はひとつのことに明け暮れていた。それが自傷行為──リストカット──だった。学校の美術用具の一つにあったカッターナイフを取り出し、その鋭利な刃先を青白い血管に押し当てたときのことを今でもよく覚えている。極限状態まで追い詰められ、手に取ったカッターナイフの無機質な冷たさと、皮膚越しに伝わる、血管の生々しいほどの温かさ。その境界を探るように刃先を皮膚に滑らせているとき、僕の心はどういうわけか奇妙なほど凪いていた。", "ぱっくりと裂ける皮膚に、ぷっくりと膨らみながら、皮膚を伝って滴っていく血の跡。痛みはあるはずなのに、その痛みはどこか遠い異国の風景のように現実味がない。そのまま二回、三回と刃先を滑らせていくうちに、一瞬の痛みは静かに飽和していき、やがて実体のない空気のかたまりのようなものになる。ぱっくりと裂けるたびに、滴り落ちる無数の血。血を拭くたびに、赤黒い湿り気を帯びるティッシュペーパー。その様子を見つめるたびに、生きている実感のようなものがどこか遠くから足音を立てて近づいてくるよような感覚を僕は味わった。そしてその感覚が、何もかもを失った僕にとってはひどく心地よかった。カッターナイフを手に取った瞬間の凪いた心。刃先を滑らせ、ぱっくりと裂ける皮膚から溢れる血を見つめながら感じる、空気のかたまり。赤黒く湿ったティッシュペーパーを見つめながら感じる、生きている感触。皮膚を切れば切るだけ、見返りに血が返ってくる、あの奇妙な達成感。そしてそれがいつしか生き甲斐へとすり替わっていく、眩暈がするほどの倒錯。しかしそれすらもどこか心地よく、うっとりとしてしまうような万能感。リストカットには、そういう魔性の力があった。そしてその得体の知れない感覚に酔いしれていくうちに、僕の腕はいつの間にか取り返しのつかないほど傷だらけになった。しかし不思議と後悔のようなものはなかった。何故なら、それが自分にとっての生きた証であったからだった。生きた証を失うことは、生きようともがいた時間をなかったことにすることと、等しかった。だから僕は、傷跡を誇りとして考え続けた。", "そんな日々の中、僕の人生を決定的に変えたことがひとつあった。それはある秋口の何気ない夕暮れだった。その日、僕は学校からの帰り道、河川敷を歩いていた。特に理由はなかった。ただ家に帰りたくなかっただけだ。僕は土手の斜面に座り込み、ひとりぼんやりと空を眺めていた。最初は何の変哲もない、どこにでもある夕暮れに見えた。しかし、しばらくすると、突然夕焼けが信じられないほど鮮やかな橙色に染まり、その中を一羽の烏が横切っていくのが見えた。一見すると何の変わり映えもない光景だ。しかし僕はそれを見た瞬間、不意に涙が溢れて止まらなくなった。なぜ涙が溢れたのか、その理由は今になっても正確には分からない。ただその美しさが、あまりにも自分のいる現在地から遠ざかったもののように思えたのだ。世界はこんなにも美しく鮮烈なのに、自分はそこからどこまでも遠い場所にいる。その絶望感が涙となってとめどなく込み上げてきた。しかし同時に、僕は別のことにも気づいていた。それはこんなにも美しい世界にこれまで気づくことも、希求することもなく、今日まで何の支障もなく生きてこられたという当たり前の事実だった。そしてそのひどく当たり前な事実を前に、僕は心を震わせると同時に、激しく打ちのめされた。何故なら自分が夕焼けの美しさに救われずとも、健やかに生きていけるほど恵まれた存在であったことを、僕は知らなかったからだ。そして同時に恵まれているが故に、その事実に今日までたどり着けなかった不運な存在であることにも、僕は気づいていなかったからだ。僕はその事実を前に、ただ愕然とし、涙を流すしかなかった。", "でも、あの涙は決して無駄ではなかったと思う。むしろそれに気づけたことが、僕にとっての大きな転換点になったのだと、今では思っている。実際それから僕は少しずつ、本当に少しずつ変わっていった。劇的な回復などではない。その変化はあまりにも緩慢で、自分でもいつ変わったのか正確には説明できない。しかしそうした変化を積み重ね、高校三年になる頃には、もう毎晩死を考えることはなくなっていた。もちろん何か生きる意味を見つけられたわけではない。だがそれでいいのだと、いつからか思えるようになっていた。意味などなくても人は生きていける。大切なのはなぜ生きるかではなく、どう生きるのかだ。その考えに辿り着けたのは、まさにあの険しい人生の季節を通り抜けたからこそだった。", "「アイツは、死ぬのが怖くなかったのかな」", "トヲルの呟きを耳にし、僕は現実へと戻った。", "「きっと、怖かったはずさ。でもそれ以上に生きることが怖かったんだよ」", "「……怖い、か」", "トヲルは深くため息をついて、ポケットから煙草を取り出した。しかし、トヲルは手にした煙草を一向に口にしなかった。", "「アイツの葬式、覚えてるか？」", "僕はその言葉を聞いて、キズキの葬式を思い出した。", "「覚えてるよ。忘れられないさ」", "親族以外でキズキの葬式に訪れたのは、僕とトヲルだけだった。葬式のときに知ったことだが、キズキは僕たち以外に友人がいなかった。", "「アイツの母親、棺桶にしがみつきながら泣き崩れてさ。正直、見てるのも辛かったよ」", "「でも、安らかに眠っていたよね」", "「ああ。ほんと、全てを果たしたように眠っていた」", "キズキの死顔は驚くほど穏やかだった。昼寝をする猫のように。", "「そういえばあのとき、俺たち最後まで火葬場にいなかったよな」", "その言葉を耳にし、僕は当時のことを思い出した。確かに、僕たちはあの日、最後まで火葬場にいなかった。", "「確か、アイツが火葬炉に運ばれていくのを見送ったあと、適当な理由をつけて火葬場から抜け出したんだよな」", "「そうだったね」", "どこからか聞こえる親族の咽び泣く声と、重苦しく響く僧侶のお経。死者を悼むための厳かな儀式や、そこに充満する過剰な悲しみ。そのすべてに嫌気が差した僕たちは、キズキの入った棺が火葬炉の重い扉の向こうへと滑り込んでいくのを、ただ放心しながら見送った。やがて扉が閉じられ、二度と開かないものになった瞬間、僕とトヲルは示し合わせたかのように顔を見合わせた。もう、ここにはいられない。そう思った僕たちは大人たちの集まるホールを抜け出し、親族に適当な理由を言い残して、逃げるように火葬場の重いガラスドアを押し開き、その場を後にした。", "「そして骨を拾うかわりに、火葬場の煙突がよく見える丘に登った」", "風がゆるやかに駆け抜ける、静かな丘だった。僕たちはそこに並んで立ち、遠くの火葬場の煙突からキズキが焼かれ、灰色の煙となって青空へと舞い上がっていく姿をじっと見つめていた。その煙は雲ひとつない午後の澄み渡った空へ、まるで一筋の光の帯のようになって天へと昇っていった。風に揺らぎながら高さを増していくその姿は、悲劇の結末というよりはどこか幻想的で、不思議と目を見張るほど美しかった。だけど、それがつい先日まで僕たちと笑い合い、喋っていたキズキという存在を焼いた煙だとは到底思えなかった。あのあたたかな皮膚も、少し高めの声も、すべてがただの不機嫌な灰色の空気となって空の青さに溶けて消えていく。そのあっけなさと現実味のなさに、僕の心はただ透明に透き通っていくばかりだった。", "「あのとき、お前言ってたよな。『まるで天国に向かって昇っているみたいだ』って」", "「そんなこと言ったっけ？」", "「言ってたよ。覚えてないのか？」", "それについて僕は思いを巡らせた。十年も前のことだ。情景を思い出すだけで精一杯だ。", "「ごめん、覚えてないや」", "僕が首を振ると、トヲルは小さく息をついてからギムレットを飲んだ。", "「俺、結構その言葉に救われてたんだよ」", "「救われてた？」", "トヲルは頷き、手にしていた煙草を口に咥えた。そしてポケットからライターを取り出して火をつけた。", "「何というか、これでいいんだって思えたんだよ。もちろんアイツが死んだことはものすごくつらかったよ。でも、アイツが天国に行くことで楽になれるなら、それでいいんじゃないかって思えたんだ」", "「つまり僕の言葉がきっかけで、キズキの死を受け入れられたってこと？」", "トヲルは硬く、重たい扉をこじ開けるように一度頷いた。", "「そっか……それは良かったよ」", "そこで僕はウイスキーを飲んだ。", "「だからさ、俺は感謝してるんだ。あのとき、お前がああ言ってくれたことに」", "「そんな、感謝されるようなことはしてないよ」", "僕が言うと、トヲルは首を振ってギムレットを飲んだ。そして灰皿のふちをなぞって、こちらを向いた。", "「俺にとっては感謝するべきことなんだよ。だってお前があのとき、あんなふうに言ってくれなかったら、俺は今、ここにいなかったかもしれないんだから。そういう可能性だって否定はできないだろ？」", "ハッとなって顔を上げると、トヲルは憂いを帯びた瞳でこちらを見ていた。", "「俺が今ここにいるのは、お前のおかげなんだ。だからお前には心から感謝してるんだよ。本当に、ありがとう」", "そう言い残し、トヲルは不器用に笑った。その笑みに何と声をかけてあげればいいのか、僕にはよくわからなかった。"]}, {"title": "第六話：羽田空港", "paragraphs": ["羽田近くに着いたのは、代々木パーキングエリアを出てから十五分ほど経った頃のことだった。潮の匂いが混じり始めた夜の静けさの中、路肩に車を停め、エンジンを切った。そして車外へ出て、羽田空港が一望できる臨海公園へと向かって歩き出した。真夜中という時間帯のせいもあり、だだっ広い公園には僕たち以外に人の気配はまったくなかった。数少ない外灯がぽつり、ぽつりと点在しているだけで、その灯りと灯りのあいだには、足元すらおぼつかないほど深い闇が横たわっていた。僕たちは静まり返った闇の中を並んで歩きながら、その先に広がる真っ暗な海と、対岸の滑走路でかすかに点滅する誘導灯の光を、ただ黙って見つめていた。", "「何も見えないね」", "「まあ、夜だからな」", "「でも、星は少し見えるね」", "「ああ、そうだな」", "僕たちはそれから長いあいだ、言葉を交わすことも忘れたまま、目の前にどこまでも広がる巨大な闇をじっと見つめていた。黒々と波打つ海からは、潮の匂いと夜の深い静寂を孕んだ冷たい風が、ひっきりなしに頬を打ちつけてくる。頭上の夜空には星がまばらに輝き、時折、氷の粒が割れるように儚く瞬いていた。十二月の冬の海岸は、立っているだけで凍てつくほどに冷たく、刃物のような寒さが服の隙間から侵入しては、僕たちの体の芯にまで容赦なく襲いかかってきた。それでも僕たちは身を寄せ合うこともなく、ただ暗闇の重みに耐えるようにして、その場に固まって立っていた。", "「なんか、色々と思い出すな」", "「思い出す？」", "僕の問いに、キズキは一度頷いた。そしてポケットから煙草の箱とライターを取り出した。", "「高校生のときに、夜な夜な短編集を書いていたんだ。そのときのことを、ふと思い出してさ」", "「へえ、なんて短編集？」", "「『月を喰らうもの』っていう短編集だよ」", "「『月を喰らうもの』」", "僕はそのタイトルを口に出して繰り返してみた。", "「何篇くらいあるの？」", "「原稿用紙五十枚くらいの短編が、全部で三十篇くらいあるんだ」", "「超大作だね」", "「ああ。書くのに三年かかったよ」", "そう言って、キズキは苦笑した。", "「中でも一番気に入っているのが、表題作の『月を喰らうもの』だ」", "「どんな話なの？」", "僕が尋ねると、キズキはちらっとこちらを見てから煙草を口に咥えた。", "「貴族の召使として働く女の子の、悲しい恋の物語だよ」", "「悲しい恋の物語？」", "「ああ。悲しい哀しい恋の物語さ」", "そこでキズキはライターで煙草の先端に火をつけた。夜空の片隅には白い月が美しく冴えて光っていた。", "「えっ、でもちょっと面白そう。ねえ、よかったらあらすじ聞かせてよ」", "僕がそう言うと、キズキは「あまり明るい話じゃないけど、いいか？」と尋ねてきた。", "「全然いいよ。むしろキズキの書いた話、気になる」", "僕の言葉にキズキは一度頷いた。そして煙草の先端を叩いて灰を落とした。", "「物語は主人公のルナが、テラという貴族の屋敷を掃除していたときに、美しい少年ルシウスに出会うところから始まるんだ」", "キズキはそこで一息つき、ゆっくりと物語を語っていった。", "「ルシウスは眉目秀麗という言葉がぴったりな青年で、貴族の中で最も人気があった。ルナはひと目でそんなルシウスの虜になり、何とか自分の存在に気づいてもらおうと必死になる。でも、ルシウスは一向にルナの好意に気づかない。それどころかルシウスは、ルナの主人であるテラのことを好きになってしまう。自分は美しくないのだ、そう失望するルナ。しかし、月蝕の夜、ふたりは舞踏会の場で偶然一緒になる。ルナはルシウスを外に連れ出し、そこで月蝕を見せる。そしてこう言う。『月蝕がどのような仕組みで起こるか知っていますか』と。ルシウスは『知らない』と答える。するとルナはこう言うんだ。『月蝕は地球の影の中を、月が通過することによって起こるのです』と。ルシウスは『君、物知りなんだね』と言う。するとルナは今にも泣き出しそうな顔で、こう言うんだ。『あなたはいつも美しい星を見つめている。今宵の月のように私はその陰に隠れている。あなたは太陽のように美しい』って。だけど意味がわからなかったルシウスは『君が何を言っているのか、さっぱりわからないよ』とルナに言った。そして続けて『テラがどこにいるか知らないかい？』と尋ねるんだ。そこでルナは舞踏会から逃げ出してしまった。ルシウスはルナを追いかけたが、途中でテラに声をかけられて追うのをやめてしまう。ルナはひとり、どこまでも走り続ける。気づくと、ルナは森の奥深くにいた。そこでルナは膝をつき、暗い月を見つめながら、ひとりわんわんと泣いた。すると森の奥から葉がこすれる音が聞こえたんだ。驚いて辺りを見回すと、そこには黒いマントを羽織った骸骨がいた」", "「骸骨？」", "「ああ。骸骨は右手に大きな鎌を持ち、左手には青い炎が灯ったランタンを持っていた。ルナが驚いていると、骸骨はルナの前まで行き、自分が死神であることを告げた。そして死神は、大きな鎌と青い炎が灯ったランタンを差し出して、こう言った。『あなたは生と死の狭間に迷い込んだ。私があなたを救ってあげましょう』と。ルナが『救う？』と尋ねると、死神は大きく頷いた。そしてこう言った。『ここにあるのは命を刈り取る鎌と、現世に帰るためのランタンです。鎌を選べばあなたは冥界へと誘われます。ランタンを選べばあなたは現世へと戻れます。さあ、あなたはどちらを選びますか？』と。ルナはしばらく迷ってから、大きな鎌を手に取った。そしてこう言った。『もうこの世に生きている意味などないわ。だからこの鎌で私の命を刈り取って』と。死神はルナの選択に一度だけ頷いた。そしてランタンの炎をふっと息で消した。死神は鎌を手にし、大きく構える。ルナは恐ろしく澄んだ瞳で、夜空の月を見つめている。そこで物語は終わる」", "「えっ、終わり？」", "僕が驚いて声を出すと、キズキはその問いに頷いた。", "「これで終わりだ。ルナがその後どうなったのかは描いていない」", "そう言って、キズキは煙草を一気に吸い込んだ。", "「この終わり方にしたのには一応理由があるんだが、それは話すと長くなるから、また今度話すよ」", "「…そう、ありがとう」", "そこで僕たちはしばらくの間黙った。キズキは煙草を地面に落とし、足で踏み消した。僕は夜空に浮かぶ白い月を、じっと見つめた。", "「でも、何だか切ない話だね」", "「切ない？」", "「だってルナは月蝕の夜に、自らを月と重ね合わせて愛を伝えたんだよ。でも、ルシウスはテラのことばかりを考えていて、ルナの言葉の真意に気づかなかった。ルナが言った『あなたは太陽のように美しい』って言葉が、なんとも胸を締めつけるよ」", "僕がそう言うと、キズキは「だよな」と言って目を伏せた。氷塊のように透き通った顔立ちが、柔らかな月の光に照らされていた。", "「俺がこの作品を描く上で意識したのは、太陽系をモチーフにすることなんだ。実際にこの作品に出てくる登場人物は全て、太陽系がモチーフになっている。主人公のルナは密やかに光り輝く月を象徴していて、ルシウスはいくつもの惑星を引き寄せる太陽を象徴している。そしてテラは美しい星、地球を象徴している。ルシウスを中心とした恋心を公転という形で表現し、それぞれの登場人物が生きることを自転という形で表現する。そうやって文学と天文学を結びつけて描いたんだ」", "僕はキズキの解説を踏まえた上で、もう一度物語を思い返してみた。", "「本当だ。確かに太陽系がモチーフになってる。でもタイトルの『月を喰らうもの』って何なの？」", "僕が気になって尋ねると、キズキは手にしていたライターをカチンと閉めてから声を出した。", "「実はこの小説、英語で書いたんだよ」", "「英語で？」", "「ああ。そっちの方が描いていて、すっと身に馴染んだからな」", "そこでキズキは一息ついた。僕は英語で小説を描くキズキの姿を思い浮かべてみた。全く、想像がつかない。", "「それもあって日本語の題名は『月を喰らうもの』になっているんだが、原文、つまり英語での題名は『エクリプス』になっているんだ。エクリプスは主に天文学で使われる用語で、日蝕や月蝕の『蝕』を意味する言葉だ。『蝕』とは、一つの天体が他の天体を遮ることを言う。俺は物語の中で、ルナがテラに遮られるところを強調して描いた。その遮っているテラのことを、俺は『エクリプス』と表現したんだ。そしてその意図を汲み取った上で和訳したのが、『月を喰らうもの』という題名なんだよ」", "そう言って、キズキは何度か咳払いをした。僕は緻密に練られた作品の構成に感嘆した。", "「でも、ひとつ気になるんだけど、キズキはなんでルナじゃなくて、テラのことをタイトルにしたの？」", "僕の問いに、キズキはうーんと唸った。", "「それはうまく言葉にできないな。ただ、俺は別にルナの失恋を描きたかったわけじゃないんだ。俺が本当に描きたかったのは、テラという存在の無意識の邪悪さなんだよ」", "「無意識の邪悪さ……」", "僕はその言葉の意味を噛み砕くために、しばらく黙った。あたりには冷たい潮の香りが広がっていた。その匂いには、死の気配がそっと漂っていた。", "「ちなみに『月を喰らうもの』はどういう経緯で描こうとしたの？」", "僕が尋ねると、キズキは少し間を置いてから声を出した。", "「さっき居酒屋で、好きな人がいるって話をしただろ？ 実は高校時代も好きだった人がいたんだよ。そして俺とその人の関係も、まさに『月蝕』そのものだった。俺は月で、その人は太陽。だけどその人には他に好きな人がいた。いわば地球だ。俺はいつもその地球の影に隠れている。わかるか？」", "「まあ、なんとなくね」", "「だからさ、俺は自分自身の報われない気持ちを昇華するために、物語を描いたんだ。ルナの台詞でこんなものがある。『私のことを好きじゃないところ以外、私はルシウスのことが全部好きだ』まさに、その通りなんだよ。俺はその好きな人が、自分のことを好きじゃないところ以外、全部好きだった。だけど、その状態では、どれだけ想っても意味はない。愛とは受け取ってもらわなければ意味がないんだ。一方的な愛ほど、虚しいものはない」", "そこでキズキは静かに息をついた。僕はちらっとキズキの姿を見てから、前を向いた。", "「僕は、一方的な愛も美しいと思うよ」", "「えっ？」", "キズキが驚いたようにこちらを見つめた。その瞳には夜空のすべてが映っていた。", "「というか、美しい愛は大抵一方通行なんだよ」", "「一方通行……」", "キズキはその言葉を、ゆっくりと繰り返した。まるで言葉の響きを確かめるように。", "「まあ、報われるに越したことはないんだけどね」", "僕が呟くように言うと、キズキは「そうだよな」と言って息をついた。", "「少し歩こう。夜風に当たりたい」", "「ああ、いいよ」", "それから僕たちは、あてもなく、ただ果てのない闇の中を静かに歩き続けた。", "足元を呑み込む闇は途切れることなく広がり、限りなく深く重かった。それはまるでこの世界の深淵が、僕たちのすぐ足元でひっそりと黒い口を開けて待ち構えているかのようだった。僕たちはそんな闇の中を、ただ前に、その先に何かがあるだろうと信じて、ゆっくりと歩いて行った。"]}, {"title": "第七話：煙みたいなやつだった。", "paragraphs": ["カウンターに置かれた灰皿からは、細い煙が一本の線となって天井へ昇っていた。外を走る車のヘッドライトが、ブラインドの隙間から時折まぶしくカウンターを横切っていった。トヲルが声を出したのは、僕が六本目の煙草に火をつけた時のことだった。", "「『あるものは断ち切られたようにふっと消え去り、あるものはゆっくりと霞むように消えていく』」", "「キズキの言葉？」", "「キズキの書いた詩の一節だよ」", "そう言ってトヲルはミモザを飲んだ。僕はウイスキーを飲みながら、その言葉を何度か頭の中で繰り返した。", "「でも、キズキってどことなく儚かったよね」", "「ああ。煙みたいなやつだった」", "目にかかるくらいまで伸びた艶やかな黒髪に、光を呑み込む湖底のように静かで澄んだ瞳。右耳にだけぽつんと灯る小さな黒いピアスと、彫刻刀で一筋に削り出されたかのように鋭く尖った鼻梁。そして内側から光を放ちながらもどこか冷たさを帯びた、陶器のように滑らかな白い肌。それらひとつひとつの美しいパーツは、気の遠くなるような途方もない遺伝子の配列の果てに組み合わされ、今この瞬間にしか存在し得ない、儚くも刹那的な輝きを放っていた。まるでいつか脆く崩れ去ってしまう運命を最初から約束されているかのように。", "「そして本当に煙みたいに消えてしまった」", "僕はトヲルの言葉に頷き、煙草を吸った。風に揺られるように、キズキは消えてしまった。", "「俺はさ、初めてアイツに会った時ゾッとしたんだ。何というか、世界の秘密を覗き見たような気分だった」", "「世界の秘密？」", "気になって尋ねると、トヲルはグラスのふちを指でなぞってからこちらを見つめた。", "「とにかく、存在そのものに衝撃を受けたんだ。こんなにも美しいものがこの世にあるのかってさ」", "「確かに、キズキは美しかったよね」", "「ああ。でもそれは世間一般の言う美しさとは少し違った」", "「というと？」", "「何というか、アイツの美しさは見た人の心の一番デリケートな部分を揺さぶるんだ。それは、とても激しく」", "確かに、キズキの美しさには見た人の心に強く訴えかけるようなものがあった。それは間違いない。", "「でも、その美しさは長くは続かなかった」", "僕は一度だけ頷いた。どれだけ美しいものも、いつかは尽き果てる。", "「アイツが死んでしまったことによって、アイツの美しさは永遠に失われてしまった。そしてアイツが心のうちに秘めていた想いも、アイツが死んでしまったことによって永遠に秘められてしまった」", "僕はその言葉に頷いて、キズキの心に思いを巡らせた。たくさんの秘密を残したまま、キズキは死んでしまった。そしてそれらの答えを失った遺灰は、どこへ辿り着くことも許されず、冷たい夜空のどこかで透明な風に乗り、今もこの世界を静かに彷徨い続けている。", "「きっと僕たちは、キズキの心にもっと踏み込んでいくべきだったんだよ」", "「踏み込む？」", "僕は頷き、煙草を吸った。", "「キズキはいつも優しかったけど、心の奥底には誰にも触れられたくない領域を持っていた。僕たちもそれには気づいていたけど、無理に踏み入ろうとはしなかった。だけど、その領域にこそキズキの本当の姿があったんだよ。キズキの苦悩が、痛みがそこにはあった。僕たちはきっと無理にでもその領域に踏み込むべきだったんだよ。たとえキズキが嫌がっても、そこに本当のキズキがあるんだから」", "「……本当のキズキか」", "トヲルはミモザの入ったグラスに口をつけ、喉を鳴らして飲み干すと、静かに小さな息をついた。カクテルの透き通った濃密な液体が、照明の明かりを浴びて淡く揺れている。僕はポケットから煙草を取り出して火をつけ、胸の奥まで深く吸い込んでから、白い煙を天井に向けて吐き出した。どのようにキズキと接していたら、彼を救うことができたのだろう。どのようにキズキと向き合っていたら、死の淵から連れ戻すことができたのだろう。答えは出なかった。それでも僕たちはその決して答えの出ることのない虚ろな問いに、ただいつまでも思いを巡らせていた。"]}, {"title": "第八話：海ほたる", "paragraphs": ["冷え切った身体を滑り込ませるようにして車に戻った僕たちは、そのまま羽田をあとにし、東京湾アクアラインを通って「海ほたる」へと向かうことにした。海ほたるは、暗く巨大な東京湾のただ中にぽつりと浮かぶパーキングエリアで、巨大な展望デッキや商業施設を備えた、半ば人工島のような観光スポットだった。僕にとってもキズキにとっても海ほたるを訪れるのはこれが初めてのことで、夜のアクアラインを車で走り抜けるのも当然のように初めての体験だった。羽田側から海ほたるへと足を進めるには、「アクアトンネル」と呼ばれる長い海底トンネルを潜り抜けなければならない。僕たちは緩やかな傾斜を下りながら、生まれて初めてとなる海底の闇の中へと静かに踏み込んでいった。", "「海底トンネルってのは、人類の叡智の結晶だな」", "「確かに、そうだね」", "どこまでも続く無機質な壁面と、頭上で一定の感覚で過ぎ去っていく黄色い照明の群れ。自分たちの頭上には膨大な量の漆黒の海水が蠢いているのだと思うと、車内に響くエンジン音すらどこか現実味を失い、世界の底へと深く沈み込んでいくような不思議な錯覚に囚われた。", "「ここを抜けたら人工島なんだよな？」", "「うん、そうらしいね。そしてその人工島に海ほたるパーキングエリアがある感じだね」", "僕がカーナビの画面に表示された青く細い路線を見つめながらそう言うと、キズキは「なるほどな」と小さく呟き、そのまま視線を助手席の窓の外へと戻した。頭上を絶え間なく過ぎ去っていく黄色いナトリウムランプの光が、一定の周期で車内を高速で駆け抜けていく。その規則正しい明暗の交錯が、キズキの彫りの深い横顔にいくつもの鋭い陰影を作り出していた。光が照らし出す一瞬の鋭利な輪郭と、次の瞬間に彼を呑み込む深い闇。その激しいコントラストの中に浮かび上がる彼の顔は、まるで生きているのかどうかも定かではない、美しい仮面のようにも見えた。", "「にしても、すごいよな。海底にトンネルを掘って東京と房総半島を繋げようって言うんだから。発想がすごい」", "「でも、遠回りしなくて済むから楽だよね」", "「ああ。ほんと、人間はすごいよ」", "そんな会話を交わしているうちに、不意に視界がひらけ、僕たちは果てしなく続いたトンネルの暗闇を抜け出していた。視界の先にぽっかりと浮かび上がったのは、夜の海に灯る巨大な船のような、海ほたるパーキングエリアの明かりだった。", "真夜中という時間帯のせいもあり、広大な駐車場は驚くほどガラガラに空いていた。それでもぽつり、ぽつりと数台の車が白線の中に佇んでおり、僕たちと同じようにこんな夜更けの海の上を訪れている物好きな人間が、ほかにも幾人かいるようだった。車を降りて冷たい海風を突っ切り、パーキングエリアの建物の中へと足を踏み入れてみたものの、土産物屋や飲食店は軒並みシャッターを下ろしており、昼間の賑わいが嘘のように施設の中はひっそりと閑散としていた。無機質な蛍光灯の光だけが誰もいないフロアを寂しく照らし出し、僕たちの靴音が天井に高く響いては、そのまま透明な静寂の中に吸い込まれていった。", "「まあ、もう夜中の二時だからね」", "「それもそうか。じゃあ、外でも見に行こう」", "仕方なく外に出てみると、風がとても強く、僕は思わず「寒っ」と声を出してしまった。", "「あっ、でもすごいね。夜景が綺麗だよ」", "「ああ、ほんとだ」", "目の前には、東京湾を跨ぐ一本の光の帯となって海上を駆け抜けていく車の光跡が無数に走り、そのはるか奥には、房総半島の街並みが放つささやかな光の群れが、漆黒の夜の闇にどこか淡く、切なく滲んでいた。見上げる夜空と足元の黒い海の境目はすっかり溶け合い、僕たちが今立っている場所だけが、世界からぽつりと切り離された小島のように夜の真ん中に取り残されていた。吹きすさぶ潮風が髪を激しく乱すのも構わず、僕とキズキはただ肩を並べ、闇の中に浮かび上がるその果てしない光の渦を、吸い込まれるようにじっと見つめ続けていた。", "「こんなに眺めがいいなんて知らなかったよ」", "「ほんとだな」", "東京方面が海底を潜る密やかなトンネルだったのに対して、千葉方面へは「アクアブリッジ」と呼ばれる巨大な橋が、黒々とした海を跨ぐように架けられていた。そのため遮るもののない海上には、幾筋もの車の赤と白の光跡が、夜の闇の中に鮮やかに浮かび上がって見えた。絶え間なく流れ、交差し、どこか遠くへと消えていくそれらの明かりは、まるで一本の太い光の帯となって、漆黒の海を静かに回遊する夜光虫の群れのようにも見えた。潮風がゴオゴオと耳元で鳴り響くなか、僕たちはその幻想的な光の潮流から目を離すことができずにいた。風の冷たさも忘れ、ただ夜の海を滑っていく光の粒を追いかけていると、自分たちの存在さえもその静かな流れの中に溶けていってしまうような気がした。", "「こっちからは東京の夜景が見えるよ」", "「ああ、ほんとだ」", "千葉とは反対の方角へと体を向け直すと、そこには見渡す限りの東京の街並みが広がり、そびえ立つビル群の無数の輝きが、夜の深い闇を力強く押し返すようにして眩い光を放っていた。東京方面へ続く道は足元から暗い海底トンネルへと潜り込んでいるため、海上に遮る架橋がなく、視界のすべてを覆い尽くす圧巻の夜景が千葉側よりもはっきりと、どこまでも鮮明に見渡せた。黒い海の上にぽっかりと浮かぶ光の絨毯。まるで誰かが宝石箱をひっくり返したかのように煌めくその輝きはため息が漏れてしまうほどに、驚くほど壮麗な眺めだった。僕たちはただ息をのんで、その光を見つめていた。", "「こういう景色を見てるとさ、何だか救われた気持ちになるね」", "「救われた気持ち？」", "僕は頷き、ポケットに手を突っ込んだ。", "「だって、この世界に本当の暗闇なんてないんだって、知ることができるから」", "「どういうこと？」", "不思議そうに尋ねるキズキをよそに、僕はポケットから手を出して東京の夜景を指差した。", "「星が見えなければ、地表は明るい。地表が見えなければ、星は明るい。僕たちはこの世界にいる限り、本当の暗闇を知ることはできないんだ」", "「本当の暗闇……」", "「僕はこういう景色を見ていつも思うんだ。本当の暗闇がないように、本当の絶望などない。どんなときにも希望は残っている、ってね」", "「……希望、か」", "キズキはそう言うと、暗い海の彼方に見える夜景をじっと見つめた。僕もキズキと同じように、海の向こう側にある夜景を見つめた。", "「どんな絶望に立たされていようとも、希望は残っている。そんなことをこの世界が教えてくれているような気がするんだ」", "「そうだと、いいな」", "そこまで言って、僕たちはふつりと口をつぐみ、沈黙した。ゴーと音を立てて吹きすさぶ冷たい潮風が容赦なく僕たちの体に激しく吹きつけている。その冷気の中で、キズキの繊細な髪がさらさらと柔らかく揺れていた。言葉はもう必要なかった。僕たちはただ肩を並べ、真っ暗な海の遠く彼方に揺らめくビルの光の群れをじっと見つめ、そこに確かに存在するはずの、ささやかな希望の欠片にすがりついていた。"]}, {"title": "第九話：不公平な神より、平等な死を望む。", "paragraphs": ["それからトヲルが声を出したのは、僕が七本目の煙草に火をつけ、トヲルがギムレットを口にした時だった。カランと氷がグラスの壁を叩く甲高い音が、静まり返った店内に小さく響く。ふとあたりを見回すと、いつの間にか僕たち以外に客の姿はなかった。", "「『俺は不公平な神より、平等な死を望む』」", "「キズキの言葉？」", "僕が尋ねると、トヲルはああと頷いてギムレットを飲んだ。", "「『不公平な神に従うくらいなら、死んだ方がマシだ』ってことらしいよ」", "「死んだ方がマシ、か……でもキズキはよく神を批判してたからね。何となく言ってるところは想像できるよ」", "キズキは神を憎み、ニーチェを愛していた。『神は死んだ』というニーチェの名言は、キズキの座右の銘でもあった。", "「『
