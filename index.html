<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夭折した天使たちへ | To the Angels Gone Too Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>

:root{--paper:#FDFCF8;--ink:#1A1A1A;--bronze:#8B5E3C;--umber:#3B2A20;--slate:#5B6470;--ivory:#EFE8DA;--fs:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter','Noto Serif JP',sans-serif;line-height:1.6}
.serif{font-family:'Playfair Display','Noto Serif JP',serif}
.jp{font-family:'Noto Serif JP',serif}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
/* progress */
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--bronze);z-index:60}
/* portal */
.portal{min-height:100vh;padding:clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;
background:radial-gradient(ellipse at 80% 20%,rgba(139,94,60,.18),transparent 55%),radial-gradient(ellipse at 10% 90%,rgba(91,100,112,.12),transparent 50%)}
.portal .eyebrow{position:static;margin-bottom:auto;max-width:min(100%,calc(100% - 12rem));padding-bottom:2rem;font-size:12px;line-height:1.9;letter-spacing:.35em;text-transform:uppercase;color:var(--bronze)}
.portal h1{font-family:'Playfair Display','Noto Serif JP',serif;font-weight:400;font-size:clamp(3rem,9vw,8rem);line-height:1.02;letter-spacing:-.01em;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.portal h1 em{display:block;font-size:.34em;font-family:'Noto Serif JP',serif;font-style:normal;font-weight:300;letter-spacing:.3em;color:var(--bronze);margin-bottom:1.2rem}
.portal .abs{margin-top:2.5rem;max-width:34rem;font-family:'Noto Serif JP',serif;font-weight:300;font-size:1rem;line-height:2.1;color:#444;animation:rise 2s .3s cubic-bezier(.2,.7,.2,1) both}
.enter{margin-top:3rem;align-self:flex-start;border:1px solid var(--ink);padding:1rem 2.2rem;letter-spacing:.25em;font-size:13px;text-transform:uppercase;transition:.4s;animation:rise 2s .6s both}
.enter:hover{background:var(--ink);color:var(--paper)}
.ghost{position:absolute;right:-2vw;top:8vh;font-family:'Playfair Display',serif;font-size:min(34vw,420px);line-height:1;color:rgba(139,94,60,.07);user-select:none;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
/* top controls */
.ctl{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:8px}
.ctl button{background:rgba(253,252,248,.9);backdrop-filter:blur(6px);border:1px solid #ddd5c6;padding:.55rem 1rem;font-size:12px;letter-spacing:.18em;transition:.3s}
.ctl button:hover{border-color:var(--bronze);color:var(--bronze)}
/* reader */
.reader{display:grid;grid-template-columns:minmax(0,76fr) minmax(0,24fr);max-width:1720px;margin:0 auto}
.text{padding:12vh clamp(24px,3vw,56px) 16vh clamp(24px,4vw,72px)}
.prose{max-width:min(100%,58rem);margin:0 auto}
.prose p{font-family:'Noto Serif JP',serif;font-size:var(--fs);line-height:2.1;margin-bottom:1.35em;font-weight:300;text-align:justify;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
.prose p.in{opacity:1;transform:none}
.prose p.d{padding-left:1.1em;border-left:1px solid #e3dccd;margin-bottom:.75em}
.prose p.line{text-align:center;color:var(--bronze);font-family:'Playfair Display','Noto Serif JP',serif;font-size:1.18em;margin:2.2em 0;border:0;padding:0}
.prose p.rc{font-family:'Inter',monospace;font-size:.84em;line-height:1.95;background:var(--ivory);padding:1rem 1.2rem;border-left:2px solid var(--bronze);letter-spacing:.04em;text-align:left;margin:1.8em 0}
.prose p.fin{text-align:center;color:var(--bronze);font-family:'Playfair Display','Noto Serif JP',serif;font-size:1.3em;margin-top:2.5em}
.chap{padding:7vh 0 2vh}
.prose .chap:first-child{padding-top:0}
.prose .chap h2{font-size:clamp(1.6rem,2.2vw,2.3rem);margin:.4rem 0 1.8rem}
.chap .no{font-family:'Playfair Display',serif;font-style:italic;color:var(--bronze);font-size:1rem;letter-spacing:.2em}
.chap h2{font-family:'Playfair Display','Noto Serif JP',serif;font-weight:400;font-size:clamp(1.8rem,3.2vw,3rem);line-height:1.25;margin:.5rem 0 2.4rem}
.chap p{font-family:'Noto Serif JP',serif;font-size:var(--fs);line-height:2.15;margin-bottom:1.5em;font-weight:300;text-align:justify;opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease}
.chap p.in{opacity:1;transform:none}
.chap p.d{text-indent:0;margin-bottom:.9em;padding-left:1em;border-left:1px solid #e3dccd}
.chap p.rc{font-family:'Inter',monospace;font-size:.85em;line-height:1.9;background:var(--ivory);padding:1rem 1.2rem;border-left:2px solid var(--bronze);letter-spacing:.04em}
.chap p.fin{font-family:'Playfair Display','Noto Serif JP',serif;font-size:1.35em;color:var(--bronze);text-align:center;margin-top:3em}
.chap p{text-indent:1em}
.chap p.d,.chap p.line,.chap p.rc,.chap p.fin{text-indent:0}
.stage{position:sticky;top:0;height:100vh;padding:clamp(12px,1.4vw,22px) clamp(12px,1.4vw,22px) clamp(12px,1.4vw,22px) 0}
.canvas{position:relative;height:100%;overflow:hidden;background:var(--umber)}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,4vw,64px);color:#f5eee2}
.scene.on{opacity:1}
.scene::before{content:"";position:absolute;inset:0;background:var(--g);transform:scale(1.15,1);transition:transform 6s ease}
.scene.on::before{transform:scale(1,1)}
.scene::after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.scene>*{position:relative;z-index:1}
.scene .big{position:absolute;z-index:1;top:3vh;right:3vw;font-family:'Playfair Display',serif;font-size:min(22vw,300px);line-height:1;opacity:.14}
.scene .kw{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.3rem,1.9vw,2.1rem);line-height:1.15}
.scene .cap{margin-top:.7rem;max-width:19rem;font-family:'Noto Serif JP',serif;font-weight:300;font-size:.82rem;line-height:1.9;opacity:.85}
.scene .big{font-size:min(13vw,180px)}
.scene .tone{font-size:11px;letter-spacing:.35em;text-transform:uppercase;opacity:.65;margin-bottom:.8rem}
.rcpt{position:absolute;z-index:1;top:50%;left:50%;transform:translate(-50%,-56%) rotate(-2deg);background:#f6f1e4;color:#222;padding:1.6rem 1.8rem;width:min(300px,70%);font-family:'Inter',monospace;font-size:12px;line-height:1.9;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.rcpt b{display:block;text-align:center;letter-spacing:.3em;margin-bottom:.6rem;font-size:15px}
.rcpt hr{border:0;border-top:1px dashed #b8ad96;margin:.6rem 0}
/* gallery */
.gal{background:var(--ink);color:#eadfce;padding:16vh clamp(24px,5vw,80px)}
.gal h2{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(2.4rem,6vw,5.5rem);line-height:1.05}
.gal .sub{margin-top:1rem;color:#a99a85;font-family:'Noto Serif JP',serif;font-weight:300;max-width:34rem}
.grid{margin-top:8vh;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{position:relative;overflow:hidden;min-height:320px;cursor:pointer;display:flex;align-items:flex-end;padding:1.4rem;text-align:left;color:#f5eee2;transition:transform .6s}
.card::before{content:"";position:absolute;inset:0;background:var(--g);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover::before,.card:focus-visible::before{transform:scale(1.12,1.04)}
.card span{position:relative}
.card small{display:block;font-size:11px;letter-spacing:.3em;opacity:.7;margin-bottom:.4rem}
.card i{font-family:'Playfair Display',serif;font-size:1.5rem}
.c1{grid-column:span 7;min-height:440px}.c2{grid-column:span 5}.c3{grid-column:span 4}.c4{grid-column:span 4}.c5{grid-column:span 4}.c6{grid-column:span 5}.c7{grid-column:span 7}
footer{padding:10vh clamp(24px,5vw,80px);font-size:13px;letter-spacing:.15em;color:var(--slate);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem 2rem}
footer span,footer a{display:block;min-width:0;white-space:normal}
/* constellation overlay */
.map{position:fixed;inset:0;z-index:70;background:rgba(26,26,26,.97);color:#eadfce;display:none;overflow:auto}
.map.open{display:block;animation:fade .5s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.map .close{position:fixed;top:18px;right:22px;font-size:12px;letter-spacing:.2em;border:1px solid #6d5a48;padding:.55rem 1rem;color:#eadfce}
.map h3{font-family:'Playfair Display',serif;font-weight:400;font-size:1.3rem;padding:80px 6vw 0;color:var(--bronze);font-style:italic}
.nodes{position:relative;min-height:80vh;padding:6vh 6vw}
.node{position:absolute;text-align:left;padding:.9rem 1.2rem;border:1px solid #4a3d31;border-radius:999px;transition:.4s;max-width:15rem;background:rgba(255,255,255,.02)}
.node:hover,.node:focus-visible{background:var(--bronze);border-color:var(--bronze);color:#fff}
.node small{display:block;font-size:10px;letter-spacing:.3em;opacity:.6;text-transform:uppercase}
.node span{font-family:'Noto Serif JP',serif;font-size:.95rem}
@media(max-width:820px){
 .reader{display:block;position:relative}
 .stage{display:none}
 :root{--fs:14px}
 .text{position:relative;z-index:1;padding:0 28px 16vh;background:var(--paper)}
 .prose p,.chap p{line-height:2}
 .prose .chap h2{font-size:1.3rem;margin-bottom:1.4rem}
 .chap .no{font-size:.9rem}
 .portal h1{font-size:clamp(2.4rem,11vw,3.4rem)}
 .portal h1 em{font-size:.38em}
 .portal .abs{font-size:.88rem;line-height:2}
 .ctl{top:10px;right:10px;gap:6px}
 .ctl button{padding:.4rem .7rem;font-size:11px}
 .grid{display:flex;flex-direction:column;align-items:center;gap:14px}
 .card,.c1,.c2,.c3,.c4,.c5,.c6,.c7{grid-column:auto;width:min(100%,420px);min-height:0;aspect-ratio:1/1;margin:0;padding:1.4rem;align-items:center;justify-content:center;text-align:center}
 .card span{width:100%}
 .node{position:relative!important;left:auto!important;top:auto!important;display:block;margin:10px 0;max-width:none;border-radius:16px}
 .nodes{min-height:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.chap p{opacity:1;transform:none}.door>*{opacity:1!important}.door>*:not(.rcpt){transform:none!important}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,8,6,.92);display:none;align-items:center;justify-content:center;padding:4vw}
.modal.open{display:flex}
.modal .box{width:min(960px,100%);height:min(70vh,640px);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:3rem;color:#f5eee2;background:var(--g)}
.modal .box p{max-width:30rem;font-family:'Noto Serif JP',serif;font-weight:300;line-height:2;margin-top:1rem}
.modal h4,.modal .box p{white-space:pre-line}
.modal h4{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:clamp(2rem,4vw,3.4rem)}
.modal button{position:absolute;top:16px;right:16px;border:1px solid #fff5;padding:.5rem 1rem;font-size:12px;letter-spacing:.2em}
/* edit mode */
#editor{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:95;display:none;align-items:center;gap:8px;background:#1A1A1A;color:#f5eee2;padding:.6rem .8rem;box-shadow:0 18px 44px rgba(0,0,0,.4);flex-wrap:wrap;max-width:94vw}
body.editing #editor{display:flex}
#editor .st{font-size:12px;letter-spacing:.08em;color:#bda98f;padding:0 .5rem;max-width:22rem;line-height:1.5}
#editor button{border:1px solid #6d5a48;padding:.5rem .9rem;font-size:12px;letter-spacing:.15em;transition:.25s}
#editor button:hover{border-color:#bda98f}
#editor button.primary{background:var(--bronze);border-color:var(--bronze);color:#fff}
body.editing .prose p{opacity:1!important;transform:none!important}
body.editing [data-edit]{outline:1px dashed rgba(139,94,60,.45);outline-offset:4px;cursor:text;transition:background .2s}
body.editing [data-edit]:hover,body.editing [data-edit]:focus{background:rgba(139,94,60,.07);outline-color:var(--bronze)}
body.editing .card{pointer-events:none}
body.editing .chap h2{outline:1px dashed rgba(139,94,60,.45);outline-offset:6px}
body.editing .chap p{opacity:1!important;transform:none!important}
.chdel{display:none;font-size:11px;letter-spacing:.14em;color:var(--bronze);border:1px solid #ddd5c6;padding:.35rem .7rem;margin-bottom:1.2rem;background:rgba(253,252,248,.9);cursor:pointer}
body.editing .chdel{display:inline-block}
body.editing .chdel:hover{border-color:var(--bronze);background:#fff}
body.editing .portal h1{outline:none!important;background:none!important;cursor:text}
/* 章扉（モバイルのみ表示） */
.door{display:none}
@media(max-width:820px){
 .door{display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:#f5eee2;min-height:100vh;min-height:100svh;margin:0 -28px 7vh;padding:28px 28px 12vh}
 .door::before{content:"";position:absolute;inset:0;background:var(--g)}
 .door::after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
 .door>*{position:relative;z-index:1;opacity:0;transition:opacity 1.2s ease}
 .door>*:not(.rcpt){transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
 .door.in>*{opacity:1}
 .door.in>*:not(.rcpt){transform:none}
 .door .big{position:absolute;top:6vh;right:6vw;font-family:'Playfair Display',serif;font-size:min(46vw,220px);line-height:1;opacity:0;margin:0}
 .door.in .big{opacity:.16}
 .door .tone{font-size:11px;letter-spacing:.35em;text-transform:uppercase;margin-bottom:.8rem}
 .door.in .tone{opacity:.65}
 .door .kw{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.2}
 .door .cap{margin-top:.8rem;max-width:20rem;font-family:'Noto Serif JP',serif;font-weight:300;font-size:.85rem;line-height:1.95}
 .door.in .cap{opacity:.88}
 .door .rcpt{top:42%;width:min(280px,74%)}
 body.editing .door>*{opacity:1!important}
 body.editing .door>*:not(.rcpt){transform:none!important}
 body.editing .door .big{opacity:.3!important}
 body.editing .door [data-d]{outline:1px dashed rgba(245,238,226,.55);outline-offset:4px}
 body.editing .door [data-d]:focus{background:rgba(255,255,255,.12);outline-color:#fff}
}
/* stage edit */
.scene{pointer-events:none}.scene.on{pointer-events:auto}
body.editing .scene [data-s]{outline:1px dashed rgba(245,238,226,.55);outline-offset:4px;cursor:text}
body.editing .scene [data-s]:focus{background:rgba(255,255,255,.12);outline-color:#fff}
/* login */
.login{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,.94);display:none;align-items:center;justify-content:center;padding:4vw}
.login.open{display:flex}
.login .lb{width:min(380px,100%);background:var(--paper);padding:2.2rem 2rem;position:relative}
.login h4{font-family:'Playfair Display',serif;font-weight:400;font-size:1.4rem;margin-bottom:1.4rem;color:var(--umber)}
.login input{width:100%;border:1px solid #ddd5c6;background:#fff;padding:.8rem 1rem;margin-bottom:.8rem;font:inherit;font-size:14px;color:var(--ink)}
.login input:focus{outline:2px solid var(--bronze);outline-offset:1px}
.login .go{width:100%;background:var(--ink);color:var(--paper);padding:.85rem;letter-spacing:.25em;font-size:12px}
.login .go:disabled{opacity:.5}
.login .msg{min-height:1.4em;margin-top:.9rem;font-size:12px;color:#a33;line-height:1.6}
.login .x{position:absolute;top:10px;right:12px;font-size:11px;letter-spacing:.2em;color:var(--slate)}

.ctl{display:flex}

.back-row{position:relative;z-index:3;padding:18px clamp(24px,5vw,72px) 0}
.back{font-size:12px;letter-spacing:.2em;text-decoration:none;border:1px solid var(--ink);padding:.5rem .9rem;background:rgba(253,252,248,.92)}
.back:hover{background:var(--ink);color:var(--paper)}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:linear-gradient(rgba(253,252,248,.18),rgba(253,252,248,.42)),url("assets/cover.png") center/cover no-repeat}
.hero-in{position:relative;z-index:1;max-width:1000px;padding:0 clamp(24px,8vw,140px)}
.hero .eyebrow{font-size:12px;letter-spacing:.35em;color:var(--bronze)}
.jp-t{font-size:clamp(1.2rem,2.4vw,1.8rem);letter-spacing:.4em;color:var(--bronze);margin:1.6rem 0 .8rem}
.hero h1{font-family:'Playfair Display','Noto Serif JP',serif;font-weight:400;font-size:clamp(2.4rem,5.4vw,4.8rem);line-height:1.08;color:var(--ink)}
.hero .abs{margin-top:1.8rem;max-width:34rem;font-size:.95rem;line-height:2;color:#444}
.hero .enter{margin-top:2.6rem}

.works{list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:8vw;row-gap:5rem}

.works li.r{margin-top:9rem}

.works li:hover h3{color:var(--bronze)}
footer a{text-decoration:none}
.hero .eyebrow{color:#4a2e1a;font-weight:500;text-shadow:0 0 12px rgba(253,252,248,.95),0 0 4px rgba(253,252,248,.9)}

.lbl{display:block;font-size:12px;letter-spacing:.15em;color:var(--bronze);margin-bottom:.4rem}

@media(min-width:821px){.works h3{font-size:1.6rem}.works .sub{font-size:1rem}.works p{font-size:1rem;max-width:30rem;line-height:2}.works .tag{font-size:12px}.works .no{font-size:1rem}}

<script>
const DATA={"stories": [{"id": "s1", "group": "夭折した天使たちへ", "title": "ジェラール・フィリップは洗われた", "chapters": [{"title": "", "paragraphs": ["世界のどこかに土曜日の昼下がりに五万円のジャケットを買う人がいて、その人が一冊の古い文庫本を読んでいた、という事実を僕はときどき理由もなく思い出すことがある。別に実際に見たわけではない。ただ、そういう人が確かにどこかに存在していたのだろう、という感覚だけが、なぜか長い間頭の片隅には残っていた。高価な服を買うことと、古い文庫本を読むこと。その二つが同じ一日の中に並んでいることが、僕には奇妙なほど現実的で、同時に少しだけ不思議な感じがした。その人の顔は浮かばない。年齢も性別もわからない。けれどその人が買い物袋を片手に、二月の空の下、渋谷の街を歩いている光景だけは、なぜか鮮明に想像できる。乾いた冬の空気と、昼過ぎの白っぽい光。渋谷パルコの前の広場に斜めに落ちる、少し硬質な日差し。実際にはそこへ行ったことなど一度もないのに、その場所だけは昔から知っている景色みたいに頭に浮かぶ。車通りの多い交差点。信号待ちをする人たち。コートの襟を立てて歩く若い男女。ビルのガラスに反射する淡い冬の光。そういう細部までもがなぜか僕には容易に想像ができる。多分僕は、その景色そのものに惹かれているというより、そこに偶然存在していた無数の他人の生活に惹かれているのだと思う。自分とはまったく関係のない誰かが、何かを買い、何かを読み、誰かと待ち合わせをし、あるいは一人で歩いて帰る。そのこと自体に静かな生活感がある。自分の知らない場所で、自分とは無関係な時間が、今も静かに流れ続けている。そんな当たり前の事実に、僕はほっと胸を撫で下ろしていたのかもしれない。とにかく僕は今も世界のどこかにいる、誰かに思いを馳せている。名前も知らない、顔も知らない。声も、年齢も、身分すらわからない誰かに、思い馳せている。"]}, {"title": "", "paragraphs": ["大学の第二外国語のフランス語の授業だった。午後の教室には窓から差し込む光が机上に細長く伸びていた。教授は黒板に向かい、チョークを走らせながら動詞の活用について説明していた。前の席では誰かが教科書のページをめくり、少し離れたところから椅子の脚が床を擦る音が聞こえた。", "僕は教授の説明を聞きながら、ノートに書き取った例文の下へ、意味のわからない単語をいくつか書き足していた。", "教授が黒板に「lavé」と書いたのは、そのときだった。", "「これは過去分詞です。洗われた、という意味になります。たとえば、洗いをかけた服のことを、フランス語ではこう言うこともあります」", "その言葉を耳にした瞬間、ノートを走っていたペン先が止まった。", "COTON MILITAIRE LAVE。", "頭の中で、古い文庫本に挟まっていたレシートの文字が、そのまま浮かび上がった。日付も、時刻も、店の名前も、金額も、もう何度見返したかわからない。けれど、その三つの単語だけは、いつ見ても少し不思議な感じがした。僕はノートの余白に、教授が黒板に書いたものと同じように、COTON MILITAIRE LAVEと書き写した。書いてみると、レシートに印字されていたときよりも、ずっと意味のある言葉に見えた。", "「何、それ」", "隣の席から、小さな声が聞こえた。顔を向けると、髪を一つに束ねた女の子が僕のノートを覗き込んでいた。彼女は片手で教科書のページを押さえ、もう片方の手にはシャープペンシルを持っていた。覗き込んだ拍子に、耳の横に残っていた短い髪が頬にかかる。彼女はそれを指先で軽く払ってから、ノートの文字をもう一度確かめた。", "「あ、いや。服の名前で」", "「ミリタリー。軍隊の？」", "「そう。ジャケットの」", "「へえ。かっこいいね」", "彼女は文字を読み終えると、特にそれ以上尋ねることもなく、教科書へ視線を戻した。何かを気に入ったときに、深く考えずそのまま口にするような言い方だった。僕はどうしてその言葉をノートに書いたのか説明しようかと思った。古本屋で買った本にレシートが挟まっていたこと。そのレシートに、今書いたのと同じ文字が印字されていたこと。けれど、初めて話した相手にするには、どれも少し長い話のような気がした。", "「……うん」", "結局、返したのはそれだけだった。ちょうど教授が次の例文を読み始め、教室のあちこちでペンの音が戻ってきた。彼女も黒板に目を向け、自分のノートに何かを書き始めた。僕はしばらく彼女の横顔を見ていたが、やがて自分のノートに視線を落とした。そこには、授業の内容とはほとんど関係のない三つの単語が、ほかの文字より少し大きく書かれていた。それが、フユとの最初の会話だった。"]}, {"title": "", "paragraphs": ["フユは文学部で、フランス語は単位を取るために履修していた。けれど彼女の発音は驚くほど上手だった。教授が黒板に書いた文章を順番に読ませるとき、彼女の番になると、教室の空気がほんの少しクリアになった。フランス語特有の鼻に抜ける音も、単語と単語のあいだを滑らかにつなぐ発音も、初めからその言葉を知っていたようだった。教授は彼女が読み終わるたびに発音が素晴らしい、と褒めた。フユはそのたびに、ありがとうございます、と小さく頭を下げた。得意げになるわけでも、謙遜して否定するわけでもなく、慣れたように微笑みを浮かべた。僕は彼女の後に同じ文章を読まされることが何度かあったが、自分の口から出てくるフランス語は、どうしても教科書の文字を一つずつ拾い上げているように聞こえた。", "彼女と初めて会話をした授業が終わった後、僕たちは学食で一緒に食事をした。昼休みの学食はびっくりするほど混雑していて、トレーを持った学生たちが空席を探して行き来していた。窓際の席がひとつ空いていたので、そこに向かい合って座った。フユは日替わり定食を選び、僕はカレーライスを頼んだ。彼女は食べる前に、テーブルに置かれた紙ナプキンを一枚取って、膝の上に落ちた水滴を拭いた。それから、今日の課題どうだったと尋ねた。", "最初は授業の課題について話していた。動詞の活用がどうにも覚えられないとか、教授が出す小テストは妙に細かいとか、そんなことだった。彼女は僕が間違えた箇所を覚えていて、そこは前にもやったところだよ、と言って笑った。僕は少しばつが悪かったが、彼女の説明はわかりやすかった。", "食事が進むにつれて、話題は少しずつ授業から離れていった。彼女が最近読んだ本の話をし、僕が昔観た映画の話をした。アルバイト先の店長がいかに理不尽かという話になると、彼女は自分の勤めている書店にも似たような人がいると言って、レジで起きた出来事を話してくれた。話の途中で何度か笑い声を立てたが、周囲の学生たちの声に紛れてしまうくらい小さかった。彼女は話をするとき、相手の言葉を遮らなかった。僕がうまく説明できずに途中で言い直しても、急かすことなく待っていた。そうしているうちに、食べ終わった後も席を立つ理由がなくなってしまった。", "\\", "&#x20;　それから授業のない日にも会うようになった。", "大学の図書館で待ち合わせたり、駅前の喫茶店でコーヒーを飲んだり、彼女のアルバイトが終わる時間に合わせて書店の近くまで行ったりした。特別な約束をしたわけではなかった。どちらかが何かを読み終えたとき、面白かったから読んでみて、と連絡をする。その本について話したくなって、次に会う日を決める。そんなことが何度か続くうちに、会うこと自体が僕たちの予定のなかに自然に組み込まれていった。\\", "&#x20;　彼女は読書家だった。小説だけでなく、エッセイや評論も読んでいたし、気に入った本は何度も読み返していた。気に入った文庫本の端には時折鉛筆で線が引かれていて、ページの隅が少しずつ丸まっていた。彼女は本の話をするとき、あらすじを説明するよりも、ある一節のことや、登場人物が何気なく口にした言葉について話すことが多かった。どうしてそんなところを覚えているのだろうと思うような些細な文章を彼女は何週間も経ってから正確に思い出したりした。ある日、僕がとある作家の名前を挙げると、彼女はそれまで手にしていたカップをテーブルに置いた。", "目が少し大きくなり、さっきまでとは明らかに違う表情で僕を見た。\\", "&#x20;「え、その人読むの？」\\", "&#x20;　声に出してから、自分でも意外だったというように、彼女は少し笑った。", "僕が頷くと、どの作品が好きなのか、いつから読んでいるのか、矢継ぎ早に尋ねてきた。僕は彼女の質問に答えながら、その作家について一体自分がどれほど知っているのか急に心配になった。彼女のほうがずっと詳しいのではないかと思ったし、実際、その予感はすぐに当たった。それでも彼女は、僕の話を途中で訂正したり、知識を披露したりはしなかった。ただ自分の好きな作品について話し始めた。普段より少し早口になって、言葉を探すために何度か視線を宙に泳がせた。僕はそのとき初めて、彼女が本の話をするのを好きなのではなく、本の話を誰かとすることが好きなのだと思った。", "「ねえ、あなたなんだかジェラール・フィリップみたいね」", "小説の話がひと段落したあと、彼女は思い出したようにそう言った。", "「ジェラール・フィリップ？」", "「うん。知らない？　フランスの俳優」", "「知らないな」", "「『花咲ける騎士道』とか『肉体の悪魔』とか。昔の映画だけど」", "「初めて聞いたよ」", "僕が正直に答えると、彼女は肩を揺らして笑った。", "「そう。でも、とてもよく似てる気がする。目元とか」", "「そうかな」", "「まあ、今度調べてみなよ」", "彼女はそう言って、ストローで飲み物をかき混ぜた。氷がグラスの内側に当たって、小さな音がした。僕はその音を聞きながら、彼女の話し方が好きだと思った。何かを無理に伝えようとせず、ただそこにある事実をそっと手渡すような声のトーン。窓から差し込む午後の光が、彼女の束ねた髪の輪郭を淡く縁取っていた。僕はストローから指を離し、飲みかけのアイスコーヒーを見つめながら、この時間がずっと続けばいいのにとぼんやりと考えた。"]}, {"title": "", "paragraphs": ["その夜、僕は部屋に帰ると、ジェラール・フィリップと検索した。画面には、白黒の写真がいくつも表示された。巻き毛の好青年がこちらを見て少し困ったように笑っている。整った顔立ちというより、どこか頼りなさげで、素直に笑いきれていないような、おぼつかない表情だった。写真の中の彼はこちらの知らない時間を生きていて、こちらの知らない場所で誰かに愛され、誰かを失い、誰にも知られないような些細なことで機嫌を損ねたりもしたのだろう。そんな当たり前のことを考えながら、僕は彼の生年月日と没年を確かめた。三十六歳だった。思っていたよりずっと若かった。出演作の一覧を開くと、知らない映画の題名が縦に並んでいた。古いポスターには、彼の顔が何度も印刷されていた。どの写真でも巻き毛の具合や目元の印象は少しずつ違っていたが、そこに在りし日の自分の面影を探すように、僕はそれらの写真を一枚ずつ眺めた。けれど見れば見るほど、自分が彼に似ているのかどうかはわからなくなった。そもそも僕と彼とでは生きた時代も、育った場所も、身につけていた服も違う。似ているという言葉が、顔の輪郭や目鼻立ちのことなのか、それとも写真から受ける漠然とした印象のことなのか、僕には判断がつかなかった。気がつくと、部屋の照明だけがついたまま、窓の外はすっかり暗くなっていた。机の上には朝から飲みかけの水が入ったグラスと、大学の講義で使ったノートが開きっぱなしになっていた。画面の隅には、彼が出演した映画の配信情報がいくつか表示されていた。一本くらい観てみようかと思った。けれど、どれも再生ボタンを押す寸前で止まった。彼の声を聞いてしまえば、僕はフユと関わる中で、常に彼の存在を意識しなければならないような気がした。そしてそれはとても気疲れしてしまうように思えた。結局、僕は一本も観ないまま画面を閉じた。似ていると言われたことが褒め言葉なのかどうかも、よくわからなかった。ただ、彼が三十六歳で死んだということと、フユがその名前を知っていたということだけが、脳裏を離れなかった。僕はもう一度、暗くなった画面に映る自分の顔を見た。"]}, {"title": "", "paragraphs": ["翌日の授業の前に、「調べたよ」と伝えると、彼女はペンを回しながら訊いた。", "「どうだった」", "「よくわからなかった」", "「わからなかった？」", "フユが首を傾げた。", "「自分とどこが似ているのか、さっぱりわからなかった」", "僕が正直に答えると、彼女はにこりと笑った。", "「わからなくていいのよ」", "「どうして？」", "「そのうちわかるから」", "「そのうち？」", "「うん、そのうち」", "短い沈黙が流れた。", "「ねえ、あなたはどんなふうに生きてきたの？」", "「どんなふうに？」", "彼女は静かに頷いた。", "「どこから来て、どこへ向かっていたのか。どんな部屋に住み、朝には何を飲むのか。休日には何をして過ごすのか」", "その問いを、僕は何度か反芻した。", "「普通だよ」", "「ふつう？」", "僕は頷いた。", "「裕福でもないし、貧乏でもない家庭に生まれて、流れに身を任せるように大学受験をして、西荻窪のアパートでコーヒーを飲みながら、本を読んでる」", "僕がありのままに話すと、彼女は何度かしきりに瞬きをしてから、今にも消え入りそうな声で、「そっか」とだけ呟いた。", "「大した生活はしてないけど、それなりには充実してるよ」", "「そう。なら、よかったわ」", "彼女はそう言って、満足げにノートにペンを走らせた。僕はその姿を見つめながら、彼女という存在に強く惹かれ始めている自分に気がついていた。"]}, {"title": "", "paragraphs": ["一人暮らしの部屋にフユはよく来た。六畳ほどの部屋には、ベッドと本棚と、小さな折りたたみの机がひとつあるだけだった。二人で机に向かうと、ノートを広げる場所にも困った。彼女が教科書を開けば、僕は自分のノートを膝の上に置いた。消しゴムを貸してほしいと言われるたびに、机の向こうまで手を伸ばさなければならなかった。ときどき肘がぶつかり、そのたびにどちらからともなく少し身体を引いた。課題が一段落すると、彼女は椅子の背にもたれて、しばらく天井を眺めていた。僕が続きをやろうと言うと、もう少し休ませて、と答えた。夕食も二人で作った。彼女は味噌汁を作るのが上手だった。冷蔵庫に残っている野菜を見て、何を入れるか決めるのが早かったし、味噌を溶くときも、いつも目分量だった。僕は米を炊くことだけは得意だった。水の量を間違えたことがほとんどなく、炊き上がった米はいつもふっくらとしていて、彼女に褒められた。大したことではないのに彼女は蓋を開けるたびに、今日も上手に炊けてるね、と言った。僕はその言葉を聞くたびに米を炊くくらい誰にでもできる、と返した。彼女は、そういうことじゃないんだけど、と言って笑った。食事のあとは、どちらかが洗い物をした。僕が洗っているあいだ、彼女は流しの横で濡れた食器を拭いていたこともあるし、反対に彼女が洗い、僕が拭くこともあった。そうした分担を決めた覚えはなかった。気がつけば片方が何かをしていると、もう片方も自然に手を動かしていた。彼女が来る日は、帰りに牛乳を買ってきてもらうことがあった。僕は彼女の好きな銘柄のヨーグルトを冷蔵庫に入れておくようになった。特別なことをしているつもりはなかったが、買い物のときに自分以外の誰かについて考えることは、それまでの生活にはなかったことだった。", "いつしか彼女は僕の使っているマグカップで水を飲んだ。最初にそれを見たとき、僕は何となく自分のものだと説明しようとしたが、彼女はもう口をつけていたので、結局何も言わなかった。それ以来、そのカップは二人で使うものになった。彼女は読みかけの本を机の隅に置いて帰ることがあった。次に来たときには、その続きを読み始める。ときどき、前にどこまで読んだのか忘れてしまったと言って、僕に尋ねることもあった。僕が覚えていないと、彼女は少し呆れた顔をして、栞を挟んでおけばよかった、と自分に言い聞かせるように呟いた。洗面台には、いつの間にか彼女のヘアゴムがひとつ残っていた。黒くて、飾りも何もついていない、ごく普通のものだった。僕はそれを見つけたとき、彼女に忘れているよと連絡しようかと思ったが、次に来たときに渡せばいいと思い直した。ところが、次に来たときも、その次に来たときも、渡すのを忘れてしまった。彼女も特に気にしていないようだった。ヘアゴムはしばらく洗面台の隅に置かれたままになり、いつしかそこにあることが当たり前になった。", "部屋に二人分の食器が増えていくにつれて、生活というものの輪郭が少しずつはっきりしていくような感覚を覚えた。以前は冷蔵庫に何が入っているかも、洗濯をいつするかも、すべて自分の都合だけで決まっていた。けれど彼女が来るようになってからは、夕食の材料を少し多めに買い、使った食器を二人分まとめて洗い、彼女が読み終えるまで机の上の本を動かさないようになった。彼女が帰ったあとの部屋には、使われたマグカップや、畳まれたブランケットや、読みかけの本が残っていた。そういうものを片づけずに眺めている時間も僕は嫌いではなかった。誰かと暮らすということがどういうものなのか、僕にはまだわからなかったけれど、少なくとも誰かが帰ったあとにも、その人の気配が部屋に残るということだけは身に沁みて実感した。", "それでもふとした瞬間に、僕は『あの人』のことを思い出した。車の窓から渋谷方面の看板を見かけたときだった。見慣れた地名が視界の端を通り過ぎただけなのに、そこに結びついていた何かが、思いがけず意識の底から浮かび上がってきた。街の服屋の前でカーキ色の上着が目に入ったときもそうだった。店先のマネキンが着ていただけで、特段珍しい色でもなかった。誰かが土曜日の予定を話しているのを聞いたとき、古本屋で本を買ったあとにレシートを受け取ったときにも同じことが起きた。レシートには店名と日付と金額が印字されていて、商品名には『文庫本』とだけ記されていた。それなのに、紙を財布にしまうとき、僕は一瞬だけ手を止めてしまった。そういう瞬間は、決まって唐突に訪れた。何かを探しているわけではなかったし、忘れないように努めているわけでもなかった。むしろ、日々の暮らしに追われているときほど、何の前触れもなく思い出した。夕食の味噌汁をよそっているときや、フユが机に向かってフランス語の課題を解いているときでさえ、ふいにその人のことが頭をよぎることがあった。", "思い出すといっても、何かが鈍く痛むわけではなかった。胸が締めつけられることもなければ、その場に立ち尽くしてしまうこともなかった。ただ、胸の奥のどこかに、消えないまま燻り続ける残火のようなものがあった。普段はそこにあることさえ忘れている。けれど、何かの拍子に空気が通ると、まだ熱を持っていることがわかる。もう一度燃え上がるほどの力はないのに、完全に冷めてしまうこともなかった。フユと一緒にいるときでも、その火は消えなかった。彼女が隣で本を読んでいるとき、僕の作ったご飯を食べているとき、何か面白いことを思い出して話しているとき、僕は確かに彼女との時間を過ごしていた。彼女の声や、食器を置く音や、洗面台に残されたヘアゴムは、どれもその時間に属していた。あの人のことを思い出す時間とは何かが違っていた。しかしそれは決してどちらかがどちらかの代わりになるという話ではなかった。フユと過ごす時間が増えたからといって、あの人の記憶が薄くなるわけではないし、あの人を思い出すからといって、フユといる時間が色褪せるわけでもなかった。僕のなかでは、それぞれが別の場所にあり、それぞれが互いに干渉することなく、互いの領域に踏み込まず、静謐に存在していた。僕はずっと昔人の心というものはもっと単純にできているのだと思っていた。新しいものが入ってくれば、古いものは少しずつ場所を譲っていくのだと思っていた。けれど、実際にはそうではなかった。新しい食器を買い足しても、食器棚の奥にしまった古い皿がなくならないように、僕のなかには、使わなくなったあともそのまま残っている場所があった。"]}, {"title": "", "paragraphs": ["しかし、いつまでも『その人』のことを隠していることはできない。その話をフユにしたのは、十一月の夜だった。その日は僕の部屋で鍋をしていた。夕方から冷え込みが厳しくなり、大学から帰る途中、駅前のスーパーで白菜と長ねぎ、それから豚肉を買った。フユは豆腐を選び、僕は鍋つゆの棚の前でしばらく迷った。結局、いつも買っているものにした。部屋に着くころには、買い物袋を持つ指先が冷たくなっていた。", "鍋は折りたたみの机の上に置いた。二人で向かい合って座るには少し狭く、彼女が箸を伸ばすと、僕の茶碗に当たりそうになった。フユは白菜をよく食べた。煮えて柔らかくなった葉の部分を箸でつまみ、少し冷ましてから口に運んでいた。僕が肉を取りすぎると、そんなに食べるの、と言った。僕は鍋なんだからいいだろうと答えた。彼女は笑って、そういう問題じゃない、と言った。食べ終わるころには、窓がすっかり曇っていた。外の街灯は輪郭を失い、黄色い光だけがガラスの向こうにぼんやり浮かんでいた。鍋の火を止めても、部屋にはしばらく湯気と出汁の匂いが残っていた。フユは食器を流しに運び、僕は鍋を片づけた。彼女が洗い物をしているあいだ、僕は濡れた机を布巾で拭いた。食後、フユは本棚の前に立っていた。僕が洗面所から戻ると、背表紙を眺めながら、何か面白そうな本はないかと尋ねた。彼女は本棚の上段から何冊か取り出し、表紙を見比べていた。やがて一冊の文庫本を手に取った。フユはその本を開き、最初の数ページをめくったあと、途中のページで手を止めた。何かを確かめるように、少し戻ってから、また先へ進んだ。表紙を裏返し、出版社の名前を眺めているようだった。そのとき、挟まっていたレシートが滑り落ちた。", "乾いた紙の音が、机の脚のあたりで小さく鳴った。", "「あ、ごめん」", "「あっ、大丈夫。そのままでいい」", "フユは本を持ったまま、床に落ちたレシートを見た。僕は彼女よりも先に、それを拾った。薄い紙片は何度も折り畳まれたせいで端が柔らかくなっていた。印字もところどころ薄れていたが、日付と店名はまだ読めた。僕はそれを手のひらに載せた。何度も見てきた紙片だった。日付も、店名も、金額もすべて覚えていた。財布から取り出して眺めたこともあったし、本に挟んだまま何か月も忘れていたこともあった。捨てようと思ったことも一度や二度ではない。けれど、そのたびにまだ捨てなくてもいいと心に暗示をしていた。理由を考え始めると、かえって捨てられなくなるような気がした。", "「それ、何のレシート？」", "フユが尋ねた。", "「古本屋で買った本に挟まってたレシート」", "「買ったときのレシート？」", "「ううん。本を買ったときに、たまたま挟まっていた知らない人の知らない買い物のレシート」", "自分でも要領を得ない答えだと思った。フユは手にしていた文庫本を閉じた。僕の顔と手のひらに載ったレシートを交互に見ていた。僕は紙を広げ、印字された数字を指でなぞった。もう何度も確かめたはずなのに、そこに書かれているものを読み直すのはいつも少しだけ落ち着かなかった。レシートには何の説明もなかった。誰が本を買ったのかも、どうしてそれが僕の手元にあるのかも、そこには記されていない。", "ただ、ある日、ある店で、ある金額の買い物があったという事実だけが残っていた。", "「実は──」", "僕はそこで一度言葉を切った。彼女の手元にはさっきまで読んでいた文庫本が閉じられたまま置かれていた。", "「このレシートを持っていた人のことをずっと考えているんだ」", "そう言ってから、僕はどこから話せばいいのか考えた。いつのことだったのか。どういう関係だったのか。そもそも、僕はその人のことをどれくらい知っていたのだろう。思い出せる出来事はいくつもあったが、それを順番に並べたところで、彼女に伝わるとは思えなかった。", "「別に、付き合っていたとか、そういう話じゃないんだけど」", "「うん」", "「ただ、今でもときどき思い出すんだ。何かを見たり、聞いたりしたときに。自分でも、どうしてそんなことで思い出すのかわからないようなときに」", "フユは僕の手元に目を落とした。僕はレシートをもう一度折り畳もうとしたが、折り目が以前と違う場所にできそうで、途中でやめた。", "「この人が、その人なの？」", "「うん。このレシートは、きっとその人が買ったものなんだと思う」", "言ってしまうと、思っていたよりも簡単なことのように聞こえた。けれど僕にとっては、ずっとそうではなかった。誰かが買った一冊の本と、その人が生きていた時間と、僕が今も覚えているいくつかの場面。それらは僕のなかで、長いあいだ切り離せないままになっていた。", "フユは少しだけ考えるように黙っていた。やがて、机の上に置かれた本を指先で押さえた。", "「その人のことが、好きなの？」", "僕はすぐには答えられなかった。好きだった、と言えば何かを決めつけてしまうような気がしたし、そうではなかったと言うのも違う気がした。", "「わからない」", "僕はそう答えた。フユはそれ以上尋ねなかった。窓の外では街灯の光が曇ったガラスに滲んでいた。机の上には二人分の湯飲みと、読みかけの文庫本が置かれていた。僕の手のひらには、折り目のついたレシートが残っていた。僕はしばらく迷ったあと、彼女にその話をし始めた。"]}, {"title": "", "paragraphs": ["その本を手に入れたのは、高校三年生の冬だった。場所は駅前から少し外れた雑居ビルの二階にある古本屋で、駅前の新しい書店とは違い、そこにはいつも少し古く、すこしカビた時間が流れていた。入口は狭く、階段も急だった。階段の壁には色褪せた映画のポスターが何枚か貼られていて、途中の踊り場には縛った雑誌の束が積まれていた。上まで行くと小さなガラス扉があり、押して入ると乾いた紙の匂いがした。店の中には文庫本の棚が所狭しに隙間なく並んでいた。棚は天井近くまで伸びていて、上段の本を取るための脚立が端に立てかけられていた。暖房は入っていたが、それほど熱心には効いておらず、コートを脱ぐほどではなかった。カウンターの奥では店主らしき老人が椅子に座り、半分眠っているような顔でラジオを聞いていた。AMラジオ特有の少しざらついた音だけが静かに流れていた。僕は棚の間をゆっくり歩きながら、背表紙を順番に眺めていた。古本屋では、特に探している本がなくても、棚を見ているだけで時間が過ぎることがある。タイトルを眺め、少し引き抜き、また戻す。その繰り返しだった。僕は学校帰りで、制服のままだった。マフラーには外の冷たい空気がほんのりと残っていた。外の冷気で硬くなっていた喉が、少しずつ温まってきた。", "その本を見つけたのは、偶然だった。著者の名前は昔から知っていた。父親の本棚に何冊か並んでいて、中学生の頃は難しそうだと思っていたが、高校に入ってから少しずつ読むようになっていた。不思議と手が止まらない文章を書く人だった。乾いているのに、妙な湿度がある、とでもいうか、言葉のひとつひとつが素っ気ないのに、読んでいると胸の奥のほうが静かに揺さぶられた。長編も何作か書いていたが、短編集の方がはるかにその作家性とでもいうべきものが遺憾なく発揮されていた。その本も例によって薄い短編集だった。カバーは少し日に焼けていて、角に細かな擦れがあった。何人かの手を渡ってきたことがわかる本だった。新品の本にある硬さがもうなく、ページを開いたとき、癖が少しついていた。値段は、覚えていない。ただ、高校生の自分でも迷わず買えたくらいには安かった。古本屋の文庫本はたいていそうだった。会計を済ませると、店主は無言で本を紙袋に入れた。僕はそれを鞄に入れて店を出た。外は夕方前で、駅前には制服姿の高校生や買い物帰りの人たちがいた。コンビニの前では自転車が何台も並び、遠くで踏切の警報音が聞こえていた。外気は依然として冷ややかだったが、とても穏やかで、どことなく祝福的な夕暮れだった。", "家に帰ると、僕は制服のまま自分の部屋へ入った。暖房をつけ、ベッドに腰を下ろして、その本を開いた。窓の外では夕方の電車が一定の間隔で通り過ぎていった。遠くで犬の鳴く声がした。部屋には電気ストーブの少し焦げたような匂いが漂っていて、机の上には読みかけの問題集とシャープペンが置かれたままだった。最初の短編は、動物園のカンガルーについて書かれた話だった。少し奇妙な話で、作者の意図までは読み取れなかったが、不思議と読みやすかった。二つ目には、春の朝に「完璧な誰か」とすれ違う話が入っていた。主人公は朝の街を歩いていて、そのとき一人の女性とすれ違う。ただ、それだけの話だった。相手の名前もわからないし、長い会話があるわけでもない。けれど主人公はその一瞬で、この人は自分にとって特別な存在なのだと感じる。理屈というより直感に近かった。この人とは、本来どこかで出会うはずだったのではないか。そんな確信だけが、不自然なくらい静かに描かれていた。しかし主人公は声をかけない。ただ、そのまま歩き続ける。少しして振り返ると、相手はもう人混みの中へ消えている。物語はそこで終わる。事件らしい事件は何も起きない。再会もない。ただ一度すれ違っただけだ。それなのに読み終えたあと、妙に長く余韻が残った。悲しいのか、寂しいのか、自分でもうまく整理できない。ただ何か取り返しのつかないものを、少しだけ失ったような感覚だけが静かに残っていた。僕はその短編を最後まで読み終えたあと、少し間を置いてから、もう一度最初のページに戻った。二回目のほうが文章はゆっくり頭に入ってきた。窓の外はさらに暗くなっていて、部屋の中ではストーブのカタカタという小さな音だけが聞こえていた。", "二つ目の物語を読み終えたところで、一階から夕飯の支度ができたことを知らせる声が聞こえた。僕はそこで本を閉じ、机の上に置いた。その瞬間、本の間から何かが滑り落ちた。薄い紙切れだった。僕は反射的にそれを拾い上げた。よく見ると、それはレシートだった。細長く折れ曲がっていて、角には少し皺が寄っていた。前の持ち主が栞代わりに挟んでいたのだろう。古本にはたまにそういうものが残っている。映画の半券だったり、コンビニのレシートだったり、メモ帳の切れ端だったり。僕は最初、深く考えずにそれを捨てようとした。ゴミ箱へ放ろうとして、でも途中で手が止まった。そのレシートの内容が気になったのだ。この本を読んでいた人が、どんな人だったのか少し知りたくなった。もちろん、レシート一枚でその人のすべてがわかるわけではない。それでも、まったく何も知らない誰かの生活の断片が、偶然自分の部屋に落ちてきたような感覚があった。", "だから僕はレシートを眺めた。", "店名　A.P.C", "住所　東京都渋谷区宇田川町15ー1　パルコ2F", "日付　2021年02月13日（土）12:59", "商品名　COTON MILITAIRE LAVE", "単価　¥55,000", "決済方法　クレジット", "僕はしばらく、その数字を見ていた。", "それは高校一年生だった自分にとって、現実感のない買い物だった。まず渋谷パルコという住所が僕にとっては新鮮な響きを持っていた。都会的で、どこか前衛的なその響きは、郊外に住む自分にとっては奇妙で、硬質な響きを持っていた。それに五万五千円のジャケットというのもまた現実感のない値段だった。僕の財布の中には常に千円札が二枚くらいしか入っていなかったし、小遣いも月に五千円程度だった。服に五万円を使う、という感覚自体がまだよくわからなかった。しかしそれ以上に不思議だったのは、そんな高価な服を買う人が、本の栞にレシートを使っていたことだった。僕は勝手に想像した。その人はきっと、スマートで洒落た人なのだろう。渋谷パルコへ行き、店員と気さくに会話をして、迷いなく服を選ぶような人。長財布からクレジットカードを取り出す動作は手慣れていて、買い物そのものが生活の一部として馴染んでいるようなクールで知的な人。もちろん、レシート一枚からそんな妄想をするのは少しばかり飛躍していたが、少なくとも休日の昼間に五万円のジャケットを買うには単にお金があるだけでは足りないような気がした。自分の暮らしに対するある程度の余裕というか、自分はこういうものを着たいのだという確信のようなものが必要な気がした。", "でもその人はレシートを栞にしていた。そこが僕の心をくすぐらせた。", "僕は当時、そういう人たちはもっときちんとした栞を使うものだと思っていた。革製のブックマーカーとか、海外の美術館で買った有名絵画を模したカードとか、そういうものを自然に本へ挟む人たちなのだと思っていた。けれど実際にはレシートだった。近くにある紙をそのまま栞代わりにすることは僕自身もよくあった。何気なく観た映画の半券だったり、カフェでもらった短いレシートだったり、学校で配られたプリントの切れ端だったり……。その場にあるもので済ませてしまう性分が僕にはあった。そして五万円のジャケットを買うような人にも、ありふれた高校生の僕と同じような性分があったのだ。まるで僕とは正反対にも見えるようなスマートで、クールな人がだ。僕はしばらくの間、そのレシートを机の上で眺めていた。捨てようと思えば、すぐに捨てることはできた。でも結局、僕はそのレシートを捨てなかった。そしてなんとなく、そのまま本に戻した。"]}, {"title": "", "paragraphs": ["目を閉じ、想像する。", "二〇二一年の二月。土曜日の昼下がり。渋谷パルコのA.P.Cで、五万五千円のジャケットを買った誰かはクレジットカードで会計を済ませ、受け取ったレシートを二つ折りにし、本の間に挟んだ。そしてそのまま古本屋へ売ったのか、あるいは別の誰かを経由したのか。それはわからないが、今、その本とレシートはめぐり巡って、自分の部屋にある。その人が男性なのか、女性なのかはわからない。年齢も、居住地も、どのような朝を過ごしているのかさえも僕にはまったくわからない。ただ土曜日の昼に、渋谷で買い物をして、そのあとどこかでこの本を読んでいた、という事実だけがレシートからはわかる。ただ、それだけだった。それだけのはずなのに、いやそれだけのことだからなのか、僕はその人のことを考えないわけにはいかなかった。"]}, {"title": "", "paragraphs": ["フユは話の腰を折ることなく聞いていた。湯呑みを両手で包み、ときどき小さく頷いていた。話し終えると、部屋は静かになった。台所の蛇口から、水が一滴落ちる音がした。冷蔵庫のモーターが低く唸っていた。僕は手のひらのレシートを見ていた。フユもまた、しばらくそれを眺めていた。", "「その人を、探してるの？」", "彼女の声は、責める調子ではなかった。ただまっすぐに尖った問いだった。僕は答えようとして、口を開いた。けれど言葉が出てこなかった。探している、と言えば嘘になる気がした。探していない、と言えばそれもまた嘘になってしまうような気がした。僕はあの人に会いたいのだろうか。会いたいわけではないような気がする。ただ、どこかにいるのだと思っていたいだけなのかもしれない。自分の知らない場所で普通に暮らし、買い物をし、誰かと話し、時には本を読む。そういう日々を過ごしているのだと思っていたかった。でも、それをどう説明すればいいのか、わからなかった。", "「わからない」", "ようやくそう答えると、フユは小さく頷いた。", "「そっか」", "それだけ言って、彼女はレシートを本に戻し、本を元の位置に差した。その仕草は丁寧だったが、どこか少しだけ憂いを帯びていた。彼女はそのことを責めなかったし、それ以降、話題に出すこともなかった。僕もまた彼女といるあいだは、あのレシートのことを口にしなくなった。"]}, {"title": "", "paragraphs": ["二年生になった春、フユは交換留学の選考に通った。行き先はフランスのリヨンで、期間は一年だった。出発は九月。結果を知らせてきたとき、彼女は電話で、少し泣きながら笑っていた。電話の向こうから聞こえる声は、いつもより少し高く、言葉の合間に短い息が混じっていた。僕はよかったね、と言った。それが間違いのない本心だったことは、今でもはっきりと覚えている。電話の向こうでは、彼女の声に混じって、駅のアナウンスのような音が聞こえていた。彼女は外にいるらしく、ときどき周囲の音に気を取られて返事が遅れた。これから必要な手続きを調べなければならないと言い、僕はパスポートのことや住む場所のことを尋ねた。ビザの申請や大学への連絡、現地での住居探し。彼女が一つずつ話すたびに、僕たちの会話には知らない地名や制度の名前が増えていった。話しているうちに、僕たちの間に一年という時間が置かれたのだということが、少しずつ実感を伴ってきた。けれどそのときの僕には、それがどれほど長い時間なのか、まだよくわかっていなかった。", "彼女が日本を発つ前の数か月、僕たちは何度も会った。彼女は準備に追われ、僕は設計課題に追われた。休日に会っても、以前のように何時間も一緒に過ごすことは少なくなった。留学に必要な書類を確認したり、買い物に付き合ったり、出発前に会っておきたい友人の話を聞いたりした。文房具店では彼女が現地で使うノートを何冊か選び、僕はその横で、どれも同じように見えるノートの違いについて説明を求められた。薬局では、持っていく薬の種類を一緒に確認した。彼女は買ったものを一つずつ鞄にしまい、帰り道にはまだ買わなければならないものを思い出しては携帯電話にメモしていた。僕たちは以前よりも多くのことを話していたのに、二人の間にある時間は、どこか短くなっているようだった。彼女の部屋には、少しずつ荷物が増えていった。床に広げられたスーツケースの脇には衣類や本が積まれ、棚の上には書類をまとめた透明なファイルが置かれていた。僕の部屋に置いてあった彼女の本やヘアゴムも、いつの間にか持ち帰られていた。ある日、机の端に見慣れない空きができているのに気づいた。そこには以前、彼女が読みかけの本を置いていた。僕はその空いた場所をしばらく眺めていたが、特に何も言葉は思い浮かばなかった。", "九月になり、彼女は日本を発った。", "空港で別れるとき、僕たちはしばらく手を繋いでいた。彼女の手は少し冷たく、指先には出発前に指を切ったといって小さな絆創膏が貼られていた。何か言わなければならないと思ったが、結局、気をつけて、という言葉しか出てこなかった。彼女は笑って、うん、と答えた。それから、また連絡するね、と言った。僕は頷いた。彼女の背中が人の流れに紛れていくまで、僕はその場に立っていた。飛行機が出発するまで見送ったわけではない。彼女が搭乗口へ向かっていくのを見届けてから、僕は空港を出た。帰りの電車では、窓の外の景色をぼんやりと眺めていた。時折携帯電話を取り出して、彼女から届いたばかりのメッセージを開き、何度か読み返した。そこには出発前に交わした言葉と変わらない、短い挨拶が書かれていた。", "しかし、時差のある連絡は次第に間遠になった。最初は毎日だったメッセージが週に一度になり、月に一度になった。向こうでの授業や生活のことを聞き、こちらの大学の課題やアルバイトのことを伝えた。写真も何枚か送られてきた。リヨンの街並み、カフェのテーブル、川沿いの風景。写真の隅には見慣れない看板や、読み方のわからない店の名前が写っていた。僕はそれらを眺めながら、彼女が今どんな生活をしているのかあてもなく想像した。写真に写っているカフェで彼女が何を注文したのか、誰と座っていたのか、帰り道にはどんな景色を見たのか。尋ねれば教えてくれたのかもしれない。けれど、そうしたことを一つずつ聞いていくのは、彼女の生活をこちら側から確かめようとしているようで、少し気が引けた。写真に写っているものと、実際に彼女が過ごしている時間とのあいだには、どうしても埋められない距離があった。僕が見ているのは、彼女の生活そのものではなく、彼女がその中から切り取って送ってくれた一部分にすぎなかった。彼女の返事が遅くなっても、僕は催促しなかった。僕のほうも送ろうと思ったメッセージをそのまま下書きに残すことが増えていった。大学では新しい課題が始まり、アルバイトのシフトが入り、友人と食事をすることもあった。彼女のいない生活にも、それなりの予定ができていった。ときどき、彼女に見せようと思って写真を撮ることがあった。大学の近くにできた店や、帰り道に見つけた古本屋の棚。けれど、それを送る頃には、なぜ撮ったのかを自分でもうまく説明できなくなっていた。ただ、ある日気づくと、彼女からの連絡がぷつんと途絶えていて、僕からもメッセージを一切送らなくなっていた。最後にどちらが何を送ったのか、今では正確に思い出せない。最後の会話に、別れを告げるような言葉があったわけでもなかった。誰が悪いわけでもない。ただ、生活が違う方向へと流れていっただけだ。彼女のいる場所には彼女の時間があり、僕のいる場所には僕の時間があった。それだけのことだった。そう、たったそれだけのことのはずだった。", "二〇二六年の春、桜が咲く頃に、一度だけ短いメッセージが届いた。", "『元気？　あの本、まだ持ってる？』", "僕は少し考えてから、返事を打った。", "『持ってる。レシートも、そのまま』", "短い会話だった。既読はついたけれど、返事は来なかった。僕はスマートフォンを机の上に置き、窓の外を眺めた。隣の家の物干しには、洗濯物が風に揺れていた。春の光は部屋の奥まで届いていた。僕はしばらくそのまま座っていたが、やがて本棚からあの文庫本を取り出した。", "レシートは以前と同じページに挟まっていた。", "店名　A.P.C", "住所　東京都渋谷区宇田川町15ー1　パルコ2F", "日付　2021年02月13日（土）12:59", "商品名　COTON MILITAIRE LAVE", "単価　¥55,000", "決済方法　クレジット", "その人は今、どこにいるのだろう、と僕は考えた。今も渋谷の近くに住んでいるのかもしれないし、あるいはフユのようにまったく別の知らない街に住んでいるのかもしれない。あのジャケットはまだクローゼットに残っているだろうか。それとももう処分してしまったのだろうか。この本を売ったのはいつだったのか。どんな気持ちで古本屋に持って行ったのか。あるいは売ったこと自体をもう覚えていないのかもしれない。レシートが挟まったままだったことにも最後まで気づかなかった可能性もある。そう考えると、この小さな紙切れだけが、今もその人から切り離されずに残っているのだ。", "レシートはまだ手元にある。紙は少し柔らかくなり、端も少し丸くなったが、印字は今でも読める。二〇二一年二月十三日、土曜日、十二時五十九分。A.P.C。COTON MILITAIRE LAVE。五万五千円。クレジット。そこには、ただそれだけが記録されている。名前も、顔も知らない誰かが、ある土曜日に渋谷で服を買い、そのあとこの本を読んでいた。そして栞に、レシートを用いた。その事実だけで、世界は今以上にクリアに見えた。秋の夕方や、雨が降り出す少し前みたいな時間に、僕はたまにその本を本棚から取り出すのだろう。そしてレシートを眺めながら、その人のことを考えるのだろう。"]}, {"title": "", "paragraphs": ["ふたつ目の短編の最後で、物語の主人公はこんなことを考える。", "もしあの人と三十分だけでも話せたなら、その人がどこから来て、どこへ向かおうとしていたのかを聞いてみたかった、と。好きな季節や、朝によく飲むものや、どんな音楽を聴くのか知りたかった、と。そしてあの晴れた朝に、偶然すれ違うに至った運命の経緯のようなものを解き明かしてみたい、と。もちろん、これは架空の話だ。でも僕はその文章を、どうしてもレシートの誰かに重ねずにはいられなかった。"]}, {"title": "", "paragraphs": ["もし三十分だけでも話せたなら、と僕は思う。どこから来て、どこへ向かっていたのか。どんな部屋に住み、朝には何を飲むのか。休日には何をして過ごすのか。どうしてあの日、渋谷パルコでジャケットを買い、そのレシートをこの本へ挟んだのか。そしてあの古本屋で僕がこの本を手にとるに至った運命の経緯のようなを解き明かしてみたい。もちろん、その人に出会うことは、今後一生ないのかもしれない。一枚の小さなレシートから特定の誰かを探し当てるなんて、現実的にはほとんど不可能だ。でも、その人は確かに存在していた。この本を読み、途中でページを閉じ、レシートを挟んだ。そのことだけはこの小さな紙が確かに証明している。僕はそれで十分だと思った。あの本は今も本棚にある。レシートもまだ同じページに挟まっている。そして僕はこれからも、ときどきその本を開いて、名前も知らない誰かのことを少しだけ考えるのだと思う。悪くない、と思った。悪くない人生だ、と思った。そして願わくば、その人生の最果てに、レシートを栞にした誰かと出会えたなら、それ以上に幸運なことはないのかもしれない。僕はレシートを本に挟み、そっと閉じた。するとちょうどそのとき、机の上のスマートフォンが短く震えた。画面にはインスタグラムのフォロー申請が届いていた。画面をスワイプして、インスタグラムを開くと、そこにはアカウントからのフォロー申請が表示されてい**た。**&#x30A2;カウントのタイムラインを遡っていくと、ふと目に止まる写真があった。二〇二一年二月十三日に投稿された一枚の写真。それはカーキ色のジャケットを纏う女性の後ろ姿の写真だった。僕は目を見張り、ほとんど反射的に、画面をスクロールしてアカウント名を見つめた。そこにはたった一行、こう書かれていた。", "ジェラール・フィリップは洗われた、と。"]}, {"title": "", "paragraphs": ["そのアカウントをしばらく眺めていた。プロフィールには何も書かれていなかった。投稿も数枚足らずで、フォローしている人数も、フォロワーの数もごくわずかだった。アイコンには何も設定されておらず、名前のほかにその人について知る手がかりはなかった。二〇二一年二月十三日の写真には、カーキ色のジャケットを着た女性が写っていた。顔は見えない。肩まで伸びた髪が背中にかかり、片方の手には小さな紙袋を提げていた。写真の背景には見覚えのある建物の壁面があった。渋谷パルコだった。投稿された時間は十三時二十七分。レシートに記された買い物から、三十分も経っていない。", "僕は写真を、何度も拡大した。ジャケットの襟元や袖口、背中にできた細かな皺を見た。COTON MILITAIRE LAVE。洗いをかけた、軍用コットン。レシートに記されていた商品名が、初めて具体的な衣服として目の前に現れた。もちろん、それだけで同じ人物だと断定できるわけではない。たまたま同じ日に同じ場所で、同じような色のジャケットを着ていた別の誰かかもしれない。そもそも写真の女性が買ったものなのか、誰かから借りたものなのかさえわからない。けれど僕にはもう、それを偶然として片づけることができなかった。何よりジェラール・フィリップは洗われた、というアカウント名。その存在が僕の胸の鼓動を高鳴らせ、喉をからからに乾かせた。僕は一度画面を閉じた。それからもう一度開いた。アカウント名を読み、写真を見て、プロフィールに戻る。その繰り返しだった。しばらくして、フォロー申請を承認した。すると、すぐにメッセージが届いた。", "『こんばんは。突然すみません。フォローありがとうございます』", "僕は返信欄を開いたまま、しばらく何も打てなかった。何と返せばいいのだろう。あなたがあの日、五万五千円のジャケットを買った人なのですか、と尋ねるのはあまりにも唐突だった。馬鹿げている。それにレシートを持っている、と言えば、相手はきっと困惑するだろう。", "僕は一度文章を打ち、消した。もう一度打ち、また消した。結局、短く返した。", "『こちらこそ。以前から、あなたのことが気になっていました』", "送信してから、おかしな文章だったと思った。これじゃはまるで昔からの知り合いに送るような言い方だった。けれど、相手はすぐに返事をくれた。", "『そう言ってもらえると嬉しいです。実は、少しお話ししてみたいと思っていました』", "そのあと、いくつかメッセージを交わした。僕たちは互いの名前を尋ね、住んでいる場所を教え合った。彼女は現在、東京に住んでいるらしかった。仕事のことや休日の過ごし方についても、少しだけ話した。僕は大学を卒業してからも東京に残っていることを伝えた。彼女は本を読むのが好きなのだと言った。僕が古い小説をよく読むと答えると、彼女も最近、昔読んだ短編集を読み返しているところだと教えてくれた。会話は不思議なくらい自然に続いた。僕は相手の文章を読みながら、その人がどんな声で話すのかを想像していた。年齢も、顔も、詳しい生活も知らない。それなのに、僕の中では少しずつ、『ジェラール・フィリップは洗われた』というアカウントの先にある人物の輪郭を持ちはじめていた。", "何日か経った頃、彼女から一通のメッセージが届いた。", "『よかったら今度、渋谷のカフェでお茶でもしませんか』", "僕はその文章を何度か読み返した。渋谷。あの日と同じ場所だった。二〇二一年二月十三日、土曜日、十二時五十九分。A.P.C。五万五千円。", "『ぜひ』", "僕は間髪を入れず、そう返した。日程を決めるまでに、それほど時間はかからなかった。彼女の都合に合わせて、翌週の土曜日に会うことになった。待ち合わせ場所は渋谷パルコの前、時間は十三時だった。カフェの場所は会ってから決めようということになった。約束の日まで、僕は何度かレシートを取り出した。文庫本の同じページに挟まれていた紙片は、以前よりもさらに柔らかくなっていた。印字された文字は、まだ読める。僕はそれを指先で伸ばし、日付と金額を確かめた。二〇二一年から、もう何年も経っていた。あのときの僕は高校生で、今は大学を卒業している。フユと出会い、一緒に暮らし、そして離れた。あの頃には想像もできなかった生活を、僕はそれなりに過ごしてきた。けれど、この紙切れだけはずっと同じ場所にあった。"]}, {"title": "", "paragraphs": ["土曜日はよく晴れていた。僕は約束の時間より少し早く渋谷に着いた。駅からパルコへ向かう道には、休日を過ごす人たちが絶えず行き交っていた。交差点では信号が変わるたびに人の流れが入れ替わり、店の前には買い物袋を提げた人たちが立ち止まっていた。ビルの窓には春の光が反射していた。僕は歩道の端に立ち、腕時計を確認した。まだ待ち合わせの時間には十分ほどあった。渋谷パルコの建物を見上げた。何度も想像してきた場所だった。高校生の頃、レシートの住所を読みながら頭のなかに描いていた景色が、今は目の前にあった。もちろん、想像していたものとは少し違っていた。建物の外壁も、行き交う人の服装も、道路の向こうに見える景色も、記憶のなかで作り上げていたものとは違っていた。それでも、ここに誰かがいたのだと思った。あの日、十二時五十九分に会計を済ませ、ジャケットを受け取り、紙袋を持ってこの場所を歩いていた誰かが。僕はスマートフォンを取り出し、彼女とのメッセージを開いた。最後に届いていたのは、もうすぐ着きます、という短い連絡だった。時計を見ると、十二時五十八分だった。信号が青に変わり、人の波が動き出す。僕は無意識のうちに、その流れの中の一人ひとりの顔を目で追っていた。コートを脱いだ人たち、薄手のシャツの袖をまくった人たち。春の装いの群れのなかで、ひとつだけ、色が違った。カーキ色。少し丈の短い洗いのかかったミリタリージャケット。襟元は柔らかく落ち、袖口には何度も腕を通したことを思わせる自然な皺が寄っている。その人は横断歩道を渡り切り、広場の入口で一度足を止めた。それから、静かにこちらを向いた。髪はひとつに束ねられていなかった。肩のあたりで切りそろえられた髪が、風に少しだけ揺れていた。間違いない。フユだった。", "四年の時間が、彼女の輪郭を少しだけ変えていた。頬のあたりが細くなり、目元には、僕の知らない街の光を見てきた人の静けさがあった。けれど、こちらを見て目を細めたときの表情は、あの学食の窓際で、ストローをかき混ぜていた彼女と同じだった。僕は、何も言えなかった。フユはゆっくりと歩いてきた。急ぐでもなく、ためらうでもなく、まるで毎週ここで待ち合わせていたかのような、軽快な足取りだった。僕の前で立ち止まると、彼女は少しだけ首を傾げ、僕の顔を、目元のあたりをじっと見た。春の陽光が、彼女の肩に落ちていた。ジャケットの生地が、光を吸って柔らかく色を変えた。五万五千円の、洗われたコットン。誰かが二〇二一年の土曜日の昼下がりに買い、そのあと本を読み、レシートを栞にした、あのジャケット。", "「ずっと……」", "僕が言いかけると、彼女は小さく首を振った。", "「いいの。今は、まだ」", "それから、あのときと同じように、何かを無理に伝えようとしない声で言った。", "「ほんとはね、あのレシート、栞にするつもりじゃなかったの。ただ、近くにあったから挟んだだけ。だから本を売ったときも、気づかなかった」", "「うん」", "「古本屋の棚でね、リヨンに発つ前の日に、一度だけ見に行ったの。そこにまだあるかなって。なかったけど」", "彼女は少し笑った。", "「あなたの部屋の本棚で見つけたとき、すぐにわかった。この本、わたしのだって。でも、言えなかった。言ったら、何かが変わるような気がして」", "僕は手のひらにレシートがないことを、はじめて少し寂しく思った。それから、すぐに思い直した。あれは、今も本棚の同じページにあるのだ、と。", "「ジェラール・フィリップに似てるって言ったの、覚えてる？」", "彼女が訊いた。", "「覚えてる。調べても、わからなかった」", "「そのうちわかるって、わたし言ったでしょう」", "「言ったね」", "「あのね」", "フユは一度、視線を足元に落とし、それから顔を上げた。", "「三十六歳で死んだ人でしょう、あの人。でも映画の中では、ずっとあの顔で、あの声で、生きてる。会ったこともない人が何十年経っても誰かの記憶のなかで、ちゃんと生きてる。あなたが誰かを思い続けていたのも、きっとそういうことなんだって思ったの。そのとき、直感で──」", "僕はようやく確信した。信号の音が、遠くで鳴っていた。春の風が、広場を斜めに抜けていく。フユは少しだけ背筋を伸ばして、僕を見た。", "「ジェラール・フィリップは現れたね、ちゃんと」", "カーキ色の袖が、風に揺れていた。陽の光のなかで、彼女の言葉は凛として澄んでいた。あの日から、どれくらいの時間が経っただろう。どれほどの想いが胸にあふれ、やがてついえていっただろう。しかしそれでもついえなかった想いは、確かにあった。消えずに、灯り続けた想いがあった。きっと今なら胸を張って、その想いを伝えられるはずだ。何度も迷い、戸惑い、そして心に閉ざしてきたあの言葉を、今なら、きっと──。", "運命の予感をたっぷりと含んだ空気を、胸いっぱいに吸い込む。そして僕は在りし日の記憶を告げるように、そっと口を開く。"]}, {"title": "", "paragraphs": ["──ジェラール・フィリップは洗われた、と。"]}], "en": "Gérard Philipe was Washed.", "summary": "古本に挟まった一枚のレシートから始まる物語。", "tag": "再会"}, {"id": "s2", "group": "夭折した天使たちへ", "title": "オリヴァー、盲目なのは", "chapters": [{"title": "", "paragraphs": ["四月のある晴れた朝、ロンドンのオックスフォード・サーカスから一本入った裏通りで、僕は盲目の女の子と出会う。一目見たその瞬間から、とても素敵な女の子だと僕は思う。清潔な白いブラウスを着て、栗色の髪を後ろでひとつに結んで、小さな真珠の耳飾りをつけている。年齢は僕と同じ、十八歳くらいだろうか。どこか張り詰めた表情をしている。背後で路上ライブをしていたおじさんたちが、ビートルズの『ヘイ・ジュード』を唄い始める。チャップリンの格好をした路上パフォーマーが、You’ll never find a rainbow if you’re looking down.（下を向いていたら、虹を見つけることは出来ないよ）と書かれたプレートを胸に掲げながら、タップダンスをしている。彼女との距離はおよそ五十メートルほど。白杖を左右に振る音が、眩い運命のビートのように祝福的な響きを放っている。彼女の姿を捉えたチャップリンは、帽子をすぽんと頭から取ると、深々とお辞儀をする。もちろん彼女にはその姿は見えていない。背後を流れる『ヘイ・ジュード』は、白杖の動きに合わせて、音楽的な高まりを見せている。彼女が白杖の動きを合わせているのか、それともおじさんたちが白杖の動きに合わせているのか、真実は藪の中にある。彼女は東から西へ、僕は西から東へと歩いている。地上を照らす日差しはどこまでも陽気で、青空を写す水たまりはどこまでも健気だ。僕は彼女にどうにかして声をかけたいと思う。話題は、なんでもいい。だけど、どうせなら今日の天気みたいに、少しでも明るくなる話がいい。彼女と付き合いたいとか、彼女と寝たいとか、そんな野暮な気持ちはない。いや、少しはあるかもしれない。盲目の女の子と寝るのがどんなものか、少しは気になる。でもそんなことは本当のことを言えばどうでもいいのだ。僕はただ彼女と話をしたい。この世にいつ生を受け、どのような家庭で育ち、どういった苦悩や葛藤を抱えながら、今日という日まで生きてきたのか。そしてこれからどのように生きていきたいのか。僕は少しでも、そのことを知りたい。もちろん知ったからといって、どうにかなる話ではないけれど、そのことを少しでも知れたなら、僕はきっと以前よりも幾分か前を向いていけそうなのだ。そして何より、今日は僕にとって特別な日なのだ。ほんの一時間前まで、僕はオックスフォード・サーカスの交差点の隅に立ち、行き交う人々の顔をひとつひとつ確かめていた。午後三時までまだ五時間もあるというのに。そして結局、僕はその場に立っていることに耐えきれなくなって、逃げるように裏通りへ入ってきたのだった。ポケットには右足のためのテーピングと、何度も折り畳んだせいでぼろぼろになったバスの切符が入っている。理由は後で話す。今はとにかく、目の前の彼女のことだ。", "だけど、問題はどうやって彼女に話しかけるかだ。見知らぬ誰かが話題も持たずに、急に話しかけるなんて、あまりにもおっかない。それに僕だって一応は紳士なのだ。相手の都合も考えず、不躾に声をかけることなんて到底できない。じゃあこのまま彼女とすれ違うのか。それも僕には許せない。何故なら、僕たちはもう出会ってしまったのだから。りんごが落ちて、ニュートンが万有引力を発見したみたいに、それは避けようのないことなのだから。", "三十メートル、二十メートルと、僕たちの距離は詰まっていく。しかしその瞬間、僕は彼女が周囲をしきりに見回しながら歩いていることに気づく。白杖を左右に振りながら、まるで地面に落ちてしまったコンタクトを探すみたいに、彼女は周囲を気にしながら歩いているのだ。見えない目で、あたりを見回している。その矛盾がなぜか僕の胸を軽く叩く。チャップリンを模した路上パフォーマーが立ち尽くす僕に一度ウインクをする。『ヘイ・ジュード』がサビに入り、通行人たちが無意識のうちに「ヘイ・ジュード」と鼻歌で愉快に歌っている。きっと彼女は何か探し物をしているのだ。そう思った僕は、たまらず路上パフォーマーに三枚の硬貨を投げ、「ヘイ・ジュード！」と叫びながら、水たまりを飛び越えた。アスファルトを叩く白杖の音が、一瞬止まる。僕は彼女に駆け寄り、息を切らしながら声をかける。", "「やあ」", "僕の声は緊張からか、うわずっている。", "「困った顔をしてるね。何か探し物かい？」", "目の前に立つと、僕と彼女の間には思った以上の身長差がある。彼女は少し顔を上げて、僕の声のする辺りへ首を傾けた。その仕草に僕の中のどこかが小さく軋む。何かを思い出しかけて、思い出さないようにしている。そんな種類の軋みだった。", "「オリヴァー」", "「ん？」", "「オリヴァーって男の人を捜してるの。金髪で、背の高い……」", "彼女の言葉に、僕はびくっと肩を震わせる。オリヴァー。金髪。背の高い。どれも鏡の前でうんざりするほど見てきた僕の特徴と酷似している。", "「約束をしてたの」", "彼女は困ったように言った。", "「約束？」", "「ええ。十七歳になったら、ここで会おうって」", "僕はそっと息を呑む。", "「ねえ、あなたオリヴァーじゃないよね」", "その瞬間、世界から音が引いていった。『ヘイ・ジュード』も、水たまりを走る車の音もすべてが遠くなる。その代わりに、六年前のある午後の光が、僕の目の裏側にゆっくりと満ちてきた。忘れたつもりでいた景色のなかで、彼女はあの頃と何ひとつ変わらない顔をして、こちらを振り向いていた。"]}, {"title": "", "paragraphs": ["ソフィアは、小学校の六年間、ずっと僕の隣の席にいた。背が低くて、よく笑って、言葉より先に目がものを言う女の子だった。緑がかった、まるで猫みたいな目。その目で見つめられると、僕は何を言おうとしていたのかをいつも忘れてしまった。", "僕の家のリビングは西側に大きな掃き出し窓があり、夕方になると部屋の奥までオレンジ色の光が鮮やかに射し込む仕様になっていた。 ソフィアは家に着くと淀みない動作で靴を脱ぎ、リビングのソファの定位置に腰を下ろした。僕は台所で紅茶を二つのグラスに注ぎ、リビングへと運んだ。ガラガラと氷が鳴る音が、静かな室内に響き、そこが二人だけの空間であることを強調した。", "「最後だから、一番好きな曲にしよう」", "ソフィアが言った。", "「最後って、卒業式が終わっても、変わらないだろ？」", "僕が少し尖った声で言うと、ソフィアは何も答えず、ただイヤホンの左側を彼に手渡した。僕はそれを耳に嵌め、ソファの隣に座った。流れてきたのはアコースティックギターの静かなアルペジオだった。これまでに何度も聴いてきたはずの曲だった。しかし今日の音は、いつもよりずっと近くで鳴っているように感じられた。ソフィアは自分の目の前に右手をかざした。強い西日が彼女の指先を透過させるように赤く照らし出している。壁に映る影は光の強さのせいで、二重にブレて見えた。 ソフィアはその影を見つめながら、ゆっくりと指を折り曲げていった。", "「ソフィア」", "「何？」", "「この曲、サビに入るところがいいよね」", "僕の声は、ギターの旋律の底に沈むようにして響いた。", "「どうしたの、急に？」", "「いや、思ったことはちゃんと言うべきかなって思って言ってみた」", "「何それ」", "ソフィアは肩を揺らしながら笑った。そんなソフィアの横顔を、僕はじっと見た。西日に照らされた彼女の肌は、陽炎のように透き通って見えた。", "「あなたって、時々不思議なこと言うよね」", "「そうかな」", "ソフィアは手を下ろし、ソファのクッションに指先を沈めた。音楽は静かに、しかし確実に終わりの時間を迎えるための展開へと向かっていった。繰り返される旋律が、部屋の中の空気を少しずつ薄くしていくようだった。僕は自分の左耳に響く音をただじっと受け止めていた。名前も意味もない、ただ同じ空間で、同じ音を共有しているという、ただそれだけの事実が心を和ませた。曲の終盤、ピアノの音が重なり、旋律が最も高い盛り上がりを見せた瞬間、ソフィアがふと、目を閉じた。彼女の長いまつ毛が、西日を受けて、その毛先が金色に光っている。", "「明日さ」", "ソフィアは目を閉じたまま、囁くように言った。", "「式が終わったら、話がある」", "「話？」", "「うん。話したいことがあるの」", "僕は彼女の閉じた瞼を見つめながら、喉の奥がぎゅっと収縮するのを感じた。", "「自分も話したいこと、あるよ」", "その言葉が口をついて出た瞬間、イヤホンからの音楽が、ふっと途絶えた。曲が終わったのだ。リビングには、再び静寂が戻ってきた。冷蔵庫の低い音と、窓の外を通り過ぎる風の音だけが、部屋の隅々に染み渡っていく。ソフィアはゆっくりと目を開け、イヤホンを耳から外した。", "「じゃあ、明日、一緒に話そうね」", "彼女はプレイヤーをポケットに収め、ソファから立ち上がった。その動作には何の迷いも、躊躇いもなかった。", "玄関へ向かう彼女の背中を、僕はただ見送るしかなかった。"]}, {"title": "", "paragraphs": ["ソフィアが去った後のリビングには、まだ強い西日の名残が留まっていた。僕は一人でソファに座り直した。自分の左耳にはまだイヤホンの圧迫感が微かに残っている。彼はソフィアが座っていた場所のクッションに目をやった。そこには彼女の身体の重みが作った小さな窪みが残っていた。窓の外を見ると、空に広がっていた雲は完全に払われ、深い西日が広がり始めていた。明日という日がどのような形で訪れるのかは知る由もなかった。ただ、胸の奥で早鐘を打つ鼓動だけが、これから始まる長い時間の幕開けを告げているかのように、静かに、しかし確かに響き続けていた 。"]}, {"title": "", "paragraphs": ["卒業式の日の空は、ひどく青かった。雲ひとつない、突き抜けるようなコバルトブルー。まるで世界そのものが今日という門出を祝福し、同時に突き放しているようでもあった。体育館の天井から吊るされた紅白の幕が、隙間風に煽られて重たげに揺れている。パイプ椅子のきしむ音と、誰かの鼻をすする音。名前を呼ばれ、精一杯の返事をして、磨き上げられた壇上へ上がる。校長の手から渡された卒業証書は、指先に伝わる紙の凹凸こそ確かだったが、持ち上げると拍子抜けするほど軽かった。これが、六年の重さなのかと思わず声が漏れたが、僕の意識は別の場所にあった。視線の先にソフィアがいた。背筋をピンと伸ばし、一点を見つめて座っている。いつもは無造作に結んでいる髪が今日は丁寧に整えられ、慣れなブレザー姿も相まって、彼女だけが少し先の未来を生きている大人のように見えた。 その横顔を盗み見た瞬間、心臓の奥が冷たく、ぎゅっと締めつけられた。", "式が終わり、体育館の扉を抜けると春の冷たい空気が一気に肺を満たした。校庭は喧騒のるつぼだった。誇らしげに掲げられた証書の筒、響き渡るシャッター音、それから無理に明るく振る舞う別れの挨拶。そこでは春の匂いがそこここに漂っていた。", "「ソフィア」", "人の波をかき分け、僕はその名前を呼んだ。彼女は足を止め、すぐに振り返った。迷いも、探す素振りもなかった。まるで最初から、彼がそこに来ることを知っていたかのように。その真っ直ぐな眼差しに、僕の心はほんの少しだけ救われ、同時に心が波立った。", "「昨日言ってた話、しよう」", "絞り出した声は、乾燥した冬の名残に掠れて低く響いた。ソフィアは一瞬だけ、賑わう校庭の景色に視線を流してから、静かにうなずいた。"]}, {"title": "", "paragraphs": ["校舎の裏手に回ると、喧騒は潮が引くように遠のいた。急に世界がふたりだけのために狭まったような錯覚に陥る。菱形の金網越しに見える青空は、相変わらずあまりに青すぎて、直視すれば涙がこぼれそうだった。沈黙が二人の間に重く降り積もった。何度も脳内でシミュレーションをし、ノートの隅に書きなぐってきた言葉が、肝心なところで喉に絡まって形にならない。無慈悲な時間だけが、砂時計のようにさらさらと指の間を抜けていった。ソフィアは何も言わなかった。時計を見ることも、問い詰めることもしない。ただ春の陽光をその身に受けて、僕の言葉を待っていた。その静かで、真摯な優しさが、かえって僕を逃げ場のない場所へと追い詰めていった。", "「……俺さ」", "ようやく発した声は、情けないほど震えていた。", "「ソフィアのこと、ずっと好きだったよ」", "言葉として放たれた瞬間、世界から色が消え、音が消えた。遠くの笑い声も、風が木々を揺らす音も、すべてが外へと追いやられた。ただ、胸の奥で早鐘を打つ鼓動だけが、鼓膜を直接叩いていた。ソフィアは少しだけ目を見開いた。それから溜め込んでいた熱を逃がすように、ふっと息を吐いた。", "「……遅い、わよ」", "その声には長い間、暗い水底で息を止めていた人が、ようやく水面に顔を出したときのような切実な安堵の響きがあった。", "「でも、嬉しい」", "彼女が小さく、綻ぶように笑う。その光景を見た瞬間、僕の肩を縛り付けていたものが、音を立てて崩れ落ちた。", "「じゃあ……」", "「いいわよ」", "即答だった。食い気味に返された言葉に、僕の顔がパッと明るくなった。けれど、ソフィアはすぐに真剣な眼差しを取り戻し、言葉を継いだ。", "「ただし、条件がある」", "再び、心臓が跳ねる。", "「付き合うのは、十八歳になってからでもいい？」", "予想もしなかった宣言に、僕は言葉を失った。ソフィアの瞳は決意と覚悟、そしてどこか哀しみを湛えて、じっと僕を見据えている。その静謐な表情が、僕の中に残っていた幼い焦燥を浮き彫りにした。", "「今からじゃダメなのか？」", "焦りがそのまま、尖った声になって漏れた。ソフィアは視線を落とし、地面に落ちた自分の影を見つめながら、ぽつり、ぽつりと話し始めた。", "「私ね、小学校を卒業したら、日本に行くのよ。パパの仕事で」", "その言葉が耳に届いた瞬間、全身の血が引いていくような感覚に襲われた。", "「中学も、高校も、向こうで過ごすことになる。たぶん、帰ってこれない」", "淡々とした口調だった。それは自分自身に言い聞かせ、何度も心の中で反芻し、ようやく形にした言葉のようにも聞こえた。", "「……それでも、付き合おう」", "考えるより先に言葉が口をついて出ていた。その言葉がどれだけ重く、同時に無責任にもなり得るのか、僕はまだ分かっていなかった。ただ、今ここで声を出さなければすべてが崩れてしまう気がした。今すぐにでも手を伸ばして、ソフィアをここに留めておきたかった。彼女の服の袖を掴めば、まだこの場所に留まってくれるような気がした。", "「もし今付き合って、離れ離れになって……それで連絡が途絶えていくようなことになったら、お互い嫌じゃないかしら？」", "ソフィアの声は驚くほど冷静だった。感情を押し殺した声ではない。何度も悩み、迷い、その先で選び取ったような静けさだった。彼女は僕を見ているのに、その眼差しはすでにずっと遠い先の未来を見据えていた。", "「十八歳になったら、また会いましょ」", "その言葉に、胸がひくりと痛む。", "「そのとき、まだお互いが同じ気持ちだったら……そのときは、ちゃんと付き合いましょ」", "それは未来を信じるための提案だった。しかし同時に今日という日で一度この関係を手放す提案でもあった。かすかな希望と別れの悲しみがソフィアの言葉の中には複雑に混ざり合っていた。僕はすぐに返事ができなかった。今、一緒にいたい。その思いは疑いようのないものだった。でも、目の前のソフィアはもう少しだけ、遠い場所に立っている。自分よりも一歩先の時間を生き、先に来たるべき痛みを引き受けようとしている。", "「……分かった。約束する」", "そう答えるまでに、何度も震える息を吸い直した。", "「約束、ね」", "ソフィアはそう言って、いつものように笑った。けれどその笑顔は、陽炎のように透き通っていて、今にも消えてしまいそうだった。", "「十八歳の年の、今日。オックスフォード・サーカスの交差点で会いましょ」", "そのちいさなあまりに脆い約束が、これから先の孤独な年月を支える唯一の拠り所になることを僕はまだ知らなかった。この日を、この青空を、この土の匂いを。何度も何度も心の中で思い返し、擦り切れるまで反芻しては、来たるべき再会を夢見る日々が始まることを。僕はまだ知らなかった。天を見上げると、空は相変わらず呆れるほど青かった。十八歳の約束の日も、どうかこんな天気であってほしい。そう願いながら、僕はただ一度だけ強く、ソフィアと切実な抱擁を交わした。 離れたとき、頬をなでた風はもうすっかり春の柔らかな体温を帯びていた。それが、七年も前の話だ。"]}, {"title": "", "paragraphs": ["目の前の彼女は、白杖を握ったまま、僕の返事を待っている。まつ毛の長い、少し伏せた目。光を受けていない瞳は、緑にも灰色にも見える。栗色の髪。小さな鼻。どれも、七年前の記憶の中のソフィアに似ていて、同時にまったく別人のようにも見えた。人は変わる。六年は、人を変えるのに十分な時間だ。僕だって、背が三十センチも伸びて、声が変わって、髪は金色のままなのに、鏡の中の他人のようなのだから。", "もし、彼女がソフィアだったら。それは僕の人生で一番嬉しい偶然のはずだった。胸は確かに高鳴っていた。けれどそれ以上に、足元から何かが崩れていく音がしていた。ソフィアが盲目であること。あの猫みたいな目が、もう何も映さないこと。いつ何があったのか。僕はそれを知らなかった。知る由もなかった。知らないうちに、七年の間、彼女は一人でその変化を引き受けていたのだ。そしてその彼女の前に、七年前と変わらない顔をして、「やあ、僕だよ」と立つ資格が、僕にあるのだろうか。違う。そもそも、彼女がソフィアだという確証が、どこにある？　名前も、まだ聞いていない。", "「ねえ、聞いてる？」", "彼女が少し不安そうに言う。僕は一度深く息を吸って、それからほとんど反射的に言った。", "「……知らないな。オリヴァーなんて男は」", "口に出した瞬間、後悔が背中を駆け上がった。けれど言葉はもう戻らない。送った言葉は、消せないまま相手の中に残り続ける。", "「残念だけど、僕は君の捜している男じゃないよ」", "「……そう」", "彼女は残念そうに、肩を窄めた。その肩の細さが、記憶の中の背中と重なって、僕は慌てて目を逸らした。", "「ここで会う約束をしてたの？」", "自分で自分の声が、他人のもののように聞こえた。", "「そうなの。でも、見つからなくて。あの交差点は、人が多すぎて……真ん中に立とうとしたら、押し出されちゃった」", "彼女は小さく笑った。あの交差点の、中央。僕が一時間前、立てなかった場所。", "「よかったら、一緒に捜そうか？　時間ならあるし」", "それは世界で一番間の抜けた申し出だった。それでも僕には他にどうすればいいのか、本当に分からなかった。", "「いいの？」", "「いいよ。任せなよ」", "そう言って、僕は彼女の手を取った。彼女の手はほっそりとしていて、とても冷たかった。そしてどこまでも切実に、僕の手を握り返していた。"]}, {"title": "", "paragraphs": ["オックスフォード・サーカスの交差点は、四月の陽気に浮かれた人々で溢れていた。信号が赤に変わると、四方の道路から一斉に人が流れ込み、交差点の中央で斜めに交差する。いつ見ても巨大な生き物の呼吸みたいだと僕は思う。彼女の手を引いて、その中心に立ったとき、僕は思わず足を止めた。一時間前の僕は、ここに立てなかった。それが今、彼女の手を握って、堂々と、もっとも約束に近い場所に立っている。", "「ここが、中央？」", "彼女が白杖を短く持ち直しながら訊いた。", "「うん。ちょうど真ん中だ。周りは人でいっぱいだよ」", "「……約束の場所ね」", "彼女は小さく息を吐いた。それから、思い出したように付け加える。", "「最初に着いたとき、足元に白い線が見えた気がしたの。目が見えないのに、おかしいでしょう」", "「おかしくないよ」", "僕は言った。喉の奥が少し痛かった。僕はあたりを見回し、金髪で背の高い男を探すふりをした。ふりをしながら、本当に辺りを見回していた。鏡を見るのが嫌になるくらい見慣れた、あの頭が、どこかにいやしないかと。もちろんそんな男は見つからない。僕はこの手の中にいるのだ。", "「オリヴァーは大切な人なの？」", "沈黙を埋めるように、不意にそんな言葉がこぼれた。", "「……十八歳になったら、ここで会おうって約束したの。小学校のときに」", "彼女の短い返答には、七年間をたった一人で耐え、この場所に来た人の強い思いと重みがあった。", "「……約束は」", "僕は一度言葉を切り、慎重に間を置いた。", "「心を縛るからね」", "声が少し揺れたのが自分でも分かった。", "「縛られてたわ、ずっと」", "彼女が静かに言った。", "「でも、それだけじゃなかったから。何かに縛られているということは、何かに繋がれていることと同義でもあるから」", "その言葉を、僕は胸の中で何度も繰り返した。繋がれている。繋がれている。", "「リージェント・ストリートを先に見ない？」", "どこか上ずった自分の声が、自分のものではないように聞こえた。", "「人の流れが多い場所だから、見つけやすいかもしれないよ」", "歩き始めると白杖を短く持ち直した彼女の動作に合わせて、僕は無意識に歩幅を狭めていた。意識して気を遣ったのではなく、身体が勝手に反応したのだ。その何気ない調整があまりに自然に行われたことに気づき、彼は言いようのない苦しさを覚えた。\\", "&#x20;　リージェント・ストリートに近づくと、日常のざわめきが一気に押し寄せてきた。", "「金髪で、背が高い人だよね」", "自分の特徴を、まるで他人のことのように言葉にする。そのいびつさに、胸の奥が強く痛んだ。", "「うん。細身で……たぶん、優しそうな顔をしてると思うわ」", "その言葉が耳に刺さった。彼女は今も、七年前の幼い自分の面影を抱いていた。そしてその顔を「優しそう」だと言った。名乗ることもできず、親切なふりをして彼女の隣を歩いている今の自分は、本当にそんな顔をしているだろうか。", "「オリヴァー！」", "気づくと、僕は大きな声で叫んでいた。自分の名前を、自分で呼ぶ。この世でこれほど居心地の悪いことがあるだろうか。数人の通行人が振り返り、赤い二階建てバスの運転手が不審そうにこちらを見た。彼女が驚いて肩を揺らす。", "「声が大きいわ」", "「ごめん。でもほら、これくらい呼ばないと届かないだろ」", "彼女は少しだけ笑った。その笑い方が、七年前、僕のジョークに目を細めたソフィアの笑い方と、重なる。僕は、慌てて目を逸らした。"]}, {"title": "", "paragraphs": ["それから僕たちは三十分ほど、交差点の四つ角を順番に回った。リージェント・ストリートの角。ピカデリー方面の角。ブリッジ・ストリートへの道。彼女は黙ったまま、ときどき立ち止まって、耳を澄ませた。人の足音、バスのブレーキ、信号機の電子音。そのあらゆる音の中から、彼女は何かを聞き分けようとしていた。でも、オリヴァーは見つからなかった。彼女の呼吸が少しずつ浅くなっているのを、僕は見逃さなかった。", "僕たちは交差点から少し離れた、小さな広場のベンチに座った。", "「ベンチで休もう。僕も、ちょっと疲れたし」", "それは嘘だった。僕の脚は、まだ走れるくらい元気だった。でも僕は、僕の嘘を二つ三つ重ねることに、もう抵抗を感じなくなっていた。", "彼女は白杖を膝の上へ慣れた手つきで置いた。", "「……見つからないわね」", "彼女が静かに、諦念を滲ませて呟いた。", "「そうだね」", "「……来てないのかな」", "その声の底に潜む、僅かな震えを僕は感じ取っていた。来ている。ここにいる。たった一言が、喉の奥で固い石のようにつかえていた。路上ライブの音楽が、どこか遠くで優雅な旋律を流している。ビートルズの『ヘイ・ジュード』は、いつの間にか　別の曲に変わっていた。", "「……音楽、流れてるわね」", "「そうだね」", "「なんの曲か、分かる？」", "耳を澄ませると、確かに聞き覚えのある旋律だった。アコースティックギターの、歌のない、静かなアルペジオ。けれど曲名を思い出そうとした瞬間、鈍い痛みが走った。思い出してはいけない、と体が言っていた。その旋律に結びついた記憶を呼び起こすことが、今はあまりにも怖かった。", "「……分からないな」", "「私も」", "彼女が微笑む。", "「だけど、ずっと昔聴いていた曲とよく似てる。大切な人と一緒に聴いてた曲と」", "僕は固く口を閉ざしたまま、その告白を受け止めた。", "「あの頃は、分からなくても、それでいいって思えた。分からないことを、ひとりで抱えなくていいって思えてた……」", "「……素敵な時間だったんだね」", "「うん。今は、もっとよく分かる」", "彼女の声がわずかに低くなった。", "「貴方にはある？　誰かとそういう時間を過ごしたこと」", "彼女の不意の問いに、僕は一拍置いてから答えた。", "「……あるよ」", "「どんな人だった？」", "ふたたび、重い沈黙。", "「……素敵な人だったよ。でも、よくわからなかった」", "「よくわからない？」", "「……言葉にすること、定義することを、ずっと躊躇してるんだ、その人。だから自分にどんな感情を抱いているのかわからなくてさ」", "口にしながら、僕はなんとも言えない気持ちになった。自分の想いをその本人の前で打ち明けている。馬鹿げた状況だ。それでも口は止まらない。", "「多分きっと、怖かったんだと思うわ」", "彼女が静かに言った。", "「怖かった？」", "「心地よい関係を、ありふれた形にしてしまうことが」", "僕は何も言わなかった。", "「その人のことが、大切なのね」", "「多分、そうだと思う」", "「今も？」", "答えは出なかった。答える代わりに、僕は青い空を見上げた。どこか遠くを見つめていなければ、感情がぐしゃぐしゃになってしまいそうだった。", "「……捜しに行こう」", "ようやく絞り出した言葉とともに、僕は立ち上がった。それに合わせるように彼女も立ち上がった。彼女は白杖を構え直すと、今度は自らの意志で、僕の手を取った。彼女の手は今度は包み込むようにしっかりと僕の掌を握っていた。その確かな重みを、僕はきっと生涯忘れないだろうと感じていた。"]}, {"title": "", "paragraphs": ["最後にもう一度、僕たちが出会った裏通りに戻ることを僕が提案した。再び辿り着いた裏通りには相変わらずチャップリンを模した路上パフォーマーがいた。路上ライブをするおじさんたちはビートルズの『愛こそはすべて』を歌っていた。通行人たちも心なしか愛について寛容な面持ちをしていた。夕方に近づいた裏通りには午前とは違う光が差していた。ショーウィンドウに西日が映り込み、街全体が少しだけ金色に傾いている。僕たちは信号が赤になるのを待ち、中央へ流れ込む人の波に混じって、もう一度その真ん中に立った。", "「やっぱり、いないわ」", "「……いないね」", "「うん。いない」", "彼女は自分に言い聞かせるように、その事実を言葉の重みで確かめていた。", "「ねえ」", "「ん？」", "「私がここに来たことに、意味はあったと思う？」", "「えっ？」", "「いや、果たされなかった約束に意味はあるのかなって思っちゃって」", "目頭を押さえる彼女に、僕は咄嗟に手を伸ばそうとした。しかしその手を僕はすぐに引っ込めた。", "「あるよ、きっと」", "僕は少し間を置いてから、そう答えた。自らの声が制御しきれない感情によって低く沈んでいくのを自覚していた。彼女はその声の調子を読み取ろうとするかのように、僅かに首を傾けたが、それ以上の問いを重ねることはなかった。一陣の風が吹き抜け、僕たちの髪をなびかせた。", "「今日は……ありがとう」", "彼女がそっと手を離し、ゆっくりと振り返った。", "「いえ」", "「助かったわ。もしひとりだったら、もっと心細かったと思うから」", "「……申し訳ないよ、見つけられなくて」", "気づけば、謝罪の言葉が唇を滑り落ちていた。", "「そんなことないわ。こんなにも親切にしてもらって感謝しかない」", "彼女が優しく首を振った。そのたびに、僕は言いようのないもどかしさを感じた。", "「オリヴァーってやつは、幸せものだね」", "「え？」", "「だって、こんなにも一途に思ってくれる人がいるんだから」", "僕の声は、震えていた。", "「……そうなのかしら」", "彼女は答えを持ち合わせていない少女のように小さく笑った。", "「じゃあ……僕は、帰るね」", "「うん」", "「会えたらいいね、その人に」", "「会えるまで待つわ」", "そのあまりにも健気な返答に、僕はほとんど反射的に自分の右手で頬を平手打ちした。", "「えっ、今、凄い音がしたわよ」", "彼女が驚いたように肩を揺らした。", "「えっ、なんの音だろう？」", "僕は目尻を手の甲で拭いながら、笑った。", "「まあ、なんでもいいじゃないか」", "「えっ。どういうこと？」", "困惑する彼女をよそに、僕はその肩を二度叩いた。", "「素敵だよ、誰かを想う君の姿は」", "「えっ……？」", "彼女が目を丸くした。", "「いや、なんでもない。じゃあ……失礼するよ」", "そこで僕は踵を返し、逃げるように交差点を後にした。チャップリンの格好をした男が、どこかでまた、僕に向かって帽子を取った気がした。"]}, {"title": "", "paragraphs": ["僕は振り返らなかった。振り返ってしまえば、きっと何かを期待してしまうから。彼女が僕の名前を呼ぶことを、あるいは僕の手をもう一度握ることを。リージェント・ストリートを北へ、人の流れに逆らうようにして歩いた。ポケットには路上パフォーマーのチャップリンに投げ損ねた硬貨が二枚、残っている。水たまりに映った空は、相変わらずどこまでも青かった。それが、ひどく腹立たしかった。", "彼女はソフィアじゃない。僕はそう言い聞かせた。声は少し低くなっていた。背は伸びていた。あの猫みたいな目は閉ざされていた。そんな別人のような人が、僕の記憶の中の彼女であるはずがない。そうであってほしくなかった。あの日のソフィアは青い空の下で背筋を伸ばして、僕に約束を告げた少女のままで、世界のどこかにいてほしかった。目が見えなくなったソフィアなんて、僕は想像したくなかった。だけど、だけどやっぱり僕はまだ、彼女にどうしようもなく惹かれていた。彼女は言った。──何かに縛られているということは、何かに繋がれていることと同義でもある、と。繋がれている。七年間、彼女は一人で、この約束に繋がれていたのだ。僕は金髪の髪を両手でかき乱した。通りすがりの老婦人がぎょっとして僕を見た。彼女が約束につながれていたように、僕もまた約束によって彼女とつながれていたのではないか。そう、あのとき彼女の細く、冷たい手を握ったように。", "やはり、彼女はソフィアなのだ。それ以外の可能性を、僕はもう信じられなかった。僕の名前を口にしたときの、柔らかな声。冷たい手のひら。握り返してきたあの強さ。七年という時間が変えたものと変えられなかったものが、彼女の中で一つに重なっていた。僕は踵を返し、勢いよく走り出した。", "右足がわずかに軋んだ。", "しかし構わずに、地面を蹴った。", "呼吸と、地面と、脚の感覚だけになった。", "ストップウォッチは握っていなかったけれど、たぶん、それは僕の自己ベストだった。"]}, {"title": "", "paragraphs": ["その頃、ソフィアはセルフリッジズの店内にいた。", "人の波から逃れるように入った百貨店は香水と暖房の匂いで満ちていて、耳の奥まで音が詰まった。誰かがぶつかりそうになって、すみませんと言いながら去っていく。彼女は通路の脇の壁に背を預けて、白杖を膝の高さで握り締めた。諦めて、帰ろう。そう思った。七年間、待ち続けたのだ。それが叶わなかったとしても、今日ここまで来たことは、嘘にはならない。そう自分に言い聞かせて、出口に向かって歩き出した", "けれど、数歩進んだところで、足が止まった。", "さっきの男の人の手の温度が、まだ掌に残っていたからだ。彼は最後に、素敵だよ、誰かを想う君の姿はと言った。あの言葉の、震え。何かを堪えるように揺れた語尾。あれは初対面の通りすがりが、ただ親切心から口にするような言葉の調子ではなかった。それに約束の話をしたとき。約束は、心を縛るからねと、彼は言った。あのとき、彼の声は確かに揺れていた。確かめたい、と思った。もう一度だけ。彼女は出口とは反対の方向に、白杖の先を向けた。どうせ諦めるなら、諦めきれなかったという事実ごと抱えて、あの交差点を、もう一度通ってから帰りたかった。"]}, {"title": "", "paragraphs": ["ソフィアが交差点の中央に戻ってきたのは、それから三分ほど後のことだった。もう、人の気配は少なかった。バスのエンジン音と、信号機の電子音と、遠くから聞こえる路上ライブの『愛こそはすべて』。そのほかは風の音だけだ。彼女は白杖をたたんで、その場所に立った。足の裏にアスファルトの硬さが伝わる。確かにここだ、と思った。七年前、小さな口でこの場所の名前を告げた、あの日の約束の場所。", "「……いないわね」", "誰にともなく、そう呟いた。そのとき、ソフィアの肩が、誰かの肩に軽く触れた。ほんの少し、どこかで嗅いだことのある匂いがした。洗い立ての、シャツみたいな匂い。けれど、それがいつ、どこで嗅いだものなのかは思い出せなかった。振り返ったときには、もう気配は雑踏に混じっていた。彼女は、午前中に出会った男の人のことを考えた。背が高く、声は低く、そして手がとても温かかった。彼はずっと自分の歩幅に合わせて歩いていた。意識して合わせるのではなく、体が勝手に反応しているような、無理のない調整だった。", "あの人が、オリヴァーだったのだろうか。", "その考えは、ひどく突飛に思えた。けれど、一度浮かんでしまったら、もう打ち消せなかった。彼は、オリヴァーを知らないと言った。それなのに、どうして、あれほど親身に一緒に捜してくれたのか。どうして、あの人の声はあんなに震えていたのか。どうして最後に、あんなことを言ったのか。", "もし、あの人がオリヴァーだったとしたら──", "なぜ、名乗らなかったのだろう。", "彼女は考えた。白杖を持った自分を見て、もしかしたら驚いたのかもしれない。変わってしまった自分の姿に、どう接したらいいのか分からなかったのかもしれない。幻滅させてしまったのかもしれない。それとも──彼もまた何かに縛られて、動けなかったのだろうか。", "けれどそうだとしても、あの親切さはおかしい。失望した相手に、あんなにも丁寧に、手を引いて一緒に歩く人はいない。名乗れなかったからこそ、あれほど優しかったのかもしれない。優しさでしか、何も伝えられなかったから。考えは、どこまで行っても、答えには届かなかった。", "彼女はしばらく、風の中に立っていた。やがて、静かに首を振った。", "「……どちらでもいい」", "声に出して、そう言ってみた。", "本当に、どちらでもいいと思えた。六年前、彼女は十二歳で、異国へ旅立った。言葉も通じない土地で、ある日突然、世界から光を奪われた。教室の黒板が滲んで消えたとき、彼女は約束を思い出した。十八歳の今日。オックスフォード・サーカスの交差点の中央で、また会おう。それだけが、暗闇の中で、細い糸のように、彼女を繋ぎ止めていた。約束がなければ、彼女は立ち上がれなかったかもしれない。約束があったから、彼女は白杖の使い方を覚えた。点字を覚えた。見えなくても、音で世界の形を知る術を覚えた。誰にも頼らず、自分の足で、ここまで来た。約束は彼女を縛っていた。けれど同時に、彼女を前に進ませてくれた。相手が来たかどうかは、もう、問題ではなかった。この約束が彼女を成長させてくれた。それは誰にも奪えない。", "彼女は。白杖を広げた。遠くで、おじさんたちの合唱が『ヘイ・ジュード』に変わった。サビに入って、通行人たちが、鼻歌でそれに合わせている。彼女も、小さく口ずさんだ。昔、誰かと一緒に聴いていた、歌のない旋律の続きのように。いつか、またあの人に会えたなら──今度は私から彼の名前を訊こう。あなたは誰ですか、と。そして、初めて出会った人のように、こう言うのだ。はじめまして、と。"]}, {"title": "", "paragraphs": ["ほとんど同じ頃、僕は人の波をかき分けて、オックスフォード・サーカスの交差点へ飛び込んだ。走ってきたせいで呼吸が乱れ、喉の奥が乾いていた。中央へ向かう。歩行者用の信号が青に変わり、四方から人が流れ込んだ。買い物袋を提げた人、スマートフォンを見ながら歩く人、誰かと話し続けている人。それぞれが決まった方向へ進み、交差点の中央で一瞬だけ互いの進路を譲り合い、また離れていく。二階建てバスのブレーキ音が通りの向こうで鳴った。リージェント・ストリートのほうから、おじさんたちの合唱が聞こえてくる。『ヘイ・ジュード』のサビの前。僕は人混みの中で目を凝らした。栗色の髪。結んだ髪と真珠の耳飾り。白杖。歩く速度も、肩の傾きも、遠くから見分けられるほど覚えていたはずだった。けれど、いない。僕は交差点の真ん中を何度も方向を変えながら歩いた。立ち止まると後ろから人が来るので、避けながら、顔を上げながら、同じ場所を行き来した。信号が変わるたびに人の流れが途切れ、また始まった。そのどこにも、あの背中はなかった。人混みの向こうに、いるはずの姿がない。", "そのとき、僕の肩に誰かの肩が軽く触れた。反対側の端から、中央に向かって歩いてきた誰かだった。小さな肩。かすかに石鹸のような清潔な匂い。コツ、コツ、という白杖の音が一瞬だけ、すぐ近くで鳴った。僕は人を避けるためにわずかに身体を傾けた。相手も同じように進路を変えたのだろう。互いに足を止めることも、声をかけることもなかった。けれどその音は無数の足音とクラクションと『ヘイ・ジュード』の中に、あっという間に溶けて消えた。僕は振り向かなかった。振り向く理由を、持っていなかった。それは後から思えば、ほんの一メートルにも満たない距離だった。", "誰もいなくなった交差点の中央で、僕は立ち尽くしていた。実際には、まだ周囲を歩く人は大勢いた。信号が変われば人はまた動き、店の前には列ができ、バスは停まり、誰かが笑っていた。それでも僕には、もう探すべきものがなくなったように思えた。間に合わなかったのだ。そう思った。彼女は、帰ってしまったのだ。足元には、白い線が引かれていた。何度も踏まれ、ところどころ擦れている横断歩道の線。ソフィアが言っていた線。目が見えなくなっても、彼女の足は、きっとこの白い線を覚えている。交差点の幅も、信号の音も、歩道の段差も、ここを行き交う人々の声も。そうしたものを頼りに、彼女は今日もこの場所を歩いていたのかもしれない。僕はそのことを考えながら、足元を見ていた。", "僕はその場に立ったまま、青い空を見上げた。ビルの間から見える空には雲がほとんどなく、日差しは交差点の舗装を明るく照らしていた。僕は何をしに来たのだろう。約束を果たすために来たはずだった。けれど、約束を果たすというのはいったい、どういうことなのだろう。同じ時間に同じ場所に立つことか。それとも七年前の自分たちを取り戻すことか。七年前に交わした言葉をそのまま今の僕たちに当てはめようとすることか。もしそうなら、僕は最初から間違えていた。あの日のソフィアは、もういない。僕たちはそれぞれの場所で、それぞれのやり方で変わってしまう。記憶の中では、彼女はいつも同じ年齢で、同じ声で、同じように笑っていた。けれど現実の彼女には、僕の知らない年月がある。僕の知らない人々と過ごした時間があり、僕の知らない考えや習慣があり、僕が想像することさえできない日々があった。いや、違う。本当の意味で変わってしまったのは、僕の方だじゃないか。変わってしまったことを怖がって、隠して、嘘で包んだ僕は、きっと約束の相手に会う資格すらなかったのだ。彼女に会うことばかり考えて、その先にいる彼女がどんな人間なのか、考えることを避けていた。僕が待ち続けていたのは、彼女自身ではなく、彼女と過ごした時間だったのかもしれない。", "──だったら。", "僕は深く息を吸った。", "喉の乾きが少しだけ和らいだ。いつか、もし再会が許されるなら。そのときは約束に縛られた少年としてではなく、何も背負っていない一人の人間として、彼女の前に立てばいい。七年前のことを最初から説明しなくてもいい。失った時間を埋めようとしなくてもいい。彼女が何を覚えていて、何を忘れているのか、僕が決める必要もない。そして初めて出会った他人のように、まっすぐ彼女を見て、声をかけるのだ。はじめまして、と。", "誰の耳にも届かない声で、僕はそう呟いた。チャップリンの格好をした路上パフォーマーが、遠くで僕に向かって、帽子をひらりと持ち上げた。黒い山高帽に、白い手袋。足元には小さな箱が置かれ、そこに何枚かの硬貨が入っていた。彼はしばらく僕を見ていたようだったが、やがて別の通行人に向き直った。胸のプレートの文字は、ここからは読めなかった。けれど何が書いてあるのかは、もう知っていた。下を向いていたら、虹を見つけることは出来ない。僕はポケットの中に残った硬貨を握りしめたまま、今度こそ本当に歩き出した。指の間で硬貨が重なり、小さな音を立てた。振り返らずに歩いた。水たまりに映った空は相変わらずどこまでも青かった。僕は確かに空を見上げていた。けれどそこにあるものを見ていたとは限らない。目に映るものと、目を向けるべきものは、きっと別だったのだ。今なら、はっきりと言える。今なら、間違いなく言える。オリヴァー、盲目なのは僕の方だ、と。"]}], "en": "Oliver, It Is I Who Am Blind.", "summary": "七年前の約束の場所で、盲目の女の子に出会う。", "tag": "約束"}, {"id": "s3", "group": "夭折した天使たちへ", "title": "ドストエフスキーはお断り", "chapters": [{"title": "", "paragraphs": ["「結婚相手に求める、条件ですか」と男は言った。隠さずとも身なりから育ちの良さが滲み出ている知的で、ハンサムな顔立ちの男である。男は少し間を置いてから言った。「しいていうならば、ドフトエフスキーを知っていることですかね」", "「ドフトエフスキー」", "私はその単語を、何度か頭で繰り返した。それは不思議と、奇妙な響きをまとった言葉だった。", "「あっ、でも誤解しないでほしいんですが、別に私は彼の作品を全て読めと言っているわけではないんです」と男は訂正した。「ただ、ドフトエフスキーという偉大な作家の名前と、彼がロシア文学を代表する、稀代な作家であったことくらいは、最低限の教養として身につけておいてほしいんです」", "「はぁ」", "ドトールの混雑した店内の一角で、彼はスマートにそう言った。その眼差しは、どこまでも従順で、知的で、迷いがなかった。しかし不覚にも、読書と無縁の生活を送ってきた私にとって、彼が口にしたドフトエフスキーという作家ついて、それらしき知識をほとんど持ち合わせていなかった。", "「『カラマーゾフの兄弟』とか、『罪と罰』とかを知っているなら、なおいいです。だけど、彼の作品を全て読破しているような熱心で、教養のある愛好家だと、かえって自分の思考の狭量さや、浅はかさが露呈して、生きづらいかもしれない。だから、結婚相手に求める条件を挙げるなら、私は『ドフトエフスキーを知っていること』を提示しますね」", "ドフトエフスキー、ドフトエフスキー。私はそのどこか謎めいた言葉をら再び口ずさんでみる。ドフトエフスキー、ドフトエフスキー……ど太F好きー。だめだ。これじゃまるで藤子・F・不二雄みたいだ。", "「つまりドフトエフスキーを教養として知らない人とは結婚を考えられないということですか」", "私は慎重に、注意深く尋ねた。しかし彼は、エレガントな笑みを崩さない。", "「極論はそうなりますね。ですが私にとってドフトエフスキーはどちらかというと、相手の教養の深さを推し量る、試金石のようなものなんです」", "「試金石……」", "彼は一度頷いた。", "「教養をはかる尺度は無数にありますが、私はその中でもドフトエフスキーがもっともその尺度にふさわしいと思うんです。彼は文学界では知らぬ人などいない絶対的な文豪です。それに文学ファンからも、半ば狂気的な支持を集めている。もはや、世界文学において、彼抜きにその歴史を語ることなど、近代文学の冒涜に他ならない。彼には、まさしくそう言わしめるほどの類稀なる才覚がありました」", "彼はそっと足を組み直し、形の整った手のひらを膝に乗せた。", "「しかし、誰しもが文学を愛好しているわけではありません。この世界には八十億もの人々がいて、その趣味嗜好は千差万別です。だからこそ全ての人々がドフトエフスキーを認知し、その作品を何かしらひとつは手にとって、読んでいなければならないとは、流石の私も思いません。しかしながら、教養としての知識、となると話は違います。少なくとも我々人類は、健康的な生活を送っていれば、六十年以上は問題なく生きれると医学的には証明されています。六十年とは、言い換えれば半世紀近いとても長い年月です。それはひとつの文明の誕生と衰退をあわよくばお目にかかれるような歳月です。私たちはその途方もなく長い歳月の中で、実に様々なことに触れ、多様な経験を積み重ね、時に波乱に満ちた人生を生きていきます。初めての歩行、その原初的な体験から、上司に対する正しい礼儀作法、害虫の適切な駆除の仕方や、好きな人へのスマートなデートの誘い方、ひいては風呂栓の実践的かつ、効率的なサイズの測り方まで。人々はあらゆる経験から、実に多彩な知恵を見出し、多様な人格を形成していきます。それは明言するなら極めて初歩的かつ、実践的な、それでいて限りなくスタンダードな人間的営みです。私はそのような人類の素晴らしい文化的発展と、それに伴う神話的な平和と安寧に、限りない敬意を表しています。それは私にとって、疑いようのないことです」", "彼は二、三度頷き、それから私に向かって魅惑的なウインクをした。", "「しかしながら私はそのような牧歌的営みの中に、やはり最低限の教養というものが不可欠であると、常々感じています。私にとって文化形成とは相互の認識の共有によって初めて成り立つ、協調的かつ、建設的なものです。古いことわざに同じ釜の飯を食うとも言うように、共通の認識や教養がない以上、そこに文化的な対話は存在しません」", "彼はテーブルに置かれたグラスを手にし、ストローでアイスティーを口に含んだ。", "「だからこそ、我々人類には『文化的な認識としての教養』が必要です。哲学のソクラテスや、劇曲のシェイクスピア、あるいは物理学のニュートン。誰もがその名を一度は耳にしたことがあるだろう、歴史的な偉人と、彼らが生涯をかけて残した、人類史を根底から覆す芸術的遺産の数々。それらは今も人類の崇高な文化と、精神に深く根ざしている。それは疑いようのない事実です。だからこそ、我々はその社会的意義に満ちた人類の遺産を、文化的、認識的な教養として留めておく必要があります。たとえばキリスト教信者が注意深く聖書を愛読するように」", "彼はそこで言葉を切り、窓の外へ視線を移した。夜空を飛び回る、巨大な鴉の翼が、漆黒の闇へと、静かに溶け込んでいる。その不吉な闇は世界の輪郭を、見境なく溶かしていく。", "「しかしながら、人類はその爆発的な多様化に伴い文化的、認識的教養を失いつつあります。インターネットの普及や、アルゴリズムの進化により、人類は今自分に必要な知識を、自分に必要な範囲のみ、限定的に獲得できてしまう。これは情報技術の発達そのもの恩恵とも言えますが、裏を返せば、広義的かつ、包括的な、文化的知識を失いつつあることを意味しています。それは別の角度で言い換えるならすなわち文化的な認識としての教養が、衰退の一途をたどっていることを意味しています。そして私はその事実は人類にとっていずれ危機的なものになるのではないかと、常に危惧しているのです」", "哀切の念がこもった彼の声が、混雑したドトールの店内に切実な響きをもって広がり、消えていく。", "「今のご時世、もしかしたらドフトエフスキーの名を知る人の方が少ないかもしれません。それは文化的、認識的な教養をこよなく愛する、私としては、あまりにも哀しく、胸の痛むことです」", "彼の憂いを湛えた眼差しに、私の心は否応なく、惹きつけられてしまう。", "「だからこそ私は『文化的な認識としての教養』を愛するひとりのしがない文化人として、せめてものわるあがきと評して、ドフトエフスキーの名を知る文化的、認識的な女性と、文化的、認識的な教養を育む、牧歌的で、穏やかな家庭を築きたいのです」", "その瞳には人類の存続を賭けたような、唯ならぬ覚悟と、人類の未来を託されたような、並々ならぬ決意の色が宿っていた。", "「なので大変心苦しいのですが、あなたと結婚を前提としたお付き合いはできません」", "そのあまりにも拍子抜けした宣告は、婚活に奔走する私の胸に、重苦しく、理解不明な悲劇として、鮮烈に、しかしどこまでも重く鎮座した。"]}, {"title": "", "paragraphs": ["ドフトエフスキーという一風変わった奇妙な尺度によって、ハンサムな男にふるいをかけられた日の夜、私はリビングの床に胡座をかいたまま、ノートパソコンの画面に検索窓を立ち上げていた。", "「ドフトエフスキー」——彼の口から、幾度となく紡がれたその名前を、私は一文字ずつ、まるで宗教儀式のように打ち込んでいく。Enterキーを押すと、画面には見慣れないカタカナの羅列が並んだ。", "『ドストエフスキー Wikipedia』", "「ん？」", "私は目を細めた。", "ドフトエフスキーではなく、ドストエフスキー。似てはいるが、微妙に違う。検索エンジンの気の利いた誤字修正機能だろうか。私はそう思い、特に気にも留めずに、そのページをクリックした。", "フョードル・ミハイロヴィチ・ドストエフスキー。1821年、モスクワ生まれ。19世紀ロシア文学を代表する小説家。工兵学校を卒業後、文学の道へ進み、『貧しき人々』でデビュー。その後、政治結社への関与により逮捕され、死刑を宣告されるも、土壇場で恩赦を受け、シベリアへの流刑を経験する。この経験が、後の彼の作品世界に決定的な影響を与えることになる──。", "私は画面をスクロールしながら、その波乱に満ちた生涯にいつしか引き込まれていった。彼が語っていた『絶対的な文豪』という言葉が決して大げさな誇張でなかったことを私はこのとき、ようやく実感した。続けて私は『罪と罰』のあらすじを読んだ。", "貧しい元大学生ラスコーリニコフが、独自の思想のもとに金貸しの老婆を殺害し、その後の良心の呵責と、刑事ポルフィーリイとの心理的な駆け引きに苦しめられていく物語。そのままの勢いで、私は『カラマーゾフの兄弟』のあらすじも読む。", "放蕩な父フョードルと、性格の異なる三人の息子たち。父殺しという事件を軸に、信仰と理性、愛と憎しみが複雑に絡み合う、壮大な人間ドラマ。", "読み進めるうちに、私の胸の中にはある種の悔恨にも似た感情が芽生えていた。あの夜、ドトールで交わされた会話の一部始終が鮮明に蘇ってくる。「教養」という言葉を、彼はあまりにも重々しく、まるで人生の全てであるかのように、語っていた。そしてその教養の欠如を理由に、私はいとも簡単に切り捨てられてしまったのだ。", "だったら、今からでも彼の言う教養に追いつけばいい。そんないささか意地になったような感情に突き動かされ、私はAmazonのアプリを開いた。検索窓に「罪と罰」と打ち込むと、複数の出版社から出ている文庫本の一覧が、ずらりと表示される。私はその中から、レビュー評価の高い文庫本を選び、カートに追加した。続けて「カラマーゾフの兄弟」も検索し、上中下巻セットになっている新訳文庫版をカートに入れる。これで教養を得る準備はできた。そう、確信し、購入ボタンを押そうとした、その瞬間、ふと商品ページの著者名の表記に目を留めた。", "「ドストエフスキー(著)」", "──ドストエフスキー。", "私は思わず、画面を二度見した。心臓がどくんと嫌な音を立てる。そうだ。さっきWikipediaで調べたときも、確かにそう表示されていたはずだ。ドフトエフスキーではなく、ドストエフスキー。私は震える指先で、もう一度、Googleの検索窓に「ドフトエフスキー」と打ち込んでみる。すると画面には、あの忌々しいほど親切な一文が表示された。", "『もしかして: ドストエフスキー』", "もしかして、も何も。彼はあれほど自信満々に、まるで自らの人生哲学を語るような饒舌さで、その名前を幾度となく繰り返していたのだ。「ドフトエフスキーを知っていること」。それが彼の掲げる、結婚相手に求める唯一の、絶対条件のはずだった。なのに彼自身が、その名前を間違えていた。", "私はしばらくの間、放心状態でノートパソコンの画面を見つめていた。頭の中では、あの夜の彼の得意げな表情と、エレガントな身のこなしと、憂いを湛えた眼差しが何度も脳内でリフレインされている。文化的な認識としての教養。あれほど朗々と語られた美辞麗句の数々が、今となってはひどく空虚な音の羅列としか思えなくなっていた。", "私は結局、その日は購入ボタンを押せないまま、ノートパソコンを閉じた。"]}, {"title": "", "paragraphs": ["翌日、仕事の昼休み、私は大学時代からの友人である遥を、行きつけのカフェに呼び出していた。", "遥は根っからの読書家で、彼女の家の部屋には天井まで届きそうな本棚が三つもある。本棚の上段は太宰治から始まり、武者小路実篤といった近代日本文学が並び、下段にはフランツ・カフカ、アーネスト・ヘミングウェイ、そしてトーマス・マンなどの近代海外文学が並んでいる。私の知らない数々の──恐らく──偉大な作家たちの名著は彼女の巨大な本棚の中で、幾分誇らしげに輝いている。ロシア文学も一通り読破していると豪語していたことを、私はふと思い出す。", "「──で、その男、なんて言い間違えたの?」", "私が昨日の一部始終を、恥を忍びながら話し終えると、遥は興味津々といった様子で身を乗り出してきた。私はテーブルの上に置いたスマートフォンを手に取り、検索履歴を見せながら、ゆっくりとその名前を口にする。", "「ドフトエフスキー、って」", "一瞬、店内に静寂が訪れた。そして次の瞬間、遥は堰を切ったように爆笑し始めた。", "「──は？ えっ……ちょっと待って」", "「何？」", "「今、ドフトエフスキーって言った？」", "「うん」", "「ちょっと待って、それガチ？」", "「うん、ガチ」", "沈黙が流れる。", "「えっー！！やば！ヤバすぎるんですけど！」", "「ちょ、遥、声大きい」", "「無理、無理無理、待って」", "遥は口元を手で押さえながら、肩を震わせている。目にはうっすらと涙まで浮かんでいた。周囲の客が何事かとこちらを振り返るのも構わず、彼女はしばらくの間、必死に腹を抱えて笑い続けた。", "「ご、ごめん……でも、それ、めちゃくちゃ面白いんだけど」", "「面白くないよ。私本気で凹んでるんだから」", "「いやいや、あんたが凹む必要ないでしょ」と遥はようやく笑いを収めながら、目尻の涙を拭った。「むしろ死ぬほど面白いエピソードトークじゃん」", "「エピソードトークって」", "「だって、考えてみなよ」と遥はアイスコーヒーのストローを弄びながら、楽しそうに語り始める。「普通に考えて、自分の好きなアーティストの名前なんて間違えなくない？ ほら、あんたがBUMP OF CHICKENをパンツ・オブ・チキンって、自信満々に言い間違えないみたいにさ」", "「BUMPを下品な名前にしないで」", "「でも、熱心に応援している作家とかアーティストの名前なんてフツー絶対間違えないでしょ？」", "「まあ、確かに」", "私はストローでアイスティーを吸った。", "「しかも初対面でそれをドヤ顔で語るってことは、相当練習したんだろうね。ドフトエフスキーって」", "「そうかなぁ」", "「そうだよ」と遥は目にも止まらぬ速さで断定し、くすくすと笑った。「でもさあ、冷静に考えてみるとめっちゃダサいよね、それ」", "「そうなのかな」", "「ダサいに決まってるでしょ。だってそいつはモテたい一心で、『教養』とか、『ドフトエフスキー』とか、斜に構えた言葉使ったんだよ？　なんか想像するだけで鳥肌立たない、ざわざわって」", "遥はそう言って、腕をさすりながら笑った。", "「詳しく知らないからわかんないけどさ、マチアプとかって、やっぱ第一印象が肝心だから、その手のタイプは割といるんじゃないの？　教養とか、知性とか、それっぽい言葉を引き合いに出して、博識な印象を残そうとする姑息なやつ。中身は空っぽなのに、権威だけ借りたがるっていうかさ。たぶん、そいつドストエフスキーの名前を出せば、相手に知的な印象を与えられるとでも思ったんだよ、きっと」", "「知的な、印象……」", "「図星だな」", "「図星です。知的だと思いました」", "「ウケる」", "私の告白に、遥は再びゲラゲラと笑った。あの夜感じた、彼の理解不明な悲劇めいた感傷も、今となってはひどく滑稽なものに思えてくる。", "「でも、ドストエフスキー自体は本当に面白いよ。『カラマゾーフの兄弟』とか彼の最高傑作だし、私も五本指に入るくらいは大好きな小説だし。勿論、きっかけはアレだけどさ、せっかく興味持ったならこれを機に読んでみるのもいいんじゃない？」", "私はその言葉に、思わず笑みをこぼした。", "「──うん。実は昨日の夜、もうAmazonでカートに入れてある」", "「え、はやっ」と遥は目を丸くして、それからまた声を上げて笑った。「じゃあ、これも何かの縁だ、読んでみるべきだね」", "「……うん、でもなんか凹むなぁ」", "私が不満をこぼすと、遥は首を振った。", "「あんたが凹むことじゃないでしょ。そいつは自分を少しでも良く見せようと見栄を張った、容姿だけが取り柄のろくでもない詐欺師なんだから。そんなやつと関わっても、ろくな人生にならないし、誰も報われないよ」", "「そっかあ」", "「だからさ、とりあえずドストエフスキー読んで、気分転換しな」", "私は遥の粋な説得に、渋々黙り込んだ。窓の外には、昨夜見たあの深い闇とは打って変わって、昼下がりの陽光が眩しく降り注いでいた。私はその昨夜とは決定的に対照的な光景を見つめながら、スマートフォンを取り出し、昨夜押せなかった購入ボタンを、今度こそ静かにタップした。"]}, {"title": "", "paragraphs": ["翌日、注文したドストエフスキーの『罪と罰』と『カラマーゾフの兄弟』が届いた。", "『罪と罰』は上下巻、『カラマーゾフの兄弟』は上中下巻の合計五冊の長編小説である。しかしその二つのタイトルを眺めているうちに、私は次第に名状しがたい違和感のようなものを覚えた。私は『カラマーゾフの兄弟』の上巻を手にし、そのタイトルを凝視する。カラマーゾフの兄弟。そこには寸分の狂いなくそう書かれている。しかしその寸分の狂なく記されたタイトルに、私は胸騒ぎにも似た、奇妙な違和感を感じ始める。カラマーゾフの兄弟。カラマーゾフの兄弟。その名状しがたい違和感は、やがて婚活詐欺師だった、あのハンサムな男の言い間違えを、否応なく私に想起させる。ロシアの偉大な作家、ドフトエフスキー。私は誤解によって生まれた、その偉大な作家の名前を何度か口ずさんでみる。ドフトエフスキー。ドフトエフスキー。本当の名前を知った今、存在しないその名前はどこか存在しない奇妙な響きを持っている。", "私はもう一度、ドフトエフスキーと静かに口ずさんでみる。ドフトエフスキー。ドフトエフスキー。やがてその名前は様相を変えていく。ド太エフ好きー、どフトFスキー。それはかつて私の心を支配した、得体の知れない名前へと変貌する。ど太F好きー。ど太F好きー。遥は奇妙な言い間違いをした彼をろくでもない詐欺師と軽妙に嘲笑った。しかしやがて私は遥という存在に対して、かつてないほど強烈な不信感を抱き始める。私はその不信感に激しく困惑し、同時に不信を抱く自分そのものに身の毛のよだつような不信感を覚える。何故、私は大学時代の一番の友人であり、博識で、頼りがいのある遥に、これほどまでに強烈な不信感を抱いているのか。わからない。何もわからない。しかしやがてその不信感は彼女が私に勧めてくれた『カラマーゾフの兄弟』という上中下巻からなる、手元の小説のタイトルに収斂していく。", "カラマーゾフの兄弟、と私は呟く。カラマーゾフの兄弟、と私は首を傾げる。遥は本当に、カラマーゾフの兄弟を読んだことがあるのだろうか。出し抜けに、ひどく間の抜けた問いが胸中に降り立つ。カラマーゾフの兄弟。カラマーゾフの兄弟。その響きに、私はかすかな違和感を覚える。カラマーゾフの兄弟。カラマーゾフの兄弟。果たして本当に遥はこの小説を『カラマーゾフの兄弟』と呼んでいただろうか？　カラマーゾフの兄弟、カラマーゾフの兄弟、カラマゾーフの兄弟。ん？　カラマゾーフの兄弟？ 私はそこでひとつの事実に思い当たる。そうだ。いや、間違いない。遥はあのとき、『カラマーゾフの兄弟』のことを『カラマゾーフの兄弟』と言った。語感がよく似ているから聞き流してしまったが、それは間違いない事実だった。カラマーゾフの兄弟。カラマゾーフの兄弟。間違いない。遥は『カラマーゾフの兄弟』をカラマゾーフの兄弟と言い間違えていた。しかしそこで、私はもうひとつの疑問に当たる。何故、ロシア文学をあらかた網羅しているはずの遥が、そんな初歩的な言い間違えをしたのだろう。彼女の話し方と、その話ぶりからして、彼女がカラマーゾフの兄弟を読了していることは明白だったし、それは疑いようのないことだった。それなのに遥は『カラマーゾフの兄弟』を、『カラマゾーフの兄弟』と言い間違える致命的なミスを犯した。『カラマーゾフのの兄弟を読了し、五本指に入るくらい大好きな小説であったにもかかわらず、何故遥はそんな大胆かつ、絶望的な言い間違えをしたのだろう。しかしそこで私は、暗闇から虚をつかれたように、ひとつの事実に思い当たる。もっと初歩的な問題なのではないか、と。そもそも彼女はロシア文学はおろか、『カラマーゾフの兄弟』や『罪と罰』すら読んでいなかったのではないか。その瞬間、私の胸に得体の知れないひややかな何かがするすると流れ落ちていく。遥の部屋の壁一面を埋め尽くす、あの有名な文学作品は果たして本当に彼女の教養の一部となっていたのだろうか。彼女が愛読書だと豪語していたカラマーゾフの兄弟は、果たして本当に彼女の血肉となっていたのだろうか。もしかして──と、私は思う。遥自身を守るようにして置かれた、あの巨大な本棚たちは『文化的な認識としての教養』というただそれだけの建前によって、それらしく飾り立てられたみすぼらしいモニュメントに過ぎないのではないだろうか。もちろん、私は友人に向けるにはあまりにも軽薄なその疑問を、すぐに頭の中から追い払おうとした。しかし一度頭に浮かんでしまった疑問は、それから一向に脳裏を離れなかった。疑いはどこまでも膨らみ、やがて手から離れた風船のように、どこまでも遠くへ、手の届かない遠く彼方へと飛んでいく。そして膨らんだ疑念は、やがて不穏な疑惑へと姿を変え、破裂する。もしかしたら──と、私は思う。もしかしたら、遥という人間は本棚という虚飾の城壁を築き上げることで、教養というものを絶えず求める社会から、必死にその身を守っていたのではないだろうか。まるで荒れ狂う乱世から逃れるために、戦乱を離れた武将が孤城を築くように。やがて胸に鎮座する疑惑は、不確かな確信へとすり替わっていく。遥はもしかすると数々の欺瞞や嘘偽りを、自分を飾り立てるための装飾として、華やかに着飾っているのではないか。それは即ち彼女自身が抜き差しならぬ傲慢さと、顕示欲を抱えながら、それでも貪欲に、まるで弱者を蹴落とすように、むさ苦しく生きていることを意味するのではないか。私はその事実に打ち震えながら、それでも平静を保とうと、カラマーゾフの兄弟と呟く。しかしその言葉はもう以前のように、確信めいた響きを持っていない。私はもう一度、ある種の決意を込めて、カラマーゾフの兄弟と呟く。しかし結果は変わらない。私は飽き足らず、何度も、何度も、執拗に叫び続ける。カラマーゾフの兄弟。カラマーゾフの兄弟。しかし私は、ふと首を傾げる。", "カラマーゾフの兄弟？　カラマーゾフの兄弟？　なんだっけ、それは？　どこまでも混乱する頭と、抑揚を欠いた平板な声。相反するふたつの事象。激しく混乱する頭。私は間髪を入れずにドストエフスキーと呟く。しかしその言葉もまた、以前のように確信めいた響きを持っていないことに私は気づく。私はもう一度、ある種の決意を込めて、ドストエフスキーと呟く。しかし結果は変わらない。私は飽き足らず、何度も、何度も執拗にドストエフスキーと叫び続ける。ドストエフスキー。ドストエフスキー。しかし私はまた、再び首を傾げる。ドストエフスキー？　ドストエフスキー？　なんだっけ、それは？　どこまでも混乱する頭と、抑揚を欠いた平板な声。相反するふたつの事象。激しく混乱する頭。私は間髪を入れずにカラマーゾフの兄弟、ドストエフスキーと次々に叫ぶ。カラマーゾフの兄弟、ドストエフスキー。しかしそれは本当に実在する小説のタイトルで、実在する作家の名前なのだろうか。わからない。何もわからない。ふと、テーブルに置かれた本の装丁が目に映る。フョードル・ドフトエフスキーの『カラマゾーフの兄弟』私はそのタイトルと著者名に目を疑い、思わず手に取る。しかしそこには間違いなく克明に、ドフトエフスキーの『カラマゾーフの兄弟』と記されている。Wikipediaにも、Amazonにもまだ存在しない、しかし現代社会の底流に巣食う、教養という巨悪の権化によって描かれた、偉大なる傑作。それは今まさに、文化的な認識としての教養という大義を掲げながら、どこまでも奇妙で、不吉な笑みを浮かべていた。"]}], "en": "No Dostoevsky, Please.", "summary": "婚活で出会った男の、言い間違えた名前。", "tag": "可笑しみ"}, {"id": "s4", "group": "夭折した天使たちへ", "title": "さよならだけが人生だ", "chapters": [{"title": "", "paragraphs": ["「トラットリア・ダ・ジーノ」の窓際、いちばん奥から二番目のテーブルが彼の定位置だったことは、街の誰もが知っている。昼の十二時半になると、彼は決まってその席に座った。上着の内ポケットから、藍色の布でできた袋を取り出し、紐をほどいて、その中から使い込まれた木の箸を一膳出す。先端はすり減って丸くなり、持ち手には指の形に沿って窪みができている。彼はその箸をテーブルの上に置き、皿が運ばれてくるのを座禅でも組むようにじっと待つ。運ばれてくるのはタリアテッレのラグーだった。トラットリア・ダ・ジーノのラグーは、豚と牛を二時間以上かけて煮込んだもので、湯気の向こうで平たい麺が艶やかに光っている。彼は皿が運ばれると軽く両手を合わせ、小さな声で『いただきます』と唱えてから、箸を取る。そして麺をつまみ、持ち上げ、皿の縁に沿って巻き取るようにまとめて、口に運ぶ。するっと、なめらかな動きで。", "啜る音は立てない。イタリア人の目には、それがある意味で神聖な祈りのようにも見えた。もちろん最初の頃、ジーノの店の若いウェイターたちは、彼がテーブルにつくたびに目配せをして、にやにやしていた。フォークの代わりに棒を使う東洋人という好奇心が先に立った。観光客がスマートフォンを向けることもあった。けれど半年もしないうちに誰もそれを珍しがらなくなった。彼が箸でパスタを食べるのは、ジーノの店では窓の外のプラタナスが秋に葉を落とすのと同じくらい、当たり前の風景になっていたからだ。発音の問題も、少し愉快だった。イタリア語では「Ｈ」を発音しない。だから街の人々は彼を「アーシ」と呼んだ。パン屋の注文帳にも、自転車屋の台帳にも「Hashi」と綴られているのに、口に出すと皆「アーシ」だった。ハシは、どちらで呼ばれても同じように軽快に振り向いた。訂正しようとしたことは、一度もなかった。彼がどこから来たのか、日本でどんな暮らしをしていたのか、なぜよりによってこんな辺鄙な街を選んだのか。誰も知らなかったし、彼のほうからも、話そうとはしなかった。ただ彼には何人かの親しい友人がいたし、恋人もいた。そして彼は少なくとも傍目には、異国の地でとても充実した暮らしを送っているように見えた。そしてその友人のうちの一人、ルカ・ファンティーニは、ハシと過ごした十年間と、そのあとに起きたひとつの出来事についていつも思い耽っている。"]}, {"title": "", "paragraphs": ["ルカ・ファンティーニは、ルッカの旧市街の、観光客があまり入ってこない細い路地の角で、小さなバールを営んでいた。カウンターが七席ほどと、店先に丸テーブルがふたつ。朝はエスプレッソとコルネット、昼はパニーノ、夕方からはワインとおつまみを出す。壁には、前の持ち主が残していった古い自転車レースのポスターが貼ってある。看板には「バール・デル・アンゴロ」、つまり「角のバール」とだけ書かれていた。ルカは生まれも育ちもルッカだった。この城壁の内側で生まれ、この城壁の内側の学校に通い、この城壁の内側で父の店を継いだ。父もまたこの街で生まれ育った男で、そのまた父も同じだった。ルカは四十年近い人生のあいだ、イタリアの外に出たことが一度もなかった。ミラノにも、ローマにも数えるほどしか行っていない。学生の頃の友人たちは、ほとんどが大きな街へ出ていったが、彼だけが残った。何故出ていけなかったのか、あるいは出ていかなかったのか、自分でもよくわからないと彼は言う。ただ毎朝、同じ時間にシャッターを開け、同じ機械でエスプレッソを淹れ、同じ顔ぶれの常連たちに「ボンジョルノ」と言う暮らしを、彼は心地よく感じていた。ただ時々、夕暮れの店先に立ちながら、ふと自分はこの街の中でさえ、どこにも辿り着けていないような感覚に囚われた。生まれた場所にずっといるのに、なぜかここではないどこかにずっと恋焦がれている。そんな感覚に、ルカはずっと心を縛られていた。"]}, {"title": "", "paragraphs": ["そのバールに、日本人の青年『ハシ』がやってきたのは、夏の涼しい朝だった。まだシャッターを半分しか開けていない七時前に、ひとりの男がバールに入ってきた。白いシャツ、肘までまくった袖、小さなボストンバッグ。男はカウンターに近づいて、ゆっくりとしたイタリア語で言った。", "「エスプレッソを、お願いします」", "発音に少し癖があった。東洋人だということは、ひと目でわかった。観光客にしては荷物が少なく、疲れているのに、表情が妙に穏やかだった。ルカは黙ってエスプレッソを淹れ、ソーサーに角砂糖を二つ添えて、カウンターに置いた。男は砂糖を入れずにそれを飲み、カップを静かに戻した。そしてふと、レジの横に視線を落とした。引き出しが、少しだけ開いていた。そこから、折り畳まれた紙ナプキンの端が、のぞいていた。", "男はそれを指差して、ためらうように言った。", "「あの……それ、日本語ですよね」", "ルカは驚いて、ナプキンを取り出し、広げて見せた。それは数年前、とある日本人の観光客の夫婦が記した言葉だった。"]}, {"title": "", "paragraphs": ["その夫婦はバールの窓際の席に座ると、コーヒーを頼み、店内をあらかた眺めてから、スマートフォンの画面を見て、くすくすと笑っていた。ルカは初め、変わった客が来たものだと首を傾げていたのだが、やがて奥さんの方が彼を手招きして、画面を差し出した。それはよくある地図アプリだった。夫婦の差し出した画面の中のピンは、この店の位置に立っていた。その横に、読めない文字が並んでいる。", "「ここに、書いてあるんです」", "夫婦は、片言の英語で説明した。", "「日本語で、『さよならだけが人生だ』って」", "ルカは、意味がわからなかった。夫婦は、笑いをこらえながら、ゆっくりと英語に直してくれた。", "「ライフ・イズ・メイド・オブ・グッバイズ。人生に別れはつきものだ、という意味ですよ」", "アプリの仕様なのか、登録の手違いなのかはわからなかった。夫婦はすぐに失礼だと思ったのか謝ったが、ルカはなぜか、その十文字がとても気に入ってしまった。人生に別れはつきもの。それは自分の店のことでも、自分自身のことでもあるような気がした。彼は去り際、夫婦に頼んで、その文字を紙ナプキンに書いてもらった。それ以来、『さよならだけが人生だ』と記された、そのナプキンはレジの引き出しの奥に、しまわれたままになった。"]}, {"title": "", "paragraphs": ["男はしばらく黙って、文字を見つめていた。それから肩を小さく下ろした。笑っているのだとわかるまで、少し時間がかかった。", "「さよならだけが人生だ」", "彼はゆっくりと、その音を口にした。", "「どこかの日本人がいたずらで、地図のアプリにそう登録したらしいんだ」", "ルカの言葉に、彼はくすっと笑った。", "「……ずっと遠くまで来たはずなのに」", "「え？」", "「いや、素敵な言葉だよ」", "男は顔を上げた。目がまっすぐルカを見ていた。", "「この場所にふさわしい言葉だ」", "その口調には、からかいの響きはなかった。ルカは、なぜか、胸のどこかが温かくなるのを感じた。", "「……ええ。僕も、そう思います」", "これがルカがハシと出会った朝である。それからハシは、毎朝のようにバールに来るようになった。七時に来て、エスプレッソを一杯飲み、角砂糖をひとつだけ入れる。仕事に向かう前の、五分か十分ほどの短い時間だった。ハシのイタリア語は文法は正しかったが、ときどき母語の癖が顔を出して、動詞の位置がおかしくなった。ルカはそれを直そうとはしなかったし、ハシもルカのトスカーナ訛りの早口を聞き返すことなく、頷いて聞いていた。最初の一か月の間に、ルカが知ったことはとても少なかった。ハシがこの街に来て間もないこと。ジーノの店の裏にある自転車修理店で働き始めたこと。借りた部屋が、城壁の近くの古い建物の三階だということ。そして彼が日本でどんな暮らしをしていたかについて、まったく何も語らないということ。"]}, {"title": "", "paragraphs": ["ルッカでの暮らしが半年を過ぎる頃、ハシは気がつくと街のあちこちに居場所を持っていた。「トラットリア・ダ・ジーノ」の主人・ジーノは六十を過ぎた大柄な男だった。最初にハシが箸を取り出したとき、彼は厨房からわざわざ出てきて、腕組みをして長いこと眺めていた。そしてハシが麺を巻き取って口に入れ、「美味しい」と言う代わりに小さく頭を下げたのを見て、満足げに厨房に戻っていった。次の日から、ハシの皿には、いつも少しだけ多くラグーがかけられるようになった。自転車修理店のトンマーゾは、ハシの雇い主だった。ルッカは自転車の街で、城壁の上を走る観光客の貸自転車から、地元の老人の古い通勤用の自転車まで、年じゅう何かしらが壊れる。トンマーゾは五十代の無口な男で、ハシの手つきを見るなり「かつてお前はこういう仕事をしていたな」と言った。ハシは「いいえ」と答えたが、翌週にはスポークの張りを一本ずつ指で弾いて、音で確かめるようになっていた。手先がとても器用で、細かい作業を黙々と続けることができた。マルタは広場の古書店で働いている女性だった。三十代で、早口でよく笑う。ハシが店に入ってきて、背表紙をひとつずつ指でなぞりながら長いこと立っているのを見て、「アーシ、本は読むもんよ、撫でるもんじゃないわ」とからかった。ハシは笑って、一冊だけ買っていった。それは色褪せた表紙のイタリア語の詩集だった。", "そして最後に、キアラがいた。キアラは小学校の教師だった。ハシと出会ったのはジーノの店で、偶然に同じテーブルに相席になったのがきっかけだった。彼女は目の前の東洋人が箸でラグーを食べているのを見て、遠慮もなく、じっと見つめた。ハシは気づいて、少し困ったように笑った。", "「面白いですか」", "「とても」キアラは、きっぱりと答えた。「それ、私にもできるかしら」", "ハシは少しの間、箸と彼女の顔とを見比べていたが、やがて布袋の中から、もう一膳の予備の箸を出して、彼女に渡した。キアラは麺どころか最初はトルデッリひとつつかめなかったが、笑い転げながら何度も挑戦して、三十分後には皿の端の小さな肉の欠片を、なんとか口に運ぶことができた。", "「できた！」", "彼女が子どものように叫ぶと、ジーノの店の客たちが、一斉に拍手をした。ハシは照れくさそうに頭をかいて、でも、そのときの顔はルカが見たことがないくらい、やわらかく開いていたという。それからのキアラとハシは驚くほど軽やかに、エキゾチックに親密な関係になった。彼女が彼の部屋に来るようになり、彼が彼女の授業参観に呼ばれるようになり、一年が過ぎる頃には、ふたりは互いに恋人とはっきり言葉にしなくても、皆が当然のように隣同士に座らせる存在になっていた。ルカはふたりを見るたびに、少し羨ましくなり、しかしすぐに心を震わせた。ハシはルッカで、ほんとうに多くの人に愛されていた。それは彼自身が何かを積極的に与えたからというよりも、むしろ彼が何も押しつけず、何も隠そうとせず、ただそこに静かに存在していたからのようにも思えた。人々はハシの過去を知らなくても、ハシの現在の気丈な振る舞いを知っていた。それで十分だと、誰もが感じていた。", "けれどルカだけは、ときどき、ふとした瞬間にハシの横顔に深い影のようなものが差すのを見た。たとえば日本人の観光客の団体がトラットリアに入ってきたときのことだ。ある秋の昼、十人ほどのツアー客が、ガイドに連れられて、ジーノの店にどやどやと入ってきた。彼らは日本語で、大きな声で、あれこれと言い合っていた。ルカはその日、たまたまトラットリアに昼の出前を届けに来ていて、厨房の入口に立っていた。ハシはいつもの席で、ちょうどタリアテッレを巻き取っているところだった。ところがツアー客が来た途端、彼の箸が一瞬、止まった。それからハシはまるで何も聞こえなかったかのように、下を向いて黙々と皿を空にし、勘定を置いて、いつもよりずっと早く店を出ていった。ツアー客の誰かが小声で何か言って笑ったが、その声がガラスの向こうの背中に届いたのかどうか、ルカにはわからなかった。何を言ったのかもわからなかった。わかったのはただその笑い声が、ハシの背中をほんの少し──しかしほんの少しと呼ぶにはあまりにも取り返しがつかないくらい──淋しげに丸くしただけだった。その日の夕方、ハシはいつも通りバールに来て、エスプレッソを頼んだ。ルカは何か訊こうとして、それが不躾な行為であることを悟った。ハシも何も言わなかった。ただ角砂糖を二つとも入れて、ゆっくりとスプーンで混ぜていた。"]}, {"title": "", "paragraphs": ["ハシとルカが、ふたりきりで過ごす時間は決まって夜だった。", "バールを閉めたあと、ルカはワインの瓶を一本とグラスを二つ、紙袋に入れて、城壁の上まで歩いた。ハシは仕事が終わると、先に城壁に上がって、石の胸壁に背中を預けて待っていた。ふたりは並んで腰を下ろし、街の屋根の向こうに星が出てくるのを眺めながら、静かに飲んだ。そういう夜に、彼らはたくさんのことを話した。ルカは自分の父のこと、この街の古い噂話、誰と誰が仲違いして、誰が誰に恋をしているかといったどうでもいい話を、いくらでもできた。ハシは笑いながら話を聞いた。そしてごくまれに、自分から短い言葉を足した。ハシが日本語を口にするのは、本当にまれだった。けれどある夜、ルカが何気なく、「いただきますって、君はいつも言うよね。あれは一体何なんだい？」と訊いたとき、ハシは少し考えてから、日本語の発音のまま、それをゆっくり繰り返した。", "「イタダキマス」", "「イタ、ダキ、マス」", "「そう」ハシは、微笑んだ。「食べる前に、言うんだ。命をいただきます、という意味」", "「命」", "「魚でも、肉でも、野菜でも。何かの命をもらって、自分が生きる。だから感謝を込めて、ありがとう、と言う」", "ルカはグラスを置いた。城壁の下の街の灯が、ぽつぽつと揺れていた。", "「じゃあ、君は毎日、ラグーに『ありがとう』って言ってるんだ」", "「そうなるね」", "「ジーノが聞いたら、感動して泣くよ」", "ハシは声を出して笑った。それはルカが聞いたなかでも、いちばん屈託のない笑い声だった。"]}, {"title": "", "paragraphs": ["それからルカは、ハシに日本語を少しずつ教わるようになった。「おはよう」「ありがとう」「おいしい」「また、あした」。発音はいつもわずかにおかしかった。ハシは直さずに、ただにっこりと頷いた。ルカの口から出る、不器用な日本語はハシの顔をなぜか、柔らかくした。", "「箸は、どうして使うんだ」", "ルカが初めてそう訊いたのは、その少し後だった。ずっと気になっていたが、訊いてはいけないような気がして、ためらっていた質問だった。", "ハシはグラスを傾けて、少し黙ってから、答えた。", "「手に馴染むからだよ」", "それはもっともらしい答えだった。けれどルカはそれが本当の答えではないような気がした。ルカはそれから何度か、同じ質問を違う夜にした。そのたびに、ハシの答えは変わった。あるときは「敬意を払っているからさ」と言った。「命あるものには敬意を払わないといけないと思うんだ」と。またあるときは「ただの癖だよ」と言って、笑った。別の日には「悪あがき、かな」と言ったが、果たしてそれがどういう意味なのか、ルカには皆目見当もつかなかった。最後に訊いたのは、ハシがルッカに来て八年目の秋のことだった。その夜、ハシは少し酔っていた。", "ルカがいつもの質問をするとハシはグラスを持ったまま、城壁の下の暗い街を見下ろして、静かに言った。", "「理由が、あると思うか」", "「……ないのか」", "「あったかもしれない。だけど、いまはもう忘れたよ」", "ハシはそう言って、笑った。その笑い方が何光年も先から放たれた恒星の光のように遠かったのを、ルカは後になって何度も思い出すことになる。"]}, {"title": "", "paragraphs": ["もうひとつ、忘れられない夜がある。その夜、ふたりは珍しく言葉遊びをしていた。ルカが教わった日本語を披露しようとして、「ハシ」という音の話をしたのだ。もともと、ハシが以前、何かのついでに話してくれたことだった。", "「ハシって、いくつも意味があるんだろう。食べるときのハシ、川にかかるハシ、それから端っこのハシ。全部、同じ音だって」", "「よく覚えてるな」", "「面白いなって、ずっと思ってたんだ。食べるものと、渡るものと、終わりの場所が、同じ音なんだ」", "ハシはしばらく黙っていた。それから、ゆっくりと言った。", "「ハシはな、どっちの岸にも属さないんだ」", "「属さない？」", "「川のこっち側にも、向こう側にも。両方の岸に足を置いているけど、どっちの岸にも属していない。ただ端と端を、つなぎ止めるだけ……」", "そう言ってから、ハシははっとしたように口をつぐみ、グラスのワインを飲み干した。それ以上、その話は続かなかった。ルカはそのとき、何かを訊くべきだったのかもしれないと、あとで思った。けれど、彼は訊かなかった。ハシが黙るとき、そこには踏み込んではいけない領域があることを本能的に知っていたからだ。そしてそれは、ひとつにはルカ自身もまた、誰にも踏み込ませたくない領域を持って生きてきた人間だったからでもある。"]}, {"title": "", "paragraphs": ["その冬のはじめ、城壁の上は風が強く、ふたりはいつもより早くワインの栓を抜いた。胸壁の陰に身を寄せ、紙コップのように小さく肩をすくめて、しばらく黙って飲んでいた。口を開いたのはルカのほうだった。", "「ずっと、誰にも言ったことがないんだけど」", "ハシはグラスを持ったまま、顔だけをルカに向けた。", "「僕は、母親の顔をよく覚えていないんだ」", "ルカが六つの年の春、母は「ミラノに行ってくる。すぐ戻る」と言って、ルッカの駅から汽車に乗った。小さな鞄がひとつだけだった。父は見送りにも行かず、その日のうちにバールの鈴の紐を新しいものに替えた。以来、父の口から母の名が出たことは一度もなかった。ルカは学校から帰ると、店の扉の内側に立って、鈴が鳴るのを待った。鳴るたびに振り返った。常連の老人や配達の男が入ってくるたびに、自分の顔が何かを期待してしまうのを、六つの子どもなりに隠そうとした。", "「大人になった頃には、もう諦めたよ。本当に。ただ毎朝シャッターを開けるときに、鈴が鳴るのを、ほんの一瞬だけ、待ってしまう自分がいるんだ」", "ルカは笑ってみせたが、うまく笑えなかった。", "「もし僕がこの街を出ていったら、あの人が戻ってきたとき、迎え入れる人がいなくなる。それはあまりに哀しいと思わないか？」\\", "&#x20;「……だからこの街にずっといる」", "ハシの言葉に、ルカは一度だけ深く頷いた。", "「三十年近く経ってるんだ。もう会えないことはわかってる。だけど、やっぱり置いていかれたものは、そこから出ていくことはできないんだ」\\", "&#x20;　風がふたりの髪を激しく靡かせる。ハシは長いあいだ何も言わなかった。それは言葉を探しているのではなく、言葉の手前で何かと真剣に向き合っているような深く、長い沈黙だった。ルカはワインを紙コップに注ぎ、風に揺れる襟を押さえながら、そっとワインに口をつけた。", "やがてハシはルカの目を見ないまま、低く言った。", "「俺が母親だったら、待っていてほしくない」", "「えっ？」", "ルカはグラスを下ろした。ハシの声は穏やかで、穏やかであることがかえって異様だった、", "「待ちくたびれて、とっくに諦めて、過ごした記憶もすべて忘れて、自分の知らない世界で幸せになってほしい。俺が母親なら、そう思うよ。きっと」", "「でも、それじゃあ……」", "「世の中には忘れてしまった方が幸せになれることだってあるんだ」", "低く抑えられたハシの声が、ルッカの城壁に響き渡る。", "「手放したつもりだったんだ。全部。名前以外のほとんどすべてを」", "ハシはワインを飲み干し、空のグラスを石の上に置いた。それから胸壁の向こうの暗い街を見下ろしたまま、震えるような声で付け加えた。", "「でも、俺は本当の意味ですべてを手放しきれなかった。逃げても、逃げても、俺を手中に捉えるものからは、本当の意味では逃げられない」", "ハシの瞳は恐怖からか、ひどく濡れて、震えていた。", "ルカは何かを訊こうとして、口を開きかけ、すぐに口を噤んだ。母が駅へ向かって歩いていった背中と、ハシのいつも少しだけ伸びすぎている背筋とが、薄闇のなかで不思議なほど重なって見えた。その夜、ふたりはそれ以上、何も話さなかった。城壁を降りるとき、ハシはいつものように「また明日」と日本語で言った。ルカはいつものように少しおかしな発音で、それを返した。しかしあとになってルカは何度も思うことになる。あの夜、ハシは何かを打ち明けようと試みていたのではないか、と。ルカが差し出したものと、同じ重さのものを、同じ場所に置こうとしていたのではないか、と。そしてその試みの最中に見せたあの表情こそが、ハシが他人に見せた、いちばん深い翳りだったのだ、と。"]}, {"title": "", "paragraphs": ["ハシが四十歳を迎えた日、ルカはささやかな贈り物をした。木の箸の置物だった。旧市街の骨董屋の隅で見つけた、日本製の古い箸置きで、小さな魚の形をしていた。高価なものではなかった。ハシは箱を開けて、それを手のひらに載せ、しばらく眺めていた。そして言った。", "「ありがとう」", "それから、いたずらっぽく付け加えた。", "「じゃあ、お返しだ。お前に、やるよ」", "ハシは、自分の布袋から、予備の一膳を出して、ルカの手に押しつけた。キアラに教えたときに使った、あの箸だった。", "「お前も、使え」", "ルカは笑った。彼は箸を持ったことが、人生で一度もなかった。その夜、彼はバールの二階の自分の部屋で、もらった箸を持って、夜中までひとりで練習した。皿に豆を載せて、右から左へ、つまんでは移した。指がつり、豆は何度も床に転がった。ハシの手を思い出し、動きを真似した。何度も失敗して、それでも、ふとした拍子に一粒、うまく持ち上がった瞬間があった。ルカは小さな声で、「イタダキマス」と言って、その豆を食べた。"]}, {"title": "", "paragraphs": ["ハシがルッカに来て十年が経った年の夏、彼とキアラは、ふたりで旅行に出かけた。行き先は、シチリア島だった。キアラが前から行きたがっていたタオルミーナの海を見下ろす丘の上のホテルを一週間予約したのだ。出発の前日、ハシはバールに立ち寄った。いつものエスプレッソではなく、グラスにワインを一杯だけ注いでもらって、カウンターに立ったまま飲んだ。", "「何か、土産がいるか」", "「アーモンドのお菓子がいい。シチリアの」", "「わかった」",
